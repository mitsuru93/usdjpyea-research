batch_id: batch_band_model_screen_v2
dataset_registry: configs/datasets/dataset_registry.yaml
dataset_id: usdjpy_m1_2024_01_02_to_2026_02_18_public_main
output_root: research/reports/batches/batch_band_model_screen_v2
shard_size: 12
output_tag_default: cloud_dispatch_v2
blackout_windows_jst:
  - start_hhmmss: '06:55:00'
    end_hhmmss: '07:10:00'
    label: tokyo_preopen_guard
  - start_hhmmss: '23:55:00'
    end_hhmmss: '00:10:00'
    label: daily_rollover_guard
spread_mode: audit_only
analyze_after_run: false
band_model_sweep:
  families:
    percent:
      models: [percent]
      grid:
        band_percent: [0.00040, 0.00045, 0.00050, 0.00055, 0.00060, 0.00065, 0.00070, 0.00075, 0.00080, 0.00085, 0.00090, 0.00095, 0.00100, 0.00105, 0.00110, 0.00115, 0.00120]
    fixed_pips:
      models: [fixed_pips]
      grid:
        band_pips: [5.0, 5.5, 6.0, 6.5, 7.0, 7.5, 8.0, 8.5, 9.0, 9.5, 10.0, 10.5, 11.0, 11.5, 12.0, 12.5, 13.0, 13.5, 14.0, 14.5, 15.0]
    atr:
      models: [atr]
      grid:
        band_atr_k: [0.4, 0.5, 0.6, 0.7, 0.8, 0.9, 1.0, 1.1, 1.2, 1.3, 1.4, 1.5, 1.6, 1.7, 1.8, 1.9, 2.0]
        band_atr_period: [7, 14, 28]
    stddev:
      models: [stddev]
      grid:
        band_std_k: [0.8, 1.0, 1.2, 1.5]
        band_std_period: [10, 20, 40]
        band_std_source: [returns, close]
    range_mean:
      models: [range_mean]
      grid:
        band_range_period: [10, 20, 40]
        band_range_k: [0.6, 0.8, 1.0, 1.2]
    range_median:
      models: [range_median]
      grid:
        band_range_period: [10, 20, 40]
        band_range_k: [0.6, 0.8, 1.0, 1.2]
    range_percentile:
      models: [range_percentile]
      grid:
        band_range_period: [20, 40]
        band_range_k: [0.8, 1.0]
        band_range_percentile: [0.70, 0.80, 0.90]
    vol_linked:
      models: [realized_vol_cc, parkinson, garman_klass, rogers_satchell]
      grid:
        band_vol_period: [10, 20, 40]
        band_vol_k: [0.8, 1.0, 1.2]
    hybrid_percent_floor:
      models: [max_percent_fixed_floor]
      grid:
        band_percent: [0.0005, 0.0007]
        band_fixed_floor_pips: [6.0, 8.0, 10.0, 12.0]
    hybrid_atr_cap:
      models: [min_atr_fixed_cap]
      grid:
        band_atr_k: [0.8, 1.0]
        band_atr_period: [14, 28]
        band_fixed_cap_pips: [10.0, 12.0]
    hybrid_atr_floor:
      models: [max_atr_fixed_floor]
      grid:
        band_atr_k: [0.6, 0.8]
        band_atr_period: [14, 28]
        band_fixed_floor_pips: [6.0, 8.0]
timing_modes: [baseline_touch]
compare_sections:
  - overall
  - by_month
  - by_session
  - by_family
  - timing_overall
  - timing_by_month
  - timing_by_session
  - timing_by_family
  - timing_by_decision_event
  - timing_by_reject_reason
  - timing_by_family_decision_event
  - timing_by_family_reject_reason
  - timing_by_still_touch_status
ranking_profile:
  primary_metric: kept_total_pnl_pips
  secondary_metric: kept_avg_pnl_pips
  tertiary_metric: kept_trade_count
  shortlist_top_n: 12
  require_spread_column: false
review_sink:
  issue_number: 1
  comment_marker: BATCH_REVIEW_BATCH_BAND_MODEL_SCREEN_V2
notes: >-
  Cloud-first band screening v2 for large-scale family expansion (100-300 variants).
  Percent parameters are decimal rates in config/code (e.g., 0.0005 == 0.05%).
  Pre-MT4 research only; MT4/core remains final source of truth.
