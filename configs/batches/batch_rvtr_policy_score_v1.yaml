batch_id: batch_rvtr_policy_score_v1
dataset_registry: configs/datasets/dataset_registry.yaml
dataset_id: usdjpy_m1_2024_01_02_to_2026_02_18_public_main
output_root: research/reports/batches/batch_rvtr_policy_score_v1
shard_size: 4
output_tag_default: mobile_dispatch
blackout_windows_jst:
  - start_hhmmss: '06:55:00'
    end_hhmmss: '07:10:00'
    label: tokyo_preopen_guard
  - start_hhmmss: '23:55:00'
    end_hhmmss: '00:10:00'
    label: daily_rollover_guard
spread_mode: audit_only
band_model_sweep:
  percent_envelope: []
  fixed_pip_envelope: [8, 9]
  atr_k_envelope: []
decision_policy_sweep:
  families:
    - bin_env_v1
    - bin_forceflip_v1
    - two_stage_margin_v1
    - tri_score_rvtrno_v1
  score_bundles:
    - sf_ctx_base_v1
    - sf_ctx_momo_v1
    - sf_timing_micro_v1
    - sf_zone_risk_v1
timing_modes: [baseline_touch]
compare_sections:
  - overall
  - by_month
  - by_session
  - by_family
  - timing_overall
  - timing_by_month
  - timing_by_session
  - timing_by_family
  - timing_by_decision_event
  - timing_by_reject_reason
  - timing_by_family_decision_event
  - timing_by_family_reject_reason
  - timing_by_still_touch_status
ranking_profile:
  primary_metric: kept_total_pnl_pips
  secondary_metric: kept_avg_pnl_pips
  tertiary_metric: kept_trade_count
  shortlist_top_n: 8
  require_spread_column: false
review_sink:
  issue_number: 1
  comment_marker: BATCH_REVIEW_BATCH_RVTR_POLICY_SCORE_V1
notes: >-
  Pre-MT4 RV/TR policy-score comparison batch with fixed PIP08/PIP09 band anchors.
  MT4 remains final source of truth; this batch only compares research-side
  candidate selection policy and score-bundle behavior.
