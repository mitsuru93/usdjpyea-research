study_name: cloud_timing_rv_close_confirm_first
output_root: research/reports/studies/cloud_timing_rv_close_confirm_first
dataset_registry: configs/datasets/dataset_registry.yaml
shared_defaults:
  input_timezone_mode: UTC
  max_holding_bars: 30
  symbol: USDJPY
  timeframe: M1
  analyze_after_run: true

runs:
  - label: baseline_touch
    dataset_id: usdjpy_m1_tiny_sample
    timing_mode: baseline_touch
    notes: cloud baseline touch reference

  - label: rv_close_confirm
    dataset_id: usdjpy_m1_tiny_sample
    timing_mode: rv_close_confirm
    notes: cloud RV close-confirm timing candidate

  - label: all_close
    dataset_id: usdjpy_m1_tiny_sample
    timing_mode: all_close
    notes: cloud all-close timing comparison reference

compare:
  enabled: true
  selected_bucket_features:
    - dist_from_ema_pips
    - pre60_change_pips
    - net10_change_pips
    - rsi14
  compare_sections:
    - overall
    - by_month
    - by_session
    - by_family
    - timing_overall
    - timing_by_month
    - timing_by_session
    - timing_by_family
    - timing_by_decision_event
    - timing_by_reject_reason
    - timing_by_family_decision_event
    - timing_by_family_reject_reason
    - timing_by_still_touch_status

notes: "Cloud-first timing study scaffold (research-only, pre-MT4; MT4 remains final source of truth)."
