study_name: dc18ab5s_baseline_screen
output_root: research/reports/studies/dc18ab5s_baseline_screen
shared_defaults:
  input_timezone_mode: UTC
  max_holding_bars: 30
  symbol: USDJPY
  timeframe: M1
  analyze_after_run: true
  # Optional policy defaults applied to all runs unless overridden per run.
  # policy:
  #   enabled: true
  #   name: baseline_policy
  #   semantics: last_match_wins
  #   rules:
  #     - type: deny
  #       candidate_family: rev
  #       session: asia
  # Optional alternative:
  # policy_file: configs/policies/rev_danger_zone_example.yaml

runs:
  - label: baseline
    input_csv: /ABSOLUTE/OR/LOCAL/PATH/usdjpy.csv
    notes: baseline run
  - label: variant_a
    input_csv: /ABSOLUTE/OR/LOCAL/PATH/usdjpy.csv
    max_holding_bars: 40
    notes: variant run
    # Optional run-level policy override:
    # policy:
    #   enabled: false
    # Or policy preset:
    # policy_file: configs/policies/trend_bias_example.yaml

compare:
  enabled: true
  selected_bucket_features:
    - dist_from_ema_pips
    - pre60_change_pips
    - net10_change_pips

notes: "Template for deterministic study-level orchestration (pre-MT4 research only)."
