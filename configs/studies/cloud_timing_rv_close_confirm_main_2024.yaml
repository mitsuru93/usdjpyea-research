study_name: cloud_timing_rv_close_confirm_main_2024
output_root: research/reports/studies/cloud_timing_rv_close_confirm_main_2024
dataset_registry: configs/datasets/dataset_registry.yaml
shared_defaults:
  input_timezone_mode: UTC
  max_holding_bars: 30
  symbol: USDJPY
  timeframe: M1
  analyze_after_run: true

runs:
  - label: baseline_touch
    dataset_id: usdjpy_m1_2024_public_main
    timing_mode: baseline_touch
    notes: cloud baseline touch reference (main 2024 public dataset)

  - label: rv_close_confirm
    dataset_id: usdjpy_m1_2024_public_main
    timing_mode: rv_close_confirm
    notes: cloud RV close-confirm timing candidate (main 2024 public dataset)

  - label: all_close
    dataset_id: usdjpy_m1_2024_public_main
    timing_mode: all_close
    notes: cloud all-close timing comparison reference (main 2024 public dataset)

compare:
  enabled: true
  selected_bucket_features:
    - dist_from_ema_pips
    - pre60_change_pips
    - net10_change_pips
    - rsi14
  compare_sections:
    - overall
    - by_month
    - by_session
    - by_family
    - timing_overall
    - timing_by_month
    - timing_by_session
    - timing_by_family
    - timing_by_decision_event
    - timing_by_reject_reason
    - timing_by_family_decision_event
    - timing_by_family_reject_reason
    - timing_by_still_touch_status

notes: "Main cloud timing study for public 2024 candidate-screening research only (pre-MT4; MT4 remains final source of truth)."
