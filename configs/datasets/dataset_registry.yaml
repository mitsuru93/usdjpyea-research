# Cloud-first dataset registry for study orchestration.
# Keep this deterministic and repo-resolvable for public research use.
datasets:
  usdjpy_m1_2024_public_main:
    provider: url
    url: https://www.histdata.com/download-free-forex-historical-data/?/ascii/1-minute-bar-quotes/USDJPY
    filename: usdjpy_m1_2024_public_main.csv
    source_ref: url://www.histdata.com/download-free-forex-historical-data/?/ascii/1-minute-bar-quotes/USDJPY
    note: "Main 2024 public dataset target for cloud timing research. URL provider is used to avoid committing a very large yearly M1 CSV into git history; keep this pinned to a deterministic exported CSV snapshot in CI/ops."

  usdjpy_m1_tiny_sample:
    provider: repo_path
    path: research/data_sample/usdjpy_m1_tiny_sample.csv
    source_ref: repo://research/data_sample/usdjpy_m1_tiny_sample.csv
    note: "Tiny sample for smoke tests and workflow validation only."

  usdjpy_m1_tiny_sample_url_example:
    provider: url
    url: https://raw.githubusercontent.com/mitsuru93/usdjpyea-research/1397e7591c798c85a5b95d568bc438b037b82ae9/research/data_sample/usdjpy_m1_tiny_sample.csv
    filename: usdjpy_m1_tiny_sample.csv
    sha256: 1b1fcf4f3e70444fb4eab6517b5b27361bc2bc9a76fc6c4e6ec29d16ef254c69
    source_ref: url://raw.githubusercontent.com/mitsuru93/usdjpyea-research/1397e7591c798c85a5b95d568bc438b037b82ae9/research/data_sample/usdjpy_m1_tiny_sample.csv
    note: "URL-provider example pinned to immutable Git commit for deterministic resolver behavior."
