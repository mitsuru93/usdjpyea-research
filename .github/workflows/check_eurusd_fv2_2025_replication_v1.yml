name: Check EURUSD F v2 2025 Replication v1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/check_eurusd_fv2_2025_replication_v1.yml
      - .github/workflows/run_eurusd_fv2_2025_replication_v1.yml
      - tools/run_eurusd_fv2_2025_replication_v1.py
      - configs/research/eurusd_fv2_2025_replication_protocol_v1.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies and validate syntax
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy tabulate pyyaml
          python -m py_compile tools/run_eurusd_fv2_2025_replication_v1.py
          python - <<'PY'
          import yaml
          from pathlib import Path
          for path in [
              Path('.github/workflows/run_eurusd_2025_full_year_collect.yml'),
              Path('.github/workflows/run_eurusd_fv2_2025_replication_v1.yml'),
          ]:
              yaml.safe_load(path.read_text())
              print('YAML_OK',path)
          PY
      - name: Generate deterministic mean-reverting H1 sources
        run: |
          mkdir -p smoke/input smoke/result
          python - <<'PY'
          import numpy as np
          import pandas as pd
          rng=np.random.default_rng(20250720)
          count=500
          deviation=np.zeros(count)
          for index in range(1,count):
              deviation[index]=0.20*deviation[index-1]+rng.normal(0.0,0.00075)
          close=1.1000+deviation
          series=pd.Series(close)
          z=(series-series.rolling(72,min_periods=72).mean())/series.rolling(72,min_periods=72).std(ddof=0)
          er=(series-series.shift(24)).abs()/series.diff().abs().rolling(24,min_periods=24).sum()
          signal=((z.abs()>=1.5)&(er<=0.35)).iloc[100:-20]
          assert int(signal.sum())>0,{'signals':int(signal.sum())}
          def frame(timestamps,values):
              values=np.asarray(values)
              return pd.DataFrame({
                  'timestamp_utc':timestamps.strftime('%Y-%m-%dT%H:%M:%SZ'),
                  'symbol':'EURUSD',
                  'mid_open':values,
                  'mid_high':values+0.00015,
                  'mid_low':values-0.00015,
                  'mid_close':values,
                  'spread_mean_pips':0.6,
                  'tick_count':10,
              })
          warmup_time=pd.date_range('2024-12-27T00:00:00Z',periods=100,freq='h')
          replication_time=pd.date_range('2025-01-01T00:00:00Z',periods=400,freq='h')
          frame(warmup_time,close[:100]).to_csv('smoke/input/warmup.csv.gz',index=False,compression='gzip')
          frame(replication_time,close[100:]).to_csv('smoke/input/replication.csv.gz',index=False,compression='gzip')
          print({'registered_signals':int(signal.sum())})
          PY
      - name: Execute evaluator smoke test
        run: |
          python tools/run_eurusd_fv2_2025_replication_v1.py \
            --warmup-bars smoke/input/warmup.csv.gz \
            --replication-bars smoke/input/replication.csv.gz \
            --protocol configs/research/eurusd_fv2_2025_replication_protocol_v1.json \
            --output-dir smoke/result
          (cd smoke/result && sha256sum -c SHA256SUMS)
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('smoke/result/replication_result.json').read_text())
          assert x['candidate_ids']==[
              'F_v2_z72_1p5_mean_target_0p5_max12',
              'F_v2_z72_1p5_mean_target_0p25_max12',
          ],x
          assert x['new_rule_or_parameter_selected_from_2025'] is False,x
          assert len(x['summary'])==2,x
          assert all(int(row['trades'])>0 for row in x['summary']),x
          print({'smoke_test':'PASS','candidate_ids':x['candidate_ids'],'trade_counts':[row['trades'] for row in x['summary']]})
          PY
      - name: Record smoke-test receipt
        run: |
          mkdir -p docs/research_reboot
          python - <<'PY'
          import json,os
          from pathlib import Path
          result=json.loads(Path('smoke/result/replication_result.json').read_text())
          payload={'schema_version':'eurusd_fv2_2025_replication_smoke_receipt_v1','workflow_run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'head_sha':os.environ['GITHUB_SHA'],'python_compile':'PASS','workflow_yaml_parse':'PASS','synthetic_execution':'PASS','synthetic_trade_counts':{row['candidate_id']:row['trades'] for row in result['summary']}}
          Path('docs/research_reboot/eurusd_fv2_2025_replication_smoke_receipt_v1.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY
          git pull --rebase origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research_reboot/eurusd_fv2_2025_replication_smoke_receipt_v1.json
          git commit -m "ci: record EURUSD F v2 2025 replication smoke test"
          git push origin main
