name: Run EURUSD 2025 Full-Year Replication Source

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: eurusd-2025-full-year-replication-source
  cancel-in-progress: false

jobs:
  gate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.issue.title == '[EURUSD] Collect 2025 annual H1 replication source v1' }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Authorized EURUSD 2025 source collection"
          echo "event=${GITHUB_EVENT_NAME}"

  collect-wave-1:
    needs: gate
    name: collect-${{ matrix.month_tag }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {month_tag: "2025-01", start_utc_hour: "2025-01-01T00", end_utc_hour: "2025-02-01T00"}
          - {month_tag: "2025-02", start_utc_hour: "2025-02-01T00", end_utc_hour: "2025-03-01T00"}
          - {month_tag: "2025-03", start_utc_hour: "2025-03-01T00", end_utc_hour: "2025-04-01T00"}
          - {month_tag: "2025-04", start_utc_hour: "2025-04-01T00", end_utc_hour: "2025-05-01T00"}
    uses: ./.github/workflows/reusable_public_fx_tick_symbol_pilot_monthly_v2.yml
    with:
      symbol: EURUSD
      pilot_tag: pilot-${{ matrix.month_tag }}-EURUSD-a${{ github.run_attempt }}
      start_utc_hour: ${{ matrix.start_utc_hour }}
      end_utc_hour: ${{ matrix.end_utc_hour }}
      min_coverage: "1.0"
      max_hard_errors: "0"
      collect_max_parallel: 1

  collect-wave-2:
    needs: [gate, collect-wave-1]
    if: ${{ always() && needs.gate.result == 'success' }}
    name: collect-${{ matrix.month_tag }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {month_tag: "2025-05", start_utc_hour: "2025-05-01T00", end_utc_hour: "2025-06-01T00"}
          - {month_tag: "2025-06", start_utc_hour: "2025-06-01T00", end_utc_hour: "2025-07-01T00"}
          - {month_tag: "2025-07", start_utc_hour: "2025-07-01T00", end_utc_hour: "2025-08-01T00"}
          - {month_tag: "2025-08", start_utc_hour: "2025-08-01T00", end_utc_hour: "2025-09-01T00"}
    uses: ./.github/workflows/reusable_public_fx_tick_symbol_pilot_monthly_v2.yml
    with:
      symbol: EURUSD
      pilot_tag: pilot-${{ matrix.month_tag }}-EURUSD-a${{ github.run_attempt }}
      start_utc_hour: ${{ matrix.start_utc_hour }}
      end_utc_hour: ${{ matrix.end_utc_hour }}
      min_coverage: "1.0"
      max_hard_errors: "0"
      collect_max_parallel: 1

  collect-wave-3:
    needs: [gate, collect-wave-2]
    if: ${{ always() && needs.gate.result == 'success' }}
    name: collect-${{ matrix.month_tag }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {month_tag: "2025-09", start_utc_hour: "2025-09-01T00", end_utc_hour: "2025-10-01T00"}
          - {month_tag: "2025-10", start_utc_hour: "2025-10-01T00", end_utc_hour: "2025-11-01T00"}
          - {month_tag: "2025-11", start_utc_hour: "2025-11-01T00", end_utc_hour: "2025-12-01T00"}
          - {month_tag: "2025-12", start_utc_hour: "2025-12-01T00", end_utc_hour: "2026-01-01T00"}
    uses: ./.github/workflows/reusable_public_fx_tick_symbol_pilot_monthly_v2.yml
    with:
      symbol: EURUSD
      pilot_tag: pilot-${{ matrix.month_tag }}-EURUSD-a${{ github.run_attempt }}
      start_utc_hour: ${{ matrix.start_utc_hour }}
      end_utc_hour: ${{ matrix.end_utc_hour }}
      min_coverage: "1.0"
      max_hard_errors: "0"
      collect_max_parallel: 1

  build-annual-bundle:
    needs: [gate, collect-wave-1, collect-wave-2, collect-wave-3]
    if: ${{ always() && needs.gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      SYMBOL: EURUSD
      YEAR: "2025"
      START: "2025-01-01T00"
      END: "2026-01-01T00"
      ROOT: data/eurusd_2025_annual
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies and compile tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas pyyaml
          python -m py_compile \
            tools/retry_dukascopy_manifest_errors.py \
            tools/summarize_download_manifest.py \
            tools/resample_from_download_manifest.py \
            tools/validate_fx_bar_artifacts.py \
            tools/build_fx_annual_bar_bundle.py
      - name: Download every 2025 EURUSD day artifact
        uses: actions/download-artifact@v4
        with:
          pattern: public-fx-data-pilot-2025-*-EURUSD-a*-d*-${{ github.run_id }}
          path: data/eurusd_2025_day_artifacts
          merge-multiple: false
      - name: Combine manifests and synthesize absent weekday hours
        run: |
          set -euo pipefail
          mkdir -p "${ROOT}/source" "${ROOT}/annual_repair/raw" "${ROOT}/annual_repair/bars" "${ROOT}/audit/monthly"
          mapfile -d '' MANIFESTS < <(find data/eurusd_2025_day_artifacts -path '*/download_manifest.jsonl' -type f -print0 | sort -z)
          if [ "${#MANIFESTS[@]}" -eq 0 ]; then echo "No EURUSD 2025 daily manifests" >&2; exit 2; fi
          : > "${ROOT}/source/download_manifest.initial.jsonl"
          for manifest in "${MANIFESTS[@]}"; do cat "${manifest}" >> "${ROOT}/source/download_manifest.initial.jsonl"; done
          python - <<'PY'
          import json, os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          path=Path(os.environ['ROOT'])/'source'/'download_manifest.initial.jsonl'
          records=[json.loads(x) for x in path.read_text().splitlines() if x.strip()]
          observed={(str(r.get('symbol','')).upper(),str(r.get('hour_start_utc',''))) for r in records}
          symbol=os.environ['SYMBOL']; start=datetime.strptime(os.environ['START'],'%Y-%m-%dT%H').replace(tzinfo=timezone.utc); end=datetime.strptime(os.environ['END'],'%Y-%m-%dT%H').replace(tzinfo=timezone.utc)
          missing=[]; cur=start
          while cur<end:
              hour=cur.strftime('%Y-%m-%dT%H:%M:%SZ')
              if cur.weekday()<5 and (symbol,hour) not in observed:
                  missing.append({'attempt_pass':'synthetic_annual_gap','bytes':0,'error':'weekday hour absent from all EURUSD day artifacts','error_type':'MissingManifestRecord','hour_start_utc':hour,'path':None,'rows':0,'sha256':None,'status':'error','symbol':symbol,'url':None})
              cur+=timedelta(hours=1)
          with path.open('a') as fh:
              for row in missing: fh.write(json.dumps(row,sort_keys=True)+'\n')
          print({'source_records':len(records),'synthetic_missing_hours':len(missing)})
          PY
      - name: Repair terminal errors and absent hours
        run: |
          timeout --kill-after=30s 180m python tools/retry_dukascopy_manifest_errors.py \
            --manifest "${ROOT}/source/download_manifest.initial.jsonl" \
            --output-root "${ROOT}/annual_repair/raw" \
            --manifest-out "${ROOT}/source/download_manifest.annual_repair.jsonl" \
            --passes 10 --retries 5 --sleep-seconds 2.0 --request-timeout 75 \
            --request-interval 1.5 --pass-sleep-seconds 30
      - name: Resample repaired ticks
        run: |
          if [ -s "${ROOT}/source/download_manifest.annual_repair.jsonl" ]; then
            python tools/resample_from_download_manifest.py \
              --manifest "${ROOT}/source/download_manifest.annual_repair.jsonl" \
              --output-dir "${ROOT}/annual_repair/bars" \
              --symbols "${SYMBOL}" --timeframes M1 M5 M15 H1
          fi
      - name: Finalize and audit annual source manifest
        run: |
          set -euo pipefail
          cat "${ROOT}/source/download_manifest.initial.jsonl" > "${ROOT}/source/download_manifest.jsonl"
          if [ -s "${ROOT}/source/download_manifest.annual_repair.jsonl" ]; then cat "${ROOT}/source/download_manifest.annual_repair.jsonl" >> "${ROOT}/source/download_manifest.jsonl"; fi
          python tools/summarize_download_manifest.py \
            --manifest "${ROOT}/source/download_manifest.jsonl" --symbols "${SYMBOL}" \
            --start "${START}" --end "${END}" \
            --output "${ROOT}/audit/annual_source_summary.json" \
            --min-coverage 1.0 --max-hard-errors 0 --expected-records-mode weekdays
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['ROOT'])/'audit'/'annual_source_summary.json'; x=json.loads(p.read_text())
          assert x['expected_records']==6264, x
          assert x['observed_records']==6264, x
          assert x['unobserved_records']==0, x
          assert x['hard_error_records']==0, x
          assert x['effective_coverage']==1.0, x
          PY
      - name: Split and audit all twelve months
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime
          from pathlib import Path
          root=Path(os.environ['ROOT']); source=root/'source'/'download_manifest.jsonl'; out=root/'audit'/'monthly'; out.mkdir(parents=True,exist_ok=True)
          buckets={f'2025-{m:02d}':[] for m in range(1,13)}
          for line in source.read_text().splitlines():
              if not line.strip(): continue
              row=json.loads(line); raw=str(row.get('hour_start_utc',''))
              if raw:
                  month=datetime.fromisoformat(raw.replace('Z','+00:00')).strftime('%Y-%m')
                  if month in buckets: buckets[month].append(row)
          for month,rows in buckets.items(): (out/f'{month}.manifest.jsonl').write_text(''.join(json.dumps(r,sort_keys=True)+'\n' for r in rows))
          PY
          for month in 01 02 03 04 05 06 07 08 09 10 11 12; do
            start="2025-${month}-01T00"
            if [ "${month}" = "12" ]; then end="2026-01-01T00"; else next=$(printf "%02d" $((10#${month}+1))); end="2025-${next}-01T00"; fi
            python tools/summarize_download_manifest.py \
              --manifest "${ROOT}/audit/monthly/2025-${month}.manifest.jsonl" --symbols "${SYMBOL}" \
              --start "${start}" --end "${end}" --output "${ROOT}/audit/monthly/2025-${month}.summary.json" \
              --min-coverage 1.0 --max-hard-errors 0 --expected-records-mode weekdays
          done
          python - <<'PY'
          import calendar, json, os
          from pathlib import Path
          root=Path(os.environ['ROOT'])/'audit'/'monthly'; rows=[]
          for month in range(1,13):
              key=f'2025-{month:02d}'; x=json.loads((root/f'{key}.summary.json').read_text())
              expected=sum(1 for d in range(1,calendar.monthrange(2025,month)[1]+1) if __import__('datetime').date(2025,month,d).weekday()<5)*24
              assert x['expected_records']==expected,(key,x)
              assert x['observed_records']==expected,(key,x)
              assert x['unobserved_records']==0,key
              assert x['hard_error_records']==0,key
              assert x['effective_coverage']==1.0,key
              rows.append({'month':key,**x})
          (root/'monthly_audit_index.json').write_text(json.dumps(rows,indent=2,sort_keys=True)+'\n')
          PY
      - name: Build deterministic annual bars
        run: |
          python tools/build_fx_annual_bar_bundle.py \
            --input-root data/eurusd_2025_day_artifacts \
            --input-root "${ROOT}/annual_repair/bars" \
            --output-dir "${ROOT}/bundle" --symbol "${SYMBOL}" --year "${YEAR}" \
            --timeframes M1 M5 M15 H1
      - name: Validate annual bar files and metadata
        run: |
          args=(); for tf in M1 M5 M15 H1; do args+=(--input "${ROOT}/bundle/bars/${tf}/${SYMBOL}_${tf}.csv.gz"); done
          python tools/validate_fx_bar_artifacts.py "${args[@]}" --output "${ROOT}/bundle/validation_summary.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          payload={'symbol':'EURUSD','year':2025,'source':'Dukascopy public bid/ask BI5','timeframes':['M1','M5','M15','H1'],'strategy_assumptions':None,'broker_spread_assumption':None,'research_status':'source_data_only','workflow_run_id':os.environ.get('GITHUB_RUN_ID'),'run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT'),'head_sha':os.environ.get('GITHUB_SHA'),'fixed_weekday_expected_hours':6264,'mt4_tick_source':False}
          (root/'run_metadata.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY
      - name: Upload audited EURUSD 2025 annual bundle
        uses: actions/upload-artifact@v4
        with:
          name: public-fx-data-EURUSD-2025-annual-${{ github.run_id }}-a${{ github.run_attempt }}
          path: data/eurusd_2025_annual/**/*
          if-no-files-found: error
          retention-days: 90

  publish-source-release:
    needs: build-annual-bundle
    if: ${{ needs.build-annual-bundle.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      TAG: eurusd-2025-source-artifact-archive-v1
      ARTIFACT: public-fx-data-EURUSD-2025-annual-${{ github.run_id }}-a${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: source
      - name: Verify, package and write receipt
        run: |
          set -euo pipefail
          test -f source/audit/annual_source_summary.json
          test -f source/bundle/annual_bundle_manifest.json
          test -f source/bundle/validation_summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('source/audit/annual_source_summary.json').read_text())
          assert x['expected_records']==6264 and x['observed_records']==6264
          assert x['unobserved_records']==0 and x['hard_error_records']==0 and x['effective_coverage']==1.0
          PY
          find source -type f -print0 | sort -z | xargs -0 sha256sum > source/SHA256SUMS
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -cf - source | gzip -n > eurusd-2025-source-bundle-v1.tar.gz
          sha256sum eurusd-2025-source-bundle-v1.tar.gz > eurusd-2025-source-bundle-v1.tar.gz.sha256
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path('eurusd-2025-source-bundle-v1.tar.gz'); h=hashlib.sha256(p.read_bytes()).hexdigest()
          receipt={'schema_version':'eurusd_2025_source_receipt_v1','workflow_run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'head_sha':os.environ['GITHUB_SHA'],'artifact_name':os.environ['ARTIFACT'],'release_tag':os.environ['TAG'],'bundle_asset':p.name,'bundle_sha256':'sha256:'+h,'bundle_size_bytes':p.stat().st_size,'expected_weekday_hours':6264,'effective_coverage':1.0,'hard_error_records':0,'unobserved_records':0,'archive_scope':'derived bar bundle; not MT4 tick source; not broker native'}
          Path('eurusd_2025_source_receipt_v1.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
      - name: Publish durable source Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp source/audit/annual_source_summary.json annual_source_summary.json
          cp source/bundle/annual_bundle_manifest.json annual_bundle_manifest.json
          cp source/bundle/validation_summary.json validation_summary.json
          cp source/SHA256SUMS SHA256SUMS
          assets=(eurusd-2025-source-bundle-v1.tar.gz eurusd-2025-source-bundle-v1.tar.gz.sha256 eurusd_2025_source_receipt_v1.json annual_source_summary.json annual_bundle_manifest.json validation_summary.json SHA256SUMS)
          if gh release view "${TAG}" >/dev/null 2>&1; then gh release upload "${TAG}" "${assets[@]}" --clobber; else gh release create "${TAG}" "${assets[@]}" --title "EURUSD 2025 replication source archive v1" --notes "Audited Dukascopy-derived M1/M5/M15/H1 bar bundle for the preregistered untouched 2025 replication. Not broker-native and not an MT4 tick source." --latest=false; fi
      - name: Commit source receipt and update registry
        run: |
          set -euo pipefail
          git pull --rebase origin main
          mkdir -p docs/research_reboot
          cp eurusd_2025_source_receipt_v1.json docs/research_reboot/eurusd_2025_source_archive_receipt_v1.json
          python - <<'PY'
          import json
          from pathlib import Path
          cfgp=Path('configs/research/eurusd_2025_source_archive_v1.json'); cfg=json.loads(cfgp.read_text()); receipt=json.loads(Path('eurusd_2025_source_receipt_v1.json').read_text())
          cfg['status']='archived_and_verified'; cfg['release']['bundle_sha256']=receipt['bundle_sha256']; cfg['canonical_run_id']=receipt['workflow_run_id']; cfg['canonical_run_attempt']=receipt['run_attempt']; cfg['canonical_head_sha']=receipt['head_sha']
          cfgp.write_text(json.dumps(cfg,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add configs/research/eurusd_2025_source_archive_v1.json docs/research_reboot/eurusd_2025_source_archive_receipt_v1.json
          git commit -m "data: archive verified EURUSD 2025 replication source"
          git push origin main
      - name: Close trigger issue
        if: ${{ github.event_name == 'issues' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment "EURUSD 2025 source archive completed in run ${{ github.run_id }} and Release ${TAG}."
