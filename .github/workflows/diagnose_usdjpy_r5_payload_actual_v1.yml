name: Diagnose Actual USDJPY R5 Payload v1

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  diagnose:
    if: github.event.issue.title == '[Diag] Report actual R5 payload v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Report actual hashes
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python - <<'PY' > report.txt
          import base64,gzip,hashlib
          from pathlib import Path
          text=Path('.github/r5_stage/runner.py.gz.b64').read_text().strip()
          compressed=base64.b64decode(text)
          print(f'base64_chars={len(text)}')
          print(f'compressed_bytes={len(compressed)}')
          print(f'compressed_sha256={hashlib.sha256(compressed).hexdigest()}')
          try:
              source=gzip.decompress(compressed)
              print('gzip_decompress=PASS')
              print(f'source_bytes={len(source)}')
              print(f'source_sha256={hashlib.sha256(source).hexdigest()}')
              print(f'source_prefix={source[:80]!r}')
          except Exception as exc:
              print(f'gzip_decompress=FAIL:{type(exc).__name__}:{exc}')
          PY
          { echo '```text'; cat report.txt; echo '```'; } > body.txt
          gh issue comment "${ISSUE_NUMBER}" --repo "${REPOSITORY}" --body-file body.txt
      - name: Remove workflow and close issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          rm -f .github/workflows/diagnose_usdjpy_r5_payload_actual_v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove R5 payload diagnostic workflow'
          git pull --rebase origin main
          git push origin HEAD:main
          gh issue close "${ISSUE_NUMBER}" --repo "${REPOSITORY}" --reason completed
