name: Archive Accepted USDJPY R1 Entry Registry v1

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: archive-usdjpy-r1-entry-registry-v1
  cancel-in-progress: false

jobs:
  archive:
    if: github.event_name != 'issues' || github.event.issue.title == '[R1] Archive accepted Entry registry v1'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record run ID
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh issue comment "${ISSUE_NUMBER}" --repo "${REPOSITORY}" \
            --body "R1 Entry-registry archive started. Run ID: ${{ github.run_id }}. https://github.com/${REPOSITORY}/actions/runs/${{ github.run_id }}"

      - name: Download and verify accepted Actions artifact ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ARTIFACT_ID: '8428842719'
          EXPECTED_SHA256: 'a284e599c67910912d1e51c79d55ba4334e726ef423aba1b8ecb6a3e1ef9f27c'
        run: |
          set -euo pipefail
          mkdir -p release_assets
          asset='release_assets/usdjpy-r1-entry-registry-v1-run-29641805182-artifact-8428842719.zip'
          gh api "repos/${REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > "${asset}"
          actual="$(sha256sum "${asset}" | awk '{print $1}')"
          test "${actual}" = "${EXPECTED_SHA256}"
          unzip -t "${asset}" >/dev/null

      - name: Write frozen manifest and checksums
        run: |
          set -euo pipefail
          cat > release_assets/usdjpy-r1-entry-registry-v1-manifest.json <<'JSON'
          {
            "version": "v1",
            "repository": "mitsuru93/usdjpyea-research",
            "release_tag": "usdjpy-r1-entry-registry-v1",
            "accepted_run_id": 29641805182,
            "accepted_head_sha": "50411297d1743518371b06f0eceb039ab185bd89",
            "actions_artifact_id": 8428842719,
            "actions_artifact_name": "usdjpy-r1-entry-registry-v1-29641805182",
            "actions_artifact_sha256": "a284e599c67910912d1e51c79d55ba4334e726ef423aba1b8ecb6a3e1ef9f27c",
            "release_asset": "usdjpy-r1-entry-registry-v1-run-29641805182-artifact-8428842719.zip",
            "r1_status": "PASS",
            "acceptance_checks": 20,
            "families": 12,
            "unique_entry_definitions": 60,
            "signal_rows": 34636,
            "signal_equivalent_groups": 0,
            "registry_sha256": "ee646dc4dfefb3f231881c26249be0739b1e7b4ca9febbe01236b6120244a006",
            "registry_snapshot_sha256": "9f00768ddb79c9d15fa57b487b0f502786c44c1bbdbb17fffb9767bfb0a5adc2",
            "candidate_signals_gzip_sha256": "facec1f6e89a3a4813dfdda0438a13ce68256fed8a8d761f670359260d6f7725",
            "r1_acceptance_sha256": "eadf4788730b07a0ca8529b26903adf7d21108459d716cfff09c1191ac45c97b",
            "run_metadata_sha256": "6e1654749932415d112be00fa428fd7e2db7a201cf2d34beea07bbb472256eaa",
            "canonical_m15_gzip_sha256": "1566b9d0497f3a2aa156868144d31b89721fca48329feaf82035826ada7ee25c",
            "h2_rows_parsed": 0,
            "outcomes_opened": false,
            "2025_artifact_access": false,
            "r2_unblocked": true,
            "core_promotion": false,
            "mt4_promotion": false
          }
          JSON
          (
            cd release_assets
            sha256sum \
              usdjpy-r1-entry-registry-v1-run-29641805182-artifact-8428842719.zip \
              usdjpy-r1-entry-registry-v1-manifest.json \
              > SHA256SUMS
          )

      - name: Create or update durable Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: usdjpy-r1-entry-registry-v1
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          # USDJPY R1 Entry Registry v1

          Durable copy of accepted R1 run 29641805182 and Actions artifact 8428842719.

          R1 froze sixty unique Entry definitions across twelve families and generated Entry signal structure only. No H2 row, 2025 data, price, Exit, horizon, PnL or promotion outcome was opened. R2 is unblocked.
          EOF
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release_assets/* --clobber
          else
            gh release create "${TAG}" release_assets/* \
              --title 'USDJPY R1 Entry Registry v1' \
              --notes-file release-notes.md \
              --latest=false
          fi

      - name: Verify Release and commit receipt
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: usdjpy-r1-entry-registry-v1
        run: |
          set -euo pipefail
          gh release view "${TAG}" --json tagName,url,isDraft,isPrerelease,assets > release_receipt.json
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('release_receipt.json').read_text())
          assets = {row['name']: row for row in receipt['assets']}
          expected = {
              'usdjpy-r1-entry-registry-v1-run-29641805182-artifact-8428842719.zip': 'sha256:a284e599c67910912d1e51c79d55ba4334e726ef423aba1b8ecb6a3e1ef9f27c',
              'usdjpy-r1-entry-registry-v1-manifest.json': None,
              'SHA256SUMS': None,
          }
          assert receipt['tagName'] == 'usdjpy-r1-entry-registry-v1'
          assert receipt['isDraft'] is False
          assert receipt['isPrerelease'] is False
          assert set(assets) == set(expected), assets
          for name, digest in expected.items():
              assert assets[name]['state'] == 'uploaded', assets[name]
              if digest is not None:
                  assert assets[name]['digest'] == digest, assets[name]
          print({'release_verification': 'PASS', 'assets': len(assets)})
          PY
          git pull --rebase origin main
          target='docs/research_reboot/artifact_archives/usdjpy_r1_entry_registry_v1'
          mkdir -p "${target}"
          cp release_receipt.json "${target}/release_receipt.json"
          cp release_assets/usdjpy-r1-entry-registry-v1-manifest.json "${target}/artifact_manifest.json"
          cp release_assets/SHA256SUMS "${target}/SHA256SUMS"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${target}"
          if ! git diff --cached --quiet; then
            git commit -m 'docs: record durable R1 Entry-registry archive'
            git push origin main
          fi

      - name: Close successful trigger issue
        if: github.event_name == 'issues' && success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh issue comment "${ISSUE_NUMBER}" --repo "${REPOSITORY}" \
            --body 'Accepted R1 Entry-registry artifact archived at Release tag usdjpy-r1-entry-registry-v1. Original artifact digest matched and receipt was committed.'
          gh issue close "${ISSUE_NUMBER}" --repo "${REPOSITORY}" --reason completed

      - name: Upload archive audit copy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usdjpy-r1-entry-registry-release-audit-v1-${{ github.run_id }}
          path: |
            release_assets/usdjpy-r1-entry-registry-v1-manifest.json
            release_assets/SHA256SUMS
            release_receipt.json
          if-no-files-found: warn
          retention-days: 90
