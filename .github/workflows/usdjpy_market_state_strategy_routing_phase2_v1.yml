name: USDJPY Market-State Strategy Routing Phase 2 v1

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/evaluate_usdjpy_market_state_strategy_routing_phase2_v1.py'
      - 'configs/research/usdjpy_market_state_strategy_routing_phase2_v1_prereg.json'
      - '.github/workflows/usdjpy_market_state_strategy_routing_phase2_v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install frozen dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==2.1.3' 'pandas==2.2.3'
      - name: Enforce preregistration boundary
        run: |
          python - <<'PY'
          import json
          p=json.load(open('configs/research/usdjpy_market_state_strategy_routing_phase2_v1_prereg.json'))
          assert p['development_folds']==['2023H1','2023H2','2024H1','2024H2']
          assert p['external_periods_accessed'] is False
          assert p['distinct_from_closed_hyp023'] is True
          assert p['rule_count']==30
          assert p['boundaries']['candidate_selection_authorized'] is False
          PY
      - name: Download historical authorities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p inputs/historical inputs/a24 inputs/2023 inputs/2024h1 inputs/2024h2 materialized output
          gh release download f05-failed-reclaim-historical-authorities-v1 --repo "$GITHUB_REPOSITORY" --dir inputs/historical \
            --pattern 'usdjpy-2023-canonical-baseline-prep-v1.zip' \
            --pattern 'mt4-usdjpy-2024h1-event-audit-v1.zip' \
            --pattern 'mt4-usdjpy-f05-extatr-h2-validation-v1.zip' \
            --pattern 'EXPECTED_SHA256SUMS'
          (cd inputs/historical && sha256sum -c EXPECTED_SHA256SUMS)
          gh release download usdjpy-r0-canonical-2024-v1 --repo "$GITHUB_REPOSITORY" --dir inputs \
            --pattern 'usdjpy-r0-canonical-2024-v1-run-29639548804-artifact-8428199309.zip'
          mv inputs/usdjpy-r0-canonical-2024-v1-run-29639548804-artifact-8428199309.zip inputs/a24.zip
          unzip -q inputs/a24.zip -d inputs/a24
          unzip -q inputs/historical/usdjpy-2023-canonical-baseline-prep-v1.zip -d inputs/2023
          unzip -q inputs/historical/mt4-usdjpy-2024h1-event-audit-v1.zip -d inputs/2024h1
          unzip -q inputs/historical/mt4-usdjpy-f05-extatr-h2-validation-v1.zip -d inputs/2024h2
          find inputs/2023 -type f -print0 | xargs -0 sha256sum | grep '^4c10ab3244996d73d0955850675231a533f918da09a41ac642c9a3e287b7ac78 ' | sed 's/^[^ ]*  //' > inputs/path23
          find inputs/a24 -type f -print0 | xargs -0 sha256sum | grep '^1566b9d0497f3a2aa156868144d31b89721fca48329feaf82035826ada7ee25c ' | sed 's/^[^ ]*  //' > inputs/path24
          test "$(wc -l < inputs/path23)" -eq 1
          test "$(wc -l < inputs/path24)" -eq 1
      - name: Materialize canonical B02/F05 population
        run: |
          python tools/build_usdjpy_b02_f05_hyp024_inputs_v2.py \
            --m15-2023 inputs/2023/normalized/usdjpy_2023_m15_bid_utc_rakuten_mt4_v1.csv.gz \
            --m15-2024h1 inputs/2024h1/m15_utc_2024h1.csv \
            --events-2024h1 inputs/2024h1/tester/fx2_usdjpy_2024h1_event_audit_fixed_001_each_v1.csv \
            --events-2024h2 inputs/2024h2/h2_baseline/fx2_usdjpy_f05_extatr_h2_baseline_v1.csv \
            --out-dir materialized
      - name: Run routing diagnosis
        run: |
          p23=$(cat inputs/path23)
          p24=$(cat inputs/path24)
          python tools/evaluate_usdjpy_market_state_strategy_routing_phase2_v1.py \
            --trades materialized/usdjpy_b02_f05_source_trade_ledger_v2.csv \
            --m15-2023 "$p23" --m15-2024 "$p24" --out-dir output \
            --research-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" | tee output/run.log
          jq -e '.status=="PHASE2_DIAGNOSIS_COMPLETE_NO_CANDIDATE_AUTHORIZATION" and .population.trades==1882 and ."2025_accessed"==false and .candidate_authorized==false' output/execution_receipt.json
      - name: Package evidence
        run: |
          cp configs/research/usdjpy_market_state_strategy_routing_phase2_v1_prereg.json output/
          cp materialized/usdjpy_b02_f05_hyp024_input_materialization_v2.json output/
          find output -type f -print0 | sort -z | xargs -0 sha256sum > output/PACKAGE_SHA256SUMS
          zip -q -X -r "usdjpy-market-state-routing-phase2-v1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.zip" output
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: usdjpy-market-state-routing-phase2-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output
            usdjpy-market-state-routing-phase2-v1-${{ github.run_id }}-${{ github.run_attempt }}.zip
          retention-days: 90
          compression-level: 0
