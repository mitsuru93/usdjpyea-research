name: Run EURUSD F v2 2024 H1 Diagnostic v1

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: eurusd-fv2-h1-diagnostic-v1
  cancel-in-progress: false

jobs:
  diagnose:
    if: ${{ github.event_name != 'issues' || github.event.issue.title == '[EURUSD] Run F v2 2024 H1 diagnostic v1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_TAG: eurusd-2024-source-artifact-archive-v1
      SOURCE_ASSET: eurusd-2024-source-artifact-id-8441596981.zip
      SOURCE_SHA256: 7d6e282172ec4290465b61dece886df0407f983726c4f51fb9eddd028318a685
      RESULT_ROOT: result/eurusd_fv2_h1_diagnostic_v1
      RESULT_TAG: eurusd-fv2-h1-diagnostic-v1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies and compile diagnostic
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy tabulate
          python -m py_compile tools/run_eurusd_h1_h2_v2_validation.py tools/run_eurusd_fv2_h1_diagnostic_v1.py
      - name: Verify preregistration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('configs/research/eurusd_fv2_h1_diagnostic_protocol_v1.json').read_text())
          assert p['status']=='preregistered_before_diagnostic_execution',p
          assert p['period']['H2_access_forbidden'] is True,p
          assert p['anti_leakage']['diagnostic_may_not_access_H2'] is True,p
          assert p['anti_leakage']['diagnostic_may_not_change_candidate_rules'] is True,p
          assert p['candidate_ids']==[
            'F_v2_z72_1p5_mean_target_0p5_max12',
            'F_v2_z72_1p5_mean_target_0p25_max12',
          ],p
          print({'diagnostic_protocol':'LOCKED','H2_access_forbidden':True})
          PY
      - name: Download exact canonical 2024 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/source input/unpacked input/h1
          gh release download "${SOURCE_TAG}" --pattern "${SOURCE_ASSET}" --dir input/source
          echo "${SOURCE_SHA256}  input/source/${SOURCE_ASSET}" | sha256sum -c -
          unzip -q "input/source/${SOURCE_ASSET}" -d input/unpacked
          test -f input/unpacked/bundle/bars/H1/EURUSD_H1.csv.gz
      - name: Create physically isolated 2024 H1 file
        run: |
          python - <<'PY'
          import gzip,io
          from pathlib import Path
          import pandas as pd
          source=Path('input/unpacked/bundle/bars/H1/EURUSD_H1.csv.gz')
          target=Path('input/h1/EURUSD_2024_H1_ONLY.csv.gz')
          frame=pd.read_csv(source)
          timestamp=pd.to_datetime(frame['timestamp_utc'],utc=True,errors='raise')
          selected=frame[(timestamp>=pd.Timestamp('2024-01-01T00:00:00Z'))&(timestamp<pd.Timestamp('2024-07-01T00:00:00Z'))].copy()
          assert len(frame)==6112,len(frame)
          assert len(selected)==3030,len(selected)
          selected_ts=pd.to_datetime(selected['timestamp_utc'],utc=True,errors='raise')
          assert selected_ts.max()<pd.Timestamp('2024-07-01T00:00:00Z')
          buffer=io.StringIO(newline='')
          selected.to_csv(buffer,index=False,float_format='%.15g',lineterminator='\n')
          with target.open('wb') as raw:
            with gzip.GzipFile(filename='',mode='wb',fileobj=raw,compresslevel=9,mtime=0) as compressed:
              compressed.write(buffer.getvalue().encode())
          print({'annual_rows':len(frame),'isolated_H1_rows':len(selected),'last_H1_utc':selected_ts.max().isoformat()})
          PY
      - name: Run H1-only diagnostic
        run: |
          python tools/run_eurusd_fv2_h1_diagnostic_v1.py \
            --bars input/h1/EURUSD_2024_H1_ONLY.csv.gz \
            --candidate-protocol configs/research/eurusd_h1_h2_v2_candidate_protocol.json \
            --diagnostic-protocol configs/research/eurusd_fv2_h1_diagnostic_protocol_v1.json \
            --output-dir "${RESULT_ROOT}"
      - name: Enforce output contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RESULT_ROOT'])
          protocol=json.loads(Path('configs/research/eurusd_fv2_h1_diagnostic_protocol_v1.json').read_text())
          for name in protocol['required_outputs']:
            assert (root/name).is_file(),name
          result=json.loads((root/'diagnostic_result.json').read_text())
          source=json.loads((root/'source_receipt.json').read_text())
          assert result['H2_accessed'] is False,result
          assert result['candidate_rules_changed'] is False,result
          assert result['revision_selected'] is False,result
          assert source['bars_rows']==3030,source
          print({'contract':'PASS','candidate_ids':result['candidate_ids']})
          PY
          (cd "${RESULT_ROOT}" && sha256sum -c SHA256SUMS)
      - name: Write execution receipt
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['RESULT_ROOT'])
          result=json.loads((root/'diagnostic_result.json').read_text())
          source=json.loads((root/'source_receipt.json').read_text())
          receipt={
            'schema_version':'eurusd_fv2_h1_diagnostic_execution_receipt_v1',
            'workflow_run_id':int(os.environ['GITHUB_RUN_ID']),
            'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
            'head_sha':os.environ['GITHUB_SHA'],
            'source_asset_sha256':'sha256:'+os.environ['SOURCE_SHA256'],
            'isolated_H1_frame_sha256':source['bars_frame_content_sha256'],
            'diagnostic_protocol_sha256':source['diagnostic_protocol_sha256'],
            'authoritative_candidate_lock_sha256':source['authoritative_candidate_lock_sha256'],
            'H2_accessed':False,
            'candidate_rules_changed':False,
            'revision_selected':False,
          }
          (root/'execution_receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          lines=[]
          for path in sorted(root.iterdir()):
            if path.is_file() and path.name!='SHA256SUMS':
              lines.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}")
          (root/'SHA256SUMS').write_text('\n'.join(lines)+'\n')
          print(json.dumps(receipt,indent=2,sort_keys=True))
          PY
          (cd "${RESULT_ROOT}" && sha256sum -c SHA256SUMS)
      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: eurusd-fv2-h1-diagnostic-v1-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ env.RESULT_ROOT }}
          if-no-files-found: error
          retention-days: 90
      - name: Publish durable diagnostic Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -C result -cf - eurusd_fv2_h1_diagnostic_v1 | gzip -n > eurusd-fv2-h1-diagnostic-v1.tar.gz
          sha256sum eurusd-fv2-h1-diagnostic-v1.tar.gz > eurusd-fv2-h1-diagnostic-v1.tar.gz.sha256
          cp "${RESULT_ROOT}/diagnostic_result.json" diagnostic_result.json
          cp "${RESULT_ROOT}/analysis_summary.md" analysis_summary.md
          cp "${RESULT_ROOT}/execution_receipt.json" execution_receipt.json
          cp "${RESULT_ROOT}/candidate_summary.csv" candidate_summary.csv
          cp "${RESULT_ROOT}/SHA256SUMS" SHA256SUMS
          assets=(eurusd-fv2-h1-diagnostic-v1.tar.gz eurusd-fv2-h1-diagnostic-v1.tar.gz.sha256 diagnostic_result.json analysis_summary.md execution_receipt.json candidate_summary.csv SHA256SUMS)
          if gh release view "${RESULT_TAG}" >/dev/null 2>&1; then
            gh release upload "${RESULT_TAG}" "${assets[@]}" --clobber
          else
            gh release create "${RESULT_TAG}" "${assets[@]}" --title "EURUSD F v2 2024 H1 diagnostic v1" --notes "Preregistered H1-only diagnosis of the two retained F v2 exits. Fixed 2024 H2 was not accessed and no candidate rule was changed." --latest=false
          fi
          gh release view "${RESULT_TAG}" --json tagName,url,isDraft,isPrerelease,assets > "${RESULT_ROOT}/release_receipt.json"
      - name: Commit diagnostic receipts and outputs
        run: |
          set -euo pipefail
          git pull --rebase origin main
          target=docs/research_reboot/artifact_archives/eurusd_fv2_h1_diagnostic_v1
          mkdir -p "${target}"
          cp "${RESULT_ROOT}/diagnostic_result.json" "${target}/diagnostic_result.json"
          cp "${RESULT_ROOT}/analysis_summary.md" "${target}/analysis_summary.md"
          cp "${RESULT_ROOT}/execution_receipt.json" "${target}/execution_receipt.json"
          cp "${RESULT_ROOT}/release_receipt.json" "${target}/release_receipt.json"
          cp "${RESULT_ROOT}/candidate_summary.csv" "${target}/candidate_summary.csv"
          cp "${RESULT_ROOT}/monthly_breakdown.csv" "${target}/monthly_breakdown.csv"
          cp "${RESULT_ROOT}/side_breakdown.csv" "${target}/side_breakdown.csv"
          cp "${RESULT_ROOT}/session_breakdown.csv" "${target}/session_breakdown.csv"
          cp "${RESULT_ROOT}/zscore_breakdown.csv" "${target}/zscore_breakdown.csv"
          cp "${RESULT_ROOT}/efficiency_breakdown.csv" "${target}/efficiency_breakdown.csv"
          cp "${RESULT_ROOT}/holding_breakdown.csv" "${target}/holding_breakdown.csv"
          cp "${RESULT_ROOT}/exit_reason_breakdown.csv" "${target}/exit_reason_breakdown.csv"
          cp "${RESULT_ROOT}/cost_grid.csv" "${target}/cost_grid.csv"
          cp "${RESULT_ROOT}/average_path.csv" "${target}/average_path.csv"
          cp "${RESULT_ROOT}/entry_overlap.json" "${target}/entry_overlap.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${target}"
          git commit -m "research: record EURUSD F v2 H1 diagnostic"
          git push origin main
      - name: Close trigger issue
        if: ${{ github.event_name == 'issues' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment "H1-only diagnostic completed in run ${{ github.run_id }} and Release ${RESULT_TAG}."
