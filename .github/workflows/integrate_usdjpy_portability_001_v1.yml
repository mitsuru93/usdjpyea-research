name: Integrate USDJPY Portability 001 v1

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  issues: write

concurrency:
  group: usdjpy-portability-001-research-integration-v1
  cancel-in-progress: false

jobs:
  integrate:
    if: github.event.pull_request.head.ref == 'research/usdjpy-source-portability-root-cause-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/usdjpy-source-portability-root-cause-v2
          fetch-depth: 0
      - name: Detect completed integration
        id: precheck
        shell: bash
        run: |
          receipt='configs/research/usdjpy_portability_001_research_release_receipt_v1.json'
          if [[ -f "$receipt" ]] && jq -e '.status=="PASS_RESEARCH_RELEASE_AND_READBACK"' "$receipt" >/dev/null 2>&1; then
            echo 'complete=true' >> "$GITHUB_OUTPUT"
          else
            echo 'complete=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Download and validate Core Release
        if: steps.precheck.outputs.complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/port001_core /tmp/port001_unpacked
          url='https://github.com/mitsuru93/usdjpyea-core/releases/download/usdjpy-portability-001-core-root-cause-v1/usdjpy-portability-001-result-v1.zip'
          curl -fL --retry 4 --retry-all-errors "$url" -o /tmp/port001_core/core.zip
          echo '8b79a39d072872b365f0109da38d786fa07b501b1cb2307a6593e60c8d6c00c9  /tmp/port001_core/core.zip' | sha256sum -c -
          unzip -q /tmp/port001_core/core.zip -d /tmp/port001_unpacked
          final=$(find /tmp/port001_unpacked -type f -name final_result.json | head -n1)
          test -n "$final"
          src=$(dirname "$final")
          jq -e '.work_id=="USDJPY-PORTABILITY-001" and .formal_decision=="PARTIAL_COMMON_CONTRACT_WITH_REMAINING_SOURCE_LIMITATIONS" and .HYP039_mismatch_total==242 and .HYP040_mismatch_total==265 and .root_cause.unresolved==0 and .rakuten_raw_tick_availability=="RAKUTEN_BROKER_NATIVE_RAW_TICK_NOT_AVAILABLE" and .production_authorized==false and .live_authorized==false and ."2025H2_accessed"==false' "$final" >/dev/null
          echo "$src" > /tmp/port001_core/source_dir.txt
      - name: Install Research artifact archive and authority documents
        if: steps.precheck.outputs.complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          src=$(cat /tmp/port001_core/source_dir.txt)
          dest='docs/research/artifact_archives/usdjpy_source_portability_root_cause_v1'
          rm -rf "$dest"
          mkdir -p "$dest" configs/research docs/research docs/operations
          cp -a "$src"/. "$dest"/
          cp "$dest/human_report.md" docs/research/usdjpy_source_portability_root_cause_result_v1.md
          jq '{
            schema_version:"usdjpy_portability_001_work_registry_v1",
            work_id:.work_id,
            formal_name:"USDJPY Dukascopy–Rakuten Signal Chronology and Source Portability Root-Cause Study",
            work_type:"CROSS_CUTTING_TECHNICAL_RESEARCH",
            strategy_hypothesis:false,
            formal_decision:.formal_decision,
            HYP039_formal_decision_changed:false,
            HYP040_formal_decision_changed:false,
            candidate_rule_changed:false,
            period_roles:{"2020_2022":"ANALYSIS_PERIOD","2023_2024":"RESEARCH_AND_CANDIDATE_CONSTRUCTION_PERIOD","2025H1":"VALIDATION_PERIOD"},
            "2025H2_accessed":false,
            production_authorized:false,
            live_authorized:false,
            core_release:"usdjpy-portability-001-core-root-cause-v1",
            core_archive_sha256:"8b79a39d072872b365f0109da38d786fa07b501b1cb2307a6593e60c8d6c00c9",
            exact_next_action:"Use this contract as the mandatory qualification protocol for future independent deployment studies; do not reopen or retrospectively PASS HYP-039 or HYP-040."
          }' "$dest/final_result.json" > configs/research/usdjpy_portability_001_work_registry_v1.json
          cat > docs/research/USDJPY_SOURCE_PORTABILITY_TECHNICAL_DEBT_V1.md <<'EOF'
          # USDJPY Source Portability Technical Debt

          Work ID: `USDJPY-PORTABILITY-001`

          The common timestamp, bar, information-time, chronology, and observed-bar holding contracts are established. Exact Rakuten source-native executable-Tick portability remains unproved because broker-native raw Bid/Ask Tick with within-timestamp sequence is unavailable and MT4 Model=0 provides a synthetic first observed Tick.

          Binding result: `PARTIAL_COMMON_CONTRACT_WITH_REMAINING_SOURCE_LIMITATIONS`.

          HYP-039 and HYP-040 remain closed with their original formal decisions. No candidate rule, Entry, Exit, permission, period role, or production/live authorization changed.
          EOF
          cat > docs/research/USDJPY_RESEARCH_EVALUATION_MATRIX_PORTABILITY_V1.md <<'EOF'
          # USDJPY Research Evaluation Matrix — Source Portability

          | Item | Result |
          |---|---|
          | Research/Core same-source parity | HYP-039 500/500, HYP-040 545/545, field mismatch 0 |
          | Core/MT4 binding mismatch | HYP-039 242, HYP-040 265 |
          | Unresolved mismatch | 0 |
          | Implementation-correctable | 3 |
          | Source population differences | 407 |
          | Tester-model-limited | 504 |
          | Accepted corrections | T1, T2 same-raw-input scope, T4 |
          | Rejected exact certification | T3 exact deployment certification |
          | Rakuten raw Tick | Not available |
          EOF
          cat > docs/research/USDJPY_EA_PROGRAM_SYNTHESIS_PORTABILITY_V1.md <<'EOF'
          # USDJPY EA Program Synthesis — Portability Contract

          Future strategy qualification must separate candidate identity from deployment-source identity. Research performance on Dukascopy does not establish Rakuten exact deployment authority. Qualification now requires explicit source identity, UTC/server conversion, closed-information timing, executable-Tick semantics, observed-bar holding, same-timestamp chronology, restart restoration, JPY accounting, and source-difference attribution.
          EOF
          cat > docs/research/USDJPY_DECISION_LOG_PORTABILITY_001_V1.md <<'EOF'
          # Decision Log — USDJPY-PORTABILITY-001

          Decision: `PARTIAL_COMMON_CONTRACT_WITH_REMAINING_SOURCE_LIMITATIONS`.

          Accepted: T1 timestamp normalization; T2 deterministic bar reconstruction for identical raw input; T4 chronology and observed-bar holding.

          Rejected: T3 as exact deployment certification. Model=0 cannot certify source-native Rakuten executable Tick chronology.

          Existing HYP-039/HYP-040 formal decisions are unchanged and were not reopened.
          EOF
          cp "$dest/common_portfolio_handoff.json" configs/research/usdjpy_portability_001_common_portfolio_handoff_v1.json
          cat > docs/research/USDJPY_HYP039_PORTABILITY_CROSS_REFERENCE_V1.md <<'EOF'
          # HYP-039 Portability Cross-Reference

          HYP-039 was not reopened. Original formal decision remains `FAIL_CORE_MT4_PORTABILITY_WITH_2025H1_VALIDATION_COMPLETED`.

          Cross-cutting classification: primary `MT4_TESTER_LIMITED`; secondary `NON_PORTABLE_SOURCE_INFORMATION_DIFFERENCE`.
          EOF
          cat > docs/research/USDJPY_HYP040_PORTABILITY_CROSS_REFERENCE_V1.md <<'EOF'
          # HYP-040 Portability Cross-Reference

          HYP-040 was not reopened. Original formal decision remains `FAIL_RAKUTEN_2023_2024_PORTABILITY_WITH_2025H1_VALIDATION_COMPLETED`.

          Cross-cutting classification: primary `MT4_TESTER_LIMITED`; secondary `ECONOMICALLY_SIMILAR_NOT_EXACT_PORTABLE`.
          EOF
          cat > docs/operations/USDJPY_MT4_SOURCE_PORTABILITY_INFRASTRUCTURE_V1.md <<'EOF'
          # MT4 Source Portability Infrastructure

          Rakuten qualification evidence distinguishes HST, terminal chart history, generated FXT, tester history, and Model=0 fixed-spread execution from broker-native raw Bid/Ask Tick. Only the latter could certify source-native executable sequence, and it is currently unavailable.

          Standard sequence: market update → indicator update → exit check → order close → realized-state update → lifecycle release → signal evaluation → suppression evaluation → entry → portfolio snapshot.
          EOF
          current='docs/research/USDJPY_CURRENT_RESEARCH_STATE.md'
          marker='<!-- USDJPY-PORTABILITY-001 -->'
          if ! grep -q "$marker" "$current"; then
            cat >> "$current" <<'EOF'

          <!-- USDJPY-PORTABILITY-001 -->
          ## USDJPY-PORTABILITY-001 — Source Portability Root-Cause Study

          - decision: `PARTIAL_COMMON_CONTRACT_WITH_REMAINING_SOURCE_LIMITATIONS`
          - HYP-039/HYP-040 reopened: false
          - formal decisions changed: false
          - candidate rules changed: false
          - Rakuten broker-native raw Tick: unavailable
          - accepted common corrections: T1, T2 identical-raw-input scope, T4
          - exact deployment certification rejected: T3
          - 2025H2 accessed: false
          - production/live authorization: false
          - artifact authority: `docs/research/artifact_archives/usdjpy_source_portability_root_cause_v1/`
          EOF
          fi
      - name: Build deterministic Research archive
        if: steps.precheck.outputs.complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile
          roots = [
              Path('docs/research/artifact_archives/usdjpy_source_portability_root_cause_v1'),
              Path('configs/research/usdjpy_portability_001_work_registry_v1.json'),
              Path('configs/research/usdjpy_portability_001_common_portfolio_handoff_v1.json'),
              Path('docs/research/usdjpy_source_portability_root_cause_result_v1.md'),
              Path('docs/research/USDJPY_SOURCE_PORTABILITY_TECHNICAL_DEBT_V1.md'),
              Path('docs/research/USDJPY_RESEARCH_EVALUATION_MATRIX_PORTABILITY_V1.md'),
              Path('docs/research/USDJPY_EA_PROGRAM_SYNTHESIS_PORTABILITY_V1.md'),
              Path('docs/research/USDJPY_DECISION_LOG_PORTABILITY_001_V1.md'),
              Path('docs/research/USDJPY_HYP039_PORTABILITY_CROSS_REFERENCE_V1.md'),
              Path('docs/research/USDJPY_HYP040_PORTABILITY_CROSS_REFERENCE_V1.md'),
              Path('docs/operations/USDJPY_MT4_SOURCE_PORTABILITY_INFRASTRUCTURE_V1.md'),
          ]
          files=[]
          for root in roots:
              files.extend(sorted(root.rglob('*')) if root.is_dir() else [root])
          files=[p for p in files if p.is_file()]
          archive=Path('usdjpy-portability-001-research-root-cause-v1.zip')
          with zipfile.ZipFile(archive,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(files,key=lambda x:x.as_posix()):
                  info=zipfile.ZipInfo(p.as_posix(),(1980,1,1,0,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.external_attr=0o100644 << 16
                  z.writestr(info,p.read_bytes())
          sha=hashlib.sha256(archive.read_bytes()).hexdigest()
          manifest={"status":"PASS_DETERMINISTIC_RESEARCH_ARCHIVE","work_id":"USDJPY-PORTABILITY-001","archive":archive.name,"bytes":archive.stat().st_size,"sha256":sha,"file_count":len(files),"production_authorized":False,"live_authorized":False,"2025H2_accessed":False}
          Path('configs/research/usdjpy_portability_001_archive_receipt_v1.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          PY
      - name: Publish Research Release and byte-identical readback
        if: steps.precheck.outputs.complete != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='usdjpy-portability-001-research-root-cause-v1'
          asset='usdjpy-portability-001-research-root-cause-v1.zip'
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target research/usdjpy-source-portability-root-cause-v2 --title 'USDJPY Portability 001 Research Root-Cause v1' --notes 'Cross-cutting technical research. Existing strategy decisions unchanged. 2025H2 unused. Production/live false.'
          fi
          gh release upload "$tag" "$asset" --repo "$GITHUB_REPOSITORY" --clobber
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > /tmp/research_release.json
          asset_id=$(jq -r --arg n "$asset" '.assets[]|select(.name==$n)|.id' /tmp/research_release.json)
          test -n "$asset_id" && test "$asset_id" != null
          gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > /tmp/research_readback.zip
          local_sha=$(sha256sum "$asset"|awk '{print $1}'); remote_sha=$(sha256sum /tmp/research_readback.zip|awk '{print $1}')
          local_bytes=$(stat -c '%s' "$asset"); remote_bytes=$(stat -c '%s' /tmp/research_readback.zip)
          test "$local_sha" = "$remote_sha"; test "$local_bytes" = "$remote_bytes"
          release_id=$(jq -r '.id' /tmp/research_release.json)
          jq -n --arg tag "$tag" --arg sha "$local_sha" --argjson bytes "$local_bytes" --argjson release_id "$release_id" --argjson asset_id "$asset_id" --argjson run_id "$GITHUB_RUN_ID" '{status:"PASS_RESEARCH_RELEASE_AND_READBACK",work_id:"USDJPY-PORTABILITY-001",tag:$tag,release_id:$release_id,asset_id:$asset_id,archive_sha256:$sha,archive_bytes:$bytes,run_id:$run_id,production_authorized:false,live_authorized:false,"2025H2_accessed":false}' > configs/research/usdjpy_portability_001_research_release_receipt_v1.json
      - name: Commit Research authority and create receipt Issue
        if: steps.precheck.outputs.complete != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add configs/research docs/research docs/operations usdjpy-portability-001-research-root-cause-v1.zip
          git commit -m 'Complete USDJPY-PORTABILITY-001 Research authority'
          git push origin HEAD:research/usdjpy-source-portability-root-cause-v2
          title='[USDJPY-PORTABILITY-001] Research completion receipt'
          body="Work ID: USDJPY-PORTABILITY-001
          Decision: PARTIAL_COMMON_CONTRACT_WITH_REMAINING_SOURCE_LIMITATIONS
          Core Run: 30536900299
          Core Release: usdjpy-portability-001-core-root-cause-v1
          Research Run: $GITHUB_RUN_ID
          Research Release: usdjpy-portability-001-research-root-cause-v1
          HYP-039/HYP-040 formal decisions changed: false
          Candidate rules changed: false
          2025H2 accessed: false
          Production/live authorization: false"
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search 'USDJPY-PORTABILITY-001 Research completion receipt in:title' --json number,title --jq '.[]|select(.title=="[USDJPY-PORTABILITY-001] Research completion receipt")|.number'|head -n1)
          if [ -z "$issue" ]; then gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" >/dev/null; else gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body" >/dev/null; fi
