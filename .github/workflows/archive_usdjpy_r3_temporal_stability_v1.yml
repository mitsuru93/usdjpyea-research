name: Archive Accepted USDJPY R3 Temporal Stability v1

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  archive:
    if: github.event.issue.title == '[R3] Archive accepted temporal stability v1'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require completed artifact diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          state="$(gh issue view 121 --repo "${REPOSITORY}" --json state,stateReason --jq '.state + ":" + (.stateReason // "")')"
          test "${state}" = 'CLOSED:COMPLETED'
          gh issue comment "${ISSUE_NUMBER}" --repo "${REPOSITORY}" \
            --body "Clean R3 Release rebuild started after diagnostic Issue #121. Run ID: ${{ github.run_id }}."

      - name: Download accepted artifact and write exact Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          rm -rf release_assets
          mkdir -p release_assets
          asset='release_assets/usdjpy-r3-temporal-stability-v1-run-29647304892-artifact-8430424186.zip'
          gh api "repos/${REPOSITORY}/actions/artifacts/8430424186/zip" > "${asset}"
          cat > release_assets/usdjpy-r3-temporal-stability-v1-manifest.json <<'JSON'
          {
            "version": "v1",
            "repository": "mitsuru93/usdjpyea-research",
            "release_tag": "usdjpy-r3-temporal-stability-v1",
            "accepted_run_id": 29647304892,
            "accepted_head_sha": "22a72f0cf1185e072d16afcdc64651502f2db83c",
            "actions_artifact_id": 8430424186,
            "actions_artifact_name": "usdjpy-r3-temporal-stability-v1-29647304892",
            "actions_artifact_sha256": "bf906aa45e426146073d099ac2cf692067b4831256cd22de11e25f0e13b3e292",
            "diagnostic_issue": 121,
            "diagnostic_status": "completed",
            "r3_status": "PASS",
            "acceptance_checks": 25,
            "candidate_horizon_combinations": 660,
            "input_trade_rows": 383078,
            "entry_regime_map_rows": 7882,
            "monthly_rows": 3960,
            "quarterly_rows": 1320,
            "rolling_2month_rows": 3300,
            "rolling_3month_rows": 2640,
            "anchored_rows": 3300,
            "spread_regime_rows": 2640,
            "rv32_regime_rows": 3300,
            "rv96_regime_rows": 3300,
            "direction_rows": 1320,
            "neighborhood_rows": 660,
            "concentration_rows": 660,
            "sample_class_rows": 660,
            "sample_class_counts": {"standard": 572, "moderate": 44, "sparse": 44},
            "temporal_monthly_sha256": "64f0f4122e744d8f5e70e40a29f0939abfa14f4ea60f7e7201c3f21a56fc2a02",
            "anchored_ranking_sha256": "f6fe5b1043482892ee69d361cc89641c0f2f8c3a7338727c44067a573be16158",
            "entry_regime_map_sha256": "73d54b2194e21859c39a24a8e47d472b3d56eef552f593eda8fbc0a5bdceced2",
            "r3_acceptance_sha256": "17ef172240b4f7ee071634e99562fee811696497c49ef331c215b688f9a79d15",
            "H2_rows_parsed": 0,
            "2025_artifact_access": false,
            "selection_or_promotion_made": false,
            "R4_design_unblocked": true,
            "Core_promotion": false,
            "MT4_promotion": false
          }
          JSON
          (
            cd release_assets
            sha256sum \
              usdjpy-r3-temporal-stability-v1-run-29647304892-artifact-8430424186.zip \
              usdjpy-r3-temporal-stability-v1-manifest.json \
              > SHA256SUMS
          )

      - name: Rebuild and verify clean Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: usdjpy-r3-temporal-stability-v1
        run: |
          set -euo pipefail
          if ! gh release view "${TAG}" --repo "${REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${TAG}" --repo "${REPOSITORY}" \
              --title 'USDJPY R3 Temporal Stability v1' \
              --notes 'Accepted R3 run 29647304892. Complete diagnostics for all 660 R2 combinations. Artifact download and principal hashes verified in completed Issue #121. No shortlist and no H2 or 2025 access.' \
              --latest=false
          fi
          mapfile -t EXISTING < <(gh release view "${TAG}" --repo "${REPOSITORY}" --json assets --jq '.assets[].name')
          for name in "${EXISTING[@]}"; do
            gh release delete-asset "${TAG}" "${name}" --repo "${REPOSITORY}" --yes
          done
          gh release upload "${TAG}" \
            release_assets/usdjpy-r3-temporal-stability-v1-run-29647304892-artifact-8430424186.zip \
            release_assets/usdjpy-r3-temporal-stability-v1-manifest.json \
            release_assets/SHA256SUMS \
            --repo "${REPOSITORY}"
          for attempt in 1 2 3 4 5; do
            gh release view "${TAG}" --repo "${REPOSITORY}" --json tagName,url,isDraft,isPrerelease,assets > release_receipt.json
            if python - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path('release_receipt.json').read_text())
          assets={row['name']:row for row in receipt['assets']}
          expected={
              'usdjpy-r3-temporal-stability-v1-run-29647304892-artifact-8430424186.zip',
              'usdjpy-r3-temporal-stability-v1-manifest.json',
              'SHA256SUMS',
          }
          ok=(
              receipt['tagName']=='usdjpy-r3-temporal-stability-v1'
              and receipt['isDraft'] is False
              and receipt['isPrerelease'] is False
              and set(assets)==expected
              and all(row['state']=='uploaded' for row in assets.values())
              and assets['usdjpy-r3-temporal-stability-v1-run-29647304892-artifact-8430424186.zip'].get('digest')=='sha256:bf906aa45e426146073d099ac2cf692067b4831256cd22de11e25f0e13b3e292'
          )
          raise SystemExit(0 if ok else 1)
          PY
            then
              break
            fi
            sleep 5
          done
          python - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path('release_receipt.json').read_text())
          assets={row['name']:row for row in receipt['assets']}
          assert set(assets)=={
              'usdjpy-r3-temporal-stability-v1-run-29647304892-artifact-8430424186.zip',
              'usdjpy-r3-temporal-stability-v1-manifest.json',
              'SHA256SUMS',
          }
          assert assets['usdjpy-r3-temporal-stability-v1-run-29647304892-artifact-8430424186.zip']['digest']=='sha256:bf906aa45e426146073d099ac2cf692067b4831256cd22de11e25f0e13b3e292'
          print({'R3_clean_release':'PASS','assets':3})
          PY

      - name: Commit receipt without work files
        run: |
          set -euo pipefail
          target='docs/research_reboot/artifact_archives/usdjpy_r3_temporal_stability_v1'
          mkdir -p "${target}"
          cp release_receipt.json "${target}/release_receipt.json"
          cp release_assets/usdjpy-r3-temporal-stability-v1-manifest.json "${target}/artifact_manifest.json"
          cp release_assets/SHA256SUMS "${target}/SHA256SUMS"
          rm -rf release_assets release_receipt.json
          rm -f .github/workflows/archive_usdjpy_r3_temporal_stability_v1.yml
          rm -f .github/workflows/diagnose_usdjpy_r3_archive_download_v1.yml
          rm -f .github/workflows/diagnose_usdjpy_r3_release_v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: archive accepted USDJPY R3 temporal stability v1'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Close issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh issue comment "${ISSUE_NUMBER}" --repo "${REPOSITORY}" \
            --body 'R3 Release rebuilt with exactly three verified assets and receipt committed. R4 rule design is next; no shortlist was opened.'
          gh issue close "${ISSUE_NUMBER}" --repo "${REPOSITORY}" --reason completed
