name: Mirror F05 failed reclaim historical authorities v1

on:
  push:
    branches:
      - agent/f05-failed-reclaim-authority-mirror-v1
    paths:
      - 'configs/run_markers/f05_failed_reclaim_authority_mirror_v1.json'

permissions:
  contents: write
  issues: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/f05-failed-reclaim-authority-mirror-v1

      - name: Download exact Core artifacts through short-lived connector transport
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p authority_mirror
          curl -fL --retry 3 --retry-all-errors \
            'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-53ec-8206-8a6a-6572d978f4ca/raw?se=2026-07-24T14:34:03Z&sp=r&sv=2026-02-06&sr=b&scid=44c08cc6-aa97-5711-98f5-b2f85af2661e&skoid=3e273c3d-5ea1-4088-9e18-79685531b184&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-24T04:16:45Z&ske=2026-07-26T04:16:45Z&sks=b&skv=2026-02-06&sig=OcNkfWS4VWrslRNZs21e1JfMKcPHOesC1XyYO3WdDbQ%3D' \
            -o authority_mirror/usdjpy-2023-canonical-baseline-prep-v1.zip
          curl -fL --retry 3 --retry-all-errors \
            'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-b0ec-8206-86f3-e72faad749d1/raw?se=2026-07-24T14:34:16Z&sp=r&sv=2026-02-06&sr=b&scid=9044983c-1b8f-5f27-aa67-29a1342be4cd&skoid=3e273c3d-5ea1-4088-9e18-79685531b184&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-23T21:17:01Z&ske=2026-07-25T21:17:01Z&sks=b&skv=2026-02-06&sig=SlE9mk1L35qrNHMPEHwopxiNWaW8eikcWNsxM5wGbjY%3D' \
            -o authority_mirror/mt4-usdjpy-2024h1-event-audit-v1.zip
          curl -fL --retry 3 --retry-all-errors \
            'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-9fd0-8206-97ef-511516c105b5/raw?se=2026-07-24T14:34:29Z&sp=r&sv=2026-02-06&sr=b&scid=0015cc19-3e02-5e5d-a2d2-6b9e09bf4acd&skoid=3e273c3d-5ea1-4088-9e18-79685531b184&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-23T19:38:43Z&ske=2026-07-25T19:38:43Z&sks=b&skv=2026-02-06&sig=CuaZ1%2BK5OwqjHSqurNSr%2BCzWgmsiB09VBBw5PcReDqI%3D' \
            -o authority_mirror/mt4-usdjpy-f05-extatr-h2-validation-v1.zip
          cat > authority_mirror/EXPECTED_SHA256SUMS <<'EOF'
          22d66bf76c60362b78e9badff2113bc196b80e3657f5083ae470d1d62df70c01  usdjpy-2023-canonical-baseline-prep-v1.zip
          e078758343995c8254244dd36385c93a61a7124cb5037beb458afdf5d0e208e5  mt4-usdjpy-2024h1-event-audit-v1.zip
          9c5846e8b6e47b4b981a3ceeec856391311d3864a8cd7c2bef7caf7d21e6375b  mt4-usdjpy-f05-extatr-h2-validation-v1.zip
          EOF
          (cd authority_mirror && sha256sum -c EXPECTED_SHA256SUMS)
          python - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          root=Path('authority_mirror')
          members={
            'usdjpy-2023-canonical-baseline-prep-v1.zip': {
              'normalized/usdjpy_2023_m15_bid_utc_rakuten_mt4_v1.csv.gz':'4c10ab3244996d73d0955850675231a533f918da09a41ac642c9a3e287b7ac78',
              'normalized/usdjpy_2023_m1_bid_utc_rakuten_mt4_v1.csv.gz':'167509bde6553a468ffe48b082ed79de183cc57991f668cf4b3e7341350d307e'},
            'mt4-usdjpy-2024h1-event-audit-v1.zip': {
              'tester/fx2_usdjpy_2024h1_event_audit_fixed_001_each_v1.csv':'9560d6382e2457eaec83415316fb59d4989244d49c9977ce76cbdd717f32f09a'},
            'mt4-usdjpy-f05-extatr-h2-validation-v1.zip': {
              'h2_baseline/fx2_usdjpy_f05_extatr_h2_baseline_v1.csv':'a5a871d7105c6e68548e804c9ab517ee6bc0b08553474b158799f47ebd32edcd'},
          }
          verified=[]
          for archive, expected in members.items():
            with zipfile.ZipFile(root/archive) as zf:
              for name, sha in expected.items():
                payload=zf.read(name)
                actual=hashlib.sha256(payload).hexdigest()
                if actual != sha: raise AssertionError((archive,name,actual,sha))
                verified.append({'archive':archive,'member':name,'bytes':len(payload),'sha256':actual})
          receipt={
            'schema_version':'f05_failed_reclaim_historical_authority_mirror_v1',
            'status':'PASS_EXACT_CORE_ARTIFACTS_MIRRORED',
            'source':[
              {'repository':'mitsuru93/usdjpyea-core','run_id':29997167048,'artifact_id':8559483151,'asset':'usdjpy-2023-canonical-baseline-prep-v1.zip','sha256':'22d66bf76c60362b78e9badff2113bc196b80e3657f5083ae470d1d62df70c01'},
              {'repository':'mitsuru93/usdjpyea-core','run_id':29787357305,'artifact_id':8479048161,'asset':'mt4-usdjpy-2024h1-event-audit-v1.zip','sha256':'e078758343995c8254244dd36385c93a61a7124cb5037beb458afdf5d0e208e5'},
              {'repository':'mitsuru93/usdjpyea-core','run_id':29873856877,'artifact_id':8512432416,'asset':'mt4-usdjpy-f05-extatr-h2-validation-v1.zip','sha256':'9c5846e8b6e47b4b981a3ceeec856391311d3864a8cd7c2bef7caf7d21e6375b'}],
            'verified_members':verified,
            'research_release_tag':'f05-failed-reclaim-historical-authorities-v1',
            'outcomes_computed':False,'portfolio_replay_computed':False,'mt4_new_execution':False,'2025_accessed':False,
          }
          (root/'mirror_receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY

      - name: Publish durable Research Release mirror
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='f05-failed-reclaim-historical-authorities-v1'
          assets=(
            authority_mirror/usdjpy-2023-canonical-baseline-prep-v1.zip
            authority_mirror/mt4-usdjpy-2024h1-event-audit-v1.zip
            authority_mirror/mt4-usdjpy-f05-extatr-h2-validation-v1.zip
            authority_mirror/EXPECTED_SHA256SUMS
            authority_mirror/mirror_receipt.json
          )
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "${assets[@]}" --target "$GITHUB_SHA" \
              --title 'F05 failed reclaim historical authorities v1' \
              --notes 'Exact byte-identical mirror of the three fixed Core Actions artifacts required by the frozen F05 failed-reclaim validation. No outcomes computed.' \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Publish connector-visible mirror receipt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > issue.md <<EOF
          status: PASS_EXACT_CORE_ARTIFACTS_MIRRORED
          release_tag: f05-failed-reclaim-historical-authorities-v1
          mirror_commit: ${GITHUB_SHA}
          source_2023_artifact_id: 8559483151
          source_2024h1_artifact_id: 8479048161
          source_2024h2_artifact_id: 8512432416
          outcomes_computed: false
          portfolio_replay_computed: false
          mt4_new_execution: false
          2025_accessed: false
          EOF
          gh issue create --repo "$GITHUB_REPOSITORY" --title "[f05-authority-mirror] ${GITHUB_RUN_ID} PASS" --body-file issue.md
