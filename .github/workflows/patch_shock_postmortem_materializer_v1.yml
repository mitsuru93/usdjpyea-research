name: Patch Shock Failure Postmortem Materializer v1

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/patch_shock_postmortem_materializer_v1.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-shock-postmortem-materializer-v1
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/shock-failure-2025-postmortem-v1
          fetch-depth: 0
      - name: Replace single payload with verified chunk materialization
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/usdjpy_shock_failure_2025_postmortem_v1.yml')
          s=p.read_text(encoding='utf-8')
          old_path="      - 'tools/analyze_usdjpy_shock_failure_2025_postmortem_v1.py.gz.b64'"
          new_path="      - 'tools/analyze_usdjpy_shock_failure_2025_postmortem_v1.py.gz.b64.part*'"
          old_cmd="          base64 -d tools/analyze_usdjpy_shock_failure_2025_postmortem_v1.py.gz.b64 | gzip -d > tools/analyze_usdjpy_shock_failure_2025_postmortem_v1.py"
          new_cmd='''          cat tools/analyze_usdjpy_shock_failure_2025_postmortem_v1.py.gz.b64.part* > "$RUNNER_TEMP/analyzer.b64"
          actual=$(sha256sum "$RUNNER_TEMP/analyzer.b64" | awk '{print $1}')
          test "$actual" = "dcd939525e2b602d92c16f99a827ed021c708277a4983e7af00a81a4a10bbeb1"
          base64 -d "$RUNNER_TEMP/analyzer.b64" | gzip -d > tools/analyze_usdjpy_shock_failure_2025_postmortem_v1.py'''
          if old_path not in s:
              print('Target workflow already uses split payload.')
          else:
              if old_cmd not in s:
                  raise SystemExit('single-payload materializer command not found')
              s=s.replace(old_path,new_path,1).replace(old_cmd,new_cmd,1)
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/usdjpy_shock_failure_2025_postmortem_v1.yml
          if ! git diff --cached --quiet; then
            git commit -m 'ci: verify and materialize split Shock Failure analyzer'
            git push origin HEAD:agent/shock-failure-2025-postmortem-v1
          fi
