name: USDJPY HYP-043 C2 2025H1 revalidation release v1

on:
  push:
    branches: ['research/usdjpy-hyp043-c2-release-trigger-v1']
    paths:
      - 'configs/run_markers/usdjpy_hyp043_c2_release_trigger_v1.json'

permissions:
  contents: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: usdjpy-hyp043-c2-2025h1-revalidation-v1
      ARCHIVE: usdjpy-hyp043-c2-2025h1-revalidation-v1.zip
      ISSUE_NUMBER: '448'
      RESULT_SHA: deb6dec502b65ede7b63374c0d9645ce43e405c8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RESULT_SHA }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build deterministic C2 addendum archive
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,shutil,zipfile
          from pathlib import Path
          files=[
            'configs/research/usdjpy_hyp043_c2_2025h1_revalidation_addendum_v1.json',
            'configs/research/usdjpy_hyp043_final_result_v2.json',
            'configs/research/usdjpy_hyp043_integration_handoff_v2.json',
            'configs/research/usdjpy_hypothesis_ledger_addendum_v47.json',
            'configs/research/usdjpy_research_candidate_registry_v73.json',
            'configs/research/usdjpy_2023_2024_hypothesis_program_v18.json',
            'docs/research/USDJPY_HYP043_C2_2025H1_REVALIDATION_ADDENDUM_V1.md'
          ]
          result=json.loads(Path(files[1]).read_text())
          assert result['economic_decision']=='PARTIAL_RECOVERY_ECONOMIC_HISTORICAL_GATE_FAIL'
          assert result['validation_2025H1']['F05_improvement_jpy']==5909
          assert result['validation_2025H1']['portfolio_improvement_jpy']==5909
          assert result['candidate_rule_changed_after_result'] is False
          assert result['period_roles']['2025H2']=='NOT_ACCESSED'
          stage=Path('/tmp/hyp043_c2_release'); shutil.rmtree(stage,ignore_errors=True); stage.mkdir()
          sums=[]
          for name in files:
            src=Path(name); dst=stage/name; dst.parent.mkdir(parents=True,exist_ok=True); shutil.copyfile(src,dst)
            sums.append({'path':name,'sha256':hashlib.sha256(src.read_bytes()).hexdigest()})
          manifest={'schema_version':'usdjpy_hyp043_c2_release_manifest_v1','hypothesis_id':'USDJPY-HYP-043','candidate_id':'C2_LOCALIZED_SHORT_ACCEPTANCE_COMPRESSION','formal_decision':'NO_HISTORICALLY_ADMISSIBLE_LOCALIZED_F05_CANDIDATE','economic_decision':'PARTIAL_RECOVERY_ECONOMIC_HISTORICAL_GATE_FAIL','research_result_sha':os.environ['RESULT_SHA'],'core_economic_result_sha':'fa99a3fe83fa8892096289dd4bfb86d21d856923','files':sums,'candidate_rule_changed_after_result':False,'2025H2_accessed':False,'production_authorized':False,'live_authorized':False}
          (stage/'ARCHIVE_MANIFEST.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          members=files+['ARCHIVE_MANIFEST.json']
          (stage/'PACKAGE_SHA256SUMS').write_text('\n'.join(f"{hashlib.sha256((stage/n).read_bytes()).hexdigest()}  {n}" for n in members)+'\n')
          members.append('PACKAGE_SHA256SUMS')
          archive=Path(os.environ['ARCHIVE'])
          with zipfile.ZipFile(archive,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
            for name in sorted(members):
              info=zipfile.ZipInfo(name,date_time=(1980,1,1,0,0,0)); info.compress_type=zipfile.ZIP_DEFLATED; info.external_attr=(0o100644<<16); info.create_system=3
              z.writestr(info,(stage/name).read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          digest=hashlib.sha256(archive.read_bytes()).hexdigest()
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write(f'ARCHIVE_SHA={digest}\nARCHIVE_BYTES={archive.stat().st_size}\n')
          print(json.dumps({'archive':str(archive),'sha256':digest,'bytes':archive.stat().st_size},indent=2))
          PY
      - name: Publish immutable Release and verify byte-identical readback
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" "$ARCHIVE" --repo "$GITHUB_REPOSITORY" --target "$RESULT_SHA" --title 'USDJPY HYP-043 C2 2025H1 revalidation v1' --notes 'C2 unchanged: 2025H1 F05 and B02+F05 each improved by ¥5,909. Economic PARTIAL_RECOVERY; historical fold breadth 2/4 FAIL; production/live false.'
          mkdir readback
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir readback --pattern "$ARCHIVE"
          REMOTE_SHA=$(sha256sum "readback/$ARCHIVE"|awk '{print $1}')
          test "$REMOTE_SHA" = "$ARCHIVE_SHA"
          RELEASE_URL=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)
          echo "REMOTE_SHA=$REMOTE_SHA" >> "$GITHUB_ENV"
          echo "RELEASE_URL=$RELEASE_URL" >> "$GITHUB_ENV"
      - name: Complete receipt Issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body=$(cat <<EOF
          hypothesis_id: USDJPY-HYP-043
          candidate_id: C2_LOCALIZED_SHORT_ACCEPTANCE_COMPRESSION
          status: PASS_IMMUTABLE_RELEASE_BYTE_IDENTICAL_READBACK
          formal_historical_decision: NO_HISTORICALLY_ADMISSIBLE_LOCALIZED_F05_CANDIDATE
          economic_decision: PARTIAL_RECOVERY_ECONOMIC_HISTORICAL_GATE_FAIL
          F05_improvement_jpy: 5909
          portfolio_improvement_jpy: 5909
          release_tag: $TAG
          release_url: $RELEASE_URL
          archive_name: $ARCHIVE
          archive_sha256: $ARCHIVE_SHA
          remote_readback_sha256: $REMOTE_SHA
          archive_bytes: $ARCHIVE_BYTES
          research_result_sha: $RESULT_SHA
          core_economic_result_sha: fa99a3fe83fa8892096289dd4bfb86d21d856923
          candidate_rule_changed_after_result: false
          2025H2_accessed: false
          production_authorized: false
          live_authorized: false
          event_level_full_equity_Core_MT4_Rakuten: pending unchanged-C2 self-hosted evidence
          EOF
          )
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
