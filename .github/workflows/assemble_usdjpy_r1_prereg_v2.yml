name: Assemble Corrected USDJPY R1 Preregistration v2

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  assemble:
    if: github.event_name != 'issues' || github.event.issue.title == '[R1] Assemble corrected USDJPY preregistration v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create corrected v2 files
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          source_registry = Path('configs/research/usdjpy_r1_entry_universe_v1.json')
          target_registry = Path('configs/research/usdjpy_r1_entry_universe_v2.json')
          registry = json.loads(source_registry.read_text())
          registry['version'] = 'v2'
          registry['common_execution']['entry_hours_utc_applies_to'] = 'actual_next_M15_entry_timestamp'
          registry['common_execution']['entry_start_end_hour_fields_apply_to'] = 'signal_close_timestamp'
          registry['timing_semantics_correction'] = {
              'excluded_predecessor_run_id': 29641805182,
              'excluded_predecessor_artifact_id': 8428842719,
              'reason': 'v1 applied entry_hours_utc to the signal bar instead of the actual next-bar entry timestamp',
              'candidate_or_parameter_change': False,
              'outcome_information_used': False,
              'required_legacy_regression_rows': 13
          }
          target_registry.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + '\n')

          source_runner = Path('tools/run_usdjpy_r1_entry_registry_v1.py')
          target_runner = Path('tools/run_usdjpy_r1_entry_registry_v2.py')
          text = source_runner.read_text()
          old = '''def allowed_hours(bars: pd.DataFrame, candidate: dict[str, Any]) -> pd.Series:\n    if "entry_hours_utc" in candidate:\n        return bars["hour_utc"].isin([int(v) for v in candidate["entry_hours_utc"]])\n    if "entry_start_hour" in candidate:\n        return (\n            (bars["hour_utc"] >= int(candidate["entry_start_hour"]))\n            & (bars["hour_utc"] <= int(candidate["entry_end_hour_inclusive"]))\n        )\n    return pd.Series(True, index=bars.index)\n'''
          new = '''def allowed_hours(bars: pd.DataFrame, candidate: dict[str, Any]) -> pd.Series:\n    if "entry_hours_utc" in candidate:\n        entry_ts = bars["timestamp_utc"].shift(-1)\n        return entry_ts.dt.hour.isin([int(v) for v in candidate["entry_hours_utc"]])\n    if "entry_start_hour" in candidate:\n        # Session-window fields are signal-close windows by definition.\n        return (\n            (bars["hour_utc"] >= int(candidate["entry_start_hour"]))\n            & (bars["hour_utc"] <= int(candidate["entry_end_hour_inclusive"]))\n        )\n    return pd.Series(True, index=bars.index)\n'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new)
          text = text.replace('Freeze and audit the USDJPY R1 Entry universe without opening any outcome.', 'Freeze and audit the corrected USDJPY R1 Entry universe without opening any outcome.')
          target_runner.write_text(text)

          source_doc = Path('docs/research_reboot/usdjpy_r1_entry_universe_prereg_v1.md')
          target_doc = Path('docs/research_reboot/usdjpy_r1_entry_universe_prereg_v2.md')
          doc = source_doc.read_text()
          doc = doc.replace('# USDJPY R1 Entry Universe Preregistration v1', '# USDJPY R1 Entry Universe Preregistration v2', 1)
          correction = '''\n## Timing-semantics correction\n\nR1 v1 run `29641805182` and artifact `8428842719` are excluded because the v1 runner applied `entry_hours_utc` to the signal-bar hour. The authoritative corrected H1 implementation applies those fields to the actual next-bar Entry timestamp.\n\nThe v2 correction changes no family, candidate, threshold, lookback, session window or Entry mechanism. No PnL or horizon outcome was used. Session candidates whose `entry_start_hour` and `entry_end_hour_inclusive` fields define signal-close windows remain unchanged.\n\nAcceptance of v2 additionally requires exact registered-hold signal-ledger reproduction for all thirteen historical candidates, including both C1 and C2 projections of the shared failed-excursion Entry definition.\n'''
          target_doc.write_text(doc.replace('\n## Decision boundary\n', correction + '\n## Decision boundary\n', 1))
          PY
          python -m json.tool configs/research/usdjpy_r1_entry_universe_v2.json >/dev/null
          python -m py_compile tools/run_usdjpy_r1_entry_registry_v2.py
          python - <<'PY'
          import json
          from pathlib import Path
          old = json.loads(Path('configs/research/usdjpy_r1_entry_universe_v1.json').read_text())
          new = json.loads(Path('configs/research/usdjpy_r1_entry_universe_v2.json').read_text())
          old_candidates = [c for f in old['families'] for c in f['candidates']]
          new_candidates = [c for f in new['families'] for c in f['candidates']]
          assert old_candidates == new_candidates
          assert len(new_candidates) == 60
          assert len(new['families']) == 12
          assert new['common_execution']['entry_hours_utc_applies_to'] == 'actual_next_M15_entry_timestamp'
          assert new['timing_semantics_correction']['candidate_or_parameter_change'] is False
          assert new['timing_semantics_correction']['outcome_information_used'] is False
          print({'candidate_definitions_unchanged': True, 'families': 12, 'candidates': 60, 'status': 'PASS'})
          PY

      - name: Commit corrected preregistration
        run: |
          set -euo pipefail
          rm -f .github/workflows/assemble_usdjpy_r1_prereg_v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: correct USDJPY R1 actual-entry hour semantics'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Close trigger issue
        if: github.event_name == 'issues' && success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh issue comment "${ISSUE_NUMBER}" --repo "${REPOSITORY}" --body 'Corrected R1 v2 preregistration committed. Candidate definitions are unchanged; entry_hours_utc now applies to actual next-bar Entry timestamps. R1 v1 is excluded.'
          gh issue close "${ISSUE_NUMBER}" --repo "${REPOSITORY}" --reason completed
