name: Archive Accepted USDJPY R5 Controlled Exit v1

on:
  pull_request:
    types: [opened]

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download and independently verify accepted artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          rm -rf audit release_assets
          mkdir -p audit release_assets
          asset='release_assets/usdjpy-r5-controlled-exit-v1-run-29666989206-artifact-8436023286.zip'
          gh api "repos/${REPOSITORY}/actions/artifacts/8436023286/zip" > "${asset}"
          echo '0f0238a509c4bd6dc9bbe43c941001b7d2c54c66ba07b48f0aa9343f6c4a05cb  release_assets/usdjpy-r5-controlled-exit-v1-run-29666989206-artifact-8436023286.zip' | sha256sum -c -
          unzip -t "${asset}" >/dev/null
          unzip -q "${asset}" -d audit
          python - <<'PY'
          import csv
          import gzip
          import hashlib
          import json
          from collections import Counter,defaultdict
          from pathlib import Path

          root=Path('audit')
          acceptance=json.loads((root/'r5_acceptance.json').read_text())
          metadata=json.loads((root/'run_metadata.json').read_text())

          def rows(name):
              with (root/name).open(newline='',encoding='utf-8') as fh:
                  return list(csv.DictReader(fh))

          summary=rows('exit_summary.csv')
          monthly=rows('exit_monthly.csv')
          direction=rows('exit_direction.csv')
          reasons=rows('exit_reason.csv')
          baseline=rows('baseline_regression.csv')
          trade_sets=rows('policy_trade_set_regression.csv')
          with gzip.open(root/'exit_trades.csv.gz','rt',newline='',encoding='utf-8') as fh:
              trades=list(csv.DictReader(fh))

          assert acceptance['status']=='PASS'
          assert all(v is True for k,v in acceptance.items() if k!='status')
          assert metadata['status']=='PASS'
          assert len(trades)==11928
          assert len(summary)==32
          assert len(monthly)==192
          assert len(direction)==64
          assert len(reasons)==96
          assert len(baseline)==8 and all(row['passed'].lower()=='true' for row in baseline)
          assert len(trade_sets)==32 and all(row['passed'].lower()=='true' for row in trade_sets)
          assert metadata['H2_rows_parsed']==0
          assert metadata['2025_artifact_access'] is False
          assert metadata['R4_reselection'] is False
          assert metadata['policy_parameter_optimization'] is False
          assert metadata['R5_selection_or_promotion'] is False
          assert metadata['R6_design_unblocked'] is True

          by_candidate=defaultdict(list)
          for row in summary:
              by_candidate[row['candidate_id']].append(row)
          t0_best_default=0
          t0_best_severe=0
          policy_counts=Counter()
          for candidate,group in by_candidate.items():
              best_default=max(group,key=lambda row:float(row['avg_default_net_pips']))['policy_id']
              best_severe=max(group,key=lambda row:float(row['avg_severe_net_pips']))['policy_id']
              t0_best_default += best_default=='T0_fixed_time_cap'
              t0_best_severe += best_severe=='T0_fixed_time_cap'
              for row in group:
                  if float(row['avg_severe_net_pips'])>0:
                      policy_counts[row['policy_id']]+=1

          inspection={
              'accepted_run_id':29666989206,
              'evaluator_lock_commit':'1e4b27aab1f7b1cda51a902da26f4d3080cda8ad',
              'formal_workflow_commit':'63c8bcbfa9f7584354c4e84f20bf865c6a828162',
              'artifact_id':8436023286,
              'artifact_sha256':'0f0238a509c4bd6dc9bbe43c941001b7d2c54c66ba07b48f0aa9343f6c4a05cb',
              'acceptance_checks':len(acceptance)-1,
              'representatives':8,
              'policies':4,
              'representative_policy_combinations':32,
              'policy_trade_rows':11928,
              'baseline_regressions_passed':8,
              'policy_trade_set_regressions_passed':32,
              'same_bar_ambiguous_trades':metadata['same_bar_ambiguous_trades'],
              'stop_gap_exit_trades':metadata['stop_gap_exit_trades'],
              'target_gap_exit_trades':metadata['target_gap_exit_trades'],
              't0_best_avg_default_representatives':t0_best_default,
              't0_best_avg_severe_representatives':t0_best_severe,
              'severe_positive_representatives_by_policy':dict(sorted(policy_counts.items())),
              'exit_trades_sha256':hashlib.sha256((root/'exit_trades.csv.gz').read_bytes()).hexdigest(),
              'exit_summary_sha256':hashlib.sha256((root/'exit_summary.csv').read_bytes()).hexdigest(),
              'r5_acceptance_sha256':hashlib.sha256((root/'r5_acceptance.json').read_bytes()).hexdigest(),
              'run_metadata_sha256':hashlib.sha256((root/'run_metadata.json').read_bytes()).hexdigest(),
          }
          Path('inspection.json').write_text(json.dumps(inspection,indent=2,sort_keys=True)+'\n')
          print(json.dumps(inspection,sort_keys=True))
          PY

      - name: Write Release manifest and result document
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path
          inspection=json.loads(Path('inspection.json').read_text())
          manifest={
              'version':'v1',
              'repository':'mitsuru93/usdjpyea-research',
              'release_tag':'usdjpy-r5-controlled-exit-v1',
              'accepted_run_id':inspection['accepted_run_id'],
              'evaluator_lock_commit':inspection['evaluator_lock_commit'],
              'formal_workflow_commit':inspection['formal_workflow_commit'],
              'actions_artifact_id':inspection['artifact_id'],
              'actions_artifact_name':'usdjpy-r5-controlled-exit-v1-29666989206',
              'actions_artifact_sha256':inspection['artifact_sha256'],
              'r5_status':'PASS',
              'acceptance_checks':inspection['acceptance_checks'],
              'representatives':inspection['representatives'],
              'policies':inspection['policies'],
              'representative_policy_combinations':inspection['representative_policy_combinations'],
              'policy_trade_rows':inspection['policy_trade_rows'],
              'baseline_regressions_passed':inspection['baseline_regressions_passed'],
              'policy_trade_set_regressions_passed':inspection['policy_trade_set_regressions_passed'],
              'same_bar_ambiguous_trades':inspection['same_bar_ambiguous_trades'],
              'stop_gap_exit_trades':inspection['stop_gap_exit_trades'],
              'target_gap_exit_trades':inspection['target_gap_exit_trades'],
              't0_best_avg_default_representatives':inspection['t0_best_avg_default_representatives'],
              't0_best_avg_severe_representatives':inspection['t0_best_avg_severe_representatives'],
              'severe_positive_representatives_by_policy':inspection['severe_positive_representatives_by_policy'],
              'exit_trades_sha256':inspection['exit_trades_sha256'],
              'exit_summary_sha256':inspection['exit_summary_sha256'],
              'r5_acceptance_sha256':inspection['r5_acceptance_sha256'],
              'run_metadata_sha256':inspection['run_metadata_sha256'],
              'H2_rows_parsed':0,
              '2025_artifact_access':False,
              'R5_selection_or_promotion':False,
              'R6_design_unblocked':True,
              'Core_promotion':False,
              'MT4_promotion':False,
          }
          Path('release_assets/usdjpy-r5-controlled-exit-v1-manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')

          with Path('audit/exit_summary.csv').open(newline='',encoding='utf-8') as fh:
              summary=list(csv.DictReader(fh))
          summary.sort(key=lambda row:(int(row['selection_rank']),row['policy_id']))
          lines=[
              '# USDJPY R5 Controlled Exit Research Result v1','',
              '## Decision','',
              '```text','R5: PASS','strategy selection: none','H2 rows parsed: 0','2025 access: none','Core promotion: false','MT4 promotion: false','```','',
              '## Accepted run','',
              '```text',
              'run_id: 29666989206',
              'evaluator_lock_commit: 1e4b27aab1f7b1cda51a902da26f4d3080cda8ad',
              'formal_workflow_commit: 63c8bcbfa9f7584354c4e84f20bf865c6a828162',
              'artifact_id: 8436023286',
              'artifact: usdjpy-r5-controlled-exit-v1-29666989206',
              'artifact_digest: sha256:0f0238a509c4bd6dc9bbe43c941001b7d2c54c66ba07b48f0aa9343f6c4a05cb',
              'release_tag: usdjpy-r5-controlled-exit-v1','```','',
              '## Complete comparison','',
              '```text','representatives: 8','policies: 4','representative/policy combinations: 32','policy trade rows: 11,928','T0 exact R2 regressions: 8 / 8','policy Entry-set regressions: 32 / 32',f"same-bar bracket ambiguities: {inspection['same_bar_ambiguous_trades']}",f"stop-gap exits: {inspection['stop_gap_exit_trades']}",f"target-gap exits: {inspection['target_gap_exit_trades']}",'```','',
              '## Descriptive result','',
              f"The fixed time-cap baseline had the highest average default-cost return for {inspection['t0_best_avg_default_representatives']} of eight representatives and the highest average severe-cost return for {inspection['t0_best_avg_severe_representatives']} of eight.",
              '',
              'This is not an R5 selection decision. R6 common complete-strategy gates must be preregistered before any Entry/Exit pair is selected.','',
              '| R4 rank | Candidate | Policy | Trades | Avg default | Avg severe | Default PF | Severe PF | Positive months | Ex-best-two-days | Avg bars |',
              '|---:|---|---|---:|---:|---:|---:|---:|---:|---:|---:|',
          ]
          for row in summary:
              lines.append(
                  f"| {int(row['selection_rank'])} | {row['candidate_id']} | {row['policy_id']} | {int(row['trades'])} | {float(row['avg_default_net_pips']):+.6f} | {float(row['avg_severe_net_pips']):+.6f} | {float(row['default_profit_factor']):.6f} | {float(row['severe_profit_factor']):.6f} | {int(row['positive_months'])} | {float(row['total_excluding_best_two_utc_days']):+.3f} | {float(row['avg_bars_held']):.3f} |"
              )
          lines += ['', 'R5 compared the four frozen mechanisms only. It did not tune parameters, reselect R4 representatives, access H2 or 2025, or promote any strategy.']
          Path('docs/research_reboot/usdjpy_r5_controlled_exit_result_v1.md').write_text('\n'.join(lines)+'\n')
          PY
          (cd release_assets && sha256sum * > SHA256SUMS)

      - name: Create clean durable Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: usdjpy-r5-controlled-exit-v1
        run: |
          set -euo pipefail
          if ! gh release view "${TAG}" --repo "${REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${TAG}" --repo "${REPOSITORY}" --title 'USDJPY R5 Controlled Exit Research v1' --notes 'Accepted R5 H1 controlled Exit comparison. Eight representatives by four frozen policies, no selection and no H2/2025 access.' --latest=false
          fi
          mapfile -t EXISTING < <(gh release view "${TAG}" --repo "${REPOSITORY}" --json assets --jq '.assets[].name')
          for name in "${EXISTING[@]}"; do
            gh release delete-asset "${TAG}" "${name}" --repo "${REPOSITORY}" --yes
          done
          gh release upload "${TAG}" release_assets/* --repo "${REPOSITORY}"
          for attempt in 1 2 3 4 5; do
            gh release view "${TAG}" --repo "${REPOSITORY}" --json tagName,url,isDraft,isPrerelease,assets > release_receipt.json
            if python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('release_receipt.json').read_text())
          assets={row['name']:row for row in r['assets']}
          expected={'usdjpy-r5-controlled-exit-v1-run-29666989206-artifact-8436023286.zip','usdjpy-r5-controlled-exit-v1-manifest.json','SHA256SUMS'}
          ok=(r['tagName']=='usdjpy-r5-controlled-exit-v1' and not r['isDraft'] and not r['isPrerelease'] and set(assets)==expected and all(row['state']=='uploaded' for row in assets.values()) and assets['usdjpy-r5-controlled-exit-v1-run-29666989206-artifact-8436023286.zip'].get('digest')=='sha256:0f0238a509c4bd6dc9bbe43c941001b7d2c54c66ba07b48f0aa9343f6c4a05cb')
          raise SystemExit(0 if ok else 1)
          PY
            then break; fi
            sleep 5
          done
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('release_receipt.json').read_text())
          assets={row['name']:row for row in r['assets']}
          assert set(assets)=={'usdjpy-r5-controlled-exit-v1-run-29666989206-artifact-8436023286.zip','usdjpy-r5-controlled-exit-v1-manifest.json','SHA256SUMS'}
          assert assets['usdjpy-r5-controlled-exit-v1-run-29666989206-artifact-8436023286.zip']['digest']=='sha256:0f0238a509c4bd6dc9bbe43c941001b7d2c54c66ba07b48f0aa9343f6c4a05cb'
          print({'R5_release':'PASS','assets':3})
          PY

      - name: Commit receipt result and remove workflow
        run: |
          set -euo pipefail
          target='docs/research_reboot/artifact_archives/usdjpy_r5_controlled_exit_v1'
          mkdir -p "${target}"
          cp release_receipt.json "${target}/release_receipt.json"
          cp release_assets/usdjpy-r5-controlled-exit-v1-manifest.json "${target}/artifact_manifest.json"
          cp release_assets/SHA256SUMS "${target}/SHA256SUMS"
          rm -rf audit release_assets release_receipt.json inspection.json
          rm -f .github/workflows/run_usdjpy_r4_entry_horizon_selection_v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: archive accepted USDJPY R5 controlled exits v1'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Close marker PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "${PR_NUMBER}" --repo "${REPOSITORY}" --body 'Accepted R5 artifact was independently audited, archived in a clean durable Release and recorded in the repository. R6 rules must be frozen before any strategy selection.'
          gh pr close "${PR_NUMBER}" --repo "${REPOSITORY}" --delete-branch
