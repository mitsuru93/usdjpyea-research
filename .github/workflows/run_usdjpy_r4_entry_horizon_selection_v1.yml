name: Indexed Bridge Assemble USDJPY R5 Evaluator v3

on:
  pull_request:
    types: [opened]

permissions:
  contents: write
  pull-requests: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate subchunks reassemble exact evaluator and freeze lock
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          stage=Path('.github/r5_stage_v2')
          sub_specs={
              'chunk_00a.b64':(2800,'c1d35fca3f7424fa1aa08f8786aa3818419909fb47cea93307f3f2b1939bfa06'),
              'chunk_00b.b64':(2800,'07529dcc01f6f50bb7a28f3799b4430199dd7db6be82c1e49b0133458d296c3b'),
              'chunk_01a.b64':(2800,'5407b21be92011179811e5845d39a39c569e2c89d72352a5b592e9d156502bbd'),
              'chunk_01b.b64':(2800,'28a7d8594a3cd805aea33a1c6b70db527e476cbaa2948c053ba46baee113db2e'),
              'chunk_05a.b64':(2800,'b9b3bc486d2d4670498420d1e7713eac0d3dc4010b85b7ad3da0256cf061f5e3'),
              'chunk_05b.b64':(2800,'0e1ceb5e2401f9db7f1ecf224a6086bef4060e8c7e6a3c976b3f2ae1177960a8'),
          }
          sub_text={}
          for name,(expected_len,expected_hash) in sub_specs.items():
              text=(stage/name).read_text(encoding='utf-8').strip()
              actual=hashlib.sha256(text.encode()).hexdigest()
              print({'subchunk':name,'chars':len(text),'sha256':actual})
              assert len(text)==expected_len,(name,len(text),expected_len)
              assert actual==expected_hash,(name,actual,expected_hash)
              sub_text[name]=text

          chunks={
              0:sub_text['chunk_00a.b64']+sub_text['chunk_00b.b64'],
              1:sub_text['chunk_01a.b64']+sub_text['chunk_01b.b64'],
              5:sub_text['chunk_05a.b64']+sub_text['chunk_05b.b64'],
          }
          direct_specs={
              2:(5600,'88772cb4a9a31adcfc84592632d5c226de5ad97f249a23f60f8902e1363f7784'),
              3:(5600,'b67aebf9b473dce6ba4a8d11d924cc948f4dc3530467b29f717f8067cdbdc1ce'),
              4:(5600,'dd0b449f47b28017c29861555f1afd1edf47ec1217fc47b78a2fa6df75f9f6a8'),
              6:(5600,'956a1af282fac2dbce4ab8c056bdd0610a32eda70da2beebe9c2dce205cb7040'),
              7:(5600,'1a547049f4b07f73ed2c8930aa712a409a3accdb888a3fc7c7bfe90ea84f16d0'),
              8:(60,'dc3935f58fbe9fdce6767eeb52e05cf756974416394cc4cc72bc84695fa2da61'),
          }
          for index,(expected_len,expected_hash) in direct_specs.items():
              text=(stage/f'chunk_{index:02d}.b64').read_text(encoding='utf-8').strip()
              actual=hashlib.sha256(text.encode()).hexdigest()
              print({'chunk':index,'chars':len(text),'sha256':actual})
              assert len(text)==expected_len,(index,len(text),expected_len)
              assert actual==expected_hash,(index,actual,expected_hash)
              chunks[index]=text

          reconstructed_hashes={
              0:'c13d90bae5d5473d99210272bb96e604d9b66388039fa087dd4a3201e2a24a59',
              1:'cb283da1d5b871f56094423f8de18d86616a35cf92770f38673cc112318ad857',
              5:'a0599d3465c14e79f3e7474dcf9faed24668e14b301c8e15a57d0df2d0b2afbc',
          }
          for index,expected_hash in reconstructed_hashes.items():
              actual=hashlib.sha256(chunks[index].encode()).hexdigest()
              assert len(chunks[index])==5600,(index,len(chunks[index]))
              assert actual==expected_hash,(index,actual,expected_hash)

          encoded=''.join(chunks[index] for index in range(9))
          assert len(encoded)==44860,len(encoded)
          source=base64.b64decode(encoded,validate=True)
          assert len(source)==33643,len(source)
          source_hash=hashlib.sha256(source).hexdigest()
          assert source_hash=='61a08c41473f6895056b7c680f2d8a0730e6391b2f4e070e9bab4dd10f9c2a19',source_hash
          runner=Path('tools/run_usdjpy_r5_controlled_exit_v1.py')
          runner.write_bytes(source)
          runner.chmod(0o755)

          config_path=Path('configs/research/usdjpy_r5_controlled_exit_v1.json')
          prereg_path=Path('docs/research_reboot/usdjpy_r5_controlled_exit_prereg_v1.md')
          config=json.loads(config_path.read_text(encoding='utf-8'))
          assert len(config['representatives'])==8
          assert len(config['policies'])==4
          assert config['cohort_contract']['entry_rows_per_policy']==2982
          assert config['cohort_contract']['total_policy_trade_rows']==11928
          assert config['policy_design']['parameter_sweep'] is False
          assert config['research_firewall']['H2_rows_parsed']==0
          assert config['research_firewall']['2025_access'] is False

          paths=[str(config_path),str(prereg_path),str(runner)]
          code_blobs={}
          for path in paths:
              if path==str(runner):
                  code_blobs[path]=subprocess.check_output(['git','hash-object',path],text=True).strip()
              else:
                  code_blobs[path]=subprocess.check_output(['git','rev-parse',f'HEAD:{path}'],text=True).strip()
          lock={
              'version':'v1','research_stage':'R5_controlled_exit_research','symbol':'USDJPY',
              'code_blobs':code_blobs,
              'content_sha256':{path:hashlib.sha256(Path(path).read_bytes()).hexdigest() for path in paths},
              'input_releases':{
                  'r0':{'tag':config['inputs']['r0_release_tag'],'asset':config['inputs']['r0_release_asset'],'asset_sha256':config['inputs']['r0_release_asset_sha256'],'canonical_m15_gzip_sha256':config['inputs']['canonical_m15_gzip_sha256']},
                  'r2':{'tag':config['inputs']['r2_release_tag'],'asset':config['inputs']['r2_release_asset'],'asset_sha256':config['inputs']['r2_release_asset_sha256'],'trade_ledger_sha256':config['inputs']['r2_trade_ledger_sha256']},
                  'r4':{'tag':config['inputs']['r4_release_tag'],'asset':config['inputs']['r4_release_asset'],'asset_sha256':config['inputs']['r4_release_asset_sha256'],'selected_representatives_sha256':config['inputs']['r4_selected_representatives_sha256']}
              },
              'representatives':config['representatives'],'cohort_contract':config['cohort_contract'],
              'atr_contract':config['atr'],'policy_contract':config['policies'],
              'execution_contract':config['execution_semantics'],'cost_contract':config['cost_semantics'],
              'reporting_contract':config['reporting'],'required_outputs':config['required_outputs'],
              'research_firewall':config['research_firewall'],'next_stage':config['next_stage']
          }
          Path('configs/research/usdjpy_r5_controlled_exit_lock_v1.json').write_text(json.dumps(lock,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print({'R5_assembly':'PASS','source_bytes':len(source),'source_sha256':source_hash,'runner_blob':code_blobs[str(runner)]})
          PY
          python -m py_compile tools/run_usdjpy_r5_controlled_exit_v1.py

      - name: Commit exact evaluator and remove assembly material
        run: |
          set -euo pipefail
          rm -rf .github/r5_stage .github/r5_stage_v2
          rm -f .github/workflows/assemble_usdjpy_r5_from_chunks_v2.yml
          rm -f .github/workflows/assemble_usdjpy_r5_controlled_exit_v1.yml
          rm -f .github/workflows/run_usdjpy_r5_controlled_exit_v1.yml
          rm -f .github/workflows/run_usdjpy_r5_controlled_exit_final_v1.yml
          rm -f .github/workflows/patch_usdjpy_r5_compressed_hash_v1.yml
          rm -f .github/workflows/diagnose_and_patch_usdjpy_r5_payload_v1.yml
          rm -f .github/workflows/run_usdjpy_r4_entry_horizon_selection_v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'research: materialize and lock USDJPY R5 evaluator v1'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Close trigger PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "${PR_NUMBER}" --repo "${REPOSITORY}" --body 'R5 evaluator was reconstructed from verified subchunks, compiled, locked and committed to main before any formal Exit result.'
          gh pr close "${PR_NUMBER}" --repo "${REPOSITORY}" --delete-branch
