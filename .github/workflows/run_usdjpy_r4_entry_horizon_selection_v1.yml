name: Indexed Bridge Report USDJPY R5 Chunk Hashes v2

on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build chunk report
        run: |
          python - <<'PY' > report.md
          import hashlib
          from pathlib import Path
          expected_hashes=[
              'c13d90bae5d5473d99210272bb96e604d9b66388039fa087dd4a3201e2a24a59',
              'cb283da1d5b871f56094423f8de18d86616a35cf92770f38673cc112318ad857',
              '88772cb4a9a31adcfc84592632d5c226de5ad97f249a23f60f8902e1363f7784',
              'b67aebf9b473dce6ba4a8d11d924cc948f4dc3530467b29f717f8067cdbdc1ce',
              'dd0b449f47b28017c29861555f1afd1edf47ec1217fc47b78a2fa6df75f9f6a8',
              'a0599d3465c14e79f3e7474dcf9faed24668e14b301c8e15a57d0df2d0b2afbc',
              '956a1af282fac2dbce4ab8c056bdd0610a32eda70da2beebe9c2dce205cb7040',
              '1a547049f4b07f73ed2c8930aa712a409a3accdb888a3fc7c7bfe90ea84f16d0',
              'dc3935f58fbe9fdce6767eeb52e05cf756974416394cc4cc72bc84695fa2da61',
          ]
          expected_lengths=[5600,5600,5600,5600,5600,5600,5600,5600,60]
          print('| chunk | chars | expected chars | actual SHA-256 | expected SHA-256 | match |')
          print('|---:|---:|---:|---|---|---|')
          for i,(expected_hash,expected_length) in enumerate(zip(expected_hashes,expected_lengths)):
              path=Path(f'.github/r5_stage_v2/chunk_{i:02d}.b64')
              text=path.read_text(encoding='utf-8').strip()
              actual=hashlib.sha256(text.encode()).hexdigest()
              match=(len(text)==expected_length and actual==expected_hash)
              print(f'| {i} | {len(text)} | {expected_length} | `{actual}` | `{expected_hash}` | {match} |')
          PY

      - name: Comment report
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "${PR_NUMBER}" --repo "${REPOSITORY}" --body-file report.md
