name: USDJPY 2020-2022 Tick Authority v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/usdjpy_2020_2022_tick_authority_v1.yml'
      - 'tools/build_usdjpy_2020_2022_tick_authority_month_v1.py'
      - 'tools/finalize_usdjpy_2020_2022_tick_authority_v1.py'
      - 'configs/data_sources/usdjpy_2020_2022_tick_authority_contract_v1.json'

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: usdjpy-2020-2022-tick-authority-v1
  cancel-in-progress: false

env:
  WORK_ID: USDJPY-DATA-2020-2022-TICK-AUTHORITY-001
  RELEASE_TAG: usdjpy-2020-2022-source-native-bidask-tick-authority-v1

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: source
        run: echo "source_sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
      - id: matrix
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          rows=[{'year':2019,'month':m,'period_role':'WARMUP_ONLY'} for m in (10,11,12)]
          rows += [{'year':y,'month':m,'period_role':'ANALYSIS_PERIOD'} for y in (2020,2021,2022) for m in range(1,13)]
          print('matrix='+json.dumps({'include':rows},separators=(',',':')))
          PY
      - name: Validate collection firewall and code
        run: |
          python -m py_compile \
            tools/download_dukascopy_raw_tick_day_v1.py \
            tools/build_usdjpy_2020_2022_tick_authority_month_v1.py \
            tools/finalize_usdjpy_2020_2022_tick_authority_v1.py
          python - <<'PY'
          import json
          c=json.load(open('configs/data_sources/usdjpy_2020_2022_tick_authority_contract_v1.json'))
          assert c['work_id']=='USDJPY-DATA-2020-2022-TICK-AUTHORITY-001'
          assert c['candidate_evaluation_executed'] is False
          assert c['strategy_scoring_authorized'] is False
          assert c['production_authorization'] is False
          assert c['period_roles']['2020_2022']=='ANALYSIS_PERIOD'
          PY
      - name: Create isolated draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" --draft \
            --title "USDJPY 2020-2022 Source-Native Bid/Ask Tick Authority v1" \
            --notes "Analysis-only Dukascopy source-native USDJPY Bid/Ask Tick authority. No strategy scoring or candidate decision changes."

  collect-months:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      YEAR: ${{ matrix.year }}
      MONTH: ${{ matrix.month }}
      PERIOD_ROLE: ${{ matrix.period_role }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve exact UTC month bounds
        shell: bash
        run: |
          set -euo pipefail
          read START END KEY < <(python - <<'PY'
          import datetime as dt,os
          y=int(os.environ['YEAR']);m=int(os.environ['MONTH'])
          start=dt.datetime(y,m,1)
          end=dt.datetime(y+1,1,1) if m==12 else dt.datetime(y,m+1,1)
          print(start.strftime('%Y-%m-%d'),end.strftime('%Y-%m-%d'),f'{y}_{m:02d}')
          PY
          )
          echo "START=$START" >> "$GITHUB_ENV"
          echo "END=$END" >> "$GITHUB_ENV"
          echo "KEY=$KEY" >> "$GITHUB_ENV"
          echo "BASE=$RUNNER_TEMP/usdjpy-tick-authority-$KEY" >> "$GITHUB_ENV"
      - name: Download exact Dukascopy source-native BI5 and decoded Bid/Ask
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BASE/download"
          python tools/download_dukascopy_raw_tick_day_v1.py \
            --symbol USDJPY --start "$START" --end "$END" \
            --output-root "$BASE/download" \
            --manifest-out "$BASE/download_manifest.jsonl" \
            --summary-out "$BASE/download_summary.json" \
            --retries 4 --retry-passes 4 --request-timeout 45 \
            --request-interval 0.05 --max-errors 0
      - name: Normalize, audit, reconstruct bars, and package month
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_usdjpy_2020_2022_tick_authority_month_v1.py \
            --year "$YEAR" --month "$MONTH" \
            --download-root "$BASE/download" \
            --download-manifest "$BASE/download_manifest.jsonl" \
            --download-summary "$BASE/download_summary.json" \
            --out "$BASE/out" --source-sha "$SOURCE_SHA"
      - name: Upload monthly payloads to draft Release and verify remote bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for f in "$BASE/out/release_assets"/*; do
            gh release upload "$RELEASE_TAG" "$f" --repo "$GITHUB_REPOSITORY"
          done
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$BASE/release.json"
          : > "$BASE/remote_assets.jsonl"
          for f in "$BASE/out/release_assets"/*; do
            name=$(basename "$f")
            id=$(jq -r --arg n "$name" '.assets[] | select(.name==$n) | .id' "$BASE/release.json")
            url=$(jq -r --arg n "$name" '.assets[] | select(.name==$n) | .browser_download_url' "$BASE/release.json")
            test -n "$id" && test "$id" != null
            gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "$BASE/readback-$name"
            local_sha=$(sha256sum "$f" | awk '{print $1}')
            remote_sha=$(sha256sum "$BASE/readback-$name" | awk '{print $1}')
            local_bytes=$(stat -c '%s' "$f")
            remote_bytes=$(stat -c '%s' "$BASE/readback-$name")
            test "$local_sha" = "$remote_sha"
            test "$local_bytes" = "$remote_bytes"
            jq -cn --arg name "$name" --argjson id "$id" --arg url "$url" --arg sha "$remote_sha" --argjson bytes "$remote_bytes" \
              '{name:$name,id:$id,browser_download_url:$url,readback_status:"PASS_BYTE_IDENTICAL_RELEASE_READBACK",readback_sha256:$sha,readback_bytes:$bytes}' >> "$BASE/remote_assets.jsonl"
          done
          RECEIPT="$BASE/out/USDJPY_DUKASCOPY_RECEIPT_${YEAR}_$(printf '%02d' "$MONTH").json"
          python - "$RECEIPT" "$BASE/remote_assets.jsonl" <<'PY'
          import json,sys
          p=sys.argv[1];o=json.load(open(p));o['remote_release_assets']=[json.loads(x) for x in open(sys.argv[2]) if x.strip()]
          open(p,'w').write(json.dumps(o,indent=2,sort_keys=True)+'\n')
          PY
          gh release upload "$RELEASE_TAG" "$RECEIPT" --repo "$GITHUB_REPOSITORY"
      - name: Preserve small monthly receipt for root aggregation
        uses: actions/upload-artifact@v4
        with:
          name: usdjpy-tick-authority-month-receipt-${{ env.KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.BASE }}/out/USDJPY_DUKASCOPY_RECEIPT_*.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

  finalize:
    needs: [prepare, collect-months]
    if: ${{ always() && needs.collect-months.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: usdjpy-tick-authority-month-receipt-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: receipts
          merge-multiple: true
      - name: Aggregate all monthly receipts and make final decision
        run: |
          python tools/finalize_usdjpy_2020_2022_tick_authority_v1.py aggregate \
            --receipts-root receipts --out final \
            --repository "$GITHUB_REPOSITORY" --source-sha "$SOURCE_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --release-tag "$RELEASE_TAG"
      - name: Create receipt Issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          decision=$(jq -r '.decision' final/final_result.json)
          issue_url=$(gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "$WORK_ID — $decision" \
            --body-file final/human_report.md)
          issue_number=${issue_url##*/}
          echo "issue_url=$issue_url" >> "$GITHUB_OUTPUT"
          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"
          python - "$issue_number" "$issue_url" <<'PY'
          import json,sys
          for p in ['final/final_result.json','final/release_manifest.json']:
            o=json.load(open(p));o['receipt_issue_number']=int(sys.argv[1]);o['receipt_issue_url']=sys.argv[2]
            open(p,'w').write(json.dumps(o,indent=2,sort_keys=True)+'\n')
          PY
      - name: Upload static root metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for f in final/*; do
            n=$(basename "$f")
            case "$n" in release_manifest.json|final_result.json|sha256sums.txt) continue;; esac
            gh release upload "$RELEASE_TAG" "$f" --repo "$GITHUB_REPOSITORY"
          done
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > final/release_api.json
          python tools/finalize_usdjpy_2020_2022_tick_authority_v1.py enrich --out final --release-json final/release_api.json
          gh release upload "$RELEASE_TAG" final/release_manifest.json final/final_result.json final/sha256sums.txt --repo "$GITHUB_REPOSITORY"
      - name: Verify metadata readback and publish immutable Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > final/release_api_final.json
          mkdir -p readback
          : > final/metadata_readback.jsonl
          for f in final/*; do
            n=$(basename "$f")
            case "$n" in release_api.json|release_api_final.json|metadata_readback.jsonl) continue;; esac
            id=$(jq -r --arg n "$n" '.assets[] | select(.name==$n) | .id' final/release_api_final.json)
            test -n "$id" && test "$id" != null
            gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "readback/$n"
            ls=$(sha256sum "$f"|awk '{print $1}');rs=$(sha256sum "readback/$n"|awk '{print $1}')
            lb=$(stat -c '%s' "$f");rb=$(stat -c '%s' "readback/$n")
            test "$ls" = "$rs"; test "$lb" = "$rb"
            jq -cn --arg name "$n" --argjson id "$id" --arg sha "$rs" --argjson bytes "$rb" '{name:$name,id:$id,sha256:$sha,bytes:$bytes,status:"PASS_BYTE_IDENTICAL_RELEASE_READBACK"}' >> final/metadata_readback.jsonl
          done
          jq -s --arg work_id "$WORK_ID" --arg tag "$RELEASE_TAG" --argjson run "$GITHUB_RUN_ID" \
            '{schema_version:"usdjpy_tick_authority_release_readback_receipt_v1",work_id:$work_id,release_tag:$tag,workflow_run_id:$run,status:"PASS_BYTE_IDENTICAL_RELEASE_READBACK",metadata_assets:.}' \
            final/metadata_readback.jsonl > final/release_readback_receipt.json
          gh release upload "$RELEASE_TAG" final/release_readback_receipt.json --repo "$GITHUB_REPOSITORY"
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.assets[]|select(.name=="release_readback_receipt.json")|.id')
          gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$id" > readback/release_readback_receipt.json
          test "$(sha256sum final/release_readback_receipt.json|awk '{print $1}')" = "$(sha256sum readback/release_readback_receipt.json|awk '{print $1}')"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
      - name: Commit certified manifests, catalog, and Current State firewall
        env:
          ISSUE_URL: ${{ steps.issue.outputs.issue_url }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          DEST=docs/data_authorities/usdjpy_2020_2022_tick_authority_v1
          mkdir -p "$DEST" configs/data_sources docs/data_authorities
          cp final/collection_manifest.json final/source_identity.json final/raw_asset_catalog.csv \
             final/normalized_asset_catalog.csv final/tick_quality_summary.json final/tick_quality_by_month.csv \
             final/gap_catalog.csv final/spread_distribution_by_month.csv final/bar_reconstruction_receipt.json \
             final/schema_compatibility_2020_2024.json final/rakuten_history_availability.json \
             final/period_role_receipt.json final/release_manifest.json final/sha256sums.txt \
             final/final_result.json final/human_report.md final/release_readback_receipt.json "$DEST/"
          cp final/final_result.json configs/data_sources/usdjpy_2020_2022_tick_authority_final_result_v1.json
          cat > docs/data_authorities/USDJPY_TICK_AUTHORITY_CATALOG.md <<EOF
          # USDJPY Tick Authority Catalog

          | Period | Role | Source | Release | Status |
          |---|---|---|---|---|
          | 2019-10 through 2019-12 | WARMUP_ONLY | Dukascopy source-native Bid/Ask BI5 | \`$RELEASE_TAG\` | Included, excluded from analysis totals |
          | 2020-01 through 2022-12 | ANALYSIS_PERIOD | Dukascopy source-native Bid/Ask BI5 | \`$RELEASE_TAG\` | Certified by Work ID \`$WORK_ID\` |
          | 2023 | RESEARCH_AND_CANDIDATE_CONSTRUCTION_PERIOD | Dukascopy source-native Bid/Ask BI5 | \`usdjpy-2023-raw-bidask-ticks-v1\` | Existing authority |
          | 2024 | RESEARCH_AND_CANDIDATE_CONSTRUCTION_PERIOD | Dukascopy source-native Bid/Ask BI5 | \`usdjpy-2024-raw-bidask-ticks-v1\` | Existing authority |

          Rakuten M1/M15 HST history is inventoried separately and is not broker-native raw Tick. See \`$DEST/rakuten_history_availability.json\`.
          EOF
          marker='<!-- USDJPY-DATA-2020-2022-TICK-AUTHORITY-001 -->'
          if ! grep -q "$marker" docs/research/USDJPY_CURRENT_RESEARCH_STATE.md; then
            cat >> docs/research/USDJPY_CURRENT_RESEARCH_STATE.md <<EOF

          $marker
          ## USDJPY 2020–2022 Tick authority

          The 2020–2022 Tick authority is analysis-only and does not change any existing candidate formal decision or any 2025H1 validation result. Work ID: \`$WORK_ID\`. Release: \`$RELEASE_TAG\`. Receipt Issue: #$ISSUE_NUMBER.
          EOF
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$DEST" configs/data_sources/usdjpy_2020_2022_tick_authority_final_result_v1.json docs/data_authorities/USDJPY_TICK_AUTHORITY_CATALOG.md docs/research/USDJPY_CURRENT_RESEARCH_STATE.md
          git commit -m "data: certify USDJPY 2020-2022 tick authority"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
