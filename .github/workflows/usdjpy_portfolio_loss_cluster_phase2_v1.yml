name: USDJPY HYP-027 SESSION_LOSS_CAP_2 Phase 2 Confirmation v1

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/evaluate_usdjpy_portfolio_loss_cluster_phase2_v1.py'
      - 'tools/usdjpy_portfolio_loss_cluster_phase2_v1/**'
      - 'configs/research/usdjpy_portfolio_loss_cluster_phase2_prereg_v1.json'
      - 'configs/research/usdjpy_portfolio_loss_cluster_phase2_startup_receipt_v1.json'
      - 'configs/research/usdjpy_portfolio_loss_cluster_phase2_**'
      - 'configs/research/usdjpy_research_candidate_registry_v54.json'
      - 'configs/research/usdjpy_2023_2024_hypothesis_program_v13.json'
      - 'configs/research/usdjpy_hypothesis_ledger_status_update_v1.json'
      - 'docs/research/USDJPY_PORTFOLIO_LOSS_CLUSTER_PHASE2_RESULT_V1.md'
      - '.github/workflows/usdjpy_portfolio_loss_cluster_phase2_v1.yml'
      - 'configs/run_markers/usdjpy_portfolio_loss_cluster_phase2_v1.json'
  push:
    branches: [main]
    paths:
      - 'configs/run_markers/usdjpy_portfolio_loss_cluster_phase2_v1.json'
      - 'configs/research/usdjpy_portfolio_loss_cluster_phase2_prereg_v1.json'

permissions:
  contents: write
  issues: write

jobs:
  phase2-confirmation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install frozen dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==2.1.3' 'pandas==2.2.3'
      - name: Compile and preflight frozen protocol
        run: |
          set -euo pipefail
          python -m py_compile tools/evaluate_usdjpy_portfolio_loss_cluster_phase2_v1.py tools/usdjpy_portfolio_loss_cluster_phase2_v1/*.py
          rm -rf phase2_preflight
          python tools/evaluate_usdjpy_portfolio_loss_cluster_phase2_v1.py \
            --protocol configs/research/usdjpy_portfolio_loss_cluster_phase2_prereg_v1.json \
            --out-dir phase2_preflight \
            --preflight-only
          jq -e '.status=="PASS_NO_OUTCOMES" and .candidate_id=="SESSION_LOSS_CAP_2" and .candidate_threshold==2 and .comparison_count==2 and .outcomes_computed==false and .MT4_accessed==false and ."2025H1_accessed"==false and ."2025H2_accessed"==false and .production_authorized==false' phase2_preflight/preflight_result.json
      - name: Download corrected Phase 1 authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf inputs phase1_authority phase2_output
          mkdir -p inputs phase1_authority phase2_output
          gh release download usdjpy-portfolio-loss-cluster-phase1-v1-r1 \
            --repo "$GITHUB_REPOSITORY" \
            --dir inputs \
            --pattern 'usdjpy-portfolio-loss-cluster-phase1-v1-r1.zip'
          echo '32ae25199256ca83e10a6a5da2cb9236f90ce0f41ebd797a3bd205b5b299bada  inputs/usdjpy-portfolio-loss-cluster-phase1-v1-r1.zip' | sha256sum -c -
          unzip -q inputs/usdjpy-portfolio-loss-cluster-phase1-v1-r1.zip -d phase1_authority
          test -d phase1_authority/portfolio_loss_cluster_output
      - name: Execute exact Phase 2 confirmation
        run: |
          set -euo pipefail
          python tools/evaluate_usdjpy_portfolio_loss_cluster_phase2_v1.py \
            --protocol configs/research/usdjpy_portfolio_loss_cluster_phase2_prereg_v1.json \
            --phase1-dir phase1_authority/portfolio_loss_cluster_output \
            --out-dir phase2_output \
            --research-sha "$GITHUB_SHA" \
            --core-sha 'dbffc656a0793a2efd9bd54394223f1239de2afa' \
            --workflow-run-id "$GITHUB_RUN_ID"
          jq -e '.decision=="FAIL_PHASE2_SIDE_BREADTH_SHORT_DEPENDENT"' phase2_output/result.json
          jq -e '.phase1_exact_reproduction.trade_rows==1882 and .phase1_exact_reproduction.unique_trade_ids==1882 and .phase1_exact_reproduction.blocked==27 and .phase1_exact_reproduction.missing==0 and .phase1_exact_reproduction.extra==0 and .phase1_exact_reproduction.duplicate==0 and .phase1_exact_reproduction.weight_mismatch==0 and .phase1_exact_reproduction.reason_mismatch==0 and .phase1_exact_reproduction.entry_timestamp_mismatch==0 and .phase1_exact_reproduction.future_information_violations==0' phase2_output/result.json
          jq -e '.economics.delta.net_improvement_jpy==5585 and .economics.delta.realized_dd_reduction_jpy==3717 and .economics.delta.M15_snapshot_dd_reduction_jpy==3717 and .economics.delta.top20_winner_loss_jpy==0' phase2_output/result.json
          jq -e '.failed_binding_gates|index("Long_delta_nonnegative") and index("strategy_concentration_below_75pct") and index("side_concentration_below_75pct")' phase2_output/result.json
          jq -e '.core_authorized==false and .MT4_authorized==false and ."2025H1_authorized"==false and ."2025H2_authorized"==false and .production_authorized==false and .period_firewall.MT4_accessed==false and .period_firewall."2025H1_accessed"==false and .period_firewall."2025H2_accessed"==false' phase2_output/result.json
      - name: Validate canonical closure summaries when present
        run: |
          set -euo pipefail
          if test -f configs/research/usdjpy_portfolio_loss_cluster_phase2_result_v1.json; then
            jq -e '.decision=="FAIL_PHASE2_SIDE_BREADTH_SHORT_DEPENDENT" and .economics.delta.net_improvement_jpy==5585 and .economics.delta.realized_dd_reduction_jpy==3717 and .phase1_exact_reproduction.blocked==27 and .core_authorized==false and .MT4_authorized==false and ."2025H1_authorized"==false' configs/research/usdjpy_portfolio_loss_cluster_phase2_result_v1.json
            jq -e '.status=="USDJPY_HYP027_CLOSED_NO_PORTABLE_SESSION_LOSS_CAP" and .active_hypothesis==null and .current_candidate==null and .run_authorization.MT4_parity==false and .run_authorization."2025_H1"==false and .run_authorization.production_implementation==false' configs/research/usdjpy_research_candidate_registry_v54.json
            jq -e '.status=="HYP027_PHASE2_FAILED_SIDE_BREADTH_CLOSED" and .phase2_decision=="FAIL_PHASE2_SIDE_BREADTH_SHORT_DEPENDENT" and .MT4_access==false and ."2025_access"==false' configs/research/usdjpy_2023_2024_hypothesis_program_v13.json
            jq -e '.hypothesis_id=="USDJPY-HYP-027" and .phase2_status=="CLOSED" and .decision=="FAIL_PHASE2_SIDE_BREADTH_SHORT_DEPENDENT"' configs/research/usdjpy_hypothesis_ledger_status_update_v1.json
          fi
      - name: Package evidence
        run: |
          set -euo pipefail
          cp configs/research/usdjpy_portfolio_loss_cluster_phase2_prereg_v1.json phase2_output/
          cp configs/research/usdjpy_portfolio_loss_cluster_phase2_startup_receipt_v1.json phase2_output/
          find phase2_output -maxdepth 1 -type f ! -name PACKAGE_SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > phase2_output/PACKAGE_SHA256SUMS
          zip -q -X -0 -r "usdjpy-portfolio-loss-cluster-phase2-v1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.zip" phase2_output
      - name: Upload evidence artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: usdjpy-portfolio-loss-cluster-phase2-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            phase2_output
            usdjpy-portfolio-loss-cluster-phase2-v1-${{ github.run_id }}-${{ github.run_attempt }}.zip
          retention-days: 90
          compression-level: 0
      - name: Publish immutable Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='usdjpy-portfolio-loss-cluster-phase2-v1'
          asset="usdjpy-portfolio-loss-cluster-phase2-v1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.zip"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; preserving immutability."
          else
            gh release create "$tag" "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title 'USDJPY-HYP-027 SESSION_LOSS_CAP_2 Phase 2 Confirmation v1' \
              --notes 'Internal 2023H1-2024H2 confirmation. Decision FAIL_PHASE2_SIDE_BREADTH_SHORT_DEPENDENT. No candidate freeze, Core, MT4, 2025, production, or live authorization.'
          fi
      - name: Publish receipt issue
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          cat > receipt.md <<EOF
          hypothesis_id: USDJPY-HYP-027
          study_id: USDJPY-PORTFOLIO-LOSS-CLUSTER-PHASE2-V1
          candidate_id: SESSION_LOSS_CAP_2
          decision: FAIL_PHASE2_SIDE_BREADTH_SHORT_DEPENDENT
          head_sha: ${GITHUB_SHA}
          workflow_run_id: ${GITHUB_RUN_ID}
          workflow_run_attempt: ${GITHUB_RUN_ATTEMPT}
          artifact_id: ${ARTIFACT_ID}
          artifact_digest: ${ARTIFACT_DIGEST}
          release_tag: usdjpy-portfolio-loss-cluster-phase2-v1
          phase1_trade_identity: 1882/1882
          blocked_identity: 27/27
          Long_delta_jpy: -1570
          Short_delta_jpy: 7155
          F05_positive_effect_share: 0.7652641002685765
          side_positive_effect_share: 1.0
          Core_authorized: false
          MT4_authorized: false
          2025H1_authorized: false
          2025H2_authorized: false
          production_authorized: false
          live_authorized: false
          run_url: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "[HYP-027 Phase 2 receipt] ${GITHUB_SHA}" \
            --body-file receipt.md
