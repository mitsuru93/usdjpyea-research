name: USDJPY HYP-034 Unfiltered Diagnostics v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/usdjpy_hyp034_unfiltered_diagnostics_v1.yml'
      - 'tools/summarize_usdjpy_hyp034_unfiltered_diagnostics_v1.py'
      - 'tools/usdjpy_hyp034_bi5_source_v1.py'
      - 'tools/usdjpy_hyp034_study_v1.py'
      - 'tools/usdjpy_hyp034_metrics_v1.py'
      - 'tools/usdjpy_hyp034_sitecustomize_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Establish short root and identities
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/h34u"
          rm -rf "$root"
          mkdir -p "$root/src" "$root/infra" "$root/development" "$root/inputs/historical" "$root/inputs/2023" "$root/inputs/2024h1" "$root/inputs/2024h2" "$root/inputs/raw2023" "$root/inputs/raw2024" "$root/materialized" "$root/output" "$root/evidence"
          sha='${{ github.event.pull_request.head.sha || github.sha }}'
          test "${#sha}" = 40
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "research_sha=$sha" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$sha" > "$root/evidence/research_head_sha.txt"
          printf '%s\n' '30375885665' > "$root/evidence/scientific_authority_run_id.txt"
          printf '%s\n' '8695321156' > "$root/evidence/scientific_authority_artifact_id.txt"
          printf '%s\n' 'sha256:4eefbcc77962dc9f72fa647b386088c18f9efa196b7f70be1e970ccf9ed8964b' > "$root/evidence/scientific_authority_artifact_digest.txt"
      - name: Exact-SHA selective fetch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ROOT: ${{ steps.identity.outputs.root }}
          RESEARCH_SHA: ${{ steps.identity.outputs.research_sha }}
        run: |
          set -euo pipefail
          fetch_file() {
            path="$1"; out="$2"
            payload=$(gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${RESEARCH_SHA}")
            printf '%s' "$payload" | jq -er '.content' | tr -d '\n' | base64 -d > "$out"
            printf '%s' "$payload" | jq -er '.sha' >> "$ROOT/evidence/selective_fetch_blob_shas.txt"
            test -s "$out"
          }
          fetch_file 'tools/summarize_usdjpy_hyp034_unfiltered_diagnostics_v1.py' "$ROOT/src/summarize.py"
          fetch_file 'tools/evaluate_usdjpy_previous_day_extreme_sweep_v1.py' "$ROOT/src/evaluate_usdjpy_previous_day_extreme_sweep_v1.py"
          fetch_file 'tools/usdjpy_hyp034_bi5_source_v1.py' "$ROOT/src/usdjpy_hyp034_bi5_source_v1.py"
          fetch_file 'tools/usdjpy_hyp034_study_v1.py' "$ROOT/src/usdjpy_hyp034_study_v1.py"
          fetch_file 'tools/usdjpy_hyp034_metrics_v1.py' "$ROOT/src/usdjpy_hyp034_metrics_v1.py"
          fetch_file 'tools/usdjpy_hyp034_sitecustomize_v1.py' "$ROOT/src/sitecustomize.py"
          fetch_file 'tools/build_usdjpy_b02_f05_hyp024_inputs_v2.py' "$ROOT/src/build_baseline.py"
          fetch_file 'tools/vendor/fx2_infra_core_f897b250_v1.py' "$ROOT/infra/fx2_infra.py"
          python -m py_compile "$ROOT/src/"*.py "$ROOT/infra/fx2_infra.py"
          sha256sum "$ROOT/src/"*.py "$ROOT/infra/fx2_infra.py" > "$ROOT/evidence/selective_fetch_sha256sums.txt"
      - name: Set up frozen scientific runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen dependencies and probe runner
        shell: bash
        env:
          ROOT: ${{ steps.identity.outputs.root }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'numpy==2.1.3' 'pandas==2.2.3'
          python "$ROOT/infra/fx2_infra.py" probe --json "$ROOT/evidence/runner_capability.json" --markdown "$ROOT/evidence/runner_capability.md"
      - name: Download binding scientific output authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ROOT: ${{ steps.identity.outputs.root }}
        run: |
          set -euo pipefail
          gh run download 30375885665 --repo "$GITHUB_REPOSITORY" --name 'usdjpy-hyp034-development-v1-30375885665-1' --dir "$ROOT/development"
          final=$(find "$ROOT/development" -type f -path '*/output/final_result.json' -print -quit)
          path_metrics=$(find "$ROOT/development" -type f -path '*/output/path_metrics.csv.gz' -print -quit)
          test -n "$final" && test -n "$path_metrics"
          cp "$final" "$ROOT/evidence/scientific_final_result.json"
          sha256sum "$final" "$path_metrics" > "$ROOT/evidence/scientific_output_sha256sums.txt"
          jq -e '.decision=="NO_PORTABLE_REJECTION_MECHANISM" and .selected_candidate==null and .protected_2020_2022_accessed==false and .protected_2025_accessed==false' "$final"
          echo "final=$final" >> "$GITHUB_ENV"
          echo "path_metrics=$path_metrics" >> "$GITHUB_ENV"
      - name: Materialize canonical B02 F05 baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ROOT: ${{ steps.identity.outputs.root }}
        run: |
          set -euo pipefail
          gh release download f05-failed-reclaim-historical-authorities-v1 --repo "$GITHUB_REPOSITORY" --dir "$ROOT/inputs/historical" --pattern 'usdjpy-2023-canonical-baseline-prep-v1.zip' --pattern 'mt4-usdjpy-2024h1-event-audit-v1.zip' --pattern 'mt4-usdjpy-f05-extatr-h2-validation-v1.zip' --pattern 'EXPECTED_SHA256SUMS'
          (cd "$ROOT/inputs/historical" && sha256sum -c EXPECTED_SHA256SUMS)
          unzip -q "$ROOT/inputs/historical/usdjpy-2023-canonical-baseline-prep-v1.zip" -d "$ROOT/inputs/2023"
          unzip -q "$ROOT/inputs/historical/mt4-usdjpy-2024h1-event-audit-v1.zip" -d "$ROOT/inputs/2024h1"
          unzip -q "$ROOT/inputs/historical/mt4-usdjpy-f05-extatr-h2-validation-v1.zip" -d "$ROOT/inputs/2024h2"
          python "$ROOT/src/build_baseline.py" \
            --m15-2023 "$ROOT/inputs/2023/normalized/usdjpy_2023_m15_bid_utc_rakuten_mt4_v1.csv.gz" \
            --m15-2024h1 "$ROOT/inputs/2024h1/m15_utc_2024h1.csv" \
            --events-2024h1 "$ROOT/inputs/2024h1/tester/fx2_usdjpy_2024h1_event_audit_fixed_001_each_v1.csv" \
            --events-2024h2 "$ROOT/inputs/2024h2/h2_baseline/fx2_usdjpy_f05_extatr_h2_baseline_v1.csv" \
            --out-dir "$ROOT/materialized" > "$ROOT/evidence/baseline_materialization.log"
          printf '%s  %s\n' '98c9c8cf57c62c23a94aa38efa6ee257e823dd0b68c413615197a48be00b08ca' "$ROOT/materialized/usdjpy_b02_f05_source_trade_ledger_v2.csv" | sha256sum -c -
      - name: Download and verify development BI5 authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ROOT: ${{ steps.identity.outputs.root }}
        run: |
          set -euo pipefail
          gh release download usdjpy-2023-raw-bidask-ticks-v1 --repo "$GITHUB_REPOSITORY" --dir "$ROOT/inputs/raw2023" --pattern 'usdjpy-2023-??-raw-ticks-v1.tar.gz' --pattern 'SHA256SUMS'
          gh release download usdjpy-2024-raw-bidask-ticks-v1 --repo "$GITHUB_REPOSITORY" --dir "$ROOT/inputs/raw2024" --pattern 'usdjpy-2024-??-raw-ticks-v1.tar.gz' --pattern 'SHA256SUMS'
          (cd "$ROOT/inputs/raw2023" && grep -E 'usdjpy-2023-..-raw-ticks-v1\.tar\.gz$' SHA256SUMS | sha256sum -c -)
          (cd "$ROOT/inputs/raw2024" && grep -E 'usdjpy-2024-..-raw-ticks-v1\.tar\.gz$' SHA256SUMS | sha256sum -c -)
          test "$(find "$ROOT/inputs/raw2023" -name '*.tar.gz' | wc -l)" = 12
          test "$(find "$ROOT/inputs/raw2024" -name '*.tar.gz' | wc -l)" = 12
      - name: Execute diagnostic-only portfolio replay
        shell: bash
        env:
          ROOT: ${{ steps.identity.outputs.root }}
          PYTHONPATH: ${{ steps.identity.outputs.root }}/src
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          python "$ROOT/src/summarize.py" \
            --path-metrics "$path_metrics" \
            --final-result "$final" \
            --baseline-trades "$ROOT/materialized/usdjpy_b02_f05_source_trade_ledger_v2.csv" \
            --raw-2023 "$ROOT/inputs/raw2023" \
            --raw-2024 "$ROOT/inputs/raw2024" \
            --output "$ROOT/output" 2>&1 | tee "$ROOT/evidence/diagnostics_run.log"
          jq -e '.scientific_decision_preserved=="NO_PORTABLE_REJECTION_MECHANISM" and .candidate_created==false and .protected_2020_2022_accessed==false and .protected_2025_accessed==false' "$ROOT/output/unfiltered_diagnostics.json"
          (cd "$ROOT/output" && sha256sum -c PACKAGE_SHA256SUMS)
      - name: Build deterministic archive and readback
        shell: bash
        env:
          ROOT: ${{ steps.identity.outputs.root }}
        run: |
          set -euo pipefail
          python "$ROOT/infra/fx2_infra.py" archive --input "$ROOT/output" --output "$ROOT/usdjpy-hyp034-unfiltered-diagnostics-v1.zip" --source-sha '${{ steps.identity.outputs.research_sha }}' --run-id "$GITHUB_RUN_ID" --classification scientific > "$ROOT/evidence/archive_build_receipt.json"
          python "$ROOT/infra/fx2_infra.py" readback --archive "$ROOT/usdjpy-hyp034-unfiltered-diagnostics-v1.zip" > "$ROOT/evidence/archive_readback.json"
          jq -e '.status=="PASS"' "$ROOT/evidence/archive_readback.json"
          sha256sum "$ROOT/usdjpy-hyp034-unfiltered-diagnostics-v1.zip" > "$ROOT/evidence/archive_sha256.txt"
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usdjpy-hyp034-unfiltered-diagnostics-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.identity.outputs.root }}/output
            ${{ steps.identity.outputs.root }}/evidence
            ${{ steps.identity.outputs.root }}/usdjpy-hyp034-unfiltered-diagnostics-v1.zip
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
