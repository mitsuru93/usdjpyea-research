name: Recover F05 Stage1 contract v1

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-stage1-contract:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/f05-failed-reclaim-input-recovery-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect canonical contract and evaluator sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage1_contract/configs stage1_contract/docs stage1_contract/tools
          cp configs/research/usdjpy_b02_f05_stage1_old_m15_to_common_m1_migration_v1.csv stage1_contract/configs/
          cp configs/research/usdjpy_b02_f05_stage1_common_m1_to_exact_tick_migration_v1.csv stage1_contract/configs/
          cp configs/research/usdjpy_b02_f05_stage1_source_class_audit_v1.json stage1_contract/configs/
          cp configs/research/usdjpy_b02_f05_fourfold_analysis_canonical_receipt_v1.json stage1_contract/configs/
          cp configs/research/usdjpy_b02_f05_lifecycle_abc_data_contract_v1.json stage1_contract/configs/
          cp docs/research/usdjpy_b02_f05_stage1_source_class_audit_v1.md stage1_contract/docs/
          cp tools/evaluate_usdjpy_b02_f05_lifecycle_abc_v1.py stage1_contract/tools/
          cp tools/evaluate_usdjpy_b02_f05_lifecycle_abc_v1.part*.pyfrag stage1_contract/tools/
          find stage1_contract -type f -print0 | sort -z | xargs -0 sha256sum > stage1_contract/SHA256SUMS
          cat > stage1_contract/boundaries.txt <<'EOF'
          outcomes_computed=false
          candidate_outcomes_computed=false
          portfolio_replay_computed=false
          2025_accessed=false
          mt4_accessed=false
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: f05-stage1-canonical-contract-v1
          path: stage1_contract
          if-no-files-found: error
          retention-days: 14
