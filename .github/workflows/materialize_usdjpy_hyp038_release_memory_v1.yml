name: Materialize USDJPY HYP-038 Release Memory v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/materialize_usdjpy_hyp038_release_memory_v1.yml'

permissions:
  contents: write

concurrency:
  group: materialize-usdjpy-hyp038-release-memory-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Bind Release receipts into registry and research memory
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.decision=="MECHANISM_CONFIRMED_NO_DEPLOYABLE_LOSS_DECOUPLING_RULE" and .binding_result_byte_identical==true and .human_report_byte_identical==true and .candidate_freeze==false and ."2025_accessed"==false' configs/research/usdjpy_hyp038_release_receipt_v1.json
          jq -e '.status=="PASS_BYTE_IDENTICAL_RELEASE_READBACK" and .archive_byte_identical==true' configs/research/usdjpy_hyp038_release_readback_receipt_v1.json

          python - <<'PY'
          import json
          from pathlib import Path

          registry_path = Path('configs/research/usdjpy_research_candidate_registry_v67.json')
          registry = json.loads(registry_path.read_text())
          registry['release_receipt'] = 'configs/research/usdjpy_hyp038_release_receipt_v1.json'
          registry['release_readback_receipt'] = 'configs/research/usdjpy_hyp038_release_readback_receipt_v1.json'
          registry['release_tag'] = 'usdjpy-hyp038-delayed-continuation-v1'
          registry['receipt_issue_number'] = 416
          registry_path.write_text(json.dumps(registry, indent=2, sort_keys=True) + '\n')

          manifest_path = Path('configs/research/usdjpy_research_memory_manifest_v1.json')
          manifest = json.loads(manifest_path.read_text())
          manifest['canonical_pointers']['hyp038_release_receipt'] = 'configs/research/usdjpy_hyp038_release_receipt_v1.json'
          manifest['canonical_pointers']['hyp038_release_readback_receipt'] = 'configs/research/usdjpy_hyp038_release_readback_receipt_v1.json'
          existing = {x['path'] for x in manifest['mandatory_startup_read_order']}
          ordinal = max(x['ordinal'] for x in manifest['mandatory_startup_read_order'])
          additions = [
              ('configs/research/usdjpy_hyp038_release_receipt_v1.json', 'HYP-038 immutable Release and receipt Issue authority'),
              ('configs/research/usdjpy_hyp038_release_readback_receipt_v1.json', 'HYP-038 byte-identical Release readback authority')
          ]
          for path, reason in additions:
              if path not in existing:
                  ordinal += 1
                  manifest['mandatory_startup_read_order'].append({'ordinal': ordinal, 'path': path, 'reason': reason})
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          PY

          python tools/validate_usdjpy_research_memory_v2.py --root . --output "${RUNNER_TEMP}/hyp038_release_memory_validation.json"
          jq -e '.status=="PASS" and .registry_schema=="usdjpy_research_candidate_registry_v67" and .registry_status=="USDJPY_HYP038_COMPLETE_MECHANISM_CONFIRMED_NO_DEPLOYABLE_LOSS_DECOUPLING_RULE"' "${RUNNER_TEMP}/hyp038_release_memory_validation.json"
          cp "${RUNNER_TEMP}/hyp038_release_memory_validation.json" configs/research/usdjpy_hyp038_research_memory_validation_receipt_v1.json

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add configs/research/usdjpy_research_candidate_registry_v67.json configs/research/usdjpy_research_memory_manifest_v1.json configs/research/usdjpy_hyp038_research_memory_validation_receipt_v1.json
          git commit -m 'research: bind HYP-038 Release receipts into memory'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
