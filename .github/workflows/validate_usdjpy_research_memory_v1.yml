name: Validate USDJPY Research Memory v2

on:
  pull_request:
    paths:
      - AGENTS.md
      - README.md
      - configs/research/usdjpy_research_memory_manifest_v1.json
      - configs/research/usdjpy_hypothesis_ledger_v1.json
      - configs/research/usdjpy_hypothesis_ledger_addendum_v*.json
      - configs/research/usdjpy_validation_operating_contract_v4.json
      - configs/research/usdjpy_research_candidate_registry_v*.json
      - docs/research/usdjpy_research_memory_system_v1.md
      - tools/validate_usdjpy_research_memory_v1.py
      - tools/validate_usdjpy_research_memory_v2.py
      - .github/workflows/validate_usdjpy_research_memory_v1.yml
  push:
    branches: [main]
    paths:
      - AGENTS.md
      - README.md
      - configs/research/usdjpy_research_memory_manifest_v1.json
      - configs/research/usdjpy_hypothesis_ledger_v1.json
      - configs/research/usdjpy_hypothesis_ledger_addendum_v*.json
      - configs/research/usdjpy_validation_operating_contract_v4.json
      - configs/research/usdjpy_research_candidate_registry_v*.json
      - docs/research/usdjpy_research_memory_system_v1.md
      - tools/validate_usdjpy_research_memory_v1.py
      - tools/validate_usdjpy_research_memory_v2.py
      - .github/workflows/validate_usdjpy_research_memory_v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run canonical memory validator
        id: memory
        continue-on-error: true
        run: |
          set +e
          mkdir -p validation
          python tools/validate_usdjpy_research_memory_v2.py \
            --root . \
            --output validation/usdjpy_research_memory_validation_receipt_v2.json \
            > validation/usdjpy_research_memory_validator_v2.log 2>&1
          rc=$?
          echo "$rc" > validation/usdjpy_research_memory_validator_v2.rc
          exit "$rc"
      - name: Upload validator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usdjpy-research-memory-validation-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: validation
          if-no-files-found: error
          retention-days: 30
      - name: Require canonical memory PASS
        if: always()
        run: |
          set -euo pipefail
          test "$(cat validation/usdjpy_research_memory_validator_v2.rc)" = "0"
          jq -e '.status=="PASS" and .current_open_research_question==null and (.registry|length)>0 and (.hypothesis_ledger_addendum|length)>0' validation/usdjpy_research_memory_validation_receipt_v2.json
