name: USDJPY Shock Failure 2025 Postmortem v4

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/usdjpy_shock_failure_2025_postmortem_v4.yml'
      - 'tools/analyze_usdjpy_shock_failure_2025_postmortem_v3.py.gz.b64.part*'
      - 'configs/research/usdjpy_shock_failure_2025_postmortem_protocol_v1.json'
      - 'research_inputs/usdjpy/shock_failure/2025_postmortem_v1/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: usdjpy-shock-failure-2025-postmortem-v4-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  postmortem:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      INPUT_DIR: research_inputs/usdjpy/shock_failure/2025_postmortem_v1
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0

      - name: Materialize verified analyzer and repair mixed ISO parsing
        shell: bash
        run: |
          set -euo pipefail
          cat tools/analyze_usdjpy_shock_failure_2025_postmortem_v3.py.gz.b64.part* > "$RUNNER_TEMP/analyzer.b64"
          test "$(sha256sum "$RUNNER_TEMP/analyzer.b64" | awk '{print $1}')" = 90a2859a69d6419eef8a339c304c4fa02ac4ad7a74a560db923872afb75ef036
          base64 -d "$RUNNER_TEMP/analyzer.b64" > "$RUNNER_TEMP/analyzer.py.gz"
          test "$(sha256sum "$RUNNER_TEMP/analyzer.py.gz" | awk '{print $1}')" = e44d6ae9d62dc41890bee2dd4d1a87a8a12a539ccd2a8eecdaec60121c6f7c33
          gzip -t "$RUNNER_TEMP/analyzer.py.gz"
          gzip -dc "$RUNNER_TEMP/analyzer.py.gz" > tools/analyze_usdjpy_shock_failure_2025_postmortem_v3.py
          test "$(sha256sum tools/analyze_usdjpy_shock_failure_2025_postmortem_v3.py | awk '{print $1}')" = 2a6718e9e67ce41f7ee27d17a3b65cd28a181dabe18a06f41d71acadc5e5d4cc
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/analyze_usdjpy_shock_failure_2025_postmortem_v3.py')
          s=p.read_text(encoding='utf-8')
          old="pd.to_datetime(dev[c],utc=True)"
          new="pd.to_datetime(dev[c],utc=True,format='mixed')"
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python -m py_compile tools/analyze_usdjpy_shock_failure_2025_postmortem_v3.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install fixed dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==2.1.3' 'pandas==2.2.3' 'scipy==1.14.1' 'tabulate==0.9.0'

      - name: Validate frozen inputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob,json
          p=json.load(open('configs/research/usdjpy_shock_failure_2025_postmortem_protocol_v1.json'))
          assert p['status']=='FROZEN_NO_CANDIDATE_SELECTION'
          assert p['candidate_id']=='B_EXECUTABLE_T0_8BAR'
          assert p['fixed_candidate_changes_permitted'] is False
          assert p['consumed_external_evidence']==['2025H1','2025H2']
          assert p['production_authorized'] is False and p['live_orders_authorized'] is False
          base='research_inputs/usdjpy/shock_failure/2025_postmortem_v1'
          p6=json.load(open(base+'/corrected_p6_result_compact.json'))
          assert p6['status']=='FAIL_P6_2025_GATE_RESEARCH_ONLY_NO_RETUNING'
          assert p6['standalone_combined']['closed_trades']==47
          pc=json.load(open(base+'/portfolio_context_compact.json'))
          assert pc['authority']['core_run_id']==30229496015
          assert pc['authority']['core_artifact_id']==8639969385
          events=[]
          files=sorted(glob.glob(base+'/mt4_events_*.json'))
          assert len(files)==5
          for f in files:
            x=json.load(open(f)); events.extend(x['events'])
          assert len(events)==47 and len({x['event_id'] for x in events})==47
          print('PASS_FROZEN_INPUTS',len(events))
          PY

      - name: Prepare roots
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/shock-failure-postmortem-v4"
          rm -rf "$root"
          mkdir -p "$root"/{phase2-download,phase2,history,history2023,bars2024,raw2025,out}
          echo "PM_ROOT=$root" >> "$GITHUB_ENV"

      - name: Download Phase 2 authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset=usdjpy-csos-shock-failure-phase2-v1-30206226997-1.zip
          gh release download usdjpy-csos-shock-failure-phase2-v1 --repo "$GITHUB_REPOSITORY" --dir "$PM_ROOT/phase2-download" --pattern "$asset"
          unzip -q "$PM_ROOT/phase2-download/$asset" -d "$PM_ROOT/phase2"
          (cd "$PM_ROOT/phase2/phase2_output" && sha256sum -c PACKAGE_SHA256SUMS)

      - name: Download M15 authorities
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download f05-failed-reclaim-historical-authorities-v1 --repo "$GITHUB_REPOSITORY" --dir "$PM_ROOT/history" --pattern usdjpy-2023-canonical-baseline-prep-v1.zip --pattern EXPECTED_SHA256SUMS
          (cd "$PM_ROOT/history" && sha256sum -c EXPECTED_SHA256SUMS --ignore-missing)
          unzip -q "$PM_ROOT/history/usdjpy-2023-canonical-baseline-prep-v1.zip" -d "$PM_ROOT/history2023"
          printf '%s  %s\n' 4c10ab3244996d73d0955850675231a533f918da09a41ac642c9a3e287b7ac78 "$PM_ROOT/history2023/normalized/usdjpy_2023_m15_bid_utc_rakuten_mt4_v1.csv.gz" | sha256sum -c -
          gh release download usdjpy-2024-derived-bars-v1 --repo "$GITHUB_REPOSITORY" --dir "$PM_ROOT/bars2024" --pattern USDJPY-2024-m15-derived-bars-v1.csv.gz
          printf '%s  %s\n' d22a008247e2a8bed49a5169648661ab21eff404a6bc2985bca0c3b5af290020 "$PM_ROOT/bars2024/USDJPY-2024-m15-derived-bars-v1.csv.gz" | sha256sum -c -

      - name: Download immutable 2025 Raw Tick authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download usdjpy-2025-raw-bidask-ticks-v1 --repo "$GITHUB_REPOSITORY" --dir "$PM_ROOT/raw2025" --pattern 'usdjpy-2025-??-raw-ticks-v1.tar.gz' --pattern usdjpy-2025-raw-ticks-v1.annual-manifest.json --pattern SHA256SUMS
          test "$(find "$PM_ROOT/raw2025" -maxdepth 1 -name 'usdjpy-2025-??-raw-ticks-v1.tar.gz' | wc -l)" = 12
          (cd "$PM_ROOT/raw2025" && grep -E 'usdjpy-2025-(..-raw-ticks-v1\.tar\.gz|raw-ticks-v1\.annual-manifest\.json)$' SHA256SUMS | sha256sum -c -)
          jq -e '.accepted==true and .resolved_hours==.expected_hours and .tick_rows>0' "$PM_ROOT/raw2025/usdjpy-2025-raw-ticks-v1.annual-manifest.json"

      - name: Execute fixed-candidate postmortem and retain diagnostics
        id: evaluate
        shell: bash
        run: |
          set +e
          python tools/analyze_usdjpy_shock_failure_2025_postmortem_v3.py \
            --phase2-ledger "$PM_ROOT/phase2/phase2_output/candidate_trade_ledger.csv.gz" \
            --m15-2023 "$PM_ROOT/history2023/normalized/usdjpy_2023_m15_bid_utc_rakuten_mt4_v1.csv.gz" \
            --m15-2024 "$PM_ROOT/bars2024/USDJPY-2024-m15-derived-bars-v1.csv.gz" \
            --raw-2025 "$PM_ROOT/raw2025" \
            --mt4-context-dir "$INPUT_DIR" \
            --portfolio-context "$INPUT_DIR/portfolio_context_compact.json" \
            --corrected-p6 "$INPUT_DIR/corrected_p6_result_compact.json" \
            --protocol configs/research/usdjpy_shock_failure_2025_postmortem_protocol_v1.json \
            --out-dir "$PM_ROOT/out" \
            --research-sha "$HEAD_SHA" \
            --core-sha e92ac28d908cb5c6ca89224507b24690822e0f35 \
            --run-id "$GITHUB_RUN_ID" > "$PM_ROOT/out/evaluator_stdout.log" 2> "$PM_ROOT/out/evaluator_stderr.log"
          code=$?
          echo "$code" > "$PM_ROOT/out/evaluator_exit_code.txt"
          cat "$PM_ROOT/out/evaluator_stdout.log"
          cat "$PM_ROOT/out/evaluator_stderr.log" >&2
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cp tools/analyze_usdjpy_shock_failure_2025_postmortem_v3.py "$PM_ROOT/out/postmortem_source_snapshot.py"
          cp configs/research/usdjpy_shock_failure_2025_postmortem_protocol_v1.json "$PM_ROOT/out/"
          cp "$INPUT_DIR/corrected_p6_result_compact.json" "$PM_ROOT/out/corrected_p6_result.json"
          cp "$INPUT_DIR/portfolio_context_compact.json" "$PM_ROOT/out/portfolio_context.json"
          cp "$INPUT_DIR"/mt4_events_*.json "$PM_ROOT/out/"
          exit 0

      - name: Upload complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usdjpy-shock-failure-2025-postmortem-v4-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PM_ROOT }}/out
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Enforce evaluator success
        run: test '${{ steps.evaluate.outputs.exit_code }}' = '0'
