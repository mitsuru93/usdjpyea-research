name: Execute USDJPY Shock Failure 2025 Postmortem v1

on:
  pull_request:
    branches: [main]
    paths:
      - 'configs/research/usdjpy_shock_failure_2025_postmortem_dispatch_v1.json'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: usdjpy-shock-failure-2025-postmortem-v4-binding
  cancel-in-progress: true

jobs:
  postmortem:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Validate launcher marker
        uses: actions/checkout@v4
      - name: Validate one-shot launcher
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.schema_version=="usdjpy_shock_failure_2025_postmortem_dispatch_v1" and .target_branch=="agent/shock-failure-2025-postmortem-v1" and .candidate_id=="B_EXECUTABLE_T0_8BAR" and .no_retuning==true and .production_authorized==false and .live_orders_authorized==false' configs/research/usdjpy_shock_failure_2025_postmortem_dispatch_v1.json
      - name: Check out exact Research target branch
        uses: actions/checkout@v4
        with:
          ref: agent/shock-failure-2025-postmortem-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==2.1.3' 'pandas==2.2.3' 'scipy==1.14.1' 'tabulate==0.9.0'
      - name: Execute auditable fixed-candidate postmortem
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/run_usdjpy_shock_failure_2025_postmortem_v5_diagnostic.sh
      - name: Upload complete evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usdjpy-shock-failure-2025-postmortem-v5-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/shock-failure-postmortem-v4
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
