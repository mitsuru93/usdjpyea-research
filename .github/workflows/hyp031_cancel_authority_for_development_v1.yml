name: HYP031 Cancel Authority for Development v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hyp031_cancel_authority_for_development_v1.yml'

permissions:
  contents: read

jobs:
  release-year-concurrency:
    strategy:
      fail-fast: false
      matrix:
        year: [2019, 2020, 2021, 2022]
    concurrency:
      group: usdjpy-${{ matrix.year }}-raw-ticks-max-parallel-v1
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Release annual authority runner capacity
        run: echo "released USDJPY ${{ matrix.year }} authority concurrency for HYP-031 development"
