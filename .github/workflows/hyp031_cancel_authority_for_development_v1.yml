name: HYP031 Cancel Authority for Development v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hyp031_cancel_authority_for_development_v1.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel-authority-runs:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel active HYP031 authority runs to free development capacity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for run_id in 30314888829 30315092496; do
            status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status' 2>/dev/null || echo missing)
            if [ "$status" = queued ] || [ "$status" = in_progress ]; then
              gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel"
              echo "cancel requested: ${run_id}"
            else
              echo "not active: ${run_id} status=${status}"
            fi
          done
