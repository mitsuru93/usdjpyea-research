name: Purge Late Unauthorized EURUSD 2025 Artifacts v1

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  purge:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.issue.title == '[EURUSD] Purge late unauthorized 2025 artifacts v1' }}
    runs-on: ubuntu-latest
    env:
      RUN_ID: "29733387996"
    steps:
      - uses: actions/checkout@v4
      - name: Cancel run and purge all artifacts until stable zero
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/cancel" || true
          for pass in 1 2 3 4 5; do
            sleep 5
            mapfile -t ids < <(gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" --jq '.artifacts[].id')
            echo "pass=${pass} artifact_count=${#ids[@]}"
            for id in "${ids[@]}"; do
              gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" || true
            done
          done
          sleep 5
          remaining=$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" --jq '[.artifacts[]] | length' | awk '{s+=$1} END {print s+0}')
          run_json=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")
          status=$(printf '%s' "${run_json}" | jq -r '.status')
          conclusion=$(printf '%s' "${run_json}" | jq -r '.conclusion // ""')
          echo "status=${status} conclusion=${conclusion} remaining=${remaining}"
          test "${remaining}" -eq 0
          test "${status}" = "completed"
          test "${conclusion}" = "cancelled"
          mkdir -p docs/research_reboot
          jq -n \
            --argjson run_id "${RUN_ID}" \
            --arg status "${status}" \
            --arg conclusion "${conclusion}" \
            --argjson remaining_artifacts "${remaining}" \
            '{schema_version:"eurusd_2025_late_artifact_purge_receipt_v1",run_id:$run_id,status:$status,conclusion:$conclusion,remaining_artifacts:$remaining_artifacts}' \
            > docs/research_reboot/eurusd_2025_late_artifact_purge_receipt_v1.json
      - name: Commit receipt and remove one-shot workflow
        run: |
          set -euo pipefail
          git pull --rebase origin main
          git rm -f .github/workflows/purge_late_eurusd_2025_artifacts_v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research_reboot/eurusd_2025_late_artifact_purge_receipt_v1.json
          git commit -m "ci: confirm unauthorized EURUSD 2025 run purged"
          git push origin main
      - name: Close purge issue
        if: ${{ github.event_name == 'issues' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment "Run 29733387996 is cancelled and its remaining artifact count is zero."
