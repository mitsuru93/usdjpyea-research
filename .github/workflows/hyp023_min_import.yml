name: Import HYP-023 canonical closure payload

on:
  push:
    branches: [agent/hyp023-canonical-closure-v1]
    paths:
      - '.hyp023_min_payload_v2/**'
      - '.github/workflows/hyp023_min_import.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.hyp023_min_payload_v2/**'
      - '.github/workflows/hyp023_min_import.yml'

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hyp023-canonical-closure-v1
          fetch-depth: 0
      - name: Verify and extract canonical payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum .hyp023_min_payload_v2/chunk_000 | awk '{print $1}')" = "ac16b5767b0cb5b7d803aa4154894953620aa001809b49207db98d8c852732fd"
          test "$(sha256sum .hyp023_min_payload_v2/chunk_001 | awk '{print $1}')" = "66bd08d22d176d6b487cd00efcb19c7a66d94ce6cd2128d828071b72e99a5852"
          test "$(sha256sum .hyp023_min_payload_v2/chunk_002 | awk '{print $1}')" = "232d35c146dc301890650ab2b059b6ddd3877d8659bc2d46c7886a59aeeb39ac"
          test "$(sha256sum .hyp023_min_payload_v2/chunk_003 | awk '{print $1}')" = "61807638e2b3253814773f857db58d4934e4bbb4e9f53d5dfca79d3f0edd830b"
          test "$(sha256sum .hyp023_min_payload_v2/chunk_004 | awk '{print $1}')" = "dadd98d7d4121a766c2150dc5d7113fa3c43e0a7d9fcab15dbc906635c1b37e8"
          test "$(sha256sum .hyp023_min_payload_v2/chunk_005 | awk '{print $1}')" = "e2c6d1209aca62a44f78112d96069151b34deb80cfa31b78eb8ef131c968ec23"
          test "$(sha256sum .hyp023_min_payload_v2/chunk_006 | awk '{print $1}')" = "c39b3fa789197e05f854007420fcf376e31a4ee633f4131376786a0339458969"
          test "$(sha256sum .hyp023_min_payload_v2/chunk_007 | awk '{print $1}')" = "edf31773ca2d81d021602392207e08fbb2b8d9468d4ea3c04d4d25aedcd7871f"
          test "$(sha256sum .hyp023_min_payload_v2/chunk_008 | awk '{print $1}')" = "cdd7da23ff969df454c54235d4d967d681608947ccb5f0737f8aeb2d224640cc"
          cat .hyp023_min_payload_v2/chunk_* | base64 -d > /tmp/hyp023_payload.tar.gz
          test "$(sha256sum /tmp/hyp023_payload.tar.gz | awk '{print $1}')" = "f316a07c8ca1e2caa6e7f18e9c5e60763fa8f7afc954a840ca0bfac67d11b10b"
          tar -xzf /tmp/hyp023_payload.tar.gz -C .
          test "$(sha256sum docs/research/B02_F05_2023_2024_factor_analysis_v1.md | awk '{print $1}')" = "b0e61fe431485e6ae880e0b4bf7d9fdca1e3905607187d57f45f50fc3feece1e"
          python -m json.tool configs/research/usdjpy_research_candidate_registry_v41.json >/dev/null
          python -m json.tool configs/research/usdjpy_hypothesis_ledger_addendum_v15.json >/dev/null
          python -m json.tool configs/research/usdjpy_research_memory_manifest_v1.json >/dev/null
          python tools/validate_usdjpy_research_memory_v1.py
      - name: Replace canonical pointers and clean staging
        shell: bash
        run: |
          set -euo pipefail
          rm -f configs/research/usdjpy_research_candidate_registry_v40.json
          rm -f configs/research/usdjpy_hypothesis_ledger_addendum_v14.json
          rm -f configs/research/usdjpy_2023_2024_hypothesis_program_v4.json
          rm -rf .hyp023_payload .hyp023_min_payload .hyp023_min_payload_v2
          rm -f .github/workflows/hyp023_min_import.yml
      - name: Commit canonical closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "research: canonicalize HYP-023 closed result"
          git push origin HEAD:agent/hyp023-canonical-closure-v1
