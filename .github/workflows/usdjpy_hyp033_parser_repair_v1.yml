name: USDJPY HYP033 Parser Repair v1
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/usdjpy_hyp033_parser_repair_v1.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
      OLD: daf3e22332c2c0dc70cef522756cc7b001f47b2223fe8834b46cda5e6ade6bcd
      NEW: 297945c2bfdd8880ef0a384c7aa482e9b92ef147b8178bf15170f830b3c5bcf0
    steps:
      - name: Repair exact evaluator and bind hash
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/repair.py <<'PY'
          import base64,gzip,hashlib,json,os,subprocess
          repo=os.environ['GITHUB_REPOSITORY']; branch=os.environ['BRANCH']; old=os.environ['OLD']; new=os.environ['NEW']
          def api(args,body=None):
              p=subprocess.run(['gh','api',*args],input=body,capture_output=True,check=True)
              return json.loads(p.stdout)
          def get(path):
              m=api(['--method','GET',f'repos/{repo}/contents/{path}','-f',f'ref={branch}'])
              return m,base64.b64decode(''.join(m['content'].split()))
          def put(path,data,sha,msg):
              b=json.dumps({'message':msg,'content':base64.b64encode(data).decode(),'sha':sha,'branch':branch}).encode()
              api(['--method','PUT',f'repos/{repo}/contents/{path}','--input','-'],b)
          path='tools/hyp033_payload/evaluator_v1.py.gz.b64'; m,b=get(path)
          src=gzip.decompress(base64.b64decode(b)).decode(); h=hashlib.sha256(src.encode()).hexdigest()
          if h==new: print('already repaired'); raise SystemExit
          if h!=old: raise SystemExit('unexpected evaluator '+h)
          repl=[
          ("pd.to_datetime(c.signal_utc,utc=True)","pd.to_datetime(c.signal_utc,utc=True,format='mixed')"),
          ("pd.to_datetime(c.entry_execution_time,utc=True)","pd.to_datetime(c.entry_execution_time,utc=True,format='mixed')"),
          ("pd.to_datetime(c.exit_execution_time,utc=True)","pd.to_datetime(c.exit_execution_time,utc=True,format='mixed')")]
          for a,z in repl:
              if src.count(a)!=1: raise SystemExit('replacement cardinality')
              src=src.replace(a,z)
          if hashlib.sha256(src.encode()).hexdigest()!=new: raise SystemExit('new hash mismatch')
          payload=base64.b64encode(gzip.compress(src.encode(),9,mtime=0))
          put(path,payload,m['sha'],'infra: repair HYP-033 mixed ISO parser')
          for p in ['.github/workflows/usdjpy_hyp033_asian_low_sweep_rebound_development_v1.yml','.github/workflows/usdjpy_hyp033_technical_diagnostic_v1.yml']:
              m,b=get(p); t=b.decode().replace(old,new)
              if p.endswith('development_v1.yml'): t=t.replace('cancel-in-progress: false','cancel-in-progress: true')
              put(p,t.encode(),m['sha'],'infra: bind repaired HYP-033 evaluator')
          print(json.dumps({'old':old,'new':new,'scientific_contract_changed':False}))
          PY
          python /tmp/repair.py
