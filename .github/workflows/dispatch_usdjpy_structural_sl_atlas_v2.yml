name: Dispatch USDJPY Structural SL Atlas v2

on:
  push:
    branches: [main]
    paths:
      - 'configs/run_markers/usdjpy_structural_sl_atlas_v2_dispatch.json'

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch exact frozen atlas
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run evaluate_usdjpy_b02_f05_structural_sl_atlas_v2.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f confirmation=RUN_STRUCTURAL_SL_ATLAS_V2
          run_id=''
          for _ in $(seq 1 90); do
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow evaluate_usdjpy_b02_f05_structural_sl_atlas_v2.yml \
              --event workflow_dispatch \
              --branch main \
              --limit 30 \
              --json databaseId,headSha,createdAt \
              --jq '.[] | select(.headSha=="'"$GITHUB_SHA"'") | .databaseId' | head -n1)
            [[ -n "$run_id" ]] && break
            sleep 2
          done
          [[ -n "$run_id" ]]
          url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$run_id"
          cat > dispatch_receipt.md <<EOF
          workflow: evaluate_usdjpy_b02_f05_structural_sl_atlas_v2.yml
          confirmation: RUN_STRUCTURAL_SL_ATLAS_V2
          source_event: one-shot same-repository dispatcher
          dispatched_event: workflow_dispatch
          dispatcher_main_sha: $GITHUB_SHA
          frozen_package_parent_sha: 7da40aa50674b7784f1293dc1521ba2c69d0af9f
          run_id: $run_id
          run_url: $url
          deterministic_candidates: 303
          deterministic_families: 12
          supervised_models: 4
          full_portfolio_replay_before_dispatch: false
          MT4_accessed_before_dispatch: false
          2025_accessed_before_dispatch: false
          candidate_frozen_before_dispatch: false
          EOF
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "[structural-sl-atlas-v2-dispatch] $run_id" \
            --body-file dispatch_receipt.md
          echo "run_id=$run_id" >> "$GITHUB_STEP_SUMMARY"
          echo "run_url=$url" >> "$GITHUB_STEP_SUMMARY"
