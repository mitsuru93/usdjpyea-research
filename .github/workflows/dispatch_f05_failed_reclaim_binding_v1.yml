name: Dispatch F05 failed reclaim binding v1

on:
  push:
    branches: [main]
    paths:
      - 'configs/run_markers/f05_failed_reclaim_binding_dispatch_v1.json'

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact binding workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run validate_f05_failed_reclaim_v1.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f confirmation=F05_FAILED_RECLAIM_BASIC_V1
          run_id=''
          for _ in $(seq 1 30); do
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow validate_f05_failed_reclaim_v1.yml \
              --event workflow_dispatch \
              --branch main \
              --limit 10 \
              --json databaseId,headSha,createdAt \
              --jq '.[] | select(.headSha=="'"$GITHUB_SHA"'") | .databaseId' | head -n1)
            [[ -n "$run_id" ]] && break
            sleep 2
          done
          [[ -n "$run_id" ]]
          url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$run_id"
          cat > dispatch_receipt.md <<EOF
          binding_candidate: F05_FAILED_RECLAIM_BASIC_V1
          non_binding_sensitivity: F05_FAILED_RECLAIM_WEAK_QUICK_V1
          source_event: one-shot same-repository dispatcher
          dispatched_event: workflow_dispatch
          dispatcher_main_sha: $GITHUB_SHA
          run_id: $run_id
          run_url: $url
          portfolio_replay_computed_before_dispatch: false
          MT4_accessed_before_dispatch: false
          2025_accessed_before_dispatch: false
          EOF
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "[dispatch] F05 failed reclaim binding $run_id" \
            --body-file dispatch_receipt.md
          echo "run_id=$run_id" >> "$GITHUB_STEP_SUMMARY"
          echo "run_url=$url" >> "$GITHUB_STEP_SUMMARY"
