name: Archive CSOS Shock Failure Phase 2 evidence

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/usdjpy_csos_shock_failure_phase2_archive_result.yml'

permissions:
  contents: write
  actions: read

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/csos-shock-failure-phase2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download successful immutable artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ARTIFACT_ID: '8632971871'
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' "/repos/${REPO}/actions/artifacts/${ARTIFACT_ID}/zip" > phase2_artifact.zip
          mkdir extracted
          unzip -q phase2_artifact.zip -d extracted
          test -f extracted/phase2_output/final_decision.json
          (cd extracted/phase2_output && sha256sum -c PACKAGE_SHA256SUMS)
      - name: Build repository supplement and archive
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'numpy==2.1.3' 'pandas==2.2.3'
          target='docs/research/artifact_archives/usdjpy_csos_shock_failure_phase2_v1'
          rm -rf "$target"
          mkdir -p "$target"
          cp -a extracted/phase2_output/. "$target/"
          TARGET="$target" python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          import numpy as np
          import pandas as pd
          root=Path(os.environ['TARGET'])
          d=pd.read_csv(root/'candidate_trade_ledger.csv.gz')
          c=pd.read_csv(root/'chronology_audit.csv')
          unresolved=set(c.loc[c.chronology_status=='UNRESOLVED','opportunity_id'])
          eligible=['B_EXECUTABLE_T0_8BAR','C_M1_ACCEPTANCE_8BAR','D_EXECUTABLE_T0_4BAR']
          d=d[(d.candidate_id.isin(eligible)) & d.admitted].copy()
          d['date']=pd.to_datetime(d.entry_utc,utc=True).dt.date.astype(str)
          d['unresolved']=d.opportunity_id.isin(unresolved)
          def pf(s):
              gp=float(s[s>0].sum()); gl=float(s[s<0].sum())
              return float(gp/-gl) if gl<0 else None
          def metrics(x,col='pnl_jpy'):
              s=x[col].astype(float)
              return {'trades':int(len(x)),'gross_profit_jpy':float(s[s>0].sum()),'gross_loss_jpy':float(s[s<0].sum()),'net_profit_jpy':float(s.sum()),'profit_factor':pf(s),'win_rate':float((s>0).mean()) if len(s) else None,'positive_folds':int((x.groupby('fold')[col].sum()>0).sum()),'fold_net_jpy':{str(k):float(v) for k,v in x.groupby('fold')[col].sum().items()},'side_net_jpy':{str(k):float(v) for k,v in x.groupby('side_label')[col].sum().items()},'negative_baseline_day_net_jpy':float(x.loc[x.baseline_day_state=='NEGATIVE',col].sum())}
          def gate(x):
              if x.pnl_jpy.sum()<=0 or (x.groupby('fold').pnl_jpy.sum()>0).sum()<2:return False
              best=x.groupby('date').pnl_jpy.sum().idxmax()
              if x.loc[x.date!=best,'pnl_jpy'].sum()<=0:return False
              if x.drop(x.nlargest(3,'pnl_jpy').index).pnl_jpy.sum()<=0:return False
              return True
          def rank(train):
              rows=[]
              for cid,x in train.groupby('candidate_id'):
                  fold_cost=[]
                  for f in sorted(x.fold.unique()):
                      z=x[x.fold==f]; fold_cost.append(float(z.pnl_jpy.sum()-15*len(z)))
                  rows.append({'candidate_id':cid,'training_gate':gate(x),'median_training_fold_cost_net_jpy':float(np.median(fold_cost)),'pooled_pf':pf(x.pnl_jpy),'median_holding_seconds':float(x.holding_seconds.median())})
              passed=[r for r in rows if r['training_gate']]
              passed.sort(key=lambda r:(-r['median_training_fold_cost_net_jpy'],-r['pooled_pf'],r['median_holding_seconds'],r['candidate_id']))
              return rows,passed[0]['candidate_id'] if passed else None
          all_ex=d[~d.unresolved].copy()
          rows,selected=rank(all_ex)
          lofo=[]
          for held in ['2023H1','2023H2','2024H1','2024H2']:
              rr,chosen=rank(all_ex[all_ex.fold!=held])
              h=all_ex[(all_ex.fold==held)&(all_ex.candidate_id==chosen)]
              lofo.append({'held_out_fold':held,'selected_candidate':chosen,'trades':int(len(h)),'net_jpy':float(h.pnl_jpy.sum()),'pf':pf(h.pnl_jpy),'training_ranking':rr})
          b=d[d.candidate_id=='B_EXECUTABLE_T0_8BAR'].copy(); bx=b[~b.unresolved].copy()
          bx['spread_plus_1_jpy']=bx.pnl_jpy-10
          bx['severe_jpy']=bx.pnl_jpy_FIFTEEN_SECONDS-30
          sensitivity={
            'schema_version':'usdjpy_csos_shock_failure_phase2_chronology_exclusion_sensitivity_v1',
            'purpose':'Remove every UNRESOLVED chronology event from candidate evaluation instead of relying on the preregistered <=5% tolerance.',
            'unresolved_event_ids':sorted(unresolved),
            'unresolved_count':len(unresolved),
            'selected_candidate_before_exclusion':'B_EXECUTABLE_T0_8BAR',
            'selected_candidate_after_exclusion':selected,
            'selected_candidate_unchanged':selected=='B_EXECUTABLE_T0_8BAR',
            'B_metrics_before_exclusion':metrics(b),
            'B_metrics_after_exclusion':metrics(bx),
            'B_spread_plus_1_after_exclusion':metrics(bx,'spread_plus_1_jpy'),
            'B_severe_after_exclusion':metrics(bx,'severe_jpy'),
            'all_fold_candidate_ranking_after_exclusion':rows,
            'lofo_after_exclusion':lofo,
            'interpretation':'The PASS decision and B candidate freeze do not depend on the three unresolved 2023 source-disagreement events. The rule-selected LOFO outcome remains positive in 3 of 4 held-out folds; selected sequence remains B,C,C,B.'
          }
          (root/'chronology_unresolved_exclusion_sensitivity.json').write_text(json.dumps(sensitivity,indent=2,ensure_ascii=False,sort_keys=True)+'\n')
          pd.DataFrame([
            {'scenario':'B_OBSERVED_ALL','trades':len(b),'net_jpy':b.pnl_jpy.sum(),'pf':pf(b.pnl_jpy),'positive_folds':(b.groupby('fold').pnl_jpy.sum()>0).sum()},
            {'scenario':'B_OBSERVED_EXCLUDE_UNRESOLVED','trades':len(bx),'net_jpy':bx.pnl_jpy.sum(),'pf':pf(bx.pnl_jpy),'positive_folds':(bx.groupby('fold').pnl_jpy.sum()>0).sum()},
            {'scenario':'B_SPREAD_PLUS_1_EXCLUDE_UNRESOLVED','trades':len(bx),'net_jpy':bx.spread_plus_1_jpy.sum(),'pf':pf(bx.spread_plus_1_jpy),'positive_folds':(bx.groupby('fold').spread_plus_1_jpy.sum()>0).sum()},
            {'scenario':'B_SEVERE_EXCLUDE_UNRESOLVED','trades':len(bx),'net_jpy':bx.severe_jpy.sum(),'pf':pf(bx.severe_jpy),'positive_folds':(bx.groupby('fold').severe_jpy.sum()>0).sum()},
          ]).to_csv(root/'chronology_unresolved_exclusion_sensitivity.csv',index=False)
          op=json.loads((root/'operational_failure_log.json').read_text())
          op['failures'] += [
            {'stage':'Bootstrap source assembly','failure':'Bootstrap failed before data access because PyYAML was assumed present.','cause':'Unnecessary runner-environment dependency.','wasted_processing':'Checkout and source materialization only.','fix':'Removed the PyYAML check and retained Python compile plus deterministic text assertions.','prevention':'Bootstrap validation must use declared dependencies only.'},
            {'stage':'Period firewall','failure':'The firewall grep matched the workflow own forbidden-source pattern.','cause':'The workflow file was included in its own scan.','wasted_processing':'No authority download or analysis occurred.','fix':'Restricted static source scan to the evaluator; runtime receipt still asserts no 2025 access.','prevention':'Firewall test fixtures and control text must be excluded from source-reference scans.'},
            {'stage':'First complete Phase 2 evaluation','failure':'Scientific computation reached result serialization but JSON writing rejected numpy.bool_.','cause':'Result cleaner normalized numpy integers and floats but not numpy booleans.','wasted_processing':'One full authority download and approximately three minutes of deterministic calculation were repeated.','fix':'Added numpy.bool_ to the JSON normalization layer only; no event, candidate, cost, gate or ranking logic changed.','prevention':'Schema serialization tests must include every numpy scalar type before full runs.'},
            {'stage':'Compressed evaluator payload patch','failure':'A manually replaced compressed payload did not decode to a compilable source.','cause':'Large opaque base64 replacement was not independently round-trip verified after GitHub content upload.','wasted_processing':'One checkout and immediate compile attempt; no data access.','fix':'Recovered the known-good payload from Git history, applied the one-line bool normalization to plaintext, committed canonical evaluator source, and removed the opaque payload.','prevention':'Canonical research source must be stored as plaintext; opaque payloads may bootstrap once but must not remain the maintained source.'}
          ]
          (root/'operational_failure_log.json').write_text(json.dumps(op,indent=2,ensure_ascii=False,sort_keys=True)+'\n')
          receipt=json.loads((root/'execution_receipt.json').read_text())
          receipt.update({'pr_number':307,'pr_run_id':30205540213,'pr_artifact_id':8632971871,'pr_artifact_name':'usdjpy-csos-shock-failure-phase2-v1-30205540213-1','pr_artifact_digest':'sha256:8e969013266e6289a8571d8939b8a51a964be8c87f40107ca1b6e1992a9ed27d','phase2_pr_head_sha':'7558e163c1369cd2bb5aecd789658221a3709f15','chronology_exclusion_sensitivity_sha256':hashlib.sha256((root/'chronology_unresolved_exclusion_sensitivity.json').read_bytes()).hexdigest()})
          (root/'repository_execution_receipt.json').write_text(json.dumps(receipt,indent=2,ensure_ascii=False,sort_keys=True)+'\n')
          summary='''# USDJPY CSOS Shock Failure Phase 2 v1 — Canonical Summary\n\n## Decision\n\n`PASS_PORTABLE_RESEARCH_CANDIDATE`\n\nFrozen candidate: `B_EXECUTABLE_T0_8BAR`. This is a research candidate only. Core implementation, MT4, 2025H1/H2, live operation and B02/F05 integration remain unauthorized.\n\n## Authorities\n\n- Research main inspected at start: `2a245a36a97282cbf840e0e9f2ea26f18239cadc`\n- Core main inspected at start: `6ded071b3ba83cc13ff5aabb664017c80e421f9b`\n- CSOS PR #295 head: `74c9dc6869c805e3ec3fe1db87e5744ef62729b6`\n- CSOS evaluator: `11643bd5c9d04dec1d8df34e681b6516cc39264b`\n- CSOS canonical result: `88b88cd01bb84fafdf2e097401222d4f9dac1c6d`\n- Corrected CSOS Release: `usdjpy-csos-opportunity-atlas-v1-r1`\n- Phase 2 PR run: `30205540213`\n- Phase 2 artifact: `8632971871`, `sha256:8e969013266e6289a8571d8939b8a51a964be8c87f40107ca1b6e1992a9ed27d`\n\n## Event and chronology audit\n\n- CSOS events reproduced: 114/114\n- Duplicate IDs / duplicate shock starts / overlapping duplicate intervals / same-shock double counts: 0 / 0 / 0 / 0\n- Timezone mismatches / bar-close leakage: 0 / 0\n- Chronology: 58 exact, 53 bounded 2023 cross-source, 3 unresolved (2.63%).\n- Excluding all 3 unresolved events leaves 111 trades, +¥12,207, PF 2.372. Spread +1 pip leaves +¥11,097; severe stress leaves +¥9,033, PF 1.916. Candidate selection remains B and LOFO remains 3/4 positive.\n\n## Selected candidate observed-spread performance\n\n- Trades: 114\n- Net: +¥12,502\n- PF: 2.381\n- Win rate: 62.28%\n- MDD: ¥1,555\n- Positive folds: 3/4\n- Positive months: 17/24\n- Long: +¥7,288, PF 2.572\n- Short: +¥5,214, PF 2.180\n\n## Stress and portability\n\n- Spread +1 pip: +¥11,362, PF 2.197\n- Severe: +¥9,689, PF 1.964\n- Remove top 3 events: +¥6,600, PF 1.729\n- Remove top decile wins: +¥2,604, PF 1.288\n- LOFO rule-selected held-out results: B +¥2,776; C -¥313; C +¥423; B +¥8,235 = 3/4 positive.\n\n## Complementarity and portfolio\n\n- Correlation: B02 +0.052; F05 -0.126\n- B02/F05 negative-day contribution: +¥9,462\n- Time overlap: 86.84%; existing baseline drawdown at entry: 97.37%\n- Additive fixed-lot portfolio: +¥64,129; MDD ¥38,213 versus baseline ¥40,455 (-5.54%).\n- Peak concurrent positions estimate: 7; incremental margin estimate at 25x: ¥6,455.\n\n## Boundaries\n\nNo 2025 data were accessed. B02/F05 logic was not changed. Core and MT4 were not accessed. Production was not authorized.\n'''
          (root/'CANONICAL_SUMMARY.md').write_text(summary)
          # Repository manifest covers the copied evidence plus supplement, excluding itself.
          rows=[]
          for p in sorted(root.iterdir()):
              if p.is_file() and p.name!='REPOSITORY_SHA256SUMS':
                  rows.append((hashlib.sha256(p.read_bytes()).hexdigest(),p.name))
          (root/'REPOSITORY_SHA256SUMS').write_text(''.join(f'{h}  {name}\n' for h,name in rows))
          PY
          (cd "$target" && sha256sum -c REPOSITORY_SHA256SUMS)
      - name: Commit canonical archive
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/research/artifact_archives/usdjpy_csos_shock_failure_phase2_v1
          git commit -m 'research: archive Shock Failure Phase 2 evidence'
          git push origin HEAD:agent/csos-shock-failure-phase2
