name: Dispatch EURUSD 2025 Replication Source v1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dispatch_eurusd_2025_source_v1.yml
      - .github/triggers/dispatch_eurusd_2025_source_v1.trigger
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch exact source workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run run_eurusd_2025_full_year_collect.yml --ref main
          sleep 5
          mkdir -p docs/research_reboot
          gh run list --workflow run_eurusd_2025_full_year_collect.yml --limit 5 \
            --json databaseId,attempt,status,conclusion,headSha,event,createdAt,updatedAt,url \
            > docs/research_reboot/eurusd_2025_source_dispatch_receipt_v1.json
          cat docs/research_reboot/eurusd_2025_source_dispatch_receipt_v1.json
      - name: Commit dispatch receipt
        run: |
          set -euo pipefail
          git pull --rebase origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research_reboot/eurusd_2025_source_dispatch_receipt_v1.json
          if ! git diff --cached --quiet; then
            git commit -m "ci: record EURUSD 2025 source dispatch"
            git push origin main
          fi
