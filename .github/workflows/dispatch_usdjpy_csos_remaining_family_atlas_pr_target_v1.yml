name: Dispatch USDJPY CSOS Remaining-Family Atlas PR Target v1
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - 'configs/research/usdjpy_csos_dukascopy_native_remaining_family_atlas_pr_dispatch_receipt_v1.json'
permissions:
  actions: write
  issues: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose or dispatch frozen Atlas exactly once
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          workflow=usdjpy_csos_dukascopy_native_remaining_family_atlas_inventory_v1.yml
          issue=403
          legacy_run=30428550983
          receipt=configs/research/usdjpy_csos_dukascopy_native_remaining_family_atlas_release_receipt_v1.json

          gh issue comment "$issue" --repo "$repo" --body "Atlas PR-target diagnostic: dispatcher started for PR #${{ github.event.pull_request.number }} at head ${{ github.event.pull_request.head.sha }}."

          if gh api "repos/${repo}/contents/${receipt}" >/dev/null 2>&1; then
            gh issue comment "$issue" --repo "$repo" --body "Atlas PR-target diagnostic: immutable Release receipt already exists; no duplicate dispatch performed."
            exit 0
          fi

          runs=$(gh run list --repo "$repo" --workflow "$workflow" --limit 30 --json databaseId,status,conclusion,event,headSha,createdAt,url)
          active=$(printf '%s' "$runs" | jq -c --argjson legacy "$legacy_run" '[.[] | select(.databaseId != $legacy and (.status=="queued" or .status=="in_progress"))] | sort_by(.createdAt) | last // empty')
          if [ -n "$active" ]; then
            run_id=$(printf '%s' "$active" | jq -r .databaseId)
            status=$(printf '%s' "$active" | jq -r .status)
            event=$(printf '%s' "$active" | jq -r .event)
            url=$(printf '%s' "$active" | jq -r .url)
            gh issue comment "$issue" --repo "$repo" --body "Atlas PR-target diagnostic: existing non-legacy Run ${run_id} is ${status} (${event}); duplicate dispatch suppressed. ${url}"
            exit 0
          fi

          gh workflow run "$workflow" --repo "$repo" --ref main
          sleep 4
          dispatched=$(gh run list --repo "$repo" --workflow "$workflow" --limit 10 --json databaseId,status,event,headSha,createdAt,url | jq -c --argjson legacy "$legacy_run" '[.[] | select(.databaseId != $legacy and .event=="workflow_dispatch")] | sort_by(.createdAt) | last // empty')
          if [ -n "$dispatched" ]; then
            run_id=$(printf '%s' "$dispatched" | jq -r .databaseId)
            status=$(printf '%s' "$dispatched" | jq -r .status)
            url=$(printf '%s' "$dispatched" | jq -r .url)
            gh issue comment "$issue" --repo "$repo" --body "Atlas PR-target diagnostic: dispatched Run ${run_id}; current status ${status}. ${url}"
          else
            gh issue comment "$issue" --repo "$repo" --body "Atlas PR-target diagnostic: workflow_dispatch accepted, but non-legacy Run ID was not visible in immediate readback."
          fi
