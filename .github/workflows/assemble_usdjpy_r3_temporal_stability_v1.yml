name: Assemble USDJPY R3 Temporal Stability v1

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  assemble:
    if: github.event.issue.title == '[R3] Assemble USDJPY temporal stability v1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Record assembly run
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh issue comment "${ISSUE_NUMBER}" --repo "${REPOSITORY}" \
            --body "R3 evaluator assembly started. Run ID: ${{ github.run_id }}."

      - name: Decode verify and compile evaluator
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          from pathlib import Path

          encoded=Path('.github/r3_stage/runner.py.gz.b64').read_text(encoding='utf-8').strip()
          encoded += '=' * (-len(encoded) % 4)
          compressed=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(compressed).hexdigest()=='967a17121b9ae73afc52206e3ad972a526607a8f67f6aa01b28da9ef65b7810e'
          runner=gzip.decompress(compressed)
          assert len(runner)==21176,len(runner)
          assert hashlib.sha256(runner).hexdigest()=='90c4e74babcf0670b6f801dac30d04537f2a8efce0dfdb6adee2ccbf4d1c2807'
          target=Path('tools/run_usdjpy_r3_temporal_stability_v1.py')
          target.write_bytes(runner)
          target.chmod(0o755)
          print({'compressed_bytes':len(compressed),'runner_bytes':len(runner),'runner_sha256':hashlib.sha256(runner).hexdigest()})
          PY
          python -m py_compile tools/run_usdjpy_r3_temporal_stability_v1.py

      - name: Generate frozen execution lock
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          paths=[
              'configs/research/usdjpy_r3_temporal_stability_v1.json',
              'tools/run_usdjpy_r3_temporal_stability_v1.py',
              'docs/research_reboot/usdjpy_r3_temporal_stability_prereg_v1.md',
              'configs/market_sessions/fx_market_sessions_v1.json',
          ]
          for path in paths:
              assert Path(path).is_file(),path
          config=json.loads(Path(paths[0]).read_text(encoding='utf-8'))
          assert config['fixed_horizons']==[1,2,3,4,6,8,12,16,24,32,48]
          assert config['interpretation']['candidate_selection'] is False
          assert config['interpretation']['H2_access'] is False
          assert config['interpretation']['2025_access'] is False
          assert config['inputs']['r2_release_asset_sha256']=='84a495b7c7cddf1c719bb4c8ce78bfef2c990b355649d362c18481836d953426'
          assert config['inputs']['r2_trade_ledger_sha256']=='70c2313147607096976a76328b72a628e42fa0001816f14824bcd9e9a3ead6c6'
          assert config['inputs']['r2_summary_sha256']=='fa46a5db3e73c4d25b8e8c97ef4727c39d737cc8823080b23d21b0419d9e44f6'

          code_blobs={}
          for path in paths:
              if path=='tools/run_usdjpy_r3_temporal_stability_v1.py':
                  code_blobs[path]=subprocess.check_output(['git','hash-object',path],text=True).strip()
              else:
                  code_blobs[path]=subprocess.check_output(['git','rev-parse',f'HEAD:{path}'],text=True).strip()
          content_sha256={path:hashlib.sha256(Path(path).read_bytes()).hexdigest() for path in paths}
          lock={
              'version':'v1',
              'research_stage':'R3_temporal_stability',
              'symbol':'USDJPY',
              'code_blobs':code_blobs,
              'content_sha256':content_sha256,
              'input_releases':{
                  'r2':{
                      'tag':config['inputs']['r2_release_tag'],
                      'asset':config['inputs']['r2_release_asset'],
                      'asset_sha256':config['inputs']['r2_release_asset_sha256'],
                      'trade_ledger_sha256':config['inputs']['r2_trade_ledger_sha256'],
                      'summary_sha256':config['inputs']['r2_summary_sha256'],
                  },
                  'r0':{
                      'tag':config['inputs']['r0_release_tag'],
                      'asset':config['inputs']['r0_release_asset'],
                      'asset_sha256':config['inputs']['r0_release_asset_sha256'],
                      'canonical_m15_gzip_sha256':config['inputs']['canonical_m15_gzip_sha256'],
                  },
              },
              'diagnostic_contract':{
                  'candidate_horizon_combinations':660,
                  'input_trade_rows':383078,
                  'monthly_rows':3960,
                  'quarterly_rows':1320,
                  'rolling_2month_rows':3300,
                  'rolling_3month_rows':2640,
                  'anchored_rows':3300,
                  'spread_regime_rows':2640,
                  'rv32_regime_rows':3300,
                  'rv96_regime_rows':3300,
                  'direction_rows':1320,
                  'neighborhood_rows':660,
                  'concentration_rows':660,
                  'sample_class_rows':660,
                  'rv_warmup_label':0,
              },
              'required_outputs':[
                  'temporal_monthly.csv',
                  'temporal_quarterly.csv',
                  'rolling_2month.csv',
                  'rolling_3month.csv',
                  'anchored_ranking.csv',
                  'spread_regime.csv',
                  'rv32_regime.csv',
                  'rv96_regime.csv',
                  'direction_attribution.csv',
                  'horizon_neighborhood.csv',
                  'concentration.csv',
                  'sample_classes.csv',
                  'entry_regime_map.csv.gz',
                  'regime_edges.json',
                  'r3_acceptance.json',
                  'run_metadata.json',
              ],
              'research_firewall':{
                  'H2_rows_parsed':0,
                  '2025_access':False,
                  'candidate_selection':False,
                  'Core_promotion':False,
                  'MT4_promotion':False,
              },
              'next_stage':'R4_selection_design',
          }
          Path('configs/research/usdjpy_r3_temporal_stability_lock_v1.json').write_text(
              json.dumps(lock,indent=2,sort_keys=True)+'\n',encoding='utf-8'
          )
          print(json.dumps({'lock':'PASS','code_blobs':code_blobs},sort_keys=True))
          PY

      - name: Commit evaluator and lock and remove staging
        run: |
          set -euo pipefail
          rm -rf .github/r3_stage
          rm -f .github/workflows/assemble_usdjpy_r3_temporal_stability_v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'research: materialize and lock USDJPY R3 temporal stability v1'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Close issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh issue comment "${ISSUE_NUMBER}" --repo "${REPOSITORY}" \
            --body 'R3 evaluator and execution lock were committed before formal results.'
          gh issue close "${ISSUE_NUMBER}" --repo "${REPOSITORY}" --reason completed
