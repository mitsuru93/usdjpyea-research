name: Run USDJPY H1 Entry-Horizon Diagnostic v2

on:
  workflow_dispatch:

concurrency:
  group: usdjpy-h1-entry-horizon-diagnostic-v2
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas

      - name: Compile and validate frozen configuration
        run: |
          python -m py_compile \
            tools/run_usdjpy_h1_multi_family_screen.py \
            tools/run_usdjpy_h1_multi_family_screen_v2.py \
            tools/run_usdjpy_h1_entry_horizon_diagnostic_v1.py \
            tools/run_usdjpy_h1_entry_horizon_diagnostic_v2.py
          python - <<'PY'
          import json
          from pathlib import Path

          registry = json.loads(Path("configs/research/usdjpy_h1_multi_family_candidates_v1.json").read_text())
          config = json.loads(Path("configs/research/usdjpy_h1_entry_horizon_diagnostic_v2.json").read_text())
          candidate_count = sum(len(block["candidates"]) for block in registry["families"])
          assert registry["symbol"] == "USDJPY"
          assert candidate_count == 13
          assert config["candidate_registry_blob_sha"] == "68d2ad24ef278283f9addf190a2aadd26504efd6"
          assert config["horizon_bars"] == [1, 2, 3, 4, 6, 8, 12, 16, 24]
          assert config["path_window_bars"] == 24
          assert config["development_block_policy"] == "concatenate_all_months_before_signal_generation"
          print({"candidate_count": candidate_count, "horizons": config["horizon_bars"], "h2_data_read": False})
          PY

      - name: Download January baseline repair bars
        uses: actions/download-artifact@v4
        with:
          name: fx-session-baseline-2024-01-USDJPY-29307131333
          path: data/baselines/2024-01
          run-id: 29307131333
          github-token: ${{ github.token }}

      - name: Download February baseline repair bars
        uses: actions/download-artifact@v4
        with:
          name: fx-session-baseline-2024-02-USDJPY-29383810487
          path: data/baselines/2024-02
          run-id: 29383810487
          github-token: ${{ github.token }}

      - name: Download March baseline repair bars
        uses: actions/download-artifact@v4
        with:
          name: fx-session-baseline-2024-03-USDJPY-29421329471
          path: data/baselines/2024-03
          run-id: 29421329471
          github-token: ${{ github.token }}

      - name: Download April baseline repair bars
        uses: actions/download-artifact@v4
        with:
          name: fx-session-baseline-2024-04-USDJPY-29455059447
          path: data/baselines/2024-04
          run-id: 29455059447
          github-token: ${{ github.token }}

      - name: Download May baseline repair bars
        uses: actions/download-artifact@v4
        with:
          name: fx-session-baseline-2024-05-USDJPY-29469227483
          path: data/baselines/2024-05
          run-id: 29469227483
          github-token: ${{ github.token }}

      - name: Download June baseline repair bars
        uses: actions/download-artifact@v4
        with:
          name: fx-session-baseline-2024-06-USDJPY-29475803893
          path: data/baselines/2024-06
          run-id: 29475803893
          github-token: ${{ github.token }}

      - name: Download January source bars
        uses: actions/download-artifact@v4
        with:
          pattern: public-fx-data-pilot-2024-01-USDJPY-d*-29189903048
          path: data/source/2024-01
          merge-multiple: true
          run-id: 29189903048
          github-token: ${{ github.token }}

      - name: Download February source bars
        uses: actions/download-artifact@v4
        with:
          pattern: public-fx-data-pilot-2024-02-USDJPY-d*-29329511595
          path: data/source/2024-02
          merge-multiple: true
          run-id: 29329511595
          github-token: ${{ github.token }}

      - name: Download March source bars
        uses: actions/download-artifact@v4
        with:
          pattern: public-fx-data-pilot-2024-03-USDJPY-d*-29386417671
          path: data/source/2024-03
          merge-multiple: true
          run-id: 29386417671
          github-token: ${{ github.token }}

      - name: Download April source bars
        uses: actions/download-artifact@v4
        with:
          pattern: public-fx-data-pilot-2024-04-USDJPY-d*-29423451609
          path: data/source/2024-04
          merge-multiple: true
          run-id: 29423451609
          github-token: ${{ github.token }}

      - name: Download May source bars
        uses: actions/download-artifact@v4
        with:
          pattern: public-fx-data-pilot-2024-05-USDJPY-d*-29455212697
          path: data/source/2024-05
          merge-multiple: true
          run-id: 29455212697
          github-token: ${{ github.token }}

      - name: Download June source bars
        uses: actions/download-artifact@v4
        with:
          pattern: public-fx-data-pilot-2024-06-USDJPY-d*-29469210771
          path: data/source/2024-06
          merge-multiple: true
          run-id: 29469210771
          github-token: ${{ github.token }}

      - name: Add aggregate-repair M15 bars
        run: |
          set -euo pipefail
          for month in 2024-01 2024-02 2024-03 2024-04 2024-05 2024-06; do
            repair_file="data/baselines/${month}/source_aggregate_repair/bars/M15/USDJPY_M15.csv.gz"
            if [ -f "${repair_file}" ]; then
              target_dir="data/source/${month}/baseline_aggregate_repair/M15"
              mkdir -p "${target_dir}"
              cp "${repair_file}" "${target_dir}/USDJPY_M15.csv.gz"
              echo "${month}: added aggregate-repair M15 bars"
            else
              echo "${month}: no aggregate-repair M15 bars"
            fi
          done

      - name: Run corrected contiguous-block entry-horizon diagnostic
        run: |
          python tools/run_usdjpy_h1_entry_horizon_diagnostic_v2.py \
            --bars 2024-01=data/source/2024-01 \
            --bars 2024-02=data/source/2024-02 \
            --bars 2024-03=data/source/2024-03 \
            --bars 2024-04=data/source/2024-04 \
            --bars 2024-05=data/source/2024-05 \
            --bars 2024-06=data/source/2024-06 \
            --registry configs/research/usdjpy_h1_multi_family_candidates_v1.json \
            --horizon-config configs/research/usdjpy_h1_entry_horizon_diagnostic_v2.json \
            --session-config configs/market_sessions/fx_market_sessions_v1.json \
            --output-dir data/experiments/usdjpy_h1_entry_horizon_diagnostic_v2

      - name: Run authoritative H1 logic for full registered-hold regression
        run: |
          python tools/run_usdjpy_h1_multi_family_screen_v2.py \
            --bars 2024-01=data/source/2024-01 \
            --bars 2024-02=data/source/2024-02 \
            --bars 2024-03=data/source/2024-03 \
            --bars 2024-04=data/source/2024-04 \
            --bars 2024-05=data/source/2024-05 \
            --bars 2024-06=data/source/2024-06 \
            --registry configs/research/usdjpy_h1_multi_family_candidates_v1.json \
            --session-config configs/market_sessions/fx_market_sessions_v1.json \
            --output-dir data/experiments/usdjpy_h1_multi_family_screen_regression

      - name: Verify all registered holds and entry-definition accounting
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          import pandas as pd

          diag_root = Path("data/experiments/usdjpy_h1_entry_horizon_diagnostic_v2")
          canonical_root = Path("data/experiments/usdjpy_h1_multi_family_screen_regression")
          registry = json.loads(Path("configs/research/usdjpy_h1_multi_family_candidates_v1.json").read_text())
          diagnostic = pd.read_csv(diag_root / "horizon_summary.csv")
          canonical = pd.read_csv(canonical_root / "candidate_summary.csv")

          holds = {}
          for family in registry["families"]:
              for candidate in family["candidates"]:
                  holds[candidate["id"]] = int(candidate["hold_bars"])

          metrics = [
              "win_rate",
              "avg_net_pips",
              "total_net_pips",
              "profit_factor",
              "severe_avg_net_pips",
              "severe_profit_factor",
          ]
          rows = []
          for candidate_id, hold in sorted(holds.items()):
              d = diagnostic.loc[
                  (diagnostic["candidate_id"] == candidate_id)
                  & (diagnostic["horizon_bars"] == hold)
              ]
              c = canonical.loc[canonical["candidate_id"] == candidate_id]
              assert len(d) == 1, (candidate_id, hold, len(d))
              assert len(c) == 1, (candidate_id, len(c))
              d = d.iloc[0]
              c = c.iloc[0]
              assert int(d["trades"]) == int(c["trades"]), (candidate_id, hold, d["trades"], c["trades"])
              row = {
                  "candidate_id": candidate_id,
                  "registered_hold_bars": hold,
                  "trades": int(d["trades"]),
                  "status": "passed",
              }
              for metric in metrics:
                  assert math.isclose(
                      float(d[metric]),
                      float(c[metric]),
                      rel_tol=0.0,
                      abs_tol=1e-9,
                  ), (candidate_id, hold, metric, d[metric], c[metric])
                  row[metric] = float(d[metric])
              rows.append(row)

          pd.DataFrame(rows).to_csv(diag_root / "registered_hold_regression.csv", index=False)
          mapping = pd.read_csv(diag_root / "entry_definition_map.csv")
          c1 = mapping.loc[
              mapping["candidate_id"] == "C1_failed_12bar_hold3",
              "entry_definition_id",
          ].iloc[0]
          c2 = mapping.loc[
              mapping["candidate_id"] == "C2_failed_12bar_hold6",
              "entry_definition_id",
          ].iloc[0]
          assert c1 == c2, (c1, c2)

          metadata = json.loads((diag_root / "run_metadata.json").read_text())
          assert metadata["candidate_count"] == 13
          assert metadata["unique_entry_definition_count"] == 12
          assert metadata["development_block_policy"] == "concatenate_all_months_before_signal_generation"
          assert metadata["h2_data_read"] is False
          assert metadata["promotion_decision"] is False
          print({
              "registered_hold_regression": "passed",
              "candidate_count": 13,
              "unique_entry_definitions": 12,
          })
          PY

      - name: Write diagnostic summary
        if: always()
        run: |
          echo "# USDJPY H1 Entry-Horizon Diagnostic v2" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Development data only: 2024-01 through 2024-06" >> "$GITHUB_STEP_SUMMARY"
          echo "Month-boundary history: contiguous canonical H1 semantics" >> "$GITHUB_STEP_SUMMARY"
          echo "Active H2 changed: no" >> "$GITHUB_STEP_SUMMARY"
          echo "Promotion decision made: no" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Registered-hold regression" >> "$GITHUB_STEP_SUMMARY"
          echo '```csv' >> "$GITHUB_STEP_SUMMARY"
          cat data/experiments/usdjpy_h1_entry_horizon_diagnostic_v2/registered_hold_regression.csv >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Horizon stability" >> "$GITHUB_STEP_SUMMARY"
          echo '```csv' >> "$GITHUB_STEP_SUMMARY"
          cat data/experiments/usdjpy_h1_entry_horizon_diagnostic_v2/horizon_stability.csv >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usdjpy-h1-entry-horizon-diagnostic-v2-${{ github.run_id }}
          path: |
            data/experiments/usdjpy_h1_entry_horizon_diagnostic_v2/**
            data/experiments/usdjpy_h1_multi_family_screen_regression/candidate_summary.csv
          if-no-files-found: error
          retention-days: 30
