name: Probe EURUSD 2025 Source Runs v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/probe_eurusd_2025_source_runs_v1.yml
      - .github/triggers/probe_eurusd_2025_source_runs_v1.trigger

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query exact workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p docs/research_reboot
          gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/run_eurusd_2025_full_year_collect.yml/runs?per_page=10" \
            --jq '{queried_at_utc: now | todateiso8601, runs: [.workflow_runs[] | {id,run_attempt,status,conclusion,head_sha,event,created_at,updated_at,html_url}]}' \
            > docs/research_reboot/eurusd_2025_source_runs_probe_v1.json
          cat docs/research_reboot/eurusd_2025_source_runs_probe_v1.json
      - name: Commit probe
        run: |
          git pull --rebase origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research_reboot/eurusd_2025_source_runs_probe_v1.json
          git commit -m "ci: record EURUSD 2025 source workflow runs"
          git push origin main
