name: Repair exact F05 failed reclaim bundle archive v1

on:
  push:
    branches:
      - agent/f05-failed-reclaim-source-restore-v1
    paths:
      - 'configs/run_markers/f05_failed_reclaim_bundle_archive_repair_v1.json'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/f05-failed-reclaim-source-restore-v1

      - name: Repair exact archived base64 bytes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import json
          import zipfile
          from pathlib import Path

          path = Path('configs/research/f05_failed_reclaim_event_sequence_v1/F05_structural_SL_event_sequence_bundle_v1.zip.b64')
          report = Path('docs/research/F05_structural_SL_event_sequence_v1.md')
          repository_manifest_path = Path('configs/research/f05_failed_reclaim_event_sequence_v1/manifest.json')
          corrupt_sha = '4ce1940b9f76e0ed8a84a935590293f3837fabe9e889bb2b2eb024a1ec8d354f'
          expected_sha = '463850652d08f7c3d6b170a345ba92a1f7228c9efb24eb0f89f90b13a59b686d'
          expected_report_sha = '489a2484be135209fd731951990e508b67d6ff11cd2aeff3a4fbac23dffdfad5'

          text = path.read_text(encoding='ascii')
          decoded_before = base64.b64decode(''.join(text.split()), validate=True)
          actual_before = hashlib.sha256(decoded_before).hexdigest()
          if actual_before != corrupt_sha:
              raise AssertionError(('unexpected_before_sha256', actual_before, corrupt_sha))
          if hashlib.sha256(report.read_bytes()).hexdigest() != expected_report_sha:
              raise AssertionError('report identity mismatch')

          old = 'myZtp2DOV2sTX83cW3t9ztDPb88z5uWBkc2auQ91fZEpcWTok1LIL39nr0J/SlV+SY5pcgx2x/A+'
          new = 'ylZtp2DOV2sTX83cW3t9ztDPb88z5uWBkc2auQ91fZEpcWTok1LIL39nr0J/SlV+SY5pcgx2x/A+'
          if text.count(old) != 1:
              raise AssertionError(('replacement_count', text.count(old)))
          repaired_text = text.replace(old, new)
          decoded_after = base64.b64decode(''.join(repaired_text.split()), validate=True)
          actual_after = hashlib.sha256(decoded_after).hexdigest()
          if actual_after != expected_sha:
              raise AssertionError(('unexpected_after_sha256', actual_after, expected_sha))

          tmp = Path('/tmp/F05_structural_SL_event_sequence_bundle_v1.zip')
          tmp.write_bytes(decoded_after)
          repository_manifest = json.loads(repository_manifest_path.read_text(encoding='utf-8'))
          with zipfile.ZipFile(tmp) as archive:
              embedded_manifest = json.loads(archive.read('manifest.json'))
              if embedded_manifest != repository_manifest:
                  raise AssertionError('embedded and repository manifests differ')
              for item in embedded_manifest['files']:
                  payload = archive.read(item['name'])
                  if len(payload) != item['size_bytes']:
                      raise AssertionError((item['name'], 'size'))
                  if hashlib.sha256(payload).hexdigest() != item['sha256']:
                      raise AssertionError((item['name'], 'sha256'))

          path.write_text(repaired_text, encoding='ascii')
          receipt = {
              'schema_version': 'f05_failed_reclaim_bundle_archive_repair_receipt_v1',
              'status': 'PASS_EXACT_ARCHIVE_REPAIRED',
              'path': str(path),
              'before_decoded_sha256': actual_before,
              'after_decoded_sha256': actual_after,
              'replacement_count': 1,
              'report_sha256': expected_report_sha,
              'embedded_manifest_matches_repository_manifest': True,
              'all_member_sha256_pass': True,
              'outcomes_computed': False,
              'portfolio_replay_computed': False,
              'mt4_accessed': False,
              '2025_accessed': False,
          }
          Path('configs/research/f05_failed_reclaim_bundle_archive_repair_receipt_v1.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Commit repaired archive to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            configs/research/f05_failed_reclaim_event_sequence_v1/F05_structural_SL_event_sequence_bundle_v1.zip.b64 \
            configs/research/f05_failed_reclaim_bundle_archive_repair_receipt_v1.json
          git diff --cached --quiet && { echo 'No repair change staged'; exit 1; }
          git commit -m 'research: repair exact F05 exploration bundle archive bytes'
          git push origin HEAD:agent/f05-failed-reclaim-source-restore-v1
