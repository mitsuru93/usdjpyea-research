name: FX2 Release-bound Artifact Purge v1

on:
  issues:
    types: [opened]

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  purge:
    if: >-
      github.event.issue.title == '[FX2-RELEASE-BOUND-ARTIFACT-PURGE] DRY-RUN' ||
      github.event.issue.title == '[FX2-RELEASE-BOUND-ARTIFACT-PURGE] APPLY'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate release binding and purge artifacts
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fetchText = async (path) => {
              const response = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: context.sha
              });
              return Buffer.from(response.data.content, response.data.encoding).toString('utf8');
            };
            const source = await fetchText('.github/scripts/fx2_release_bound_artifact_purge_v1.js');
            const loaded = { exports: {} };
            new Function('require', 'module', 'exports', source)(require, loaded, loaded.exports);
            const mode = context.payload.issue.title.endsWith('DRY-RUN') ? 'dry-run' : 'apply';
            await loaded.exports.run({ github, context, core, mode });
