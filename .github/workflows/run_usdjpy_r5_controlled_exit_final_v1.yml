name: Run Final USDJPY R5 Controlled Exit v1

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: usdjpy-r5-controlled-exit-final-v1
  cancel-in-progress: false

jobs:
  r5:
    if: github.event_name != 'issues' || github.event.issue.title == '[R5] Run final USDJPY controlled exit v1'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CONFIG_PATH: configs/research/usdjpy_r5_controlled_exit_v1.json
      LOCK_PATH: configs/research/usdjpy_r5_controlled_exit_lock_v1.json
      OUTPUT_DIR: data/experiments/usdjpy_r5_controlled_exit_v1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record run ID
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh issue comment "${ISSUE_NUMBER}" --repo "${REPOSITORY}" --body "Final USDJPY R5 controlled Exit run started. Run ID: ${{ github.run_id }}. https://github.com/${REPOSITORY}/actions/runs/${{ github.run_id }}"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy

      - name: Materialize exact evaluator and lock before input access
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip, hashlib, json, subprocess
          from pathlib import Path

          runner=Path('tools/run_usdjpy_r5_controlled_exit_v1.py')
          if not runner.is_file():
              compressed=base64.b64decode(Path('.github/r5_stage/runner.py.gz.b64').read_text().strip())
              source=gzip.decompress(compressed)
              assert len(source)==33643,len(source)
              assert hashlib.sha256(source).hexdigest()=='61a08c41473f6895056b7c680f2d8a0730e6391b2f4e070e9bab4dd10f9c2a19'
              runner.write_bytes(source)
              runner.chmod(0o755)

          config_path=Path('configs/research/usdjpy_r5_controlled_exit_v1.json')
          prereg_path=Path('docs/research_reboot/usdjpy_r5_controlled_exit_prereg_v1.md')
          config=json.loads(config_path.read_text())
          assert len(config['representatives'])==8
          assert len(config['policies'])==4
          assert config['cohort_contract']['entry_rows_per_policy']==2982
          assert config['cohort_contract']['total_policy_trade_rows']==11928
          assert config['policy_design']['parameter_sweep'] is False
          assert config['research_firewall']['H2_rows_parsed']==0
          assert config['research_firewall']['2025_access'] is False

          paths=[str(config_path),str(prereg_path),str(runner)]
          code_blobs={}
          for path in paths:
              try:
                  code_blobs[path]=subprocess.check_output(['git','rev-parse',f'HEAD:{path}'],text=True,stderr=subprocess.DEVNULL).strip()
              except subprocess.CalledProcessError:
                  code_blobs[path]=subprocess.check_output(['git','hash-object',path],text=True).strip()
          lock={
              'version':'v1','research_stage':'R5_controlled_exit_research','symbol':'USDJPY',
              'code_blobs':code_blobs,
              'content_sha256':{path:hashlib.sha256(Path(path).read_bytes()).hexdigest() for path in paths},
              'input_releases':{
                  'r0':{'tag':config['inputs']['r0_release_tag'],'asset':config['inputs']['r0_release_asset'],'asset_sha256':config['inputs']['r0_release_asset_sha256'],'canonical_m15_gzip_sha256':config['inputs']['canonical_m15_gzip_sha256']},
                  'r2':{'tag':config['inputs']['r2_release_tag'],'asset':config['inputs']['r2_release_asset'],'asset_sha256':config['inputs']['r2_release_asset_sha256'],'trade_ledger_sha256':config['inputs']['r2_trade_ledger_sha256']},
                  'r4':{'tag':config['inputs']['r4_release_tag'],'asset':config['inputs']['r4_release_asset'],'asset_sha256':config['inputs']['r4_release_asset_sha256'],'selected_representatives_sha256':config['inputs']['r4_selected_representatives_sha256']}
              },
              'representatives':config['representatives'],'cohort_contract':config['cohort_contract'],
              'atr_contract':config['atr'],'policy_contract':config['policies'],
              'execution_contract':config['execution_semantics'],'cost_contract':config['cost_semantics'],
              'reporting_contract':config['reporting'],'required_outputs':config['required_outputs'],
              'research_firewall':config['research_firewall'],'next_stage':config['next_stage']
          }
          Path('configs/research/usdjpy_r5_controlled_exit_lock_v1.json').write_text(json.dumps(lock,indent=2,sort_keys=True)+'\n')
          print({'R5_materialize':'PASS','source_sha256':hashlib.sha256(runner.read_bytes()).hexdigest()})
          PY
          python -m py_compile tools/run_usdjpy_r5_controlled_exit_v1.py
          rm -rf .github/r5_stage
          rm -f .github/workflows/assemble_usdjpy_r5_controlled_exit_v1.yml
          rm -f .github/workflows/run_usdjpy_r5_controlled_exit_v1.yml
          rm -f .github/workflows/patch_usdjpy_r5_compressed_hash_v1.yml
          rm -f .github/workflows/diagnose_and_patch_usdjpy_r5_payload_v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'research: materialize and lock USDJPY R5 evaluator v1'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Verify committed lock
        run: |
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          lock=json.loads(Path('configs/research/usdjpy_r5_controlled_exit_lock_v1.json').read_text())
          for path,expected in lock['code_blobs'].items():
              assert subprocess.check_output(['git','rev-parse',f'HEAD:{path}'],text=True).strip()==expected
          for path,expected in lock['content_sha256'].items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==expected
          assert len(lock['policy_contract'])==4
          assert lock['cohort_contract']['total_policy_trade_rows']==11928
          assert lock['research_firewall']['H2_rows_parsed']==0
          assert lock['research_firewall']['2025_access'] is False
          print({'R5_lock':'PASS'})
          PY

      - name: Download and verify R0 R2 R4 Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p releases/r0 releases/r2 releases/r4 input/r0 input/r2 input/r4
          python - <<'PY' > release.env
          import json
          from pathlib import Path
          lock=json.loads(Path('configs/research/usdjpy_r5_controlled_exit_lock_v1.json').read_text())
          for key,prefix in [('r0','R0'),('r2','R2'),('r4','R4')]:
              row=lock['input_releases'][key]
              print(f'{prefix}_TAG={row["tag"]}')
              print(f'{prefix}_ASSET={row["asset"]}')
              print(f'{prefix}_SHA={row["asset_sha256"]}')
          PY
          source release.env
          gh release download "${R0_TAG}" --repo "${GITHUB_REPOSITORY}" --pattern "${R0_ASSET}" --dir releases/r0
          gh release download "${R2_TAG}" --repo "${GITHUB_REPOSITORY}" --pattern "${R2_ASSET}" --dir releases/r2
          gh release download "${R4_TAG}" --repo "${GITHUB_REPOSITORY}" --pattern "${R4_ASSET}" --dir releases/r4
          echo "${R0_SHA}  releases/r0/${R0_ASSET}" | sha256sum -c -
          echo "${R2_SHA}  releases/r2/${R2_ASSET}" | sha256sum -c -
          echo "${R4_SHA}  releases/r4/${R4_ASSET}" | sha256sum -c -
          unzip -q "releases/r0/${R0_ASSET}" -d input/r0
          unzip -q "releases/r2/${R2_ASSET}" -d input/r2
          unzip -q "releases/r4/${R4_ASSET}" -d input/r4
          mapfile -t M15_FILES < <(find input/r0 -type f -path '*/canonical/bars/M15/USDJPY_M15.csv.gz' | sort)
          mapfile -t R2_FILES < <(find input/r2 -type f -name 'candidate_horizon_trades.csv.gz' | sort)
          mapfile -t R4_FILES < <(find input/r4 -type f -name 'selected_representatives.csv' | sort)
          test "${#M15_FILES[@]}" -eq 1
          test "${#R2_FILES[@]}" -eq 1
          test "${#R4_FILES[@]}" -eq 1
          echo "CANONICAL_M15=${M15_FILES[0]}" >> "${GITHUB_ENV}"
          echo "R2_TRADES=${R2_FILES[0]}" >> "${GITHUB_ENV}"
          echo "R4_SELECTED=${R4_FILES[0]}" >> "${GITHUB_ENV}"

      - name: Run all 32 frozen Exit combinations
        run: |
          python tools/run_usdjpy_r5_controlled_exit_v1.py --canonical-m15 "${CANONICAL_M15}" --r2-trades "${R2_TRADES}" --r4-selected "${R4_SELECTED}" --config "${CONFIG_PATH}" --output-dir "${OUTPUT_DIR}"

      - name: Verify output contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          out=Path('data/experiments/usdjpy_r5_controlled_exit_v1')
          lock=json.loads(Path('configs/research/usdjpy_r5_controlled_exit_lock_v1.json').read_text())
          for name in lock['required_outputs']:
              assert (out/name).is_file() and (out/name).stat().st_size>0,name
          trades=pd.read_csv(out/'exit_trades.csv.gz',compression='gzip')
          summary=pd.read_csv(out/'exit_summary.csv')
          monthly=pd.read_csv(out/'exit_monthly.csv')
          direction=pd.read_csv(out/'exit_direction.csv')
          reasons=pd.read_csv(out/'exit_reason.csv')
          baseline=pd.read_csv(out/'baseline_regression.csv')
          sets=pd.read_csv(out/'policy_trade_set_regression.csv')
          acceptance=json.loads((out/'r5_acceptance.json').read_text())
          metadata=json.loads((out/'run_metadata.json').read_text())
          assert len(trades)==11928 and len(summary)==32 and len(monthly)==192 and len(direction)==64 and len(reasons)==96
          assert len(baseline)==8 and baseline['passed'].all()
          assert len(sets)==32 and sets['passed'].all()
          assert acceptance['status']=='PASS' and all(v is True for k,v in acceptance.items() if k!='status')
          assert metadata['H2_rows_parsed']==0 and metadata['2025_artifact_access'] is False
          assert metadata['R5_selection_or_promotion'] is False and metadata['R6_design_unblocked'] is True
          print({'R5':'PASS','trade_rows':len(trades),'summary_rows':len(summary)})
          PY

      - name: Write job summary
        if: always()
        run: |
          echo '# USDJPY R5 Controlled Exit v1' >> "${GITHUB_STEP_SUMMARY}"
          if [ -f "${OUTPUT_DIR}/r5_acceptance.json" ]; then cat "${OUTPUT_DIR}/r5_acceptance.json" >> "${GITHUB_STEP_SUMMARY}"; fi

      - name: Upload R5 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usdjpy-r5-controlled-exit-final-v1-${{ github.run_id }}
          path: data/experiments/usdjpy_r5_controlled_exit_v1/**
          if-no-files-found: error
          retention-days: 90

      - name: Close successful issue
        if: github.event_name == 'issues' && success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh issue comment "${ISSUE_NUMBER}" --repo "${REPOSITORY}" --body 'Final R5 controlled Exit run passed. All 32 combinations were reported with no selection; H2 and 2025 remained unopened.'
          gh issue close "${ISSUE_NUMBER}" --repo "${REPOSITORY}" --reason completed

      - name: Report failure
        if: github.event_name == 'issues' && failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh issue comment "${ISSUE_NUMBER}" --repo "${REPOSITORY}" --body 'Final R5 run failed. No R5 result is accepted and R6 remains blocked.'
