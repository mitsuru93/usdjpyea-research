name: USDJPY HYP-035 Pullback Continuation Development v1
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/usdjpy_pullback_continuation_development_v1.yml','configs/research/usdjpy_pullback_continuation_portability_prereg_v1.json','configs/research/usdjpy_pullback_continuation_source_manifest_v1.json','configs/research/usdjpy_hyp035_startup_receipt_v1.json','configs/research/usdjpy_hyp035_hypothesis_reservation_v1.json','tools/evaluate_usdjpy_pullback_continuation_v1.py']
  push:
    branches: [main]
    paths: ['.github/workflows/usdjpy_pullback_continuation_development_v1.yml','configs/research/usdjpy_pullback_continuation_portability_prereg_v1.json','configs/research/usdjpy_pullback_continuation_source_manifest_v1.json','configs/research/usdjpy_hyp035_startup_receipt_v1.json','configs/research/usdjpy_hyp035_hypothesis_reservation_v1.json','tools/evaluate_usdjpy_pullback_continuation_v1.py']
  workflow_dispatch:
permissions: {contents: write, issues: write, actions: read}
jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Exact-SHA selective fetch and Infrastructure v1 probe
        id: init
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/h35d"; rm -rf "$root"; mkdir -p "$root"/{src,infra,inputs/{atlas,historical,2023,2024h1,2024h2,raw2023,raw2024},materialized,output,evidence}
          sha='${{ github.event.pull_request.head.sha || github.sha }}'; test "${#sha}" = 40
          fetch(){ p="$1"; o="$2"; mkdir -p "$(dirname "$o")"; j=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${p}?ref=${sha}"); printf %s "$j"|jq -er .content|tr -d '\n'|base64 -d >"$o"; printf %s "$j"|jq -er .sha >"$o.blob_sha"; test -s "$o"; }
          fetch configs/research/usdjpy_pullback_continuation_portability_prereg_v1.json "$root/src/prereg.json"
          fetch configs/research/usdjpy_pullback_continuation_source_manifest_v1.json "$root/src/source_manifest.json"
          fetch tools/evaluate_usdjpy_pullback_continuation_v1.py "$root/src/evaluate.py"
          fetch tools/usdjpy_hyp034_bi5_source_v1.py "$root/src/usdjpy_hyp034_bi5_source_v1.py"
          fetch tools/build_usdjpy_b02_f05_hyp024_inputs_v2.py "$root/src/build_baseline.py"
          fetch tools/vendor/fx2_infra_core_f897b250_v1.py "$root/infra/fx2_infra.py"
          python -m py_compile "$root/src/"*.py "$root/infra/fx2_infra.py"
          python "$root/infra/fx2_infra.py" probe --json "$root/evidence/runner_capability.json" --markdown "$root/evidence/runner_capability.md"
          jq -e '.hypothesis_id=="USDJPY-HYP-035" and .candidate_id=="A_EXACT_EXECUTABLE_16BAR" and .status=="FROZEN_BEFORE_DEVELOPMENT_OUTCOMES" and .fixed_atlas_contract.hold_bars==16 and .monetary_contract.reporting_currency=="JPY" and .protected_boundaries.historical_2020_2022_access_before_freeze==false and .protected_boundaries.protected_2025_access==false and .no_retuning==true' "$root/src/prereg.json"
          jq -e '.whole_repository_checkout_required==false and .exact_sha_selective_fetch_required==true and (.forbidden_assets|sort)==["2019","2020","2021","2022","2025"]' "$root/src/source_manifest.json"
          echo "root=$root" >>"$GITHUB_OUTPUT"; echo "sha=$sha" >>"$GITHUB_OUTPUT"; printf '%s\n' "$sha" >"$root/evidence/research_head_sha.txt"
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install frozen runtime and verify all authorities
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}', ROOT: '${{ steps.init.outputs.root }}'}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'numpy==2.1.3' 'pandas==2.2.3'
          gh release download usdjpy-csos-opportunity-atlas-v1-r1 --repo "$GITHUB_REPOSITORY" --dir "$ROOT/inputs/atlas" --pattern 'usdjpy-csos-opportunity-atlas-v1-r1-30202535070-1.zip'
          printf '%s  %s\n' f5feef1a1eb06cfdc284d3642c7050b05da3fc6fa31f67a4205c7faf3e72a72f "$ROOT/inputs/atlas/usdjpy-csos-opportunity-atlas-v1-r1-30202535070-1.zip"|sha256sum -c -
          unzip -q "$ROOT/inputs/atlas/usdjpy-csos-opportunity-atlas-v1-r1-30202535070-1.zip" -d "$ROOT/inputs/atlas/unpacked"
          (cd "$ROOT/inputs/atlas/unpacked" && sha256sum -c csos_output/PACKAGE_SHA256SUMS)
          gh release download f05-failed-reclaim-historical-authorities-v1 --repo "$GITHUB_REPOSITORY" --dir "$ROOT/inputs/historical" --pattern 'usdjpy-2023-canonical-baseline-prep-v1.zip' --pattern 'mt4-usdjpy-2024h1-event-audit-v1.zip' --pattern 'mt4-usdjpy-f05-extatr-h2-validation-v1.zip' --pattern EXPECTED_SHA256SUMS
          (cd "$ROOT/inputs/historical" && sha256sum -c EXPECTED_SHA256SUMS)
          unzip -q "$ROOT/inputs/historical/usdjpy-2023-canonical-baseline-prep-v1.zip" -d "$ROOT/inputs/2023"; unzip -q "$ROOT/inputs/historical/mt4-usdjpy-2024h1-event-audit-v1.zip" -d "$ROOT/inputs/2024h1"; unzip -q "$ROOT/inputs/historical/mt4-usdjpy-f05-extatr-h2-validation-v1.zip" -d "$ROOT/inputs/2024h2"
          python "$ROOT/src/build_baseline.py" --m15-2023 "$ROOT/inputs/2023/normalized/usdjpy_2023_m15_bid_utc_rakuten_mt4_v1.csv.gz" --m15-2024h1 "$ROOT/inputs/2024h1/m15_utc_2024h1.csv" --events-2024h1 "$ROOT/inputs/2024h1/tester/fx2_usdjpy_2024h1_event_audit_fixed_001_each_v1.csv" --events-2024h2 "$ROOT/inputs/2024h2/h2_baseline/fx2_usdjpy_f05_extatr_h2_baseline_v1.csv" --out-dir "$ROOT/materialized" >"$ROOT/evidence/baseline.log"
          printf '%s  %s\n' 98c9c8cf57c62c23a94aa38efa6ee257e823dd0b68c413615197a48be00b08ca "$ROOT/materialized/usdjpy_b02_f05_source_trade_ledger_v2.csv"|sha256sum -c -
          for y in 2023 2024; do d="$ROOT/inputs/raw$y"; gh release download "usdjpy-$y-raw-bidask-ticks-v1" --repo "$GITHUB_REPOSITORY" --dir "$d" --pattern "usdjpy-$y-??-raw-ticks-v1.tar.gz" --pattern "usdjpy-$y-raw-ticks-v1.annual-manifest.json" --pattern SHA256SUMS; (cd "$d" && grep -E "usdjpy-$y-(..-raw-ticks-v1\\.tar\\.gz|raw-ticks-v1\\.annual-manifest\\.json)$" SHA256SUMS|sha256sum -c -); test "$(find "$d" -name '*.tar.gz'|wc -l)" = 12; done
          find "$ROOT/inputs/raw2023" "$ROOT/inputs/raw2024" -maxdepth 1 -type f -printf '%f %s\n'|sort >"$ROOT/evidence/raw_release_inventory.txt"; ! grep -E '2019|2020|2021|2022|2025' "$ROOT/evidence/raw_release_inventory.txt"
      - name: Preflight and execute frozen Development candidate
        shell: bash
        env: {ROOT: '${{ steps.init.outputs.root }}', PYTHONPATH: '${{ steps.init.outputs.root }}/src', PYTHONUNBUFFERED: '1'}
        run: |
          set -euo pipefail
          common=(--raw-2023 "$ROOT/inputs/raw2023" --raw-2024 "$ROOT/inputs/raw2024" --atlas-ledger "$ROOT/inputs/atlas/unpacked/csos_output/strategy_opportunity_atlas.csv.gz" --baseline-trades "$ROOT/materialized/usdjpy_b02_f05_source_trade_ledger_v2.csv" --baseline-states "$ROOT/materialized/usdjpy_b02_f05_entry_exit_state_ledger_v2.csv.gz" --prereg "$ROOT/src/prereg.json" --source-manifest "$ROOT/src/source_manifest.json" --research-sha '${{ steps.init.outputs.sha }}' --core-sha f897b250b808207d960417b2306935dcb0655acf --run-id "$GITHUB_RUN_ID")
          python "$ROOT/src/evaluate.py" "${common[@]}" --out-dir "$ROOT/evidence/preflight" --preflight-only >"$ROOT/evidence/preflight.log"; jq -e '.pass==true and .candidate_outcome_computed==false' "$ROOT/evidence/preflight/preflight_receipt.json"
          python "$ROOT/src/evaluate.py" "${common[@]}" --out-dir "$ROOT/output" 2>&1|tee "$ROOT/evidence/development_run.log"
          jq -e '.hypothesis_id=="USDJPY-HYP-035" and .historical_2020_2022_accessed==false and .protected_2025_accessed==false and .core_modified==false and .mt4_executed==false and .production_authorized==false and .live_authorized==false' "$ROOT/output/final_result.json"
          (cd "$ROOT/output" && sha256sum -c PACKAGE_SHA256SUMS); ! grep -R -E '2019-[0-9]{2}-[0-9]{2}|2020-[0-9]{2}-[0-9]{2}|2021-[0-9]{2}-[0-9]{2}|2022-[0-9]{2}-[0-9]{2}|2025-[0-9]{2}-[0-9]{2}' "$ROOT/output"
          python "$ROOT/infra/fx2_infra.py" archive --input "$ROOT/output" --output "$ROOT/usdjpy-hyp035-pullback-continuation-development-v1.zip" --source-sha '${{ steps.init.outputs.sha }}' --run-id "$GITHUB_RUN_ID" --classification scientific >"$ROOT/evidence/archive_build.json"
          python "$ROOT/infra/fx2_infra.py" readback --archive "$ROOT/usdjpy-hyp035-pullback-continuation-development-v1.zip" >"$ROOT/evidence/archive_readback.json"; jq -e .status==\"PASS\" "$ROOT/evidence/archive_readback.json"
      - name: Upload immutable evidence
        if: always()
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: usdjpy-hyp035-pullback-continuation-development-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.init.outputs.root }}/output
            ${{ steps.init.outputs.root }}/evidence
            ${{ steps.init.outputs.root }}/usdjpy-hyp035-pullback-continuation-development-v1.zip
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
      - name: Publish Release, readback, receipt and Issue on main
        if: success() && github.event_name == 'push' && github.ref_name == 'main'
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}', ROOT: '${{ steps.init.outputs.root }}', ARTIFACT_ID: '${{ steps.upload.outputs.artifact-id }}', ARTIFACT_DIGEST: '${{ steps.upload.outputs.artifact-digest }}'}
        run: |
          set -euo pipefail
          tag=usdjpy-hyp035-pullback-continuation-development-v1; ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          decision=$(jq -r .decision "$ROOT/output/final_result.json"); stage=$(jq -r .failed_binding_stage "$ROOT/output/final_result.json"); trades=$(jq -r .source_native_trades "$ROOT/output/final_result.json"); net=$(jq -r '.standalone.net_jpy//"not_executed"' "$ROOT/output/final_result.json"); pf=$(jq -r '.standalone.profit_factor//"not_executed"' "$ROOT/output/final_result.json")
          gh release create "$tag" "$ROOT/usdjpy-hyp035-pullback-continuation-development-v1.zip" --target "$GITHUB_SHA" --title 'USDJPY HYP-035 Pullback Continuation Development v1' --notes "Decision ${decision}; stop ${stage}; trades ${trades}; net JPY ${net}; PF ${pf}. No 2020-2022, Core/MT4 or 2025 access; no production/live authorization." --repo "$GITHUB_REPOSITORY"
          mkdir "$ROOT/readback"; gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$ROOT/readback" --pattern 'usdjpy-hyp035-pullback-continuation-development-v1.zip'; cmp "$ROOT/usdjpy-hyp035-pullback-continuation-development-v1.zip" "$ROOT/readback/usdjpy-hyp035-pullback-continuation-development-v1.zip"; asset_sha=$(sha256sum "$ROOT/readback/usdjpy-hyp035-pullback-continuation-development-v1.zip"|cut -d' ' -f1)
          jq -n --arg d "$decision" --arg s "$stage" --arg hs "$GITHUB_SHA" --arg ad "$ARTIFACT_DIGEST" --arg as "$asset_sha" --argjson run "$GITHUB_RUN_ID" --argjson aid "$ARTIFACT_ID" '{schema_version:"usdjpy_hyp035_release_receipt_v1",status:"PASS_BYTE_IDENTICAL_RELEASE_READBACK",hypothesis_id:"USDJPY-HYP-035",family_id:"S_PULLBACK_CONTINUATION_PORTABILITY",candidate_id:"A_EXACT_EXECUTABLE_16BAR",decision:$d,failed_binding_stage:$s,workflow_run_id:$run,head_sha:$hs,artifact_id:$aid,artifact_digest:$ad,release_tag:"usdjpy-hyp035-pullback-continuation-development-v1",release_asset_sha256:$as,byte_identical_readback:true,historical_2020_2022_accessed:false,protected_2025_accessed:false,core_modified:false,mt4_executed:false,production_authorized:false,live_authorized:false}' >"$ROOT/receipt.json"
          content=$(base64 -w0 "$ROOT/receipt.json"); gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/configs/research/usdjpy_hyp035_release_receipt_v1.json" -f message='evidence: record HYP-035 Release readback' -f content="$content" -f branch=main >/dev/null
          printf 'workflow: usdjpy_pullback_continuation_development_v1.yml\nrun_id: %s\nhead_sha: %s\nhypothesis_id: USDJPY-HYP-035\ndecision: %s\nfailed_binding_stage: %s\nartifact_id: %s\nartifact_digest: %s\nrelease_tag: %s\nprotected_2020_2022_accessed: false\nprotected_2025_accessed: false\nproduction_authorized: false\nlive_authorized: false\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$decision" "$stage" "$ARTIFACT_ID" "$ARTIFACT_DIGEST" "$tag" >"$ROOT/issue.md"; gh issue create --repo "$GITHUB_REPOSITORY" --title "[HYP-035] ${GITHUB_RUN_ID} ${decision}" --body-file "$ROOT/issue.md"
