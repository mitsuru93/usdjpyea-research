name: USDJPY HYP-036 Dukascopy Native Pullback Development v1
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/usdjpy_pullback_continuation_dukas_native_development_v1.yml'
      - 'configs/research/usdjpy_pullback_continuation_dukas_native_*.json'
      - 'tools/evaluate_usdjpy_pullback_continuation_dukas_native_v1.py'
      - 'tools/usdjpy_hyp036_dukas_native_lib_v1.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Selective exact-SHA fetch and preflight code audit
        id: init
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/h36"; rm -rf "$root"; mkdir -p "$root"/{src,infra,inputs/{historical,2023,2024h1,2024h2,raw2023,raw2024},materialized,output,evidence}
          sha='${{ github.event.pull_request.head.sha || github.sha }}'; test "${#sha}" = 40
          fetch(){ p="$1"; o="$2"; mkdir -p "$(dirname "$o")"; gh api "repos/${GITHUB_REPOSITORY}/contents/${p}?ref=${sha}" --jq .content | tr -d '\n' | base64 -d > "$o"; test -s "$o"; }
          fetch configs/research/usdjpy_pullback_continuation_dukas_native_prereg_v1.json "$root/src/prereg.json"
          fetch configs/research/usdjpy_pullback_continuation_dukas_native_source_manifest_v1.json "$root/src/source_manifest.json"
          fetch tools/evaluate_usdjpy_pullback_continuation_dukas_native_v1.py "$root/src/evaluate.py"
          fetch tools/usdjpy_hyp036_dukas_native_lib_v1.py "$root/src/usdjpy_hyp036_dukas_native_lib_v1.py"
          fetch tools/evaluate_usdjpy_pullback_continuation_v1.py "$root/src/hyp035.py"
          fetch tools/usdjpy_hyp035_source_population_repair_v1.py "$root/src/source_repair.py"
          fetch tools/usdjpy_hyp034_bi5_source_v1.py "$root/src/usdjpy_hyp034_bi5_source_v1.py"
          fetch tools/build_usdjpy_b02_f05_hyp024_inputs_v2.py "$root/src/build_baseline.py"
          fetch tools/vendor/fx2_infra_core_f897b250_v1.py "$root/infra/fx2_infra.py"
          python "$root/src/source_repair.py" --evaluator "$root/src/hyp035.py" --receipt "$root/evidence/source_repair_receipt.json"
          jq -e '.status=="PASS_TECHNICAL_FALSE_GATE_REPAIR" and .candidate_changed==false and .scientific_gate_changed==false' "$root/evidence/source_repair_receipt.json"
          python -m py_compile "$root/src/"*.py "$root/infra/fx2_infra.py"
          jq -e '.hypothesis_id=="USDJPY-HYP-036" and .candidate_id=="A_DUKASCOPY_NATIVE_16BAR" and .fixed_source_native_contract.atlas_identity_gate==false and .no_retuning==true' "$root/src/prereg.json"
          jq -e '(.forbidden_assets|sort)==["2019","2020","2021","2022","2025"]' "$root/src/source_manifest.json"
          echo "root=$root" >> "$GITHUB_OUTPUT"; echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen runtime and materialize authorities
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ROOT: ${{ steps.init.outputs.root }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'numpy==2.1.3' 'pandas==2.2.3'
          gh release download f05-failed-reclaim-historical-authorities-v1 --repo "$GITHUB_REPOSITORY" --dir "$ROOT/inputs/historical" --pattern 'usdjpy-2023-canonical-baseline-prep-v1.zip' --pattern 'mt4-usdjpy-2024h1-event-audit-v1.zip' --pattern 'mt4-usdjpy-f05-extatr-h2-validation-v1.zip' --pattern EXPECTED_SHA256SUMS
          (cd "$ROOT/inputs/historical" && sha256sum -c EXPECTED_SHA256SUMS)
          unzip -q "$ROOT/inputs/historical/usdjpy-2023-canonical-baseline-prep-v1.zip" -d "$ROOT/inputs/2023"
          unzip -q "$ROOT/inputs/historical/mt4-usdjpy-2024h1-event-audit-v1.zip" -d "$ROOT/inputs/2024h1"
          unzip -q "$ROOT/inputs/historical/mt4-usdjpy-f05-extatr-h2-validation-v1.zip" -d "$ROOT/inputs/2024h2"
          python "$ROOT/src/build_baseline.py" --m15-2023 "$ROOT/inputs/2023/normalized/usdjpy_2023_m15_bid_utc_rakuten_mt4_v1.csv.gz" --m15-2024h1 "$ROOT/inputs/2024h1/m15_utc_2024h1.csv" --events-2024h1 "$ROOT/inputs/2024h1/tester/fx2_usdjpy_2024h1_event_audit_fixed_001_each_v1.csv" --events-2024h2 "$ROOT/inputs/2024h2/h2_baseline/fx2_usdjpy_f05_extatr_h2_baseline_v1.csv" --out-dir "$ROOT/materialized"
          printf '%s  %s\n' 98c9c8cf57c62c23a94aa38efa6ee257e823dd0b68c413615197a48be00b08ca "$ROOT/materialized/usdjpy_b02_f05_source_trade_ledger_v2.csv" | sha256sum -c -
          test "$(gzip -cd "$ROOT/materialized/usdjpy_b02_f05_entry_exit_state_ledger_v2.csv.gz" | wc -l)" = 68956
          for y in 2023 2024; do
            d="$ROOT/inputs/raw$y"; gh release download "usdjpy-$y-raw-bidask-ticks-v1" --repo "$GITHUB_REPOSITORY" --dir "$d" --pattern "usdjpy-$y-??-raw-ticks-v1.tar.gz" --pattern "usdjpy-$y-raw-ticks-v1.annual-manifest.json" --pattern SHA256SUMS
            (cd "$d" && grep -E "usdjpy-$y-(..-raw-ticks-v1\\.tar\\.gz|raw-ticks-v1\\.annual-manifest\\.json)$" SHA256SUMS | sha256sum -c -)
            test "$(find "$d" -name '*.tar.gz' | wc -l)" = 12
          done
          find "$ROOT/inputs/raw2023" "$ROOT/inputs/raw2024" -maxdepth 1 -type f -printf '%f\n' | sort > "$ROOT/evidence/raw_inventory.txt"
          ! grep -E '2019|2020|2021|2022|2025' "$ROOT/evidence/raw_inventory.txt"
      - name: Execute frozen Dukascopy-native candidate
        shell: bash
        env:
          ROOT: ${{ steps.init.outputs.root }}
          PYTHONPATH: ${{ steps.init.outputs.root }}/src
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          common=(--raw-2023 "$ROOT/inputs/raw2023" --raw-2024 "$ROOT/inputs/raw2024" --baseline-trades "$ROOT/materialized/usdjpy_b02_f05_source_trade_ledger_v2.csv" --baseline-states "$ROOT/materialized/usdjpy_b02_f05_entry_exit_state_ledger_v2.csv.gz" --prereg "$ROOT/src/prereg.json" --source-manifest "$ROOT/src/source_manifest.json" --research-sha '${{ steps.init.outputs.sha }}' --core-sha f897b250b808207d960417b2306935dcb0655acf --run-id "$GITHUB_RUN_ID")
          python "$ROOT/src/evaluate.py" "${common[@]}" --out-dir "$ROOT/evidence/preflight" --preflight-only
          jq -e '.pass==true and .candidate_outcome_computed==false' "$ROOT/evidence/preflight/preflight_receipt.json"
          python "$ROOT/src/evaluate.py" "${common[@]}" --out-dir "$ROOT/output" | tee "$ROOT/evidence/development_run.log"
          jq -e '.hypothesis_id=="USDJPY-HYP-036" and .hyp035_reopened==false and .atlas_event_population_reused==false and .historical_2020_2022_accessed==false and .protected_2025_accessed==false and .production_authorized==false' "$ROOT/output/final_result.json"
          (cd "$ROOT/output" && sha256sum -c PACKAGE_SHA256SUMS)
          ! grep -R -E '2020-[0-9]{2}-[0-9]{2}|2021-[0-9]{2}-[0-9]{2}|2022-[0-9]{2}-[0-9]{2}|2025-[0-9]{2}-[0-9]{2}' "$ROOT/output"
          python "$ROOT/infra/fx2_infra.py" archive --input "$ROOT/output" --output "$ROOT/usdjpy-hyp036-dukas-native-development-v1.zip" --source-sha '${{ steps.init.outputs.sha }}' --run-id "$GITHUB_RUN_ID" --classification scientific > "$ROOT/evidence/archive_build.json"
          python "$ROOT/infra/fx2_infra.py" readback --archive "$ROOT/usdjpy-hyp036-dukas-native-development-v1.zip" > "$ROOT/evidence/archive_readback.json"
          jq -e '.status=="PASS"' "$ROOT/evidence/archive_readback.json"
      - name: Upload immutable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usdjpy-hyp036-dukas-native-development-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.init.outputs.root }}/output
            ${{ steps.init.outputs.root }}/evidence
            ${{ steps.init.outputs.root }}/usdjpy-hyp036-dukas-native-development-v1.zip
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
