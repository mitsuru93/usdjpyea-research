name: FX2 EURUSD 2024 Release-mirror Artifact Purge v1
on:
  issues:
    types: [opened]
permissions:
  actions: write
  contents: read
  issues: write
concurrency:
  group: fx2-eurusd-2024-release-mirror-purge
  cancel-in-progress: true
jobs:
  purge:
    if: >-
      github.actor == github.repository_owner &&
      (github.event.issue.title == '[FX2-EURUSD-2024-RELEASE-MIRROR-PURGE] DRY-RUN' ||
       github.event.issue.title == '[FX2-EURUSD-2024-RELEASE-MIRROR-PURGE] APPLY')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Parse request
        id: req
        env:
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os,re
          title=os.environ['TITLE'];body=os.environ.get('BODY','')
          mode='apply' if title.endswith('APPLY') else 'dry-run'
          def v(n,d=''):
            m=re.search(rf'^\s*{re.escape(n)}:\s*(\S+)\s*$',body,re.I|re.M);return m.group(1) if m else d
          digest=v('candidate_digest');maxd=int(v('max_deletions','20'));maxb=int(v('max_bytes','2000000000'))
          if not 1<=maxd<=20 or not 1<=maxb<=2_000_000_000:raise SystemExit('invalid safety cap')
          if mode=='apply' and not re.fullmatch(r'[0-9a-f]{64}',digest):raise SystemExit('APPLY requires candidate_digest')
          print(f'mode={mode}');print(f'digest={digest}');print(f'maxd={maxd}');print(f'maxb={maxb}')
          PY
      - name: Validate controller
        run: python3 -m py_compile tools/fx2_release_backed_artifact_purge_v1.py tools/fx2_release_backed_artifact_purge_v3.py tools/fx2_eurusd_2024_release_mirror_purge_v1.py
      - name: Inspect and optionally delete
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(--mode '${{ steps.req.outputs.mode }}' --repository "$GITHUB_REPOSITORY" --root "$GITHUB_WORKSPACE" --max-deletions '${{ steps.req.outputs.maxd }}' --max-bytes '${{ steps.req.outputs.maxb }}' --receipt "$RUNNER_TEMP/receipt.json" --report "$RUNNER_TEMP/report.md")
          if [ '${{ steps.req.outputs.mode }}' = apply ]; then args+=(--expected-candidate-digest '${{ steps.req.outputs.digest }}'); fi
          python3 tools/fx2_eurusd_2024_release_mirror_purge_v1.py "${args[@]}"
      - name: Publish receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f "$RUNNER_TEMP/report.md" ]; then gh issue comment '${{ github.event.issue.number }}' --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/report.md"; cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"; else gh issue comment '${{ github.event.issue.number }}' --repo "$GITHUB_REPOSITORY" --body "EURUSD 2024 Release-mirror purge failed before receipt production. No deletion should be assumed."; fi
          rm -f "$RUNNER_TEMP/receipt.json" "$RUNNER_TEMP/report.md"
