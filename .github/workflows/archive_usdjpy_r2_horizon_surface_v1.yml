name: Archive Accepted USDJPY R2 Horizon Surface v1

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  archive:
    if: github.event.issue.title == '[R2] Archive accepted horizon surface v1'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record run
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh issue comment "${ISSUE_NUMBER}" --repo "${REPOSITORY}" --body "R2 archive started. Run ID: ${{ github.run_id }}."

      - name: Download and verify accepted artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p release_assets inspection
          asset='release_assets/usdjpy-r2-horizon-surface-v1-run-29646040010-artifact-8430064217.zip'
          gh api "repos/${REPOSITORY}/actions/artifacts/8430064217/zip" > "${asset}"
          echo '84a495b7c7cddf1c719bb4c8ce78bfef2c990b355649d362c18481836d953426  '"${asset}" | sha256sum -c -
          unzip -q "${asset}" -d inspection
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          root=Path('inspection')
          acceptance=json.loads((root/'r2_acceptance.json').read_text())
          metadata=json.loads((root/'run_metadata.json').read_text())
          assert acceptance['status']=='PASS'
          assert all(value is True for key,value in acceptance.items() if key!='status')
          assert metadata['status']=='PASS'
          assert metadata['trade_rows']==383078
          assert metadata['h2_rows_parsed']==0
          assert metadata['2025_artifact_access'] is False
          assert metadata['selection_or_promotion_made'] is False
          assert metadata['legacy_reference_cross_month_rows_excluded']==5
          assert metadata['legacy_horizon_regressions_passed'] is True
          assert len(pd.read_csv(root/'candidate_horizon_summary.csv'))==660
          assert len(pd.read_csv(root/'candidate_horizon_monthly.csv'))==3960
          assert len(pd.read_csv(root/'candidate_horizon_direction.csv'))==1320
          regression=pd.read_csv(root/'legacy_horizon_regression.csv')
          assert len(regression)==117 and regression['passed'].all()
          print({'R2_archive_input':'PASS'})
          PY

      - name: Write manifest and checksums
        run: |
          set -euo pipefail
          cat > release_assets/usdjpy-r2-horizon-surface-v1-manifest.json <<'JSON'
          {
            "version": "v1",
            "repository": "mitsuru93/usdjpyea-research",
            "release_tag": "usdjpy-r2-horizon-surface-v1",
            "accepted_run_id": 29646040010,
            "accepted_head_sha": "314f286c0878b72a0f2ee2250eaa0e21ef558188",
            "actions_artifact_id": 8430064217,
            "actions_artifact_name": "usdjpy-r2-horizon-surface-final-v1-29646040010",
            "actions_artifact_sha256": "84a495b7c7cddf1c719bb4c8ce78bfef2c990b355649d362c18481836d953426",
            "r2_status": "PASS",
            "acceptance_checks": 25,
            "candidates": 60,
            "horizons": 11,
            "surface_combinations": 660,
            "trade_rows": 383078,
            "monthly_rows": 3960,
            "direction_rows": 1320,
            "historical_regression_rows": 117,
            "legacy_reference_cross_month_rows_excluded": 5,
            "zero_trade_candidates": 0,
            "candidate_horizon_trades_sha256": "70c2313147607096976a76328b72a628e42fa0001816f14824bcd9e9a3ead6c6",
            "r2_acceptance_sha256": "c1e37ec8721e9a0617d20da646fea11e8373c4c4cdbf8b64dea523d3950dca46",
            "run_metadata_sha256": "0593225bc449d8558a7f9acbfada4138a38e952b3672700eceb7e92a9c42e066",
            "h2_rows_parsed": 0,
            "2025_artifact_access": false,
            "selection_or_promotion_made": false,
            "R3_unblocked": true,
            "Core_promotion": false,
            "MT4_promotion": false
          }
          JSON
          (cd release_assets && sha256sum * > SHA256SUMS)

      - name: Create and verify Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: usdjpy-r2-horizon-surface-v1
        run: |
          set -euo pipefail
          if gh release view "${TAG}" --repo "${REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release_assets/* --repo "${REPOSITORY}" --clobber
          else
            gh release create "${TAG}" release_assets/* --repo "${REPOSITORY}" --title 'USDJPY R2 Fixed-Horizon Surface v1' --notes 'Accepted R2 run 29646040010. Complete 60 by 11 H1 surface; 117 projected historical regressions passed; no selection; no H2 or 2025 access.' --latest=false
          fi
          gh release view "${TAG}" --repo "${REPOSITORY}" --json tagName,url,isDraft,isPrerelease,assets > release_receipt.json
          python - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path('release_receipt.json').read_text())
          assets={row['name']:row for row in receipt['assets']}
          assert receipt['tagName']=='usdjpy-r2-horizon-surface-v1'
          assert receipt['isDraft'] is False and receipt['isPrerelease'] is False
          assert set(assets)=={
              'usdjpy-r2-horizon-surface-v1-run-29646040010-artifact-8430064217.zip',
              'usdjpy-r2-horizon-surface-v1-manifest.json',
              'SHA256SUMS',
          }
          assert assets['usdjpy-r2-horizon-surface-v1-run-29646040010-artifact-8430064217.zip']['digest']=='sha256:84a495b7c7cddf1c719bb4c8ce78bfef2c990b355649d362c18481836d953426'
          print({'release':'PASS','assets':3})
          PY

      - name: Commit receipt and remove workflow
        run: |
          set -euo pipefail
          target='docs/research_reboot/artifact_archives/usdjpy_r2_horizon_surface_v1'
          mkdir -p "${target}"
          cp release_receipt.json "${target}/release_receipt.json"
          cp release_assets/usdjpy-r2-horizon-surface-v1-manifest.json "${target}/artifact_manifest.json"
          cp release_assets/SHA256SUMS "${target}/SHA256SUMS"
          rm -f .github/workflows/archive_usdjpy_r2_horizon_surface_v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: archive accepted USDJPY R2 horizon surface v1'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Close issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh issue comment "${ISSUE_NUMBER}" --repo "${REPOSITORY}" --body 'Accepted R2 artifact archived at Release usdjpy-r2-horizon-surface-v1 and receipt committed.'
          gh issue close "${ISSUE_NUMBER}" --repo "${REPOSITORY}" --reason completed
