name: Run Research Timing Study

on:
  workflow_dispatch:
    inputs:
      study_config:
        description: Study config YAML path
        required: true
        default: configs/studies/cloud_timing_rv_close_confirm_first.yaml
        type: string
      dataset_id:
        description: Optional dataset_id override for all runs
        required: false
        default: ''
        type: string
      output_tag:
        description: Optional output tag under study output_root
        required: false
        default: ''
        type: string

jobs:
  run-timing-study:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check study config
        run: python tools/check_research_env.py --study-config "${{ inputs.study_config }}"

      - name: Run study
        run: |
          DATASET_ARGS=""
          if [ -n "${{ inputs.dataset_id }}" ]; then
            DATASET_ARGS="--dataset-id ${{ inputs.dataset_id }}"
          fi

          TAG_ARGS=""
          if [ -n "${{ inputs.output_tag }}" ]; then
            TAG_ARGS="--output-tag ${{ inputs.output_tag }}"
          fi

          python tools/run_study.py --config "${{ inputs.study_config }}" $DATASET_ARGS $TAG_ARGS

      - name: Generate timing review
        run: |
          STUDY_DIR=$(python - <<'PY'
          from pathlib import Path
          import yaml
          from research.orchestration.path_utils import sanitize_label

          cfg_path = Path("${{ inputs.study_config }}")
          cfg = yaml.safe_load(cfg_path.read_text(encoding="utf-8")) or {}
          output_root = Path(cfg["output_root"])
          tag = "${{ inputs.output_tag }}".strip()
          if tag:
              output_root = output_root / sanitize_label(tag)
          print(output_root)
          PY
          )

          python tools/review_timing_study.py --study-dir "$STUDY_DIR"
          echo "STUDY_DIR=$STUDY_DIR" >> "$GITHUB_ENV"

      - name: Upload study artifacts
        uses: actions/upload-artifact@v4
        with:
          name: timing-study-${{ github.run_id }}
          path: |
            ${{ env.STUDY_DIR }}/runs
            ${{ env.STUDY_DIR }}/compare
            ${{ env.STUDY_DIR }}/study_metadata.yaml
            ${{ env.STUDY_DIR }}/study_summary.md
