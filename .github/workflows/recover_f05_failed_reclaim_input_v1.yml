name: Recover F05 failed reclaim input v1

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-input:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/f05-failed-reclaim-input-recovery-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Enforce recovery-only boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          marker = json.loads(Path('configs/research/f05_failed_reclaim_input_recovery_marker_v1.json').read_text())
          assert marker['status'] == 'INPUT_RECOVERY_ONLY_NO_OUTCOMES'
          assert marker['binding_candidate'] == 'F05_FAILED_RECLAIM_BASIC_V1'
          assert marker['non_binding_sensitivity'] == 'F05_FAILED_RECLAIM_WEAK_QUICK_V1'
          assert marker['candidate_count'] == 2
          assert marker['binding_candidate_count'] == 1
          for key in ('outcomes_computed', 'candidate_outcomes_computed', 'portfolio_replay_computed', '2025_accessed', 'mt4_accessed', 'notion_task_dependency', 'new_hypothesis_id_created', 'candidate_substitution_allowed'):
              assert marker['boundaries'][key] is False, key
          PY

      - name: Extract and audit durable source package
        shell: bash
        run: |
          set -u
          mkdir -p recovery/extracted recovery/decoded
          cat > recovery/boundaries.txt <<'EOF'
          outcomes_computed=false
          candidate_outcomes_computed=false
          portfolio_replay_computed=false
          2025_accessed=false
          mt4_accessed=false
          notion_task_dependency=false
          EOF
          python - <<'PY' > recovery/audit_stdout.log 2> recovery/audit_stderr.log
          import gzip
          import hashlib
          import json
          import shutil
          import tarfile
          import traceback
          import zipfile
          from pathlib import Path

          package = Path('.stage2_lifecycle_abc_package_v1.tar.gz')
          recovery = Path('recovery')
          extracted = recovery / 'extracted'
          decoded = recovery / 'decoded'
          errors = []
          records = []
          matches = []
          target_terms = tuple(s.lower() for s in (
              'event_sequence_features',
              'basic_failed_reclaim',
              'refined_failed_reclaim',
              'refined_failed_reclaim_fold_direction_metrics',
              'refined_failed_reclaim_stopped_trades',
              'natural_family_grid',
              'natural_family_lofo',
              'refined_breadth_metrics',
              '2024_tick_first5_sensitivity',
              'F05_FAILED_RECLAIM',
              'failed_reclaim',
              'failed reclaim',
          ))

          def sha_file(path: Path):
              h = hashlib.sha256()
              size = 0
              with path.open('rb') as fh:
                  while True:
                      chunk = fh.read(1024 * 1024)
                      if not chunk:
                          break
                      h.update(chunk)
                      size += len(chunk)
              return h.hexdigest(), size

          def target_hit(name: str, prefix: bytes):
              low_name = name.lower()
              low_prefix = prefix.lower()
              return any(term in low_name or term.encode() in low_prefix for term in target_terms)

          status = {
              'package_exists': package.is_file(),
              'package_extract_ok': False,
              'outcomes_computed': False,
              '2025_accessed': False,
              'mt4_accessed': False,
          }
          try:
              if not package.is_file():
                  raise FileNotFoundError(str(package))
              shutil.copy2(package, recovery / 'source_package.tar.gz')
              package_sha, package_size = sha_file(package)
              status['package_sha256'] = package_sha
              status['package_size'] = package_size
              with tarfile.open(package, 'r:gz') as tf:
                  members = tf.getmembers()
                  (recovery / 'source_package_file_list.txt').write_text(
                      ''.join(f'{m.name}\t{m.size}\t{m.type!r}\n' for m in members), encoding='utf-8'
                  )
                  tf.extractall(extracted, filter='data')
              status['package_extract_ok'] = True
          except Exception as exc:
              errors.append({'stage': 'package_extract', 'type': type(exc).__name__, 'message': str(exc), 'traceback': traceback.format_exc()})

          for path in sorted(p for p in extracted.rglob('*') if p.is_file()):
              rel = path.relative_to(extracted).as_posix()
              try:
                  sha, size = sha_file(path)
                  with path.open('rb') as fh:
                      prefix = fh.read(20_000_000)
                  rec = {'path': rel, 'size': size, 'sha256': sha, 'kind': 'filesystem'}
                  records.append(rec)
                  if target_hit(rel, prefix):
                      matches.append(rec)
              except Exception as exc:
                  errors.append({'stage': 'filesystem_inventory', 'path': rel, 'type': type(exc).__name__, 'message': str(exc)})
                  continue

              if path.suffix.lower() == '.gz':
                  try:
                      out = decoded / (rel.replace('/', '__') + '.decoded')
                      out.parent.mkdir(parents=True, exist_ok=True)
                      with gzip.open(path, 'rb') as src, out.open('wb') as dst:
                          shutil.copyfileobj(src, dst, length=1024 * 1024)
                      dsha, dsize = sha_file(out)
                      with out.open('rb') as fh:
                          dprefix = fh.read(20_000_000)
                      drec = {'path': rel + '::gzip_payload', 'decoded_path': out.relative_to(recovery).as_posix(), 'size': dsize, 'sha256': dsha, 'kind': 'gzip'}
                      records.append(drec)
                      if target_hit(rel, dprefix):
                          matches.append(drec)
                  except Exception as exc:
                      errors.append({'stage': 'gzip_decode', 'path': rel, 'type': type(exc).__name__, 'message': str(exc)})

              try:
                  if zipfile.is_zipfile(path):
                      with zipfile.ZipFile(path) as zf:
                          for name in sorted(zf.namelist()):
                              if name.endswith('/'):
                                  continue
                              payload = zf.read(name)
                              zrec = {'path': rel + '::zip::' + name, 'size': len(payload), 'sha256': hashlib.sha256(payload).hexdigest(), 'kind': 'zip'}
                              records.append(zrec)
                              if target_hit(name, payload[:20_000_000]):
                                  matches.append(zrec)
              except Exception as exc:
                  errors.append({'stage': 'zip_inventory', 'path': rel, 'type': type(exc).__name__, 'message': str(exc)})

          status['record_count'] = len(records)
          status['target_match_count'] = len(matches)
          status['error_count'] = len(errors)
          (recovery / 'recursive_inventory.json').write_text(json.dumps(records, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          (recovery / 'target_matches.json').write_text(json.dumps(matches, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          (recovery / 'audit_errors.json').write_text(json.dumps(errors, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          (recovery / 'recovery_status.json').write_text(json.dumps(status, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(status, sort_keys=True))
          PY
          audit_rc=$?
          printf '%s\n' "$audit_rc" > recovery/audit_exit_code.txt
          find recovery/extracted -type f -printf '%P\t%s\n' 2>/dev/null | sort > recovery/extracted_file_sizes.tsv || true
          find recovery/extracted -type f -print0 2>/dev/null | sort -z | xargs -0 -r sha256sum > recovery/extracted_SHA256SUMS || true
          exit 0

      - name: Upload input-recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f05-failed-reclaim-input-recovery-v1
          path: recovery
          if-no-files-found: error
          retention-days: 14
