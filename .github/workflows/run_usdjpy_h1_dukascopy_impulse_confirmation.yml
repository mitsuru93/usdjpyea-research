name: Run USDJPY H1 Dukascopy Impulse Confirmation

on:
  workflow_dispatch:

concurrency:
  group: usdjpy-h1-dukascopy-impulse-confirmation
  cancel-in-progress: false

jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install pandas

      - name: Compile confirmation tool
        run: |
          python -m py_compile tools/analyze_usdjpy_dukascopy_impulse_confirmation.py

      - name: Download January baseline
        uses: actions/download-artifact@v4
        with:
          name: fx-session-baseline-2024-01-USDJPY-29307131333
          path: data/baselines/2024-01
          run-id: 29307131333
          github-token: ${{ github.token }}

      - name: Download February baseline
        uses: actions/download-artifact@v4
        with:
          name: fx-session-baseline-2024-02-USDJPY-29383810487
          path: data/baselines/2024-02
          run-id: 29383810487
          github-token: ${{ github.token }}

      - name: Download March baseline
        uses: actions/download-artifact@v4
        with:
          name: fx-session-baseline-2024-03-USDJPY-29421329471
          path: data/baselines/2024-03
          run-id: 29421329471
          github-token: ${{ github.token }}

      - name: Download April baseline
        uses: actions/download-artifact@v4
        with:
          name: fx-session-baseline-2024-04-USDJPY-29455059447
          path: data/baselines/2024-04
          run-id: 29455059447
          github-token: ${{ github.token }}

      - name: Download May baseline
        uses: actions/download-artifact@v4
        with:
          name: fx-session-baseline-2024-05-USDJPY-29469227483
          path: data/baselines/2024-05
          run-id: 29469227483
          github-token: ${{ github.token }}

      - name: Download June baseline
        uses: actions/download-artifact@v4
        with:
          name: fx-session-baseline-2024-06-USDJPY-29475803893
          path: data/baselines/2024-06
          run-id: 29475803893
          github-token: ${{ github.token }}

      - name: Download January source bars
        uses: actions/download-artifact@v4
        with:
          pattern: public-fx-data-pilot-2024-01-USDJPY-d*-29189903048
          path: data/source/2024-01
          merge-multiple: true
          run-id: 29189903048
          github-token: ${{ github.token }}

      - name: Download February source bars
        uses: actions/download-artifact@v4
        with:
          pattern: public-fx-data-pilot-2024-02-USDJPY-d*-29329511595
          path: data/source/2024-02
          merge-multiple: true
          run-id: 29329511595
          github-token: ${{ github.token }}

      - name: Download March source bars
        uses: actions/download-artifact@v4
        with:
          pattern: public-fx-data-pilot-2024-03-USDJPY-d*-29386417671
          path: data/source/2024-03
          merge-multiple: true
          run-id: 29386417671
          github-token: ${{ github.token }}

      - name: Download April source bars
        uses: actions/download-artifact@v4
        with:
          pattern: public-fx-data-pilot-2024-04-USDJPY-d*-29423451609
          path: data/source/2024-04
          merge-multiple: true
          run-id: 29423451609
          github-token: ${{ github.token }}

      - name: Download May source bars
        uses: actions/download-artifact@v4
        with:
          pattern: public-fx-data-pilot-2024-05-USDJPY-d*-29455212697
          path: data/source/2024-05
          merge-multiple: true
          run-id: 29455212697
          github-token: ${{ github.token }}

      - name: Download June source bars
        uses: actions/download-artifact@v4
        with:
          pattern: public-fx-data-pilot-2024-06-USDJPY-d*-29469210771
          path: data/source/2024-06
          merge-multiple: true
          run-id: 29469210771
          github-token: ${{ github.token }}

      - name: Confirm impulse condition on Dukascopy bars
        run: |
          python tools/analyze_usdjpy_dukascopy_impulse_confirmation.py \
            --baseline 2024-01=data/baselines/2024-01 \
            --baseline 2024-02=data/baselines/2024-02 \
            --baseline 2024-03=data/baselines/2024-03 \
            --baseline 2024-04=data/baselines/2024-04 \
            --baseline 2024-05=data/baselines/2024-05 \
            --baseline 2024-06=data/baselines/2024-06 \
            --bars 2024-01=data/source/2024-01 \
            --bars 2024-02=data/source/2024-02 \
            --bars 2024-03=data/source/2024-03 \
            --bars 2024-04=data/source/2024-04 \
            --bars 2024-05=data/source/2024-05 \
            --bars 2024-06=data/source/2024-06 \
            --event-date 2024-04-29 \
            --event-date 2024-05-01 \
            --event-date 2024-05-02 \
            --output-dir data/experiments/usdjpy_h1_dukascopy_impulse_confirmation_v1

      - name: Write result summary
        if: always()
        run: |
          echo "# USDJPY H1 Dukascopy Impulse Confirmation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Source-bar coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```csv' >> "$GITHUB_STEP_SUMMARY"
          cat data/experiments/usdjpy_h1_dukascopy_impulse_confirmation_v1/source_bar_coverage.csv >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Monthly result" >> "$GITHUB_STEP_SUMMARY"
          echo '```csv' >> "$GITHUB_STEP_SUMMARY"
          cat data/experiments/usdjpy_h1_dukascopy_impulse_confirmation_v1/impulse_monthly.csv >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat data/experiments/usdjpy_h1_dukascopy_impulse_confirmation_v1/summary.json >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload confirmation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usdjpy-h1-dukascopy-impulse-confirmation-${{ github.run_id }}
          path: data/experiments/usdjpy_h1_dukascopy_impulse_confirmation_v1/**
          if-no-files-found: error
          retention-days: 30
