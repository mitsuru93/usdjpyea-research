name: Audit EURUSD 2024 Raw Tick Release Authority v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize_eurusd_2024_raw_ticks_from_runs_v1.yml
      - tools/build_eurusd_2024_raw_tick_annual_release_v1.py

permissions:
  contents: read

concurrency:
  group: audit-eurusd-2024-raw-tick-release-authority-v2
  cancel-in-progress: true

env:
  RELEASE_TAG: eurusd-2024-raw-bidask-ticks-v1

jobs:
  audit-release-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate complete immutable Release inventory
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/eurusd-2024-release-audit-$GITHUB_RUN_ID"
          rm -rf "$root"
          mkdir -p "$root"
          gh api "/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$root/release.json"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$root" \
            --pattern 'SHA256SUMS' \
            --pattern 'eurusd-2024-raw-ticks-v1.annual-manifest.json' \
            --pattern 'RELEASE_NOTES.md'
          python3 - "$root" <<'PY'
          import hashlib,json,re,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          release=json.loads((root/'release.json').read_text())
          assert release['tag_name']=='eurusd-2024-raw-bidask-ticks-v1'
          assert not release['draft'] and not release['prerelease']
          assets=release['assets']
          expected={f'eurusd-2024-{m:02d}-raw-ticks-v1.{suffix}' for m in range(1,13) for suffix in ('tar.gz','manifest.json','SHA256SUMS')}
          expected|={f'eurusd-2024-{m:02d}-source-artifacts.json' for m in range(1,13)}
          expected|={'eurusd-2024-raw-ticks-v1.annual-manifest.json','RELEASE_NOTES.md','SHA256SUMS'}
          names={a['name'] for a in assets}
          if names!=expected: raise SystemExit(f'Release inventory mismatch missing={sorted(expected-names)} extra={sorted(names-expected)}')
          identities=[]
          for asset in assets:
              digest=str(asset.get('digest') or '')
              if asset.get('state')!='uploaded' or int(asset.get('size') or 0)<=0 or not re.fullmatch(r'sha256:[0-9a-f]{64}',digest):
                  raise SystemExit(f'invalid Release asset: {asset.get("name")}')
              identities.append({'id':asset['id'],'name':asset['name'],'size':asset['size'],'digest':digest})
          annual=json.loads((root/'eurusd-2024-raw-ticks-v1.annual-manifest.json').read_text())
          assert annual['accepted'] is True
          assert annual['expected_days']==366 and annual['expected_hours']==8784 and annual['resolved_hours']==8784
          assert annual['package_workflow_run_id']==29791402217
          assert annual['source_workflow_run_id']==29749870784
          checksum=(root/'SHA256SUMS').read_text().splitlines()
          listed={line.split(None,1)[1].lstrip(' *') for line in checksum if line.strip()}
          if listed!=expected-{'SHA256SUMS'}: raise SystemExit('aggregate SHA256SUMS inventory mismatch')
          receipt={
            'schema_version':'eurusd_2024_release_authority_audit_v2',
            'status':'PASS_RELEASE_AUTHORITY',
            'release_id':release['id'],
            'release_tag':release['tag_name'],
            'published_at':release['published_at'],
            'asset_count':len(assets),
            'asset_identity_sha256':hashlib.sha256(json.dumps(sorted(identities,key=lambda x:x['name']),sort_keys=True,separators=(',',':')).encode()).hexdigest(),
            'annual_manifest_sha256':hashlib.sha256((root/'eurusd-2024-raw-ticks-v1.annual-manifest.json').read_bytes()).hexdigest(),
            'source_artifact_ids':[8477498593,8477440645,8477367327,8477474051,8477507450,8480213791,8478305114,8478602440,8478903697,8479255289,8479395926,8479506330,8480394478],
            'actions_retention_dependency':False,
          }
          (root/'audit-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps(receipt,sort_keys=True))
          PY
          cat "$root/audit-receipt.json" >> "$GITHUB_STEP_SUMMARY"
          rm -rf "$root"
