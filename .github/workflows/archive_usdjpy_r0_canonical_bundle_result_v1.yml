name: Archive Accepted USDJPY R0 Canonical Result v1

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: archive-usdjpy-r0-canonical-result-v1
  cancel-in-progress: false

jobs:
  archive:
    if: github.event_name != 'issues' || github.event.issue.title == '[R0] Archive accepted canonical bundle v1'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record run ID
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh issue comment "${ISSUE_NUMBER}" --repo "${REPOSITORY}" \
            --body "Canonical result archive started. Run ID: ${{ github.run_id }}. https://github.com/${REPOSITORY}/actions/runs/${{ github.run_id }}"

      - name: Download and verify accepted Actions artifact ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ARTIFACT_ID: "8428199309"
          EXPECTED_SHA256: "d67db9b051a03050ddedb720d407b73cb48c5eacf7a441b1b8ff98dd77dc2015"
        run: |
          set -euo pipefail
          mkdir -p release_assets
          asset="release_assets/usdjpy-r0-canonical-2024-v1-run-29639548804-artifact-8428199309.zip"
          gh api "repos/${REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > "${asset}"
          actual="$(sha256sum "${asset}" | awk '{print $1}')"
          test "${actual}" = "${EXPECTED_SHA256}"
          unzip -t "${asset}" >/dev/null

      - name: Write frozen manifest and checksums
        run: |
          set -euo pipefail
          cat > release_assets/usdjpy-r0-canonical-2024-v1-manifest.json <<'JSON'
          {
            "version": "v1",
            "repository": "mitsuru93/usdjpyea-research",
            "release_tag": "usdjpy-r0-canonical-2024-v1",
            "accepted_run_id": 29639548804,
            "accepted_head_sha": "2d88fb846bbe77e256ee37abdf1dcbb462e3ebe4",
            "actions_artifact_id": 8428199309,
            "actions_artifact_name": "usdjpy-r0-canonical-2024-v1-29639548804",
            "actions_artifact_sha256": "d67db9b051a03050ddedb720d407b73cb48c5eacf7a441b1b8ff98dd77dc2015",
            "release_asset": "usdjpy-r0-canonical-2024-v1-run-29639548804-artifact-8428199309.zip",
            "r0_status": "PASS",
            "acceptance_checks": 20,
            "release_input_tag": "usdjpy-r0-artifact-archive-2024-v1",
            "canonical_manifest_sha256": "38991daed90f836217af7d871a5799d8645dc7738cb9e5bf93a7e4ace2b71cf6",
            "r0_acceptance_sha256": "f3b523ca6ec27f2ed658801479778369cef9720ff4383f1f10878baf54623cf8",
            "canonical_gzip_sha256": {
              "M1": "bd2d2643191e79a2655c5703e861ead23bee547e8c94a55a8f1582237a735722",
              "M5": "65ab9d3d9b830a169058010fd5ca06249330631b4522efb56e838807890e431b",
              "M15": "1566b9d0497f3a2aa156868144d31b89721fca48329feaf82035826ada7ee25c",
              "H1": "235cae3c81c3c9e33d08dc670cd6beb2a4a2a220f1b55626a0df4d575f8ce5bb"
            },
            "h1_normalized_ledger_sha256": "98f67e110cb641263b629234b1b0401ece3a613f695f6c829bd007cc231894f8",
            "h2_normalized_ledger_sha256": "e4eca229dc886abd239dc9a424a0ca7c2414f87acb761da952e11ab39a07ba04",
            "h2_decision": "neither_advances",
            "core_promotion": false,
            "mt4_promotion": false,
            "r1_unblocked": true,
            "2025_artifact_access": false
          }
          JSON
          (
            cd release_assets
            sha256sum \
              usdjpy-r0-canonical-2024-v1-run-29639548804-artifact-8428199309.zip \
              usdjpy-r0-canonical-2024-v1-manifest.json \
              > SHA256SUMS
          )

      - name: Create or update durable Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: usdjpy-r0-canonical-2024-v1
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          # USDJPY R0 Canonical 2024 Bundle v1

          Durable copy of accepted R0 run 29639548804 and Actions artifact 8428199309.

          R0 passed all twenty acceptance checks. R1 is unblocked but not started. Core and MT4 remain closed. No 2025 artifact was accessed.
          EOF
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release_assets/* --clobber
          else
            gh release create "${TAG}" release_assets/* \
              --title "USDJPY R0 Canonical 2024 Bundle v1" \
              --notes-file release-notes.md \
              --latest=false
          fi

      - name: Verify Release and commit receipt
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: usdjpy-r0-canonical-2024-v1
        run: |
          set -euo pipefail
          gh release view "${TAG}" --json tagName,url,isDraft,isPrerelease,assets > release_receipt.json
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path("release_receipt.json").read_text())
          assets = {row["name"]: row for row in receipt["assets"]}
          expected = {
              "usdjpy-r0-canonical-2024-v1-run-29639548804-artifact-8428199309.zip": "sha256:d67db9b051a03050ddedb720d407b73cb48c5eacf7a441b1b8ff98dd77dc2015",
              "usdjpy-r0-canonical-2024-v1-manifest.json": None,
              "SHA256SUMS": None,
          }
          assert receipt["tagName"] == "usdjpy-r0-canonical-2024-v1", receipt
          assert receipt["isDraft"] is False, receipt
          assert receipt["isPrerelease"] is False, receipt
          assert set(assets) == set(expected), assets
          assert len(assets) == 3, assets
          for name, digest in expected.items():
              assert assets[name]["state"] == "uploaded", assets[name]
              if digest is not None:
                  assert assets[name]["digest"] == digest, assets[name]
          print({"release_verification": "PASS", "assets": len(assets)})
          PY
          git pull --rebase origin main
          target="docs/research_reboot/artifact_archives/usdjpy_r0_canonical_2024_v1"
          mkdir -p "${target}"
          cp release_receipt.json "${target}/release_receipt.json"
          cp release_assets/usdjpy-r0-canonical-2024-v1-manifest.json "${target}/artifact_manifest.json"
          cp release_assets/SHA256SUMS "${target}/SHA256SUMS"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${target}"
          if ! git diff --cached --quiet; then
            git commit -m "docs: record durable R0 canonical result archive"
            git push origin main
          fi

      - name: Close successful trigger issue
        if: github.event_name == 'issues' && success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh issue comment "${ISSUE_NUMBER}" --repo "${REPOSITORY}" \
            --body "Accepted R0 canonical artifact archived at Release tag usdjpy-r0-canonical-2024-v1. Original artifact digest matched and receipt was committed."
          gh issue close "${ISSUE_NUMBER}" --repo "${REPOSITORY}" --reason completed

      - name: Upload archive audit copy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usdjpy-r0-canonical-release-audit-v1-${{ github.run_id }}
          path: |
            release_assets/usdjpy-r0-canonical-2024-v1-manifest.json
            release_assets/SHA256SUMS
            release_receipt.json
          if-no-files-found: warn
          retention-days: 90
