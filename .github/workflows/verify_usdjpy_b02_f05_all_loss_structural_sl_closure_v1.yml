name: Verify USDJPY B02 F05 Structural SL Closure v1

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '.github/workflows/verify_usdjpy_b02_f05_all_loss_structural_sl_closure_v1.yml'
      - 'configs/research/usdjpy_b02_f05_all_loss_structural_sl_result_v1.json'
      - 'configs/research/usdjpy_b02_f05_all_loss_structural_sl_execution_receipt_v1.json'
      - 'configs/research/usdjpy_b02_f05_all_loss_structural_sl_event_summary_v1.csv'
      - 'configs/research/usdjpy_b02_f05_all_loss_structural_sl_output_manifest_v1.json'
      - 'docs/research/USDJPY_B02_F05_all_loss_structural_SL_v1.md'
      - 'tools/verify_usdjpy_b02_f05_all_loss_structural_sl_closure_v1.py'
  push:
    branches: [main]
    paths:
      - 'configs/research/usdjpy_b02_f05_all_loss_structural_sl_result_v1.json'
      - 'configs/research/usdjpy_b02_f05_all_loss_structural_sl_execution_receipt_v1.json'
      - 'configs/research/usdjpy_b02_f05_all_loss_structural_sl_event_summary_v1.csv'
      - 'configs/research/usdjpy_b02_f05_all_loss_structural_sl_output_manifest_v1.json'
      - 'docs/research/USDJPY_B02_F05_all_loss_structural_SL_v1.md'
      - 'tools/verify_usdjpy_b02_f05_all_loss_structural_sl_closure_v1.py'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify canonical closure package
        run: |
          set -euo pipefail
          python -m py_compile tools/verify_usdjpy_b02_f05_all_loss_structural_sl_closure_v1.py
          python tools/verify_usdjpy_b02_f05_all_loss_structural_sl_closure_v1.py | tee closure_verification_v1.json
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('closure_verification_v1.json').read_text())
          assert result['status']=='PASS_CANONICAL_CLOSURE'
          assert result['trade_count']==1882
          assert result['baseline_loser_count']==916
          assert result['event_count']==7
          assert result['candidate_frozen'] is False
          assert result['mt4_accessed'] is False
          assert result['2025_accessed'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: usdjpy-b02-f05-structural-sl-closure-verification-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: closure_verification_v1.json
          if-no-files-found: error
          retention-days: 90
