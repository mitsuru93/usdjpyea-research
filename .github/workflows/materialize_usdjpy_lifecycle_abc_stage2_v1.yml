name: Materialize USDJPY lifecycle ABC Stage 2 v1

on:
  push:
    branches:
      - agent/usdjpy-lifecycle-abc-prereg-v1
    paths:
      - .stage2_lifecycle_abc_package_v1.tar.gz
      - .github/workflows/materialize_usdjpy_lifecycle_abc_stage2_v1.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/usdjpy-lifecycle-abc-prereg-v1
          fetch-depth: 0
      - name: Materialize atomic Stage 2 package
        shell: bash
        run: |
          set -euo pipefail
          test -s .stage2_lifecycle_abc_package_v1.tar.gz
          tar -xzf .stage2_lifecycle_abc_package_v1.tar.gz
          rm -f .stage2_lifecycle_abc_package_v1.tar.gz
          rm -f .github/workflows/materialize_usdjpy_lifecycle_abc_stage2_v1.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "research: preregister B02 F05 lifecycle ABC evaluation"
          git push origin HEAD:agent/usdjpy-lifecycle-abc-prereg-v1
# trigger-v2
