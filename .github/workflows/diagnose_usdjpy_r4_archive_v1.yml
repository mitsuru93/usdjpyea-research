name: Diagnose USDJPY R4 Archive v1

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  diagnose:
    if: github.event.issue.title == '[Diag] Inspect USDJPY R4 archive v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Report latest archive run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          gh run list --repo "${REPOSITORY}" --workflow archive_usdjpy_r4_entry_horizon_selection_v1.yml --limit 5 --json databaseId,status,conclusion,createdAt,headSha,url > runs.json
          body="$(python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('runs.json').read_text())
          print('```json')
          print(json.dumps(rows,indent=2,sort_keys=True))
          print('```')
          PY
          )"
          gh issue comment "${ISSUE_NUMBER}" --repo "${REPOSITORY}" --body "${body}"
          run_id="$(python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('runs.json').read_text())
          print(rows[0]['databaseId'] if rows else '')
          PY
          )"
          if [ -n "${run_id}" ]; then
            gh run view "${run_id}" --repo "${REPOSITORY}" --json jobs,status,conclusion,url > detail.json
            detail="$(python - <<'PY'
          import json
          from pathlib import Path
          row=json.loads(Path('detail.json').read_text())
          print('```json')
          print(json.dumps(row,indent=2,sort_keys=True))
          print('```')
          PY
            )"
            gh issue comment "${ISSUE_NUMBER}" --repo "${REPOSITORY}" --body "${detail}"
          fi

      - name: Remove diagnostic workflow and close issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          rm -f .github/workflows/diagnose_usdjpy_r4_archive_v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove R4 archive diagnostic workflow'
          git pull --rebase origin main
          git push origin HEAD:main
          gh issue close "${ISSUE_NUMBER}" --repo "${REPOSITORY}" --reason completed
