name: USDJPY Shock Failure Regime Discriminator v1

on:
  pull_request:
    branches: [main]
    paths:
      - 'configs/research/usdjpy_shock_failure_regime_discriminator_prereg_v1.json'
      - 'docs/research/USDJPY_SHOCK_FAILURE_REGIME_DISCRIMINATOR_PROTOCOL_V1.md'
      - 'tools/shock_failure_regime_discriminator_payload_v1.py.gz.b64'
      - 'tools/compare_usdjpy_shock_failure_regime_discriminator_2025_v1.py'
      - '.github/workflows/usdjpy_shock_failure_regime_discriminator_v1.yml'
  push:
    branches: [main]
    paths:
      - 'configs/research/usdjpy_shock_failure_regime_discriminator_prereg_v1.json'
      - 'docs/research/USDJPY_SHOCK_FAILURE_REGIME_DISCRIMINATOR_PROTOCOL_V1.md'
      - 'tools/shock_failure_regime_discriminator_payload_v1.py.gz.b64'
      - 'tools/compare_usdjpy_shock_failure_regime_discriminator_2025_v1.py'
      - '.github/workflows/usdjpy_shock_failure_regime_discriminator_v1.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Materialize and verify frozen evaluator
        run: |
          set -euo pipefail
          payload='tools/shock_failure_regime_discriminator_payload_v1.py.gz.b64'
          target='tools/evaluate_usdjpy_shock_failure_regime_discriminator_v1.py'
          base64 -d "$payload" | gzip -d > "$target"
          echo 'f0d27bc9ffc4e91e092ffa260a97b3b9e8b578c0aca23c00074598b33b9f040a  tools/evaluate_usdjpy_shock_failure_regime_discriminator_v1.py' | sha256sum -c -
          python -m py_compile "$target" tools/compare_usdjpy_shock_failure_regime_discriminator_2025_v1.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install frozen dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==2.1.3' 'pandas==2.2.3' 'scikit-learn==1.5.2'

      - name: Enforce preregistration and period firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p=json.load(open('configs/research/usdjpy_shock_failure_regime_discriminator_prereg_v1.json'))
          assert p['status']=='FROZEN_BEFORE_REGIME_DISCRIMINATOR_OUTCOMES'
          assert p['hypothesis_id']=='USDJPY-HYP-028'
          assert p['development_folds']==['2023H1','2023H2','2024H1','2024H2']
          assert set(p['forbidden_selection_periods'])=={'2025H1','2025H2'}
          assert p['old_candidate_retuning_permitted'] is False
          assert p['profit_then_giveback_exit_optimization_permitted'] is False
          assert p['oracle_label_as_feature_permitted'] is False
          assert len(p['candidate_models'])==3
          PY
          ! grep -nE -- '--(raw|m15|tick)-2025|2025H[12].*(feature|threshold|model|selection)' tools/evaluate_usdjpy_shock_failure_regime_discriminator_v1.py

      - name: Download and verify frozen Phase 2 authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p inputs/phase2 inputs/phase2_pkg
          gh release download usdjpy-csos-shock-failure-phase2-v1 --repo "$GITHUB_REPOSITORY" --dir inputs/phase2 --pattern 'usdjpy-csos-shock-failure-phase2-v1-30206226997-1.zip'
          unzip -q inputs/phase2/usdjpy-csos-shock-failure-phase2-v1-30206226997-1.zip -d inputs/phase2_pkg
          (cd inputs/phase2_pkg/phase2_output && sha256sum -c PACKAGE_SHA256SUMS)
          test "$(zcat inputs/phase2_pkg/phase2_output/candidate_trade_ledger.csv.gz | awk -F, '$2=="B_EXECUTABLE_T0_8BAR"{n++} END{print n+0}')" = 114

      - name: Download and verify accepted M15 authorities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p inputs/history inputs/history2023 inputs/derived2024
          gh release download f05-failed-reclaim-historical-authorities-v1 --repo "$GITHUB_REPOSITORY" --dir inputs/history --pattern 'usdjpy-2023-canonical-baseline-prep-v1.zip' --pattern 'EXPECTED_SHA256SUMS'
          (cd inputs/history && grep 'usdjpy-2023-canonical-baseline-prep-v1.zip' EXPECTED_SHA256SUMS | sha256sum -c -)
          unzip -q inputs/history/usdjpy-2023-canonical-baseline-prep-v1.zip -d inputs/history2023
          echo '4c10ab3244996d73d0955850675231a533f918da09a41ac642c9a3e287b7ac78  inputs/history2023/normalized/usdjpy_2023_m15_bid_utc_rakuten_mt4_v1.csv.gz' | sha256sum -c -
          gh release download usdjpy-2024-derived-bars-v1 --repo "$GITHUB_REPOSITORY" --dir inputs/derived2024 --pattern 'USDJPY-2024-m15-derived-bars-v1.csv.gz'
          echo 'd22a008247e2a8bed49a5169648661ab21eff404a6bc2985bca0c3b5af290020  inputs/derived2024/USDJPY-2024-m15-derived-bars-v1.csv.gz' | sha256sum -c -

      - name: Download and verify 2023 and 2024 Raw Bid Ask Tick authorities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p inputs/raw2023 inputs/raw2024
          gh release download usdjpy-2023-raw-bidask-ticks-v1 --repo "$GITHUB_REPOSITORY" --dir inputs/raw2023 --pattern 'usdjpy-2023-??-raw-ticks-v1.tar.gz' --pattern 'usdjpy-2023-raw-ticks-v1.annual-manifest.json' --pattern 'SHA256SUMS'
          gh release download usdjpy-2024-raw-bidask-ticks-v1 --repo "$GITHUB_REPOSITORY" --dir inputs/raw2024 --pattern 'usdjpy-2024-??-raw-ticks-v1.tar.gz' --pattern 'usdjpy-2024-raw-ticks-v1.annual-manifest.json' --pattern 'SHA256SUMS'
          (cd inputs/raw2023 && grep -E 'usdjpy-2023-(..-raw-ticks-v1\.tar\.gz|raw-ticks-v1\.annual-manifest\.json)$' SHA256SUMS | sha256sum -c -)
          (cd inputs/raw2024 && grep -E 'usdjpy-2024-(..-raw-ticks-v1\.tar\.gz|raw-ticks-v1\.annual-manifest\.json)$' SHA256SUMS | sha256sum -c -)
          test "$(find inputs/raw2023 -name '*.tar.gz' | wc -l)" = 12
          test "$(find inputs/raw2024 -name '*.tar.gz' | wc -l)" = 12

      - name: Execute 2023H1-2024H2 selection study without any 2025 input
        run: |
          set -euo pipefail
          mkdir -p study_output
          python tools/evaluate_usdjpy_shock_failure_regime_discriminator_v1.py \
            --phase2-ledger inputs/phase2_pkg/phase2_output/candidate_trade_ledger.csv.gz \
            --m15-2023 inputs/history2023/normalized/usdjpy_2023_m15_bid_utc_rakuten_mt4_v1.csv.gz \
            --m15-2024 inputs/derived2024/USDJPY-2024-m15-derived-bars-v1.csv.gz \
            --raw-2023 inputs/raw2023 \
            --raw-2024 inputs/raw2024 \
            --prereg configs/research/usdjpy_shock_failure_regime_discriminator_prereg_v1.json \
            --out-dir study_output \
            --research-sha "$GITHUB_SHA" \
            --core-sha '151d84b0dca3fe92a59663f56fd458727de2dbe0' \
            --run-id "$GITHUB_RUN_ID" | tee study_output/run.log
          jq -e '.pass==true and ."2025_loaded"==false and ."2025_used_for_feature_selection"==false and ."2025_used_for_threshold_selection"==false and ."2025_used_for_model_selection"==false' study_output/period_access_receipt.json
          jq -e '.pass==true and .oracle_labels_used_as_predictors==false and .post_entry_mfe_mae_pnl_used_as_predictors==false' study_output/leakage_audit.json

      - name: Download consumed 2025 postmortem only after selection is frozen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f study_output/final_decision.json
          mkdir -p inputs/postmortem2025 inputs/postmortem2025_pkg
          gh release download usdjpy-shock-failure-2025-postmortem-v1-r2 --repo "$GITHUB_REPOSITORY" --dir inputs/postmortem2025 --pattern 'usdjpy-shock-failure-2025-postmortem-v1-r2.tar.gz' --pattern 'RELEASE_SHA256SUMS'
          (cd inputs/postmortem2025 && sha256sum -c RELEASE_SHA256SUMS)
          tar -xzf inputs/postmortem2025/usdjpy-shock-failure-2025-postmortem-v1-r2.tar.gz -C inputs/postmortem2025_pkg
          python tools/compare_usdjpy_shock_failure_regime_discriminator_2025_v1.py \
            --dev-lifecycle study_output/lifecycle_ledger.csv.gz \
            --postmortem-2025-lifecycle inputs/postmortem2025_pkg/mfe_mae_lifecycle.csv \
            --final-decision study_output/final_decision.json \
            --out study_output/development_vs_consumed_2025_class_comparison.csv
          jq -e '.selection_completed_before_2025_comparison==true and ."2025_used_for_feature_threshold_model_or_rule_selection"==false' study_output/development_vs_consumed_2025_class_comparison.json

      - name: Rebuild auditable manifest and package
        run: |
          set -euo pipefail
          cp configs/research/usdjpy_shock_failure_regime_discriminator_prereg_v1.json study_output/preregistration.json
          cp docs/research/USDJPY_SHOCK_FAILURE_REGIME_DISCRIMINATOR_PROTOCOL_V1.md study_output/hypothesis_protocol.md
          cp tools/evaluate_usdjpy_shock_failure_regime_discriminator_v1.py study_output/evaluator_source_snapshot.py
          rm -f study_output/manifest.json study_output/SHA256SUMS
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('study_output'); rows=[]
          for p in sorted(root.iterdir()):
              if p.is_file() and p.name not in {'manifest.json','SHA256SUMS'}:
                  rows.append({'path':p.name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          (root/'manifest.json').write_text(json.dumps({'schema_version':'usdjpy_shock_failure_regime_discriminator_manifest_v1','files':rows},indent=2,sort_keys=True)+'\n')
          rows.append({'path':'manifest.json','bytes':(root/'manifest.json').stat().st_size,'sha256':hashlib.sha256((root/'manifest.json').read_bytes()).hexdigest()})
          (root/'SHA256SUMS').write_text(''.join(f"{r['sha256']}  {r['path']}\n" for r in rows))
          PY
          (cd study_output && sha256sum -c SHA256SUMS)
          zip -q -X -r "usdjpy-shock-failure-regime-discriminator-v1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.zip" study_output

      - name: Upload immutable Actions artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: usdjpy-shock-failure-regime-discriminator-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            study_output
            usdjpy-shock-failure-regime-discriminator-v1-${{ github.run_id }}-${{ github.run_attempt }}.zip
          retention-days: 90
          compression-level: 0

      - name: Comment PR execution receipt
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          status=$(jq -r '.status // "FAILED_BEFORE_DECISION"' study_output/final_decision.json 2>/dev/null || echo FAILED_BEFORE_DECISION)
          selected=$(jq -r '.selected_candidate_id // "NONE"' study_output/final_decision.json 2>/dev/null || echo NONE)
          gh pr comment "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --body "Shock Failure Regime Discriminator execution receipt: run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}; status ${status}; selected ${selected}; artifact ${ARTIFACT_ID}; digest ${ARTIFACT_DIGEST}. Selection evaluator had no 2025 input."

      - name: Archive canonical outputs on main
        if: github.event_name == 'push' && github.ref_name == 'main'
        run: |
          set -euo pipefail
          dst='docs/research/artifact_archives/usdjpy_shock_failure_regime_discriminator_v1'
          rm -rf "$dst"
          mkdir -p "$dst"
          cp -a study_output/. "$dst/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dst"
          git commit -m 'research: archive Shock Failure regime discriminator v1 evidence'
          git push origin HEAD:main

      - name: Publish immutable Release on main
        if: github.event_name == 'push' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='usdjpy-shock-failure-regime-discriminator-v1'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "Immutable Release already exists: $tag" >&2; exit 1; fi
          status=$(jq -r '.status' study_output/final_decision.json)
          selected=$(jq -r '.selected_candidate_id // "NONE"' study_output/final_decision.json)
          target=$(git rev-parse HEAD)
          gh release create "$tag" "usdjpy-shock-failure-regime-discriminator-v1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.zip" --target "$target" --title 'USDJPY Shock Failure Regime Discriminator v1' --notes "USDJPY-HYP-028, development-only 2023H1-2024H2 study. Decision: ${status}; selected candidate: ${selected}. 2025 was consumed comparison evidence only, never a selection input. No production or live authorization." --repo "$GITHUB_REPOSITORY"

      - name: Publish receipt Issue on main
        if: always() && github.event_name == 'push' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          status=$(jq -r '.status // "FAILED_BEFORE_DECISION"' study_output/final_decision.json 2>/dev/null || echo FAILED_BEFORE_DECISION)
          selected=$(jq -r '.selected_candidate_id // "NONE"' study_output/final_decision.json 2>/dev/null || echo NONE)
          cat > receipt.md <<EOF
          ## Canonical completion receipt
          - Hypothesis: `USDJPY-HYP-028`
          - Workflow: `usdjpy_shock_failure_regime_discriminator_v1.yml`
          - Run: `${GITHUB_RUN_ID}` attempt `${GITHUB_RUN_ATTEMPT}`
          - Head / archive commit: `$(git rev-parse HEAD)`
          - Decision: `${status}`
          - Selected candidate: `${selected}`
          - Artifact ID: `${ARTIFACT_ID}`
          - Artifact digest: `${ARTIFACT_DIGEST}`
          - Release: `usdjpy-shock-failure-regime-discriminator-v1`
          - Development: 2023H1-2024H2 only
          - 2025 selection access: false
          - Production/live authorization: false
          EOF
          gh issue create --repo "$GITHUB_REPOSITORY" --title 'USDJPY Shock Failure Regime Discriminator v1 Receipt' --body-file receipt.md
