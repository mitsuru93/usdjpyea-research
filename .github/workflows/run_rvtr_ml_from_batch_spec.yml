name: Run RV/TR ML From Batch Spec

on:
  workflow_dispatch:
    inputs:
      batch_spec:
        description: Batch spec YAML path
        required: true
        default: configs/batches/batch_band_model_screen_v1.yaml
        type: string
      dataset_id:
        description: Optional dataset_id override
        required: false
        default: ''
        type: string
      output_tag:
        description: Optional output_tag override
        required: false
        default: ''
        type: string
      review_issue_number:
        description: Optional review issue number override
        required: false
        default: ''
        type: string
      rvtr_ml_output_subdir:
        description: Optional RV/TR ML output subdir under batch output root
        required: false
        default: rvtr_ml_research
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.expand.outputs.matrix }}
      batch_manifest: ${{ steps.expand.outputs.batch_manifest }}
      batch_runtime_dir: ${{ steps.expand.outputs.batch_runtime_dir }}
      batch_runtime_relpath: ${{ steps.expand.outputs.runtime_bundle_relroot }}
      batch_manifest_relpath: ${{ steps.expand.outputs.batch_manifest_relpath }}
      batch_runtime_artifact_name: ${{ steps.runtime_artifact_meta.outputs.batch_runtime_artifact_name }}
      batch_output_root: ${{ steps.expand.outputs.batch_output_root }}
      batch_id: ${{ steps.expand.outputs.batch_id }}
      dataset_id: ${{ steps.expand.outputs.dataset_id }}
      output_tag: ${{ steps.expand.outputs.output_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Expand batch spec
        id: expand
        run: |
          DATASET_ARGS=""
          if [ -n "${{ inputs.dataset_id }}" ]; then
            DATASET_ARGS="--dataset-id ${{ inputs.dataset_id }}"
          fi

          TAG_ARGS=""
          if [ -n "${{ inputs.output_tag }}" ]; then
            TAG_ARGS="--output-tag ${{ inputs.output_tag }}"
          fi

          python tools/expand_batch.py \
            --batch-spec "${{ inputs.batch_spec }}" \
            $DATASET_ARGS \
            $TAG_ARGS \
            --write-github-output

      - name: Resolve runtime artifact metadata
        id: runtime_artifact_meta
        run: |
          artifact_name="batch-runtime-${{ steps.expand.outputs.batch_id }}-${{ github.run_id }}"

          echo "batch_runtime_artifact_name=${artifact_name}" >> "$GITHUB_OUTPUT"

      - name: Upload batch runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.runtime_artifact_meta.outputs.batch_runtime_artifact_name }}
          path: |
            ${{ github.workspace }}/${{ steps.expand.outputs.runtime_bundle_relroot }}/*

  run-shards:
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download batch runtime bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.batch_runtime_artifact_name }}
          path: ${{ github.workspace }}/.batch_runtime

      - name: Run shard study
        run: |
          STUDY_CONFIG_PATH="${{ github.workspace }}/.batch_runtime/${{ matrix.study_config_relpath }}"
          STUDY_OUTPUT_PATH="${{ needs.prepare.outputs.batch_output_root }}/${{ matrix.study_output_relpath }}"
          python tools/run_study.py --config "${STUDY_CONFIG_PATH}"
          python tools/review_timing_study.py --study-dir "${STUDY_OUTPUT_PATH}"

      - name: Upload shard artifacts
        run: |
          SHARD_SRC="${{ needs.prepare.outputs.batch_output_root }}/${{ matrix.study_output_relpath }}"
          SHARD_DST="batch_artifacts/${{ matrix.shard_runtime_relpath }}"
          mkdir -p "${SHARD_DST}"

          # Aggregate only needs study_metadata + select per-run summary/candidate files.
          if [ -f "${SHARD_SRC}/study_metadata.yaml" ]; then
            cp "${SHARD_SRC}/study_metadata.yaml" "${SHARD_DST}/study_metadata.yaml"
          fi

          if [ -d "${SHARD_SRC}/runs" ]; then
            find "${SHARD_SRC}/runs" -mindepth 1 -maxdepth 1 -type d | while read -r run_dir; do
              run_name="$(basename "${run_dir}")"
              run_dst="${SHARD_DST}/runs/${run_name}"
              mkdir -p "${run_dst}"
              for file in \
                summary_overall.csv \
                candidates_aggregate.csv.gz \
                candidate_summary.csv \
                policy_candidate_summary.csv \
                candidates_decision_policy_audit.csv \
                summary_by_month.csv \
                summary_by_session.csv \
                effective_band_config.yaml; do
                if [ -f "${run_dir}/${file}" ]; then
                  cp "${run_dir}/${file}" "${run_dst}/${file}"
                fi
              done
            done
          fi

      - name: Upload shard artifacts bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.shard_artifact_name }}
          path: |
            batch_artifacts

  aggregate-and-rvtr-ml:
    runs-on: ubuntu-latest
    needs: [prepare, run-shards]
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: batch-shard-*
          path: batch_artifacts
          merge-multiple: true

      - name: Debug downloaded shard artifact layout
        run: |
          find batch_artifacts -maxdepth 6 -type f | sort

      - name: Stage run-level label source artifact
        run: |
          LABEL_SRC_ROOT="label_source"
          mkdir -p "${LABEL_SRC_ROOT}"

          find batch_artifacts -type f -name "study_metadata.yaml" | while read -r study_meta; do
            shard_dir="$(dirname "${study_meta}")"
            shard_rel="${shard_dir#batch_artifacts/}"
            shard_dst="${LABEL_SRC_ROOT}/${shard_rel}"
            mkdir -p "${shard_dst}"
            ln "${study_meta}" "${shard_dst}/study_metadata.yaml"

            if [ -d "${shard_dir}/runs" ]; then
              find "${shard_dir}/runs" -mindepth 1 -maxdepth 1 -type d | while read -r run_dir; do
                run_name="$(basename "${run_dir}")"
                run_dst="${shard_dst}/runs/${run_name}"
                mkdir -p "${run_dst}"
                for file in \
                  candidates_aggregate.csv.gz \
                  candidates_decision_policy_audit.csv \
                  effective_band_config.yaml; do
                  if [ -f "${run_dir}/${file}" ]; then
                    ln "${run_dir}/${file}" "${run_dst}/${file}"
                  fi
                done
              done
            fi
          done

      - name: Upload run-level label source artifact
        uses: actions/upload-artifact@v4
        with:
          name: batch-runlevel-label-source-${{ needs.prepare.outputs.batch_id }}-${{ github.run_id }}
          path: |
            label_source

      - name: Download batch runtime bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.batch_runtime_artifact_name }}
          path: ${{ github.workspace }}/.batch_runtime

      - name: Aggregate batch review
        run: |
          ISSUE_ARGS=""
          if [ -n "${{ inputs.review_issue_number }}" ]; then
            ISSUE_ARGS="--review-issue-number ${{ inputs.review_issue_number }}"
          fi

          BATCH_MANIFEST_PATH="${{ github.workspace }}/.batch_runtime/batch_manifest.yaml"
          python tools/review_batch.py \
            --batch-manifest "${BATCH_MANIFEST_PATH}" \
            --artifact-staging-root "batch_artifacts" \
            $ISSUE_ARGS

      - name: Resolve RV/TR ML output directory
        run: |
          RVTR_SUBDIR="${{ inputs.rvtr_ml_output_subdir }}"
          if [ -z "${RVTR_SUBDIR}" ]; then
            RVTR_SUBDIR="rvtr_ml_research"
          fi
          RVTR_OUTPUT_DIR="${{ needs.prepare.outputs.batch_output_root }}/${RVTR_SUBDIR}"
          echo "RVTR_ML_OUTPUT_DIR=${RVTR_OUTPUT_DIR}" >> "$GITHUB_ENV"

      - name: Build RV/TR label table
        run: |
          python -u tools/build_rvtr_label_table.py \
            --source-root "label_source" \
            --output-dir "${RVTR_ML_OUTPUT_DIR}"

      - name: Train RV/TR logistic model
        run: |
          python -u tools/train_rvtr_logit_v1.py \
            --label-table "${RVTR_ML_OUTPUT_DIR}/rvtr_label_table_trainable_v1.csv.gz" \
            --output-dir "${RVTR_ML_OUTPUT_DIR}"

      - name: Distill RV/TR score weights
        run: |
          python -u tools/distill_rvtr_score_v1.py \
            --coef-csv "${RVTR_ML_OUTPUT_DIR}/rvtr_logit_v1_coef.csv" \
            --output-dir "${RVTR_ML_OUTPUT_DIR}"

      - name: Upload batch artifacts
        uses: actions/upload-artifact@v4
        with:
          name: batch-review-${{ needs.prepare.outputs.batch_id }}-${{ github.run_id }}
          path: |
            ${{ needs.prepare.outputs.batch_output_root }}/batch_metadata.yaml
            ${{ needs.prepare.outputs.batch_output_root }}/batch_manifest.yaml
            ${{ needs.prepare.outputs.batch_output_root }}/batch_ranking.csv
            ${{ needs.prepare.outputs.batch_output_root }}/batch_shortlist.csv
            ${{ needs.prepare.outputs.batch_output_root }}/band_variant_compare.csv
            ${{ needs.prepare.outputs.batch_output_root }}/policy_variant_compare.csv
            ${{ needs.prepare.outputs.batch_output_root }}/policy_variant_robustness.csv
            ${{ needs.prepare.outputs.batch_output_root }}/shortlist_robustness.csv
            ${{ needs.prepare.outputs.batch_output_root }}/batch_review.md
            ${{ needs.prepare.outputs.batch_output_root }}/batch_review_machine.yaml

      - name: Upload RV/TR ML artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rvtr-ml-${{ needs.prepare.outputs.batch_id }}-${{ github.run_id }}
          path: |
            ${{ env.RVTR_ML_OUTPUT_DIR }}/rvtr_label_table_v1.csv.gz
            ${{ env.RVTR_ML_OUTPUT_DIR }}/rvtr_label_table_trainable_v1.csv.gz
            ${{ env.RVTR_ML_OUTPUT_DIR }}/rvtr_label_table_v1.summary.json
            ${{ env.RVTR_ML_OUTPUT_DIR }}/label_distribution_overall.csv
            ${{ env.RVTR_ML_OUTPUT_DIR }}/label_distribution_by_month.csv
            ${{ env.RVTR_ML_OUTPUT_DIR }}/label_distribution_by_session.csv
            ${{ env.RVTR_ML_OUTPUT_DIR }}/label_distribution_by_band.csv
            ${{ env.RVTR_ML_OUTPUT_DIR }}/rvtr_logit_v1_coef.csv
            ${{ env.RVTR_ML_OUTPUT_DIR }}/rvtr_logit_v1_metrics.json
            ${{ env.RVTR_ML_OUTPUT_DIR }}/rvtr_logit_v1_predictions.csv.gz
            ${{ env.RVTR_ML_OUTPUT_DIR }}/distilled_total_score_rvtr_v2.yaml
            ${{ env.RVTR_ML_OUTPUT_DIR }}/distilled_feature_importance.csv

      - name: Resolve review sink metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import yaml

          machine = yaml.safe_load(Path("${{ needs.prepare.outputs.batch_output_root }}/batch_review_machine.yaml").read_text(encoding="utf-8")) or {}
          issue_override = "${{ inputs.review_issue_number }}".strip()
          issue = issue_override or str(machine.get("issue_number", "")).strip()
          marker = str(machine.get("comment_marker", "BATCH_REVIEW")).strip() or "BATCH_REVIEW"

          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env:
              env.write(f"REVIEW_ISSUE_NUMBER={issue}\n")
              env.write(f"REVIEW_COMMENT_MARKER={marker}\n")
              env.write(f"REVIEW_MD_PATH=${{ needs.prepare.outputs.batch_output_root }}/batch_review.md\n")
          PY

      - name: Publish/update review sink comment
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issueNumber = Number(process.env.REVIEW_ISSUE_NUMBER || 0);
            if (!issueNumber) {
              core.info('No review issue configured; skipping comment publish.');
              return;
            }
            const marker = `<!-- ${process.env.REVIEW_COMMENT_MARKER || 'BATCH_REVIEW'} -->`;
            const body = fs.readFileSync(process.env.REVIEW_MD_PATH, 'utf8');
            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const target = comments.find(c => typeof c.body === 'string' && c.body.includes(marker));
            if (target) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: target.id, body });
              core.info(`Updated existing review comment ${target.id}.`);
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: issueNumber, body });
              core.info(`Created review comment on issue #${issueNumber}.`);
            }

      - name: Write summary
        if: always()
        run: |
          {
            echo "## Research Batch + RV/TR ML Summary"
            echo "- batch id: \`${{ needs.prepare.outputs.batch_id }}\`"
            echo "- dataset id: \`${{ needs.prepare.outputs.dataset_id }}\`"
            echo "- output tag: \`${{ needs.prepare.outputs.output_tag || '<none>' }}\`"
            echo "- manifest: \`${{ github.workspace }}/.batch_runtime/batch_manifest.yaml\`"
            echo "- review artifact: \`${{ needs.prepare.outputs.batch_output_root }}/batch_review.md\`"
            echo "- rvtr ml output dir: \`${RVTR_ML_OUTPUT_DIR}\`"
          } >> "$GITHUB_STEP_SUMMARY"
