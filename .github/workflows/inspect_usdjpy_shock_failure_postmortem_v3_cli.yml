name: Inspect USDJPY Shock Failure Postmortem v3 CLI

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/inspect_usdjpy_shock_failure_postmortem_v3_cli.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Materialize and inspect analyzer
        shell: bash
        run: |
          set -euo pipefail
          cat tools/analyze_usdjpy_shock_failure_2025_postmortem_v3.py.gz.b64.part* > "$RUNNER_TEMP/analyzer.b64"
          base64 -d "$RUNNER_TEMP/analyzer.b64" | gzip -d > "$RUNNER_TEMP/analyzer.py"
          python -m py_compile "$RUNNER_TEMP/analyzer.py"
          sha256sum "$RUNNER_TEMP/analyzer.b64" "$RUNNER_TEMP/analyzer.py" | tee "$RUNNER_TEMP/SHA256SUMS"
          python "$RUNNER_TEMP/analyzer.py" --help | tee "$RUNNER_TEMP/cli.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: shock-postmortem-v3-cli-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/cli.txt
            ${{ runner.temp }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
