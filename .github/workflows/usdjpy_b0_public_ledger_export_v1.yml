name: USDJPY B0 Public Ledger Export v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/usdjpy_b0_public_ledger_export_v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 1
      - name: Verify source-native ledger
        run: |
          set -euo pipefail
          p='artifacts/research/usdjpy_hyp044/round_b_source_native_2020_2022_v1/round_b_event_ledger_2020_2022.csv'
          test -f "$p"
          test "$(sha256sum "$p" | awk '{print $1}')" = 'c9287f34facb87ad0209b6e6f833117d205d00b093948f4e4dba22c8fa190e4a'
          test "$(wc -l < "$p")" -eq 3626
      - uses: actions/upload-artifact@v4
        with:
          name: usdjpy-b0-source-native-2020-2022-ledger-v1
          path: artifacts/research/usdjpy_hyp044/round_b_source_native_2020_2022_v1/round_b_event_ledger_2020_2022.csv
          if-no-files-found: error
          retention-days: 30
