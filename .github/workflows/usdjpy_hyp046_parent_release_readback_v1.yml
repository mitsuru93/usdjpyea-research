name: USDJPY HYP-046 Parent Release Readback v1

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/ops/run_hyp046_parent_release_readback_v1.py
      - .github/workflows/usdjpy_hyp046_parent_release_readback_v1.yml
  push:
    branches:
      - research/usdjpy-a2a-a3-integrated-f05-long-control-v1
    paths:
      - scripts/ops/run_hyp046_parent_release_readback_v1.py
      - .github/workflows/usdjpy_hyp046_parent_release_readback_v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parent-release-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      HYP046_OUT: artifacts/research/usdjpy_a2a_a3_integrated_f05_long_control_001/preflight_v1
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Read back immutable HYP-045 Release v5
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ops/run_hyp046_parent_release_readback_v1.py
          jq -e '.status=="PASS_PARENT_RELEASE_READBACK_AND_AUTHORITY_INVENTORY" and ."2025H2_accessed"==false' "$HYP046_OUT/preflight_summary.json"
          jq -e '.remote_readback_status=="PASS_BYTE_IDENTICAL_RELEASE_ARCHIVE_AND_RULE_HASHES" and .parent_mutated==false' "$HYP046_OUT/parent_hyp045_authority_receipt.json"

      - name: Upload authority evidence
        uses: actions/upload-artifact@v4
        with:
          name: usdjpy-hyp046-parent-release-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/research/usdjpy_a2a_a3_integrated_f05_long_control_001/preflight_v1
          if-no-files-found: error
          retention-days: 30
