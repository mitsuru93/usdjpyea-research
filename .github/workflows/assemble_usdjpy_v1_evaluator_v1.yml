name: Assemble Exact USDJPY V1 Evaluator v1

on:
  pull_request:
    types: [opened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: assemble-usdjpy-v1-evaluator-v1
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify chunks and materialize evaluator
        run: |
          set -euo pipefail
          echo '667ee2f15767b9e4b3cc682d88fb67273070d9d9a3e5cbb93e2451272f4703d1  .github/v1_stage/chunk_00.b64' | sha256sum -c -
          echo 'bae5874b32febbd166f88d0aa871b388b29121a20dd404babcb3a03fb8b2f22e  .github/v1_stage/chunk_01.b64' | sha256sum -c -
          echo '97f3cb547f065cd3bf535fa53dc578ea70083f550208e8c6c5ecd3d0dcc4dd57  .github/v1_stage/chunk_02.b64' | sha256sum -c -
          echo '23c0d3466915d0aaefb86d1feffde5b64f53d5fdcb9df966413ace5cc5c0da2b  .github/v1_stage/chunk_03.b64' | sha256sum -c -
          echo '236e8ab404b144ebc55cf1e89843ca9b43fcde9b243e6db84ad236c2cd3e2b96  .github/v1_stage/chunk_04.b64' | sha256sum -c -
          cat .github/v1_stage/chunk_00.b64 \
              .github/v1_stage/chunk_01.b64 \
              .github/v1_stage/chunk_02.b64 \
              .github/v1_stage/chunk_03.b64 \
              .github/v1_stage/chunk_04.b64 > /tmp/v1_evaluator.b64
          echo '41343acf80a59d0fc200f7c12fad4b2bfcb88d81db46788ba7398bf66ab2b921  /tmp/v1_evaluator.b64' | sha256sum -c -
          base64 --decode /tmp/v1_evaluator.b64 > /tmp/v1_evaluator.py.gz
          echo 'be45b1cb9d51bb43268863c9ec1412f76cf097937c79ca9ea856c54462e9db60  /tmp/v1_evaluator.py.gz' | sha256sum -c -
          gzip -t /tmp/v1_evaluator.py.gz
          mkdir -p tools
          gzip --decompress --stdout /tmp/v1_evaluator.py.gz > tools/run_usdjpy_v1_candidate_specific_h2_validation_v1.py
          echo 'e037dcdcea1f976999c1a46606df5699878e371692b337cdecc1ba4c7f7dfb55  tools/run_usdjpy_v1_candidate_specific_h2_validation_v1.py' | sha256sum -c -
          python -m py_compile tools/run_usdjpy_v1_candidate_specific_h2_validation_v1.py
          test "$(git hash-object tools/run_usdjpy_v1_candidate_specific_h2_validation_v1.py)" = '722aedb7c4095e6a4479aee6ea9d15c8843e5972'

      - name: Commit exact evaluator and remove staging files
        run: |
          set -euo pipefail
          rm -rf .github/v1_stage
          rm -f .github/workflows/assemble_usdjpy_v1_evaluator_v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/run_usdjpy_v1_candidate_specific_h2_validation_v1.py .github
          git commit -m 'research: materialize exact USDJPY V1 H2 evaluator v1'
          git push origin HEAD:main

      - name: Report assembly result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "${{ job.status }}" = 'success' ]; then
            gh pr comment "${PR_NUMBER}" --repo "${REPOSITORY}" --body 'Exact V1 H2 evaluator was materialized on main from verified chunks. The evaluator source is locked; no 2025 data was accessed.'
          else
            gh pr comment "${PR_NUMBER}" --repo "${REPOSITORY}" --body 'V1 evaluator assembly failed. No formal V1 result is accepted and 2025 remains closed.'
          fi
