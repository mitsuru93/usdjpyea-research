name: Archive Accepted USDJPY R6 Complete Strategy Freeze v1

on:
  pull_request:
    types: [opened]

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: archive-usdjpy-r6-complete-strategy-freeze-v1
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download and independently verify accepted R6 artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          rm -rf audit release_assets
          mkdir -p audit release_assets
          asset='release_assets/usdjpy-r6-complete-strategy-freeze-v1-run-29672853145-artifact-8437864148.zip'
          gh api "repos/${REPOSITORY}/actions/artifacts/8437864148/zip" > "${asset}"
          echo 'e15d63fb0fcebf18f623e10852548420ec21affef459de1f8912a78e16d02320  release_assets/usdjpy-r6-complete-strategy-freeze-v1-run-29672853145-artifact-8437864148.zip' | sha256sum -c -
          unzip -t "${asset}" >/dev/null
          unzip -q "${asset}" -d audit
          python - <<'PY'
          import csv
          import gzip
          import hashlib
          import json
          from pathlib import Path

          root=Path('audit')
          expected_files={
              'complete_strategy_audit_all_32.csv',
              'eligible_complete_strategies.csv',
              'frozen_complete_strategies.csv',
              'redundancy_decisions.csv',
              'eligible_pairwise_similarity.csv.gz',
              'family_freeze_summary.csv',
              'h2_validation_plan.json',
              'r6_acceptance.json',
              'run_metadata.json',
          }
          assert {p.name for p in root.iterdir() if p.is_file()}==expected_files

          def rows(name):
              with (root/name).open(newline='',encoding='utf-8') as fh:
                  return list(csv.DictReader(fh))

          audit=rows('complete_strategy_audit_all_32.csv')
          eligible=rows('eligible_complete_strategies.csv')
          frozen=rows('frozen_complete_strategies.csv')
          decisions=rows('redundancy_decisions.csv')
          family=rows('family_freeze_summary.csv')
          with gzip.open(root/'eligible_pairwise_similarity.csv.gz','rt',newline='',encoding='utf-8') as fh:
              pairwise=list(csv.DictReader(fh))
          acceptance=json.loads((root/'r6_acceptance.json').read_text())
          metadata=json.loads((root/'run_metadata.json').read_text())
          plan=json.loads((root/'h2_validation_plan.json').read_text())

          expected_strategies=[
              'R1H04_ramom_32_64_z125__T0_fixed_time_cap',
              'R1B02_legacy_asia_00_07_breakout__T0_fixed_time_cap',
              'R1E02_legacy_trend_8h_resumption__T0_fixed_time_cap',
              'R1F05_donchian_96__T0_fixed_time_cap',
              'R1E03_trend_12h_resumption__T0_fixed_time_cap',
          ]
          assert len(audit)==32
          assert sum(row['eligible'].lower()=='true' for row in audit)==9
          assert len(eligible)==9
          assert len(frozen)==5
          assert [row['strategy_id'] for row in frozen]==expected_strategies
          assert len(pairwise)==36
          assert len(decisions)==9
          assert sum(row['decision']=='freeze' for row in decisions)==5
          assert sum(int(row['frozen_strategies']) for row in family)==5
          assert acceptance['status']=='PASS'
          assert len(acceptance)==21
          assert all(value is True for key,value in acceptance.items() if key!='status')
          assert metadata['status']=='PASS'
          assert metadata['audit_rows']==32
          assert metadata['eligible_complete_strategies']==9
          assert metadata['frozen_complete_strategies']==5
          assert metadata['eligible_pairwise_comparisons']==36
          assert metadata['H2_rows_parsed']==0
          assert metadata['2025_artifact_access'] is False
          assert metadata['Core_promotion'] is False
          assert metadata['MT4_promotion'] is False
          assert metadata['frozen_strategy_ids']==expected_strategies
          assert plan['strategy_count']==5
          assert [row['strategy_id'] for row in plan['strategies']]==expected_strategies
          assert plan['candidate_specific_unused_only'] is True
          assert plan['joint_single_run'] is True
          assert plan['entry_exit_parameters_unchanged'] is True
          assert plan['research_firewall']['H2_rows_parsed_in_R6']==0
          assert plan['research_firewall']['2025_access'] is False
          for name,expected in metadata['output_sha256'].items():
              actual=hashlib.sha256((root/name).read_bytes()).hexdigest()
              assert actual==expected,(name,actual,expected)

          inspection={
              'accepted_run_id':29672853145,
              'workflow_head_sha':'23e0933182aa43b3fa6f9f83611a8a0213ddeb19',
              'evaluator_lock_commit':'7cdbf84ae2da1eaf05cc3b901727b8e284f8fe93',
              'artifact_id':8437864148,
              'artifact_name':'usdjpy-r6-complete-strategy-freeze-v1-29672853145',
              'artifact_sha256':'e15d63fb0fcebf18f623e10852548420ec21affef459de1f8912a78e16d02320',
              'acceptance_checks':20,
              'audit_rows':32,
              'eligible_complete_strategies':9,
              'frozen_complete_strategies':5,
              'eligible_pairwise_comparisons':36,
              'frozen_strategy_ids':expected_strategies,
              'output_sha256':metadata['output_sha256'],
              'H2_rows_parsed':0,
              '2025_artifact_access':False,
              'Core_promotion':False,
              'MT4_promotion':False,
          }
          Path('inspection.json').write_text(json.dumps(inspection,indent=2,sort_keys=True)+'\n')
          print(json.dumps(inspection,sort_keys=True))
          PY

      - name: Write Release manifest and R6 result document
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          inspection=json.loads(Path('inspection.json').read_text())
          manifest={
              'version':'v1',
              'repository':'mitsuru93/usdjpyea-research',
              'release_tag':'usdjpy-r6-complete-strategy-freeze-v1',
              'accepted_run_id':inspection['accepted_run_id'],
              'workflow_head_sha':inspection['workflow_head_sha'],
              'evaluator_lock_commit':inspection['evaluator_lock_commit'],
              'actions_artifact_id':inspection['artifact_id'],
              'actions_artifact_name':inspection['artifact_name'],
              'actions_artifact_sha256':inspection['artifact_sha256'],
              'r6_status':'PASS',
              'acceptance_checks':inspection['acceptance_checks'],
              'audit_rows':inspection['audit_rows'],
              'eligible_complete_strategies':inspection['eligible_complete_strategies'],
              'frozen_complete_strategies':inspection['frozen_complete_strategies'],
              'eligible_pairwise_comparisons':inspection['eligible_pairwise_comparisons'],
              'frozen_strategy_ids':inspection['frozen_strategy_ids'],
              'output_sha256':inspection['output_sha256'],
              'H2_rows_parsed':0,
              '2025_artifact_access':False,
              'Core_promotion':False,
              'MT4_promotion':False,
              'next_stage':'V1_candidate_specific_unused_H2_validation',
          }
          Path('release_assets/usdjpy-r6-complete-strategy-freeze-v1-manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')

          with Path('audit/frozen_complete_strategies.csv').open(newline='',encoding='utf-8') as fh:
              frozen=list(csv.DictReader(fh))
          lines=[
              '# USDJPY R6 Complete-Strategy Freeze Result v1','',
              '## Decision','',
              '```text','R6: PASS','audited complete strategies: 32','fully eligible complete strategies: 9','frozen complete strategies: 5','eligible pairwise comparisons: 36','H2 rows parsed: 0','2025 access: none','Core promotion: false','MT4 promotion: false','```','',
              '## Accepted run','',
              '```text',
              'run_id: 29672853145',
              'workflow_head_sha: 23e0933182aa43b3fa6f9f83611a8a0213ddeb19',
              'evaluator_lock_commit: 7cdbf84ae2da1eaf05cc3b901727b8e284f8fe93',
              'artifact_id: 8437864148',
              'artifact: usdjpy-r6-complete-strategy-freeze-v1-29672853145',
              'artifact_digest: sha256:e15d63fb0fcebf18f623e10852548420ec21affef459de1f8912a78e16d02320',
              'release_tag: usdjpy-r6-complete-strategy-freeze-v1','```','',
              '## Frozen complete strategies','',
              '| Freeze rank | H1 eligible rank | Strategy | Family | Time cap | Trades | Avg severe pips | Severe PF |',
              '|---:|---:|---|---|---:|---:|---:|---:|',
          ]
          for row in frozen:
              lines.append(f"| {int(row['freeze_rank'])} | {int(row['eligible_rank'])} | {row['strategy_id']} | {row['family']} | {int(row['time_cap_bars'])} | {int(row['trades'])} | {float(row['aggregate_avg_severe_net_pips']):+.6f} | {float(row['aggregate_severe_profit_factor']):.6f} |")
          lines += [
              '',
              'All five use the accepted R5 fixed-time-cap policy. The fourth eligible combination was an alternative Exit for the same R1H04 Entry definition and was skipped by the one-definition cap. The freeze stopped at five; lower-ranked eligible strategies were not substituted.','',
              '## Validation handling','',
              'The five frozen strategies enter one joint candidate-specific unused 2024 H2 validation with Entry, Exit and time cap unchanged. Each strategy passes or fails independently; H2 reranking and rescue changes are prohibited.','',
              'If every strategy fails, this R6 branch closes and research returns to H1 for a new preregistered hypothesis or optimization branch. The same 2024 H2 remains the fixed validation gate for the new branch; detailed H2 outcomes may not be used to modify or rescue a failed strategy. 2025 remains unopened.','',
              'R6 did not parse H2, access 2025, reselect R4 representatives, modify R5 policies, or promote any strategy to Core or MT4.',''
          ]
          Path('docs/research_reboot/usdjpy_r6_complete_strategy_freeze_result_v1.md').write_text('\n'.join(lines))
          PY
          (cd release_assets && sha256sum * > SHA256SUMS)

      - name: Create clean durable Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: usdjpy-r6-complete-strategy-freeze-v1
        run: |
          set -euo pipefail
          if ! gh release view "${TAG}" --repo "${REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${TAG}" --repo "${REPOSITORY}" --title 'USDJPY R6 Complete-Strategy Freeze v1' --notes 'Accepted R6 H1 complete-strategy audit and maximum-five freeze. H2 and 2025 remained unopened.' --latest=false
          fi
          mapfile -t EXISTING < <(gh release view "${TAG}" --repo "${REPOSITORY}" --json assets --jq '.assets[].name')
          for name in "${EXISTING[@]}"; do
            gh release delete-asset "${TAG}" "${name}" --repo "${REPOSITORY}" --yes
          done
          gh release upload "${TAG}" release_assets/* --repo "${REPOSITORY}"
          for attempt in 1 2 3 4 5; do
            gh release view "${TAG}" --repo "${REPOSITORY}" --json tagName,url,isDraft,isPrerelease,assets > release_receipt.json
            if python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('release_receipt.json').read_text())
          assets={row['name']:row for row in r['assets']}
          expected={
              'usdjpy-r6-complete-strategy-freeze-v1-run-29672853145-artifact-8437864148.zip',
              'usdjpy-r6-complete-strategy-freeze-v1-manifest.json',
              'SHA256SUMS',
          }
          ok=(r['tagName']=='usdjpy-r6-complete-strategy-freeze-v1' and not r['isDraft'] and not r['isPrerelease'] and set(assets)==expected and all(row['state']=='uploaded' for row in assets.values()) and assets['usdjpy-r6-complete-strategy-freeze-v1-run-29672853145-artifact-8437864148.zip'].get('digest')=='sha256:e15d63fb0fcebf18f623e10852548420ec21affef459de1f8912a78e16d02320')
          raise SystemExit(0 if ok else 1)
          PY
            then break; fi
            sleep 5
          done
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('release_receipt.json').read_text())
          assets={row['name']:row for row in r['assets']}
          expected={
              'usdjpy-r6-complete-strategy-freeze-v1-run-29672853145-artifact-8437864148.zip',
              'usdjpy-r6-complete-strategy-freeze-v1-manifest.json',
              'SHA256SUMS',
          }
          assert r['tagName']=='usdjpy-r6-complete-strategy-freeze-v1'
          assert set(assets)==expected
          assert all(row['state']=='uploaded' for row in assets.values())
          assert assets['usdjpy-r6-complete-strategy-freeze-v1-run-29672853145-artifact-8437864148.zip']['digest']=='sha256:e15d63fb0fcebf18f623e10852548420ec21affef459de1f8912a78e16d02320'
          PY

      - name: Commit archive receipt and remove one-time workflow
        run: |
          set -euo pipefail
          mkdir -p docs/research_reboot/artifact_archives/usdjpy_r6_complete_strategy_freeze_v1
          cp release_assets/usdjpy-r6-complete-strategy-freeze-v1-manifest.json docs/research_reboot/artifact_archives/usdjpy_r6_complete_strategy_freeze_v1/artifact_manifest.json
          cp release_receipt.json docs/research_reboot/artifact_archives/usdjpy_r6_complete_strategy_freeze_v1/release_receipt.json
          rm -f .github/workflows/run_usdjpy_r6_complete_strategy_freeze_v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/research_reboot .github/workflows/run_usdjpy_r6_complete_strategy_freeze_v1.yml
          git commit -m 'docs: archive accepted USDJPY R6 complete strategy freeze v1'
          git push origin HEAD:main

      - name: Report archive result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "${{ job.status }}" = 'success' ]; then
            gh pr comment "${PR_NUMBER}" --repo "${REPOSITORY}" --body 'Accepted R6 artifact was independently rechecked, archived in the durable Release, and documented. H2 and 2025 remained unopened.'
          else
            gh pr comment "${PR_NUMBER}" --repo "${REPOSITORY}" --body 'R6 archive failed. The accepted Actions artifact remains unchanged; H2 remains blocked until the archive is completed.'
          fi
