name: Capture MT4 Tick Conversion Status

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/capture_mt4_tick_conversion_status.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture targeted workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root='docs/research_reboot/artifact_archives/usdjpy_2024_mt4_tick_import_v1'
          mkdir -p "$root"
          gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow build_usdjpy_2024_mt4_tick_import_v1.yml \
            --limit 20 \
            --json databaseId,workflowName,status,conclusion,headSha,event,createdAt,updatedAt,url \
            > "$root/build-runs.json"
          gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow stage_usdjpy_2024_mt4_tick_import_v1.yml \
            --limit 20 \
            --json databaseId,workflowName,status,conclusion,headSha,event,createdAt,updatedAt,url \
            > "$root/stage-runs.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$root/build-runs.json" "$root/stage-runs.json"
          git commit -m 'ci: capture targeted MT4 tick workflow status'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
