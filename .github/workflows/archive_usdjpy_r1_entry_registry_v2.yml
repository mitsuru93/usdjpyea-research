name: Archive Accepted USDJPY R1 Entry Registry v2

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  archive:
    if: github.event.issue.title == '[R1] Archive accepted Entry registry v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record run
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body "R1 v2 archive started. Run ID ${{ github.run_id }}."
      - name: Download verify and release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p release_assets
          asset='release_assets/usdjpy-r1-entry-registry-v2-run-29642282221-artifact-8428977454.zip'
          gh api "repos/${REPOSITORY}/actions/artifacts/8428977454/zip" > "$asset"
          echo '0e0de71ccc56409a919d48d61e4dcb12502cefdb3944374b9163eda76d222d74  release_assets/usdjpy-r1-entry-registry-v2-run-29642282221-artifact-8428977454.zip' | sha256sum -c -
          unzip -t "$asset" >/dev/null
          cat > release_assets/usdjpy-r1-entry-registry-v2-manifest.json <<'JSON'
          {
            "version": "v2",
            "release_tag": "usdjpy-r1-entry-registry-v2",
            "accepted_run_id": 29642282221,
            "accepted_head_sha": "9393e4ac9ec7d712f85c29e9ef7f44025de25403",
            "actions_artifact_id": 8428977454,
            "actions_artifact_sha256": "0e0de71ccc56409a919d48d61e4dcb12502cefdb3944374b9163eda76d222d74",
            "excluded_predecessor_run_id": 29641805182,
            "excluded_predecessor_artifact_id": 8428842719,
            "families": 12,
            "unique_entry_definitions": 60,
            "signal_rows": 34955,
            "historical_registered_hold_regressions": 13,
            "historical_registered_hold_regressions_passed": 13,
            "candidate_signals_gzip_sha256": "99c2e2d19bd76b2438c1cec6c777228f82cdca16eeb1b471257bd389d6b7dc9e",
            "r1_v2_acceptance_sha256": "a49d194cc52253207744894d23458ecf9228c3f205ef5438c707a3d27de6e20f",
            "legacy_regression_sha256": "2936af74567bb89440f1a18027beac714321869e1e96b00eb218f8b25a459992",
            "h2_rows_parsed": 0,
            "outcomes_opened": false,
            "2025_artifact_access": false,
            "r2_unblocked": true
          }
          JSON
          (cd release_assets && sha256sum usdjpy-r1-entry-registry-v2-run-29642282221-artifact-8428977454.zip usdjpy-r1-entry-registry-v2-manifest.json > SHA256SUMS)
          cat > notes.md <<'EOF'
          Corrected accepted USDJPY R1 Entry Registry v2. The v1 run is excluded because of signal-hour versus actual-entry-hour semantics. V2 reproduces all thirteen historical registered-hold Entry ledgers exactly and opens no H2, 2025 or outcome data.
          EOF
          gh release create usdjpy-r1-entry-registry-v2 release_assets/* --title 'USDJPY R1 Entry Registry v2' --notes-file notes.md --latest=false
      - name: Verify and commit receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view usdjpy-r1-entry-registry-v2 --json tagName,url,isDraft,isPrerelease,assets > receipt.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('receipt.json').read_text())
          a={x['name']:x for x in r['assets']}
          assert r['tagName']=='usdjpy-r1-entry-registry-v2'
          assert not r['isDraft'] and not r['isPrerelease']
          assert len(a)==3
          assert a['usdjpy-r1-entry-registry-v2-run-29642282221-artifact-8428977454.zip']['digest']=='sha256:0e0de71ccc56409a919d48d61e4dcb12502cefdb3944374b9163eda76d222d74'
          assert all(x['state']=='uploaded' for x in a.values())
          PY
          git pull --rebase origin main
          target='docs/research_reboot/artifact_archives/usdjpy_r1_entry_registry_v2'
          mkdir -p "$target"
          cp receipt.json "$target/release_receipt.json"
          cp release_assets/usdjpy-r1-entry-registry-v2-manifest.json "$target/artifact_manifest.json"
          cp release_assets/SHA256SUMS "$target/SHA256SUMS"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git commit -m 'docs: record durable corrected R1 v2 archive'
          git push origin main
      - name: Close issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body 'Corrected R1 v2 artifact archived at Release tag usdjpy-r1-entry-registry-v2.'
          gh issue close "$ISSUE_NUMBER" --repo "$REPOSITORY" --reason completed
