name: Run USDJPY Joint H2 A1 E3 Evaluation v1

on:
  workflow_dispatch:

concurrency:
  group: usdjpy-joint-h2-a1-e3-eval-v1
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas

      - name: Compile and validate frozen evaluator
        run: |
          python -m py_compile \
            tools/run_usdjpy_h1_multi_family_screen.py \
            tools/run_usdjpy_h1_multi_family_screen_v2.py \
            tools/run_usdjpy_joint_h2_a1_e3_eval_v1.py \
            tools/summarize_download_manifest.py
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("configs/research/usdjpy_joint_h2_a1_e3_eval_v1.json").read_text())
          assert config["candidate_ids"] == [
              "A1_impulse_breakout_lb3_hold6",
              "E3_trend_24h_resumption_hold6",
          ]
          assert config["h2_block"] == {
              "start_utc": "2024-07-01T00:00:00Z",
              "end_utc_exclusive": "2025-01-01T00:00:00Z",
          }
          assert config["history_policy"] == "generate_h2_signals_on_contiguous_h1_plus_h2_bars_then_retain_entries_and_exits_inside_h2"
          assert config["gates"]["aggregate_trades_gte"] == 300
          assert config["gates"]["minimum_monthly_trades_gte"] == 35
          assert config["gates"]["aggregate_profit_factor_gte"] == 1.1
          assert config["gates"]["severe_profit_factor_gte"] == 0.9
          assert config["intervention_dates_utc"] == ["2024-07-11", "2024-07-12"]
          print({"frozen_eval_config": "validated", "candidate_count": 2})
          PY

      - name: Download H1 2024-01 baseline repair bars
        uses: actions/download-artifact@v4
        with:
          name: fx-session-baseline-2024-01-USDJPY-29307131333
          path: data/baselines/H1/2024-01
          run-id: 29307131333
          github-token: ${{ github.token }}

      - name: Download H1 2024-02 baseline repair bars
        uses: actions/download-artifact@v4
        with:
          name: fx-session-baseline-2024-02-USDJPY-29383810487
          path: data/baselines/H1/2024-02
          run-id: 29383810487
          github-token: ${{ github.token }}

      - name: Download H1 2024-03 baseline repair bars
        uses: actions/download-artifact@v4
        with:
          name: fx-session-baseline-2024-03-USDJPY-29421329471
          path: data/baselines/H1/2024-03
          run-id: 29421329471
          github-token: ${{ github.token }}

      - name: Download H1 2024-04 baseline repair bars
        uses: actions/download-artifact@v4
        with:
          name: fx-session-baseline-2024-04-USDJPY-29455059447
          path: data/baselines/H1/2024-04
          run-id: 29455059447
          github-token: ${{ github.token }}

      - name: Download H1 2024-05 baseline repair bars
        uses: actions/download-artifact@v4
        with:
          name: fx-session-baseline-2024-05-USDJPY-29469227483
          path: data/baselines/H1/2024-05
          run-id: 29469227483
          github-token: ${{ github.token }}

      - name: Download H1 2024-06 baseline repair bars
        uses: actions/download-artifact@v4
        with:
          name: fx-session-baseline-2024-06-USDJPY-29475803893
          path: data/baselines/H1/2024-06
          run-id: 29475803893
          github-token: ${{ github.token }}

      - name: Download H1 2024-01 source bars
        uses: actions/download-artifact@v4
        with:
          pattern: public-fx-data-pilot-2024-01-USDJPY-d*-29189903048
          path: data/source/H1/2024-01
          merge-multiple: true
          run-id: 29189903048
          github-token: ${{ github.token }}

      - name: Download H1 2024-02 source bars
        uses: actions/download-artifact@v4
        with:
          pattern: public-fx-data-pilot-2024-02-USDJPY-d*-29329511595
          path: data/source/H1/2024-02
          merge-multiple: true
          run-id: 29329511595
          github-token: ${{ github.token }}

      - name: Download H1 2024-03 source bars
        uses: actions/download-artifact@v4
        with:
          pattern: public-fx-data-pilot-2024-03-USDJPY-d*-29386417671
          path: data/source/H1/2024-03
          merge-multiple: true
          run-id: 29386417671
          github-token: ${{ github.token }}

      - name: Download H1 2024-04 source bars
        uses: actions/download-artifact@v4
        with:
          pattern: public-fx-data-pilot-2024-04-USDJPY-d*-29423451609
          path: data/source/H1/2024-04
          merge-multiple: true
          run-id: 29423451609
          github-token: ${{ github.token }}

      - name: Download H1 2024-05 source bars
        uses: actions/download-artifact@v4
        with:
          pattern: public-fx-data-pilot-2024-05-USDJPY-d*-29455212697
          path: data/source/H1/2024-05
          merge-multiple: true
          run-id: 29455212697
          github-token: ${{ github.token }}

      - name: Download H1 2024-06 source bars
        uses: actions/download-artifact@v4
        with:
          pattern: public-fx-data-pilot-2024-06-USDJPY-d*-29469210771
          path: data/source/H1/2024-06
          merge-multiple: true
          run-id: 29469210771
          github-token: ${{ github.token }}

      - name: Download H2 2024-07 accepted baseline
        uses: actions/download-artifact@v4
        with:
          name: fx-session-baseline-2024-07-USDJPY-29556241138
          path: data/baselines/H2/2024-07
          run-id: 29556241138
          github-token: ${{ github.token }}

      - name: Download H2 2024-08 accepted baseline
        uses: actions/download-artifact@v4
        with:
          name: fx-session-baseline-2024-08-USDJPY-29567447264
          path: data/baselines/H2/2024-08
          run-id: 29567447264
          github-token: ${{ github.token }}

      - name: Download H2 2024-09 accepted baseline
        uses: actions/download-artifact@v4
        with:
          name: fx-session-baseline-2024-09-USDJPY-29569149852
          path: data/baselines/H2/2024-09
          run-id: 29569149852
          github-token: ${{ github.token }}

      - name: Download H2 2024-10 accepted baseline
        uses: actions/download-artifact@v4
        with:
          name: fx-session-baseline-2024-10-USDJPY-29569149852
          path: data/baselines/H2/2024-10
          run-id: 29569149852
          github-token: ${{ github.token }}

      - name: Download H2 2024-11 accepted baseline
        uses: actions/download-artifact@v4
        with:
          name: fx-session-baseline-2024-11-USDJPY-29569149852
          path: data/baselines/H2/2024-11
          run-id: 29569149852
          github-token: ${{ github.token }}

      - name: Download H2 2024-12 accepted baseline
        uses: actions/download-artifact@v4
        with:
          name: fx-session-baseline-2024-12-USDJPY-29569149852
          path: data/baselines/H2/2024-12
          run-id: 29569149852
          github-token: ${{ github.token }}

      - name: Download H2 2024-07 source bars
        uses: actions/download-artifact@v4
        with:
          pattern: public-fx-data-pilot-2024-07-USDJPY-d*-29544395435
          path: data/source/H2/2024-07
          merge-multiple: true
          run-id: 29544395435
          github-token: ${{ github.token }}

      - name: Download H2 2024-08 source bars
        uses: actions/download-artifact@v4
        with:
          pattern: public-fx-data-pilot-2024-08-USDJPY-d*-29556953388
          path: data/source/H2/2024-08
          merge-multiple: true
          run-id: 29556953388
          github-token: ${{ github.token }}

      - name: Download H2 2024-09 source bars
        uses: actions/download-artifact@v4
        with:
          pattern: public-fx-data-pilot-2024-09-USDJPY-d*-29569149852
          path: data/source/H2/2024-09
          merge-multiple: true
          run-id: 29569149852
          github-token: ${{ github.token }}

      - name: Download H2 2024-10 source bars
        uses: actions/download-artifact@v4
        with:
          pattern: public-fx-data-pilot-2024-10-USDJPY-d*-29569149852
          path: data/source/H2/2024-10
          merge-multiple: true
          run-id: 29569149852
          github-token: ${{ github.token }}

      - name: Download H2 2024-11 source bars
        uses: actions/download-artifact@v4
        with:
          pattern: public-fx-data-pilot-2024-11-USDJPY-d*-29569149852
          path: data/source/H2/2024-11
          merge-multiple: true
          run-id: 29569149852
          github-token: ${{ github.token }}

      - name: Download H2 2024-12 source bars
        uses: actions/download-artifact@v4
        with:
          pattern: public-fx-data-pilot-2024-12-USDJPY-d*-29569149852
          path: data/source/H2/2024-12
          merge-multiple: true
          run-id: 29569149852
          github-token: ${{ github.token }}

      - name: Add accepted aggregate-repair M15 bars
        run: |
          set -euo pipefail
          for block in H1 H2; do
            for month_dir in data/baselines/${block}/2024-*; do
              [ -d "${month_dir}" ] || continue
              month="$(basename "${month_dir}")"
              repair_file="${month_dir}/source_aggregate_repair/bars/M15/USDJPY_M15.csv.gz"
              if [ -f "${repair_file}" ]; then
                target="data/source/${block}/${month}/baseline_aggregate_repair/M15"
                mkdir -p "${target}"
                cp "${repair_file}" "${target}/USDJPY_M15.csv.gz"
                echo "${block} ${month}: added aggregate-repair M15"
              else
                echo "${block} ${month}: no aggregate-repair M15"
              fi
            done
          done

      - name: Audit all six H2 source manifests against fixed weekday hours
        run: |
          set -euo pipefail
          mkdir -p data/h2_source_audit
          for month in 2024-07 2024-08 2024-09 2024-10 2024-11 2024-12; do
            case "${month}" in
              2024-07) start="2024-07-01T00"; end="2024-08-01T00" ;;
              2024-08) start="2024-08-01T00"; end="2024-09-01T00" ;;
              2024-09) start="2024-09-01T00"; end="2024-10-01T00" ;;
              2024-10) start="2024-10-01T00"; end="2024-11-01T00" ;;
              2024-11) start="2024-11-01T00"; end="2024-12-01T00" ;;
              2024-12) start="2024-12-01T00"; end="2025-01-01T00" ;;
            esac
            python tools/summarize_download_manifest.py \
              --manifest "data/baselines/H2/${month}/source_combined/download_manifest.jsonl" \
              --symbols USDJPY \
              --start "${start}" \
              --end "${end}" \
              --output "data/h2_source_audit/${month}.json" \
              --min-coverage 1.0 \
              --max-hard-errors 0 \
              --expected-records-mode weekdays
          done
          python - <<'PY'
          import json
          from pathlib import Path

          expected = {
              "2024-07": 552,
              "2024-08": 528,
              "2024-09": 504,
              "2024-10": 552,
              "2024-11": 504,
              "2024-12": 528,
          }
          for month, expected_records in expected.items():
              data = json.loads(Path(f"data/h2_source_audit/{month}.json").read_text())
              assert data["expected_records_mode"] == "weekdays"
              assert data["expected_records"] == expected_records
              assert data["observed_records"] == expected_records
              assert data["unobserved_records"] == 0
              assert data["hard_error_records"] == 0
              assert data["effective_coverage"] == 1.0
          print({"h2_source_months": 6, "fixed_weekday_audit": "passed"})
          PY

      - name: Run preregistered joint H2 evaluator
        run: |
          python tools/run_usdjpy_joint_h2_a1_e3_eval_v1.py \
            --h1-bars 2024-01=data/source/H1/2024-01 \
            --h1-bars 2024-02=data/source/H1/2024-02 \
            --h1-bars 2024-03=data/source/H1/2024-03 \
            --h1-bars 2024-04=data/source/H1/2024-04 \
            --h1-bars 2024-05=data/source/H1/2024-05 \
            --h1-bars 2024-06=data/source/H1/2024-06 \
            --h2-bars 2024-07=data/source/H2/2024-07 \
            --h2-bars 2024-08=data/source/H2/2024-08 \
            --h2-bars 2024-09=data/source/H2/2024-09 \
            --h2-bars 2024-10=data/source/H2/2024-10 \
            --h2-bars 2024-11=data/source/H2/2024-11 \
            --h2-bars 2024-12=data/source/H2/2024-12 \
            --registry configs/research/usdjpy_h1_multi_family_candidates_v1.json \
            --eval-config configs/research/usdjpy_joint_h2_a1_e3_eval_v1.json \
            --session-config configs/market_sessions/fx_market_sessions_v1.json \
            --output-dir data/experiments/usdjpy_joint_h2_a1_e3_eval_v1

      - name: Verify evaluator metadata and output completeness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root = Path("data/experiments/usdjpy_joint_h2_a1_e3_eval_v1")
          required = [
              "source_bar_coverage.csv",
              "h1_regression.csv",
              "h2_candidate_summary.csv",
              "h2_candidate_monthly.csv",
              "h2_gate_results.csv",
              "h2_direction_attribution.csv",
              "h2_daily_net_pips.csv",
              "h2_candidate_trades.csv",
              "h2_decision.json",
              "run_metadata.json",
          ]
          for name in required:
              path = root / name
              assert path.exists() and path.stat().st_size > 0, name
          h1 = pd.read_csv(root / "h1_regression.csv")
          assert len(h1) == 2
          assert set(h1["status"]) == {"passed"}
          summary = pd.read_csv(root / "h2_candidate_summary.csv")
          assert set(summary["candidate_id"]) == {
              "A1_impulse_breakout_lb3_hold6",
              "E3_trend_24h_resumption_hold6",
          }
          monthly = pd.read_csv(root / "h2_candidate_monthly.csv")
          assert len(monthly) == 12
          assert set(monthly["month"]) == {
              "2024-07", "2024-08", "2024-09",
              "2024-10", "2024-11", "2024-12",
          }
          gates = pd.read_csv(root / "h2_gate_results.csv")
          assert gates.groupby("candidate_id").size().to_dict() == {
              "A1_impulse_breakout_lb3_hold6": 13,
              "E3_trend_24h_resumption_hold6": 13,
          }
          metadata = json.loads((root / "run_metadata.json").read_text())
          assert metadata["h1_regression"] == "passed"
          assert metadata["parameter_changes_after_h2_open"] is False
          assert metadata["exit_optimization_performed"] is False
          print({"evaluator_outputs": "complete", "candidate_count": 2})
          PY

      - name: Write H2 decision summary
        if: always()
        run: |
          echo "# USDJPY Joint H2 A1/E3 Evaluation v1" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Frozen candidates: A1+hold6 and E3+hold6" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Source audit" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          for f in data/h2_source_audit/*.json; do
            echo "$(basename "$f"): $(cat "$f")" >> "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## H1 regression" >> "$GITHUB_STEP_SUMMARY"
          echo '```csv' >> "$GITHUB_STEP_SUMMARY"
          cat data/experiments/usdjpy_joint_h2_a1_e3_eval_v1/h1_regression.csv >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## H2 candidate summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```csv' >> "$GITHUB_STEP_SUMMARY"
          cat data/experiments/usdjpy_joint_h2_a1_e3_eval_v1/h2_candidate_summary.csv >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Decision" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat data/experiments/usdjpy_joint_h2_a1_e3_eval_v1/h2_decision.json >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload joint H2 evaluation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usdjpy-joint-h2-a1-e3-eval-v1-${{ github.run_id }}
          path: |
            data/h2_source_audit/*.json
            data/experiments/usdjpy_joint_h2_a1_e3_eval_v1/*.csv
            data/experiments/usdjpy_joint_h2_a1_e3_eval_v1/*.json
          if-no-files-found: error
          retention-days: 30
