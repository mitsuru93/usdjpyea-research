name: Evaluate USDJPY B02 F05 Structural SL Policy Regime v3

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '.github/workflows/evaluate_usdjpy_b02_f05_structural_sl_policy_regime_v3.yml'
      - 'configs/research/usdjpy_b02_f05_structural_sl_policy_regime_protocol_v3.json'
      - 'tools/evaluate_usdjpy_b02_f05_structural_sl_policy_regime_v3.py'
      - 'tools/usdjpy_policy_v3/**'
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type RUN_STRUCTURAL_SL_POLICY_REGIME_V3'
        required: true
        type: string

permissions:
  contents: write
  issues: write

jobs:
  preflight:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==2.1.3' 'pandas==2.2.3' 'scipy==1.15.3' 'scikit-learn==1.6.1'
      - name: Verify source identities and outcome-free preflight
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            'b6369d2902a570298eb602a8eacb8de333ed898165d1700a529ab43c8ff3734d' tools/evaluate_usdjpy_b02_f05_structural_sl_policy_regime_v3.py \
            '2d97c2cd11c197f3ea340c67bdbcc2b8ccbd617c31e4d4d5f58ef4efa2ed51a2' tools/usdjpy_policy_v3/common.py \
            'a0b98009646b4325e80a2db84e0fba2848bcb3c6140b13da6e668660e1d2686c' configs/research/usdjpy_b02_f05_structural_sl_policy_regime_protocol_v3.json | sha256sum -c -
          python -m py_compile tools/evaluate_usdjpy_b02_f05_structural_sl_policy_regime_v3.py tools/usdjpy_policy_v3/common.py tools/evaluate_usdjpy_b02_f05_structural_sl_atlas_v2.py
          python tools/evaluate_usdjpy_b02_f05_structural_sl_policy_regime_v3.py \
            --protocol configs/research/usdjpy_b02_f05_structural_sl_policy_regime_protocol_v3.json \
            --preflight-only > preflight_v3.json
          jq -e '.status=="PASS_NO_OUTCOMES" and .methods==6 and .policy_cells==72 and .outcomes_computed==false and .mt4_accessed==false and ."2025_accessed"==false and .candidate_frozen==false and .notion_task_dependency==false' preflight_v3.json
          python - <<'PY'
          import sys
          import pandas as pd
          sys.path.insert(0, 'tools')
          from usdjpy_policy_v3.common import policy_summary
          master=pd.DataFrame({'month':['2023-01','2023-02']})
          result=policy_summary(pd.DataFrame(),master,'ZERO_TRIGGER_REPAIR_TEST','EMPTY')
          assert result['triggers']==0 and result['binding_gate_pass'] is False
          print('PASS_ZERO_TRIGGER_POLICY_SUMMARY')
          PY
      - name: Verify immutable atlas and historical authorities
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inputs/atlas inputs/historical inputs/2023 inputs/2024h1 inputs/2024h2 inputs/derived
          gh release download usdjpy-b02-f05-structural-sl-atlas-v2 --repo "$GITHUB_REPOSITORY" --dir inputs/atlas --pattern 'usdjpy-b02-f05-structural-sl-atlas-v2-30106687299-1.zip'
          unzip -q inputs/atlas/usdjpy-b02-f05-structural-sl-atlas-v2-30106687299-1.zip -d inputs/atlas/package
          printf '%s  %s\n' \
            '6780a28200975da6848dfd8760a96ba67f52327197649a2836c8e32e03c2a0a1' inputs/atlas/package/atlas_output/deterministic_event_ledger_v2.csv.gz \
            'd8e5da0b67d3e501e45071b54c6a784e7a5cb82cdbfa4458142c71c4693edd3a' inputs/atlas/package/atlas_output/deterministic_candidate_metrics_v2.csv \
            '27b04ab651e3fe4d72a6a4d8b6f960de20d9b876f73a3d45a8cc931b77eeb609' inputs/atlas/package/atlas_output/trajectory_diagnostics_v2.csv | sha256sum -c -
          gh release download f05-failed-reclaim-historical-authorities-v1 --repo "$GITHUB_REPOSITORY" --dir inputs/historical \
            --pattern 'usdjpy-2023-canonical-baseline-prep-v1.zip' \
            --pattern 'mt4-usdjpy-2024h1-event-audit-v1.zip' \
            --pattern 'mt4-usdjpy-f05-extatr-h2-validation-v1.zip' \
            --pattern 'EXPECTED_SHA256SUMS'
          (cd inputs/historical && sha256sum -c EXPECTED_SHA256SUMS)
          unzip -q inputs/historical/usdjpy-2023-canonical-baseline-prep-v1.zip -d inputs/2023
          unzip -q inputs/historical/mt4-usdjpy-2024h1-event-audit-v1.zip -d inputs/2024h1
          unzip -q inputs/historical/mt4-usdjpy-f05-extatr-h2-validation-v1.zip -d inputs/2024h2
          gh release download usdjpy-2024-derived-bars-v1 --repo "$GITHUB_REPOSITORY" --dir inputs/derived --pattern 'USDJPY-2024-m1-derived-bars-v1.csv.gz'
          printf '%s  %s\n' \
            '4c10ab3244996d73d0955850675231a533f918da09a41ac642c9a3e287b7ac78' inputs/2023/normalized/usdjpy_2023_m15_bid_utc_rakuten_mt4_v1.csv.gz \
            '167509bde6553a468ffe48b082ed79de183cc57991f668cf4b3e7341350d307e' inputs/2023/normalized/usdjpy_2023_m1_bid_utc_rakuten_mt4_v1.csv.gz \
            '9560d6382e2457eaec83415316fb59d4989244d49c9977ce76cbdd717f32f09a' inputs/2024h1/tester/fx2_usdjpy_2024h1_event_audit_fixed_001_each_v1.csv \
            'a5a871d7105c6e68548e804c9ab517ee6bc0b08553474b158799f47ebd32edcd' inputs/2024h2/h2_baseline/fx2_usdjpy_f05_extatr_h2_baseline_v1.csv \
            'f9f56be2daa39f07dc39cec197306fb87821ead01e4a640a73f17715bf27dde0' inputs/derived/USDJPY-2024-m1-derived-bars-v1.csv.gz | sha256sum -c -

  evaluate:
    if: github.event_name == 'workflow_dispatch' && inputs.confirmation == 'RUN_STRUCTURAL_SL_POLICY_REGIME_V3'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==2.1.3' 'pandas==2.2.3' 'scipy==1.15.3' 'scikit-learn==1.6.1'
      - name: Verify frozen source package
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            'b6369d2902a570298eb602a8eacb8de333ed898165d1700a529ab43c8ff3734d' tools/evaluate_usdjpy_b02_f05_structural_sl_policy_regime_v3.py \
            '2d97c2cd11c197f3ea340c67bdbcc2b8ccbd617c31e4d4d5f58ef4efa2ed51a2' tools/usdjpy_policy_v3/common.py \
            'a0b98009646b4325e80a2db84e0fba2848bcb3c6140b13da6e668660e1d2686c' configs/research/usdjpy_b02_f05_structural_sl_policy_regime_protocol_v3.json | sha256sum -c -
          python -m py_compile tools/evaluate_usdjpy_b02_f05_structural_sl_policy_regime_v3.py tools/usdjpy_policy_v3/common.py tools/evaluate_usdjpy_b02_f05_structural_sl_atlas_v2.py
          python tools/evaluate_usdjpy_b02_f05_structural_sl_policy_regime_v3.py --protocol configs/research/usdjpy_b02_f05_structural_sl_policy_regime_protocol_v3.json --preflight-only > preflight_v3.json
          jq -e '.status=="PASS_NO_OUTCOMES" and .policy_cells==72' preflight_v3.json
      - name: Download and verify exact inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inputs/atlas inputs/historical inputs/2023 inputs/2024h1 inputs/2024h2 inputs/derived
          gh release download usdjpy-b02-f05-structural-sl-atlas-v2 --repo "$GITHUB_REPOSITORY" --dir inputs/atlas --pattern 'usdjpy-b02-f05-structural-sl-atlas-v2-30106687299-1.zip'
          unzip -q inputs/atlas/usdjpy-b02-f05-structural-sl-atlas-v2-30106687299-1.zip -d inputs/atlas/package
          printf '%s  %s\n' \
            '6780a28200975da6848dfd8760a96ba67f52327197649a2836c8e32e03c2a0a1' inputs/atlas/package/atlas_output/deterministic_event_ledger_v2.csv.gz \
            'd8e5da0b67d3e501e45071b54c6a784e7a5cb82cdbfa4458142c71c4693edd3a' inputs/atlas/package/atlas_output/deterministic_candidate_metrics_v2.csv \
            '27b04ab651e3fe4d72a6a4d8b6f960de20d9b876f73a3d45a8cc931b77eeb609' inputs/atlas/package/atlas_output/trajectory_diagnostics_v2.csv | sha256sum -c -
          gh release download f05-failed-reclaim-historical-authorities-v1 --repo "$GITHUB_REPOSITORY" --dir inputs/historical \
            --pattern 'usdjpy-2023-canonical-baseline-prep-v1.zip' \
            --pattern 'mt4-usdjpy-2024h1-event-audit-v1.zip' \
            --pattern 'mt4-usdjpy-f05-extatr-h2-validation-v1.zip' \
            --pattern 'EXPECTED_SHA256SUMS'
          (cd inputs/historical && sha256sum -c EXPECTED_SHA256SUMS)
          unzip -q inputs/historical/usdjpy-2023-canonical-baseline-prep-v1.zip -d inputs/2023
          unzip -q inputs/historical/mt4-usdjpy-2024h1-event-audit-v1.zip -d inputs/2024h1
          unzip -q inputs/historical/mt4-usdjpy-f05-extatr-h2-validation-v1.zip -d inputs/2024h2
          gh release download usdjpy-2024-derived-bars-v1 --repo "$GITHUB_REPOSITORY" --dir inputs/derived --pattern 'USDJPY-2024-m1-derived-bars-v1.csv.gz'
          printf '%s  %s\n' \
            '4c10ab3244996d73d0955850675231a533f918da09a41ac642c9a3e287b7ac78' inputs/2023/normalized/usdjpy_2023_m15_bid_utc_rakuten_mt4_v1.csv.gz \
            '167509bde6553a468ffe48b082ed79de183cc57991f668cf4b3e7341350d307e' inputs/2023/normalized/usdjpy_2023_m1_bid_utc_rakuten_mt4_v1.csv.gz \
            '9560d6382e2457eaec83415316fb59d4989244d49c9977ce76cbdd717f32f09a' inputs/2024h1/tester/fx2_usdjpy_2024h1_event_audit_fixed_001_each_v1.csv \
            'a5a871d7105c6e68548e804c9ab517ee6bc0b08553474b158799f47ebd32edcd' inputs/2024h2/h2_baseline/fx2_usdjpy_f05_extatr_h2_baseline_v1.csv \
            'f9f56be2daa39f07dc39cec197306fb87821ead01e4a640a73f17715bf27dde0' inputs/derived/USDJPY-2024-m1-derived-bars-v1.csv.gz | sha256sum -c -
      - name: Run frozen policy/regime audit
        id: evaluate
        shell: bash
        run: |
          set -o pipefail
          python tools/evaluate_usdjpy_b02_f05_structural_sl_policy_regime_v3.py \
            --protocol configs/research/usdjpy_b02_f05_structural_sl_policy_regime_protocol_v3.json \
            --atlas-dir inputs/atlas/package/atlas_output \
            --m15-2023 inputs/2023/normalized/usdjpy_2023_m15_bid_utc_rakuten_mt4_v1.csv.gz \
            --m1-2023 inputs/2023/normalized/usdjpy_2023_m1_bid_utc_rakuten_mt4_v1.csv.gz \
            --events-2024h1 inputs/2024h1/tester/fx2_usdjpy_2024h1_event_audit_fixed_001_each_v1.csv \
            --events-2024h2 inputs/2024h2/h2_baseline/fx2_usdjpy_f05_extatr_h2_baseline_v1.csv \
            --m1-2024 inputs/derived/USDJPY-2024-m1-derived-bars-v1.csv.gz \
            --out-dir policy_output \
            --research-commit "$GITHUB_SHA" --workflow-run-id "$GITHUB_RUN_ID" --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" 2>&1 | tee policy_evaluation.log
          jq -e '(.status=="POLICY_REGIME_AUDIT_COMPLETE_NO_SURVIVOR" or .status=="POLICY_REGIME_AUDIT_COMPLETE_SURVIVOR_REQUIRES_FULL_REPLAY") and .population.trade_count==1882 and .population.baseline_loser_count==916 and .methods.monthly_walk_forward_cells==9 and .methods.regime_router_cells==9 and .methods.family_vote_cells==18 and .methods.dynamic_policy_cells==24 and .methods.gaussian_markov_cells==12 and .decision.candidate_frozen==false and .decision.implementation_authorized==false and .boundaries.mt4_accessed==false and .boundaries."2025H1_accessed"==false and .boundaries."2025H2_accessed"==false' policy_output/result_v3.json
      - name: Package evidence
        if: steps.evaluate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          cp configs/research/usdjpy_b02_f05_structural_sl_policy_regime_protocol_v3.json policy_output/
          cp tools/evaluate_usdjpy_b02_f05_structural_sl_policy_regime_v3.py policy_output/
          cp -R tools/usdjpy_policy_v3 policy_output/
          cp policy_evaluation.log policy_output/
          find policy_output -type f -print0 | sort -z | xargs -0 sha256sum > policy_output/PACKAGE_SHA256SUMS
          zip -q -X -r "usdjpy-b02-f05-structural-sl-policy-regime-v3-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.zip" policy_output
      - name: Upload evidence
        id: upload
        if: steps.evaluate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: usdjpy-b02-f05-structural-sl-policy-regime-v3-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            policy_output
            usdjpy-b02-f05-structural-sl-policy-regime-v3-${{ github.run_id }}-${{ github.run_attempt }}.zip
          retention-days: 90
          compression-level: 0
      - name: Publish immutable Research Release
        if: steps.evaluate.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          asset="usdjpy-b02-f05-structural-sl-policy-regime-v3-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.zip"
          gh release create usdjpy-b02-f05-structural-sl-policy-regime-v3 "$asset" --target "$GITHUB_SHA" --title 'USDJPY B02/F05 structural SL policy/regime v3' --notes 'Frozen time-ordered policy, regime, dynamic stopping, Gaussian Markov and oracle audit. No candidate freeze, MT4 or 2025 access.' --repo "$GITHUB_REPOSITORY"
      - name: Publish receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        shell: bash
        run: |
          status='NOT_AVAILABLE'; survivors='NOT_AVAILABLE'; state_rows='NOT_AVAILABLE'; error_tail=''
          if [[ -f policy_output/result_v3.json ]]; then
            status=$(jq -r '.status' policy_output/result_v3.json)
            survivors=$(jq -r '.survivor_count' policy_output/result_v3.json)
            state_rows=$(jq -r '.population.state_rows' policy_output/result_v3.json)
          fi
          [[ -f policy_evaluation.log ]] && error_tail=$(tail -n 20 policy_evaluation.log)
          cat > receipt.md <<EOF
          workflow: evaluate_usdjpy_b02_f05_structural_sl_policy_regime_v3.yml
          run_id: ${GITHUB_RUN_ID}
          run_attempt: ${GITHUB_RUN_ATTEMPT}
          head_sha: ${GITHUB_SHA}
          job_status: ${JOB_STATUS}
          result_status: ${status}
          policy_cells: 72
          state_rows: ${state_rows}
          survivor_count: ${survivors}
          artifact_id: ${ARTIFACT_ID}
          artifact_digest: ${ARTIFACT_DIGEST}
          release_tag: usdjpy-b02-f05-structural-sl-policy-regime-v3
          run_url: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          full_admission_portfolio_replay: false
          mt4_accessed: false
          2025_accessed: false
          candidate_frozen: false

          error_tail:
          \`\`\`
          ${error_tail}
          \`\`\`
          EOF
          gh issue create --repo "$GITHUB_REPOSITORY" --title "[structural-sl-policy-regime-v3] ${GITHUB_RUN_ID} ${JOB_STATUS}" --body-file receipt.md
