name: Cancel unauthorized USDJPY 2025 run 29742177490

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cancel_unauthorized_usdjpy_2025_run_29742177490.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel-exact-run:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel exact unauthorized run and verify no artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: "29742177490"
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPOSITORY/actions/runs/$RUN_ID"
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$api/cancel" || true
          for _ in $(seq 1 30); do
            payload="$(curl --fail --silent --show-error \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$api")"
            status="$(printf '%s' "$payload" | python -c 'import json,sys; print(json.load(sys.stdin)["status"])')"
            conclusion="$(printf '%s' "$payload" | python -c 'import json,sys; print(json.load(sys.stdin).get("conclusion"))')"
            echo "status=$status conclusion=$conclusion"
            if [[ "$status" == "completed" ]]; then break; fi
            sleep 2
          done
          artifacts="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$api/artifacts?per_page=100")"
          count="$(printf '%s' "$artifacts" | python -c 'import json,sys; print(json.load(sys.stdin)["total_count"])')"
          test "$count" -eq 0
