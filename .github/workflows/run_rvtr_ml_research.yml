name: Run RV/TR ML Research (Self Hosted)

on:
  workflow_dispatch:
    inputs:
      source_root:
        description: Completed run source root containing label-source artifacts
        required: true
        default: research/reports/batches/batch_band_model_screen_v2
        type: string
      output_dir:
        description: Output directory for RV/TR ML artifacts
        required: true
        default: research/reports/rvtr_ml_research
        type: string
      control_run_dir:
        description: Optional bin_env_v1 run directory for review
        required: false
        default: ''
        type: string
      current_run_dir:
        description: Optional total_score_rvtr_v1 run directory for review
        required: false
        default: ''
        type: string
      distilled_run_dir:
        description: Optional total_score_rvtr_v2_ml run directory for review
        required: false
        default: ''
        type: string

jobs:
  run-rvtr-ml:
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build RV/TR label table
        run: |
          python -u tools/build_rvtr_label_table.py \
            --source-root "${{ inputs.source_root }}" \
            --output-dir "${{ inputs.output_dir }}"

      - name: Train RV/TR logistic model
        run: |
          python -u tools/train_rvtr_logit_v1.py \
            --label-table "${{ inputs.output_dir }}/rvtr_label_table_trainable_v1.csv.gz" \
            --output-dir "${{ inputs.output_dir }}"

      - name: Distill RV/TR score weights
        run: |
          python -u tools/distill_rvtr_score_v1.py \
            --coef-csv "${{ inputs.output_dir }}/rvtr_logit_v1_coef.csv" \
            --output-dir "${{ inputs.output_dir }}"

      - name: Review RV/TR ML results
        if: ${{ inputs.control_run_dir != '' && inputs.current_run_dir != '' && inputs.distilled_run_dir != '' }}
        run: |
          python -u tools/review_rvtr_ml.py \
            --control-run-dir "${{ inputs.control_run_dir }}" \
            --current-run-dir "${{ inputs.current_run_dir }}" \
            --distilled-run-dir "${{ inputs.distilled_run_dir }}" \
            --coef-csv "${{ inputs.output_dir }}/rvtr_logit_v1_coef.csv" \
            --distilled-yaml "${{ inputs.output_dir }}/distilled_total_score_rvtr_v2.yaml" \
            --output-dir "${{ inputs.output_dir }}/review"

      - name: Upload RV/TR ML artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rvtr-ml-research-${{ github.run_id }}
          path: |
            ${{ inputs.output_dir }}/rvtr_label_table_v1.csv.gz
            ${{ inputs.output_dir }}/rvtr_label_table_trainable_v1.csv.gz
            ${{ inputs.output_dir }}/rvtr_label_table_v1.summary.json
            ${{ inputs.output_dir }}/label_distribution_overall.csv
            ${{ inputs.output_dir }}/label_distribution_by_month.csv
            ${{ inputs.output_dir }}/label_distribution_by_session.csv
            ${{ inputs.output_dir }}/label_distribution_by_band.csv
            ${{ inputs.output_dir }}/rvtr_logit_v1_coef.csv
            ${{ inputs.output_dir }}/rvtr_logit_v1_metrics.json
            ${{ inputs.output_dir }}/rvtr_logit_v1_predictions.csv.gz
            ${{ inputs.output_dir }}/distilled_total_score_rvtr_v2.yaml
            ${{ inputs.output_dir }}/distilled_feature_importance.csv
            ${{ inputs.output_dir }}/review/rvtr_ml_review.md
            ${{ inputs.output_dir }}/review/rvtr_ml_compare.csv
            ${{ inputs.output_dir }}/review/rvtr_ml_by_month.csv
            ${{ inputs.output_dir }}/review/rvtr_ml_by_session.csv
            ${{ inputs.output_dir }}/review/rvtr_ml_by_band.csv

