name: Reusable Public FX Tick Symbol Pilot Monthly

on:
  workflow_call:
    inputs:
      symbol:
        required: true
        type: string
      pilot_tag:
        required: true
        type: string
      start_utc_hour:
        required: true
        type: string
      end_utc_hour:
        required: true
        type: string
      min_coverage:
        required: false
        type: string
        default: "1.0"
      max_hard_errors:
        required: false
        type: string
        default: "0"
      collect_max_parallel:
        required: false
        type: number
        default: 4

concurrency:
  group: public-fx-tick-${{ inputs.symbol }}-${{ inputs.pilot_tag }}
  cancel-in-progress: false

env:
  START: ${{ inputs.start_utc_hour }}
  END: ${{ inputs.end_utc_hour }}
  TIMEFRAMES: "M1 M5 M15 H1"
  SYMBOL: ${{ inputs.symbol }}
  PILOT_TAG: ${{ inputs.pilot_tag }}
  MIN_COVERAGE: ${{ inputs.min_coverage }}
  MAX_HARD_ERRORS: ${{ inputs.max_hard_errors }}

jobs:
  prepare-chunks:
    name: prepare-${{ inputs.symbol }}-${{ inputs.pilot_tag }}-chunks
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.chunks.outputs.chunks }}
    steps:
      - name: Build weekday chunk matrix
        id: chunks
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timedelta

          start = datetime.strptime(os.environ["START"], "%Y-%m-%dT%H")
          end = datetime.strptime(os.environ["END"], "%Y-%m-%dT%H")
          if start >= end:
              raise SystemExit(f"invalid range: {start} >= {end}")
          if start.hour != 0 or end.hour != 0:
              raise SystemExit("monthly pilot currently expects midnight UTC boundaries")

          chunks = []
          current = start
          idx = 1
          while current < end:
              nxt = current + timedelta(days=1)
              if current.weekday() < 5:
                  chunks.append({
                      "chunk": f"d{idx:02d}",
                      "start": current.strftime("%Y-%m-%dT%H"),
                      "end": nxt.strftime("%Y-%m-%dT%H"),
                  })
                  idx += 1
              current = nxt

          if not chunks:
              raise SystemExit("no weekday chunks generated")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("chunks=" + json.dumps(chunks, separators=(",", ":")) + "\n")
          print(json.dumps({"chunk_count": len(chunks), "first": chunks[0], "last": chunks[-1]}, sort_keys=True))
          PY

  collect-day:
    name: collect-${{ inputs.symbol }}-${{ matrix.chunk }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: prepare-chunks
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.collect_max_parallel }}
      matrix:
        include: ${{ fromJson(needs.prepare-chunks.outputs.chunks) }}
    env:
      CHUNK: ${{ matrix.chunk }}
      CHUNK_START: ${{ matrix.start }}
      CHUNK_END: ${{ matrix.end }}
      OUTPUT_TAG: ${{ inputs.pilot_tag }}-${{ matrix.chunk }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas pyyaml

      - name: Compile tools
        run: |
          python -m py_compile \
            tools/download_dukascopy_bi5_ticks.py \
            tools/retry_dukascopy_manifest_errors.py \
            tools/summarize_download_manifest.py \
            tools/resample_fx_ticks.py \
            tools/resample_from_download_manifest.py \
            tools/validate_fx_bar_artifacts.py \
            tools/build_market_profile.py

      - name: Download public tick data
        run: |
          mkdir -p data/raw/dukascopy_bi5_${OUTPUT_TAG}
          timeout --kill-after=30s 50m python tools/download_dukascopy_bi5_ticks.py \
            --symbols ${SYMBOL} \
            --start "${CHUNK_START}" \
            --end "${CHUNK_END}" \
            --output-root data/raw/dukascopy_bi5_${OUTPUT_TAG} \
            --manifest-out data/raw/dukascopy_bi5_${OUTPUT_TAG}/download_manifest.jsonl \
            --max-errors 9999 \
            --retries 2 \
            --sleep-seconds 1.0 \
            --request-timeout 25 \
            --request-interval 0.35 \
            --error-retry-passes 4 \
            --error-retry-sleep-seconds 8 \
            --error-retry-request-timeout 45 \
            --error-retry-retries 3 \
          || echo "download command ended before full chunk; manifest will be summarized"

      - name: Summarize download coverage
        if: always()
        run: |
          if [ -f data/raw/dukascopy_bi5_${OUTPUT_TAG}/download_manifest.jsonl ]; then
            python tools/summarize_download_manifest.py \
              --manifest data/raw/dukascopy_bi5_${OUTPUT_TAG}/download_manifest.jsonl \
              --symbols ${SYMBOL} \
              --start "${CHUNK_START}" \
              --end "${CHUNK_END}" \
              --output data/raw/dukascopy_bi5_${OUTPUT_TAG}/download_summary.json \
              --min-coverage 0.0 \
              --max-hard-errors 9999
          else
            mkdir -p data/raw/dukascopy_bi5_${OUTPUT_TAG}
            echo '{"status":"missing_manifest","symbol":"'"${SYMBOL}"'","chunk":"'"${CHUNK}"'"}' > data/raw/dukascopy_bi5_${OUTPUT_TAG}/download_summary.json
          fi

      - name: Resample downloaded ticks
        if: always()
        run: |
          if [ -f data/raw/dukascopy_bi5_${OUTPUT_TAG}/download_manifest.jsonl ]; then
            python tools/resample_from_download_manifest.py \
              --manifest data/raw/dukascopy_bi5_${OUTPUT_TAG}/download_manifest.jsonl \
              --output-dir data/processed/dukascopy_bi5_${OUTPUT_TAG}_bars \
              --timeframes ${TIMEFRAMES}
          else
            echo "download_manifest.jsonl missing; skip resample"
          fi

      - name: Validate resampled bars
        if: always()
        run: |
          args=""
          if [ -d data/processed/dukascopy_bi5_${OUTPUT_TAG}_bars ]; then
            for f in data/processed/dukascopy_bi5_${OUTPUT_TAG}_bars/*/*.csv.gz; do
              [ -e "$f" ] || continue
              args="$args --input $f"
            done
          fi
          if [ -n "$args" ]; then
            python tools/validate_fx_bar_artifacts.py \
              $args \
              --output data/processed/dukascopy_bi5_${OUTPUT_TAG}_bars/validation_summary.json
          else
            mkdir -p data/processed/dukascopy_bi5_${OUTPUT_TAG}_bars
            echo '{"status":"no_resampled_bars","symbol":"'"${SYMBOL}"'","chunk":"'"${CHUNK}"'"}' > data/processed/dukascopy_bi5_${OUTPUT_TAG}_bars/validation_summary.json
          fi

      - name: Build market profiles by timeframe
        if: always()
        run: |
          mkdir -p data/profiles/dukascopy_bi5_${OUTPUT_TAG}_market_profile
          if [ -d data/processed/dukascopy_bi5_${OUTPUT_TAG}_bars ]; then
            for tf in ${TIMEFRAMES}; do
              args=""
              for f in data/processed/dukascopy_bi5_${OUTPUT_TAG}_bars/${tf}/*.csv.gz; do
                [ -e "$f" ] || continue
                args="$args --input $f"
              done
              if [ -n "$args" ]; then
                python tools/build_market_profile.py \
                  $args \
                  --output-dir data/profiles/dukascopy_bi5_${OUTPUT_TAG}_market_profile/${tf}
              fi
            done
          fi

      - name: Write chunk summary
        if: always()
        run: |
          echo "# Public FX Tick Pilot / ${SYMBOL} ${CHUNK}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "pilot_tag: ${PILOT_TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "chunk_start: ${CHUNK_START}" >> "$GITHUB_STEP_SUMMARY"
          echo "chunk_end: ${CHUNK_END}" >> "$GITHUB_STEP_SUMMARY"
          echo "timeframes: ${TIMEFRAMES}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Download summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat data/raw/dukascopy_bi5_${OUTPUT_TAG}/download_summary.json >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Validation summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat data/processed/dukascopy_bi5_${OUTPUT_TAG}_bars/validation_summary.json >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload day artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-fx-data-${{ env.OUTPUT_TAG }}-${{ github.run_id }}
          path: |
            data/raw/dukascopy_bi5_${{ env.OUTPUT_TAG }}/download_manifest.jsonl
            data/raw/dukascopy_bi5_${{ env.OUTPUT_TAG }}/download_summary.json
            data/processed/dukascopy_bi5_${{ env.OUTPUT_TAG }}_bars/**/*.csv.gz
            data/processed/dukascopy_bi5_${{ env.OUTPUT_TAG }}_bars/resample_manifest.jsonl
            data/processed/dukascopy_bi5_${{ env.OUTPUT_TAG }}_bars/validation_summary.json
            data/profiles/dukascopy_bi5_${{ env.OUTPUT_TAG }}_market_profile/**/*.csv
          if-no-files-found: warn
          retention-days: 14

  aggregate-symbol:
    name: aggregate-${{ inputs.symbol }}-${{ inputs.pilot_tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: collect-day
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas pyyaml

      - name: Compile tools
        run: |
          python -m py_compile \
            tools/download_dukascopy_bi5_ticks.py \
            tools/retry_dukascopy_manifest_errors.py \
            tools/summarize_download_manifest.py \
            tools/resample_fx_ticks.py \
            tools/resample_from_download_manifest.py \
            tools/validate_fx_bar_artifacts.py \
            tools/build_market_profile.py

      - name: Download day artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: public-fx-data-${{ env.PILOT_TAG }}-*-${{ github.run_id }}
          path: data/symbol_day_artifacts
          merge-multiple: true

      - name: Combine day manifests
        run: |
          mkdir -p data/raw/dukascopy_bi5_${PILOT_TAG}_combined
          find data/symbol_day_artifacts -path "*/download_manifest.jsonl" -type f -print0 | sort -z | xargs -0 cat > data/raw/dukascopy_bi5_${PILOT_TAG}_combined/download_manifest.initial.jsonl

      - name: Repair aggregate error hours
        run: |
          mkdir -p data/raw/dukascopy_bi5_${PILOT_TAG}_aggregate_repair
          timeout --kill-after=30s 70m python tools/retry_dukascopy_manifest_errors.py \
            --manifest data/raw/dukascopy_bi5_${PILOT_TAG}_combined/download_manifest.initial.jsonl \
            --output-root data/raw/dukascopy_bi5_${PILOT_TAG}_aggregate_repair \
            --manifest-out data/raw/dukascopy_bi5_${PILOT_TAG}_combined/download_manifest.aggregate_repair.jsonl \
            --passes 8 \
            --retries 5 \
            --sleep-seconds 2.0 \
            --request-timeout 75 \
            --request-interval 1.5 \
            --pass-sleep-seconds 30 \
          || echo "aggregate repair ended before all error hours were recovered"

      - name: Resample aggregate repairs
        if: always()
        run: |
          if [ -s data/raw/dukascopy_bi5_${PILOT_TAG}_combined/download_manifest.aggregate_repair.jsonl ]; then
            python tools/resample_from_download_manifest.py \
              --manifest data/raw/dukascopy_bi5_${PILOT_TAG}_combined/download_manifest.aggregate_repair.jsonl \
              --output-dir data/processed/dukascopy_bi5_${PILOT_TAG}_aggregate_repair_bars \
              --timeframes ${TIMEFRAMES}
          else
            mkdir -p data/processed/dukascopy_bi5_${PILOT_TAG}_aggregate_repair_bars
            echo "no aggregate repair manifest records; skip repair resample"
          fi

      - name: Finalize download coverage
        run: |
          cat data/raw/dukascopy_bi5_${PILOT_TAG}_combined/download_manifest.initial.jsonl > data/raw/dukascopy_bi5_${PILOT_TAG}_combined/download_manifest.jsonl
          if [ -s data/raw/dukascopy_bi5_${PILOT_TAG}_combined/download_manifest.aggregate_repair.jsonl ]; then
            cat data/raw/dukascopy_bi5_${PILOT_TAG}_combined/download_manifest.aggregate_repair.jsonl >> data/raw/dukascopy_bi5_${PILOT_TAG}_combined/download_manifest.jsonl
          fi
          python tools/summarize_download_manifest.py \
            --manifest data/raw/dukascopy_bi5_${PILOT_TAG}_combined/download_manifest.jsonl \
            --symbols ${SYMBOL} \
            --start "${START}" \
            --end "${END}" \
            --output data/raw/dukascopy_bi5_${PILOT_TAG}_combined/download_summary.json \
            --min-coverage ${MIN_COVERAGE} \
            --max-hard-errors ${MAX_HARD_ERRORS} \
            --expected-records-mode observed

      - name: Validate all resampled bars
        run: |
          args=""
          while IFS= read -r -d '' f; do
            args="$args --input $f"
          done < <(find data/symbol_day_artifacts data/processed/dukascopy_bi5_${PILOT_TAG}_aggregate_repair_bars \( -path "*/M1/*.csv.gz" -o -path "*/M5/*.csv.gz" -o -path "*/M15/*.csv.gz" -o -path "*/H1/*.csv.gz" \) -print0)
          if [ -n "$args" ]; then
            python tools/validate_fx_bar_artifacts.py \
              $args \
              --output data/raw/dukascopy_bi5_${PILOT_TAG}_combined/validation_summary.json
          else
            echo '{"status":"no_resampled_bars"}' > data/raw/dukascopy_bi5_${PILOT_TAG}_combined/validation_summary.json
          fi

      - name: Build combined market profiles by timeframe
        run: |
          mkdir -p data/profiles/dukascopy_bi5_${PILOT_TAG}_market_profile
          for tf in ${TIMEFRAMES}; do
            args=""
            while IFS= read -r -d '' f; do
              args="$args --input $f"
            done < <(find data/symbol_day_artifacts data/processed/dukascopy_bi5_${PILOT_TAG}_aggregate_repair_bars -path "*/${tf}/*.csv.gz" -print0)
            if [ -n "$args" ]; then
              python tools/build_market_profile.py \
                $args \
                --output-dir data/profiles/dukascopy_bi5_${PILOT_TAG}_market_profile/${tf}
            fi
          done

      - name: Write symbol aggregate summary
        if: always()
        run: |
          echo "# Public FX Tick Pilot / ${SYMBOL} Aggregate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "pilot_tag: ${PILOT_TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "start: ${START}" >> "$GITHUB_STEP_SUMMARY"
          echo "end: ${END}" >> "$GITHUB_STEP_SUMMARY"
          echo "timeframes: ${TIMEFRAMES}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Download summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat data/raw/dukascopy_bi5_${PILOT_TAG}_combined/download_summary.json >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Validation summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat data/raw/dukascopy_bi5_${PILOT_TAG}_combined/validation_summary.json >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## M5 Market profile overall" >> "$GITHUB_STEP_SUMMARY"
          echo '```csv' >> "$GITHUB_STEP_SUMMARY"
          cat data/profiles/dukascopy_bi5_${PILOT_TAG}_market_profile/M5/market_profile_overall.csv >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload symbol aggregate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-fx-data-${{ env.PILOT_TAG }}-aggregate-${{ github.run_id }}
          path: |
            data/raw/dukascopy_bi5_${{ env.PILOT_TAG }}_combined/download_manifest.initial.jsonl
            data/raw/dukascopy_bi5_${{ env.PILOT_TAG }}_combined/download_manifest.aggregate_repair.jsonl
            data/raw/dukascopy_bi5_${{ env.PILOT_TAG }}_combined/download_manifest.jsonl
            data/raw/dukascopy_bi5_${{ env.PILOT_TAG }}_combined/download_summary.json
            data/raw/dukascopy_bi5_${{ env.PILOT_TAG }}_combined/validation_summary.json
            data/profiles/dukascopy_bi5_${{ env.PILOT_TAG }}_market_profile/**/*.csv
          if-no-files-found: warn
          retention-days: 14
