name: Diagnose USDJPY R5 Materialize Failure v1

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  diagnose:
    if: github.event.issue.title == '[Diag] Inspect R5 materialize failure v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Post failed log tail
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          gh run view 29665727132 --repo "${REPOSITORY}" --log-failed > failed.log
          tail -n 160 failed.log > tail.log
          python - <<'PY' > body.txt
          from pathlib import Path
          text=Path('tail.log').read_text(errors='replace')
          print('```text')
          print(text[-50000:])
          print('```')
          PY
          gh issue comment "${ISSUE_NUMBER}" --repo "${REPOSITORY}" --body-file body.txt
      - name: Remove workflow and close issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          rm -f .github/workflows/diagnose_usdjpy_r5_materialize_failure_v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove R5 materialize diagnostic workflow'
          git pull --rebase origin main
          git push origin HEAD:main
          gh issue close "${ISSUE_NUMBER}" --repo "${REPOSITORY}" --reason completed
