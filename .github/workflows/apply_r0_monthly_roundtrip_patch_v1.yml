name: Apply R0 Monthly M15 Round Trip Patch v1

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  patch:
    if: github.event.issue.title == '[Patch] Apply R0 monthly M15 round-trip v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch monthly canonical writer and refresh lock
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          runner = Path("tools/run_usdjpy_r0_canonical_bundle_v1.py")
          text = runner.read_text()
          old = 'frame.to_csv(text, index=False, float_format="%.15g", lineterminator="\\n")'
          new = 'frame.to_csv(text, index=False, float_format="%.17g", lineterminator="\\n")'
          if old in text:
              text = text.replace(old, new)
              runner.write_text(text)
          assert new in runner.read_text()
          assert old not in runner.read_text()
          subprocess.run(["python", "-m", "py_compile", str(runner)], check=True)

          lock_path = Path("configs/research/usdjpy_r0_regression_lock_v1.json")
          lock = json.loads(lock_path.read_text())
          blob = subprocess.check_output(["git", "hash-object", str(runner)], text=True).strip()
          lock["code_blobs"][str(runner)] = blob
          lock_path.write_text(json.dumps(lock, indent=2, sort_keys=False) + "\n")
          print(f"{runner}: {blob}")
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/run_usdjpy_r0_canonical_bundle_v1.py configs/research/usdjpy_r0_regression_lock_v1.json
          if git diff --cached --quiet; then
            echo "Monthly round-trip patch already applied"
          else
            git commit -m "fix: preserve monthly M15 round-trip precision in R0"
            git push origin HEAD:main
          fi

      - name: Report completion
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh issue comment "${ISSUE_NUMBER}" --repo "${REPOSITORY}" \
            --body "R0 monthly M15 serialization changed from %.15g to %.17g and the runner blob lock was refreshed."
          gh issue close "${ISSUE_NUMBER}" --repo "${REPOSITORY}" --reason completed
