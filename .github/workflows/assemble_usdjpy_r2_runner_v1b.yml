name: Assemble USDJPY R2 Runner v1b

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  assemble:
    if: github.event.issue.title == '[R2] Assemble USDJPY horizon runner v1b'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode verify and compile runner
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          from pathlib import Path
          encoded = Path('.github/r2_stage/runner.py.gz.b64').read_text().strip()
          encoded += '=' * (-len(encoded) % 4)
          payload = base64.b64decode(encoded)
          marker = b'R2RUNNER_SENTINEL_BEGIN_'
          marker_index = payload.index(marker)
          compressed = payload[:marker_index]
          runner = gzip.decompress(compressed)
          assert len(runner) == 32434, len(runner)
          target = Path('tools/run_usdjpy_r2_horizon_surface_v1.py')
          target.write_bytes(runner)
          print({'compressed_bytes': len(compressed), 'runner_bytes': len(runner), 'sha256': hashlib.sha256(runner).hexdigest()})
          PY
          chmod +x tools/run_usdjpy_r2_horizon_surface_v1.py
          python -m py_compile tools/run_usdjpy_r2_horizon_surface_v1.py
      - name: Commit and remove staging workflows
        run: |
          set -euo pipefail
          rm -rf .github/r2_stage
          rm -f .github/workflows/assemble_usdjpy_r2_runner_v1.yml
          rm -f .github/workflows/assemble_usdjpy_r2_runner_v1b.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'research: add USDJPY R2 horizon surface runner v1'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Close issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body 'USDJPY R2 horizon runner reconstructed, gzip-verified and compiled. The resulting Git blob is the execution lock authority.'
          gh issue close "$ISSUE_NUMBER" --repo "$REPOSITORY" --reason completed
