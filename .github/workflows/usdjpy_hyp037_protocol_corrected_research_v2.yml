name: USDJPY HYP-037 Protocol-Corrected Research Gate v2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/usdjpy_hyp037_protocol_corrected_research_v2.yml'
      - 'configs/research/usdjpy_hyp037_period_role_correction_receipt_v2.json'
      - 'configs/research/usdjpy_hyp037_corrected_preregistration_addendum_v2.json'
      - 'tools/evaluate_usdjpy_hyp037_protocol_corrected_research_v2.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: usdjpy-hyp037-protocol-corrected-research-v2
  cancel-in-progress: false

jobs:
  research-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Selective exact-SHA fetch and protocol preflight
        id: init
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/h37v2"; rm -rf "$root"; mkdir -p "$root"/{src,infra,inputs/{hyp036,historical,2023,2024h1,2024h2,raw2023,raw2024},materialized,output,evidence}
          sha='${{ github.event.pull_request.head.sha || github.sha }}'; test "${#sha}" = 40
          fetch(){ p="$1"; o="$2"; mkdir -p "$(dirname "$o")"; gh api "repos/${GITHUB_REPOSITORY}/contents/${p}?ref=${sha}" --jq .content | tr -d '\n' | base64 -d > "$o"; test -s "$o"; }
          fetch configs/research/usdjpy_hyp037_period_role_correction_receipt_v2.json "$root/src/correction.json"
          fetch configs/research/usdjpy_hyp037_corrected_preregistration_addendum_v2.json "$root/src/prereg_addendum.json"
          fetch tools/evaluate_usdjpy_hyp037_protocol_corrected_research_v2.py "$root/src/evaluate.py"
          fetch tools/usdjpy_hyp034_bi5_source_v1.py "$root/src/usdjpy_hyp034_bi5_source_v1.py"
          fetch tools/build_usdjpy_b02_f05_hyp024_inputs_v2.py "$root/src/build_baseline.py"
          fetch tools/vendor/fx2_infra_core_f897b250_v1.py "$root/infra/fx2_infra.py"
          python -m py_compile "$root/src/"*.py "$root/infra/fx2_infra.py"
          jq -e '.decision=="PROTOCOL_CORRECTION_PERIOD_ROLE_BEFORE_EXTERNAL_VALIDATION" and .candidate_unchanged==true and ."2020_2022_outcomes_accessed_before_correction"==false and ."2025_outcomes_accessed_before_correction"==false' "$root/src/correction.json"
          jq -e '.hypothesis_id=="USDJPY-HYP-037" and .candidate_id=="C1_SHORT_DUKASCOPY_NATIVE_16BAR" and ."2020_2022_binding_confirmation_removed"==true and .protected_2025_gates.H1.no_retuning==true' "$root/src/prereg_addendum.json"
          echo "root=$root" >> "$GITHUB_OUTPUT"; echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize immutable HYP-036 and B02/F05 authorities
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ROOT: ${{ steps.init.outputs.root }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'numpy==2.1.3' 'pandas==2.2.3'
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/8709903106/zip" > "$ROOT/inputs/hyp036/artifact.zip"
          unzip -q "$ROOT/inputs/hyp036/artifact.zip" -d "$ROOT/inputs/hyp036/unpacked"
          ledger=$(find "$ROOT/inputs/hyp036/unpacked" -name source_native_executable_ledger.csv.gz -print -quit); test -n "$ledger"; cp "$ledger" "$ROOT/materialized/hyp036_source_native_executable_ledger.csv.gz"
          test "$(gzip -cd "$ROOT/materialized/hyp036_source_native_executable_ledger.csv.gz" | wc -l)" = 1333

          gh release download f05-failed-reclaim-historical-authorities-v1 --repo "$GITHUB_REPOSITORY" --dir "$ROOT/inputs/historical" --pattern 'usdjpy-2023-canonical-baseline-prep-v1.zip' --pattern 'mt4-usdjpy-2024h1-event-audit-v1.zip' --pattern 'mt4-usdjpy-f05-extatr-h2-validation-v1.zip' --pattern EXPECTED_SHA256SUMS
          (cd "$ROOT/inputs/historical" && sha256sum -c EXPECTED_SHA256SUMS)
          unzip -q "$ROOT/inputs/historical/usdjpy-2023-canonical-baseline-prep-v1.zip" -d "$ROOT/inputs/2023"
          unzip -q "$ROOT/inputs/historical/mt4-usdjpy-2024h1-event-audit-v1.zip" -d "$ROOT/inputs/2024h1"
          unzip -q "$ROOT/inputs/historical/mt4-usdjpy-f05-extatr-h2-validation-v1.zip" -d "$ROOT/inputs/2024h2"
          python "$ROOT/src/build_baseline.py" --m15-2023 "$ROOT/inputs/2023/normalized/usdjpy_2023_m15_bid_utc_rakuten_mt4_v1.csv.gz" --m15-2024h1 "$ROOT/inputs/2024h1/m15_utc_2024h1.csv" --events-2024h1 "$ROOT/inputs/2024h1/tester/fx2_usdjpy_2024h1_event_audit_fixed_001_each_v1.csv" --events-2024h2 "$ROOT/inputs/2024h2/h2_baseline/fx2_usdjpy_f05_extatr_h2_baseline_v1.csv" --out-dir "$ROOT/materialized"
          printf '%s  %s\n' 98c9c8cf57c62c23a94aa38efa6ee257e823dd0b68c413615197a48be00b08ca "$ROOT/materialized/usdjpy_b02_f05_source_trade_ledger_v2.csv" | sha256sum -c -
          test "$(gzip -cd "$ROOT/materialized/usdjpy_b02_f05_entry_exit_state_ledger_v2.csv.gz" | wc -l)" = 68956

      - name: Materialize 2023-2024 Dukascopy source authority only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ROOT: ${{ steps.init.outputs.root }}
        run: |
          set -euo pipefail
          for y in 2023 2024; do
            d="$ROOT/inputs/raw$y"
            gh release download "usdjpy-$y-raw-bidask-ticks-v1" --repo "$GITHUB_REPOSITORY" --dir "$d" --pattern "usdjpy-$y-??-raw-ticks-v1.tar.gz" --pattern "usdjpy-$y-raw-ticks-v1.annual-manifest.json" --pattern SHA256SUMS
            (cd "$d" && grep -E "usdjpy-$y-(..-raw-ticks-v1\\.tar\\.gz|raw-ticks-v1\\.annual-manifest\\.json)$" SHA256SUMS | sha256sum -c -)
            test "$(find "$d" -name '*.tar.gz' | wc -l)" = 12
          done
          find "$ROOT/inputs" -maxdepth 2 -type f -printf '%p\n' | sort > "$ROOT/evidence/input_inventory.txt"
          ! grep -E '/raw2020/|/raw2021/|/raw2022/|2025' "$ROOT/evidence/input_inventory.txt"

      - name: Execute corrected HYP-037 research gate
        shell: bash
        env:
          ROOT: ${{ steps.init.outputs.root }}
          PYTHONPATH: ${{ steps.init.outputs.root }}/src
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          common=(--hyp036-ledger "$ROOT/materialized/hyp036_source_native_executable_ledger.csv.gz" --baseline-trades "$ROOT/materialized/usdjpy_b02_f05_source_trade_ledger_v2.csv" --baseline-states "$ROOT/materialized/usdjpy_b02_f05_entry_exit_state_ledger_v2.csv.gz" --raw-2023 "$ROOT/inputs/raw2023" --raw-2024 "$ROOT/inputs/raw2024" --prereg-addendum "$ROOT/src/prereg_addendum.json" --correction-receipt "$ROOT/src/correction.json" --research-sha '${{ steps.init.outputs.sha }}' --core-sha f897b250b808207d960417b2306935dcb0655acf --run-id "$GITHUB_RUN_ID")
          python "$ROOT/src/evaluate.py" "${common[@]}" --out-dir "$ROOT/evidence/preflight" --preflight-only
          jq -e '.pass==true and ."2020_2022_outcomes_accessed"==false and ."2025_outcomes_accessed"==false' "$ROOT/evidence/preflight/preflight_receipt.json"
          python "$ROOT/src/evaluate.py" "${common[@]}" --out-dir "$ROOT/output" | tee "$ROOT/evidence/research_run.log"
          jq -e '.hypothesis_id=="USDJPY-HYP-037" and .candidate_unchanged==true and ."2020_2022_outcomes_accessed"==false and ."2025_outcomes_accessed"==false and .production_authorized==false and .live_authorized==false' "$ROOT/output/final_result_v2.json"
          (cd "$ROOT/output" && sha256sum -c PACKAGE_SHA256SUMS)
          python "$ROOT/infra/fx2_infra.py" archive --input "$ROOT/output" --output "$ROOT/usdjpy-hyp037-protocol-corrected-research-v2.zip" --source-sha '${{ steps.init.outputs.sha }}' --run-id "$GITHUB_RUN_ID" --classification scientific > "$ROOT/evidence/archive_build.json"
          python "$ROOT/infra/fx2_infra.py" readback --archive "$ROOT/usdjpy-hyp037-protocol-corrected-research-v2.zip" > "$ROOT/evidence/archive_readback.json"
          jq -e '.status=="PASS"' "$ROOT/evidence/archive_readback.json"

      - name: Upload immutable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usdjpy-hyp037-protocol-corrected-research-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/h37v2/output
            ${{ runner.temp }}/h37v2/evidence
            ${{ runner.temp }}/h37v2/usdjpy-hyp037-protocol-corrected-research-v2.zip
          retention-days: 90
          compression-level: 0
          if-no-files-found: warn
