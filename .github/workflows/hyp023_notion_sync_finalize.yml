name: Finalize HYP-023 Notion sync receipt

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'configs/research/usdjpy_hyp023_notion_sync_receipt_v1.json'
      - '.github/workflows/hyp023_notion_sync_finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hyp023-notion-readback-receipt-v1
          fetch-depth: 0
      - name: Update manifest deterministically
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum configs/research/usdjpy_hyp023_notion_sync_receipt_v1.json | awk '{print $1}')" = "ac8bb10fce2b3abe76aeb8528fe29c67d07edff63b57e1d2fc96f2df2accaa64"
          test "$(sha256sum configs/research/usdjpy_research_memory_manifest_v1.json | awk '{print $1}')" = "3936379bd5371cf770c3b62ec8aaff93e005c8c5a1f44b3447990e53f02be6a7"
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('configs/research/usdjpy_research_memory_manifest_v1.json')
          d = json.loads(p.read_text())
          d['canonical_pointers']['hyp023_notion_sync_receipt'] = 'configs/research/usdjpy_hyp023_notion_sync_receipt_v1.json'
          d['installation_audit'] = {
              'previous_registry': 'v40',
              'source_merge_commit': '7fbf904b19ddd74faf1aa93bc3b8e5c430d50aab',
              'notion_readback_receipt': 'configs/research/usdjpy_hyp023_notion_sync_receipt_v1.json',
              'status': 'HYP023_RESULT_RECONCILED_NOTION_READBACK_CONFIRMED'
          }
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n')
          PY
          test "$(sha256sum configs/research/usdjpy_research_memory_manifest_v1.json | awk '{print $1}')" = "37280aeeb0384091979b709083c6c5783e4ef7171198df806ad3e39240382aec"
          python tools/validate_usdjpy_research_memory_v1.py
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/hyp023_notion_sync_finalize.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "research: confirm HYP-023 Notion readback"
          git push origin HEAD:agent/hyp023-notion-readback-receipt-v1
