name: Evaluate USDJPY B02 F05 All-Loss Structural SL v1

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '.github/workflows/evaluate_usdjpy_b02_f05_all_loss_structural_sl_v1.yml'
      - 'configs/research/usdjpy_b02_f05_all_loss_structural_sl_protocol_v1.json'
      - 'tools/evaluate_usdjpy_b02_f05_all_loss_structural_sl_v1.py'
      - 'tools/usdjpy_structural_sl_v1/**'
  push:
    branches: [main]
    paths:
      - 'configs/run_markers/usdjpy_b02_f05_all_loss_structural_sl_v1.json'
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type USDJPY_B02_F05_ALL_LOSS_STRUCTURAL_SL_V1 to run the frozen full evaluation'
        required: true
        type: string

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: usdjpy-b02-f05-all-loss-structural-sl-v1-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==2.1.3' 'pandas==2.2.3'
      - name: Verify committed evaluator without outcomes
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/evaluate_usdjpy_b02_f05_all_loss_structural_sl_v1.py \
            tools/usdjpy_structural_sl_v1/common.py \
            tools/usdjpy_structural_sl_v1/events.py
          python tools/evaluate_usdjpy_b02_f05_all_loss_structural_sl_v1.py \
            --protocol configs/research/usdjpy_b02_f05_all_loss_structural_sl_protocol_v1.json \
            --preflight-only | tee preflight.json
          jq -e '.status=="PASS_NO_OUTCOMES" and .outcomes_computed==false and .mt4_accessed==false and ."2025_accessed"==false and .notion_task_dependency==false' preflight.json
      - uses: actions/upload-artifact@v4
        with:
          name: usdjpy-b02-f05-all-loss-structural-sl-preflight-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: preflight.json
          if-no-files-found: error
          retention-days: 30

  evaluate:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.confirmation == 'USDJPY_B02_F05_ALL_LOSS_STRUCTURAL_SL_V1')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==2.1.3' 'pandas==2.2.3'
      - name: Enforce main and frozen boundary
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ github.ref }}' == 'refs/heads/main' ]]
          python -m py_compile \
            tools/evaluate_usdjpy_b02_f05_all_loss_structural_sl_v1.py \
            tools/usdjpy_structural_sl_v1/common.py \
            tools/usdjpy_structural_sl_v1/events.py
          python tools/evaluate_usdjpy_b02_f05_all_loss_structural_sl_v1.py \
            --protocol configs/research/usdjpy_b02_f05_all_loss_structural_sl_protocol_v1.json \
            --preflight-only > preflight.json
          jq -e '.status=="PASS_NO_OUTCOMES" and .outcomes_computed==false and .mt4_accessed==false and ."2025_accessed"==false' preflight.json
      - name: Download and verify frozen source archives
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads inputs/2023 inputs/2024h1 inputs/2024h2
          gh api 'repos/mitsuru93/usdjpyea-core/actions/artifacts/8559483151/zip' > downloads/2023.zip
          gh api 'repos/mitsuru93/usdjpyea-core/actions/artifacts/8479048161/zip' > downloads/2024h1.zip
          gh api 'repos/mitsuru93/usdjpyea-core/actions/artifacts/8512432416/zip' > downloads/2024h2.zip
          printf '%s  %s\n' \
            '22d66bf76c60362b78e9badff2113bc196b80e3657f5083ae470d1d62df70c01' downloads/2023.zip \
            'e078758343995c8254244dd36385c93a61a7124cb5037beb458afdf5d0e208e5' downloads/2024h1.zip \
            '9c5846e8b6e47b4b981a3ceeec856391311d3864a8cd7c2bef7caf7d21e6375b' downloads/2024h2.zip | sha256sum -c -
          unzip -q downloads/2023.zip -d inputs/2023
          unzip -q downloads/2024h1.zip -d inputs/2024h1
          unzip -q downloads/2024h2.zip -d inputs/2024h2
          gh release download usdjpy-2024-derived-bars-v1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'USDJPY-2024-m1-derived-bars-v1.csv.gz' \
            --dir inputs
          printf '%s  %s\n' \
            '4c10ab3244996d73d0955850675231a533f918da09a41ac642c9a3e287b7ac78' inputs/2023/normalized/usdjpy_2023_m15_bid_utc_rakuten_mt4_v1.csv.gz \
            '167509bde6553a468ffe48b082ed79de183cc57991f668cf4b3e7341350d307e' inputs/2023/normalized/usdjpy_2023_m1_bid_utc_rakuten_mt4_v1.csv.gz \
            '9560d6382e2457eaec83415316fb59d4989244d49c9977ce76cbdd717f32f09a' inputs/2024h1/tester/fx2_usdjpy_2024h1_event_audit_fixed_001_each_v1.csv \
            'a5a871d7105c6e68548e804c9ab517ee6bc0b08553474b158799f47ebd32edcd' inputs/2024h2/h2_baseline/fx2_usdjpy_f05_extatr_h2_baseline_v1.csv \
            'f9f56be2daa39f07dc39cec197306fb87821ead01e4a640a73f17715bf27dde0' inputs/USDJPY-2024-m1-derived-bars-v1.csv.gz | sha256sum -c -
      - name: Run frozen all-loss structural evaluation
        shell: bash
        run: |
          set -euo pipefail
          python tools/evaluate_usdjpy_b02_f05_all_loss_structural_sl_v1.py \
            --protocol configs/research/usdjpy_b02_f05_all_loss_structural_sl_protocol_v1.json \
            --m15-2023 inputs/2023/normalized/usdjpy_2023_m15_bid_utc_rakuten_mt4_v1.csv.gz \
            --m1-2023 inputs/2023/normalized/usdjpy_2023_m1_bid_utc_rakuten_mt4_v1.csv.gz \
            --events-2024h1 inputs/2024h1/tester/fx2_usdjpy_2024h1_event_audit_fixed_001_each_v1.csv \
            --events-2024h2 inputs/2024h2/h2_baseline/fx2_usdjpy_f05_extatr_h2_baseline_v1.csv \
            --m1-2024 inputs/USDJPY-2024-m1-derived-bars-v1.csv.gz \
            --out-dir evaluation_output \
            --research-commit "$GITHUB_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT"
          jq -e '.status=="DESCRIPTIVE_COMPLETE_NO_CANDIDATE_FROZEN" and .population.trade_count==1882 and .boundaries.portfolio_replay_computed==true and .boundaries.mt4_accessed==false and .boundaries."2025H1_accessed"==false and .boundaries."2025H2_accessed"==false and .boundaries.candidate_frozen==false' evaluation_output/result_v1.json
      - name: Package reproducible evidence
        shell: bash
        run: |
          set -euo pipefail
          cp configs/research/usdjpy_b02_f05_all_loss_structural_sl_protocol_v1.json evaluation_output/
          cp tools/evaluate_usdjpy_b02_f05_all_loss_structural_sl_v1.py evaluation_output/
          cp -R tools/usdjpy_structural_sl_v1 evaluation_output/
          find evaluation_output -type f -print0 | sort -z | xargs -0 sha256sum > evaluation_output/PACKAGE_SHA256SUMS
          zip -q -X -r "usdjpy-b02-f05-all-loss-structural-sl-v1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.zip" evaluation_output
      - name: Upload evidence artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: usdjpy-b02-f05-all-loss-structural-sl-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evaluation_output
            usdjpy-b02-f05-all-loss-structural-sl-v1-${{ github.run_id }}-${{ github.run_attempt }}.zip
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Publish immutable evaluation Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='usdjpy-b02-f05-all-loss-structural-sl-v1'
          asset="usdjpy-b02-f05-all-loss-structural-sl-v1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.zip"
          cat > release_notes.md <<EOF
          Frozen descriptive all-loss structural-SL evaluation.
          Run ID: ${GITHUB_RUN_ID}
          Run attempt: ${GITHUB_RUN_ATTEMPT}
          Commit: ${GITHUB_SHA}
          Artifact ID: ${{ steps.upload.outputs.artifact-id }}
          Artifact digest: ${{ steps.upload.outputs.artifact-digest }}
          MT4 accessed: false
          2025 accessed: false
          Candidate frozen: false
          EOF
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "$asset" --target "$GITHUB_SHA" \
              --title 'USDJPY B02/F05 all-loss structural SL v1' \
              --notes-file release_notes.md --repo "$GITHUB_REPOSITORY"
          fi
      - name: Emit run identity
        run: |
          echo "artifact_id=${{ steps.upload.outputs.artifact-id }}"
          echo "artifact_digest=${{ steps.upload.outputs.artifact-digest }}"
      - name: Publish connector-visible run receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        shell: bash
        run: |
          set -euo pipefail
          result_status='NOT_AVAILABLE'
          decision_status='NOT_AVAILABLE'
          trade_count='NOT_AVAILABLE'
          loser_count='NOT_AVAILABLE'
          if [[ -f evaluation_output/result_v1.json ]]; then
            result_status=$(jq -r '.status' evaluation_output/result_v1.json)
            decision_status=$(jq -r '.decision.f05_failed_reclaim.status' evaluation_output/result_v1.json)
            trade_count=$(jq -r '.population.trade_count' evaluation_output/result_v1.json)
            loser_count=$(jq -r '.population.baseline_loser_count' evaluation_output/result_v1.json)
          fi
          cat > run_receipt.md <<EOF
          workflow: evaluate_usdjpy_b02_f05_all_loss_structural_sl_v1.yml
          run_id: ${GITHUB_RUN_ID}
          run_attempt: ${GITHUB_RUN_ATTEMPT}
          head_sha: ${GITHUB_SHA}
          job_status: ${JOB_STATUS}
          result_status: ${result_status}
          f05_failed_reclaim_status: ${decision_status}
          trade_count: ${trade_count}
          baseline_loser_count: ${loser_count}
          artifact_id: ${ARTIFACT_ID}
          artifact_digest: ${ARTIFACT_DIGEST}
          run_url: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          mt4_accessed: false
          2025_accessed: false
          candidate_frozen: false
          EOF
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "[structural-sl-run] ${GITHUB_RUN_ID} ${JOB_STATUS}" \
            --body-file run_receipt.md
