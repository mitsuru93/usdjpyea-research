name: USDJPY Asian Range Liquidity Sweep Phase 2 v1

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/usdjpy_asian_range_liquidity_sweep_phase2_payload_v1.py.gz.b64'
      - '.github/workflows/usdjpy_asian_range_liquidity_sweep_phase2_v1.yml'
      - 'configs/research/usdjpy_asian_range_liquidity_sweep_phase2_prereg_v1.json'
  push:
    branches: [main]
    paths:
      - 'tools/usdjpy_asian_range_liquidity_sweep_phase2_payload_v1.py.gz.b64'
      - '.github/workflows/usdjpy_asian_range_liquidity_sweep_phase2_v1.yml'
      - 'configs/research/usdjpy_asian_range_liquidity_sweep_phase2_prereg_v1.json'
      - 'docs/research/artifact_archives/usdjpy_asian_range_liquidity_sweep_phase2_v1/**'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Materialize and verify frozen evaluator
        run: |
          set -euo pipefail
          base64 -d tools/usdjpy_asian_range_liquidity_sweep_phase2_payload_v1.py.gz.b64 | gzip -d > /tmp/evaluate_asian.py
          test "$(sha256sum /tmp/evaluate_asian.py | cut -d' ' -f1)" = '91bf81605075bf2ce30419f7f848bafc6a4e36d5d0f43bd0f6c1c8b6e1132b14'
          python -m py_compile /tmp/evaluate_asian.py
      - name: Install frozen dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==2.1.3' 'pandas==2.2.3'
      - name: Enforce preregistration and protected-period firewall
        run: |
          python - <<'PY'
          import json
          p=json.load(open('configs/research/usdjpy_asian_range_liquidity_sweep_phase2_prereg_v1.json'))
          assert p['status']=='FROZEN_BEFORE_PHASE2_OUTCOMES'
          assert p['hypothesis_id']=='USDJPY-HYP-030'
          assert p['candidate_catalog']==['A_EXACT_EXECUTABLE_12BAR']
          assert p['development_folds']==['2023H1','2023H2','2024H1','2024H2']
          assert set(p['forbidden_periods'])=={'2025H1','2025H2'}
          assert p['boundaries']['protected_period_access'] is False
          assert p['boundaries']['parameter_grid_search'] is False
          assert p['boundaries']['Core_change'] is False
          PY
          ! grep -nE '2025-[0-9]{2}-[0-9]{2}|2025H[12].*(net|PF|price|trade)' /tmp/evaluate_asian.py
      - name: Verify mandatory startup memory files are present
        run: |
          python - <<'PY'
          import json, pathlib
          m=json.load(open('configs/research/usdjpy_research_memory_manifest_v1.json'))
          missing=[r['path'] for r in m['mandatory_startup_read_order'] if not pathlib.Path(r['path']).exists()]
          assert not missing, missing
          print(json.dumps({'status':'STARTUP_FILES_PRESENT','count':len(m['mandatory_startup_read_order']),'registry':m['canonical_pointers']['current_candidate_registry'],'ledger_addendum':m['canonical_pointers']['hypothesis_ledger_addendum']},indent=2))
          PY
      - name: Download and verify Atlas, M15 and B02/F05 authorities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p inputs/csos inputs/csos_pkg inputs/historical inputs/2023 inputs/2024h1 inputs/2024h2 inputs/2024derived materialized
          gh release download usdjpy-csos-opportunity-atlas-v1-r1 --repo "$GITHUB_REPOSITORY" --dir inputs/csos --pattern 'usdjpy-csos-opportunity-atlas-v1-r1-30202535070-1.zip'
          unzip -q inputs/csos/usdjpy-csos-opportunity-atlas-v1-r1-30202535070-1.zip -d inputs/csos_pkg
          (cd inputs/csos_pkg && sha256sum -c csos_output/PACKAGE_SHA256SUMS)
          test "$(zcat inputs/csos_pkg/csos_output/strategy_opportunity_atlas.csv.gz | awk -F, '$4=="F_ASIAN_RANGE_SWEEP"{n++} END{print n+0}')" = 545
          gh release download f05-failed-reclaim-historical-authorities-v1 --repo "$GITHUB_REPOSITORY" --dir inputs/historical --pattern 'usdjpy-2023-canonical-baseline-prep-v1.zip' --pattern 'mt4-usdjpy-2024h1-event-audit-v1.zip' --pattern 'mt4-usdjpy-f05-extatr-h2-validation-v1.zip' --pattern 'EXPECTED_SHA256SUMS'
          (cd inputs/historical && sha256sum -c EXPECTED_SHA256SUMS)
          unzip -q inputs/historical/usdjpy-2023-canonical-baseline-prep-v1.zip -d inputs/2023
          unzip -q inputs/historical/mt4-usdjpy-2024h1-event-audit-v1.zip -d inputs/2024h1
          unzip -q inputs/historical/mt4-usdjpy-f05-extatr-h2-validation-v1.zip -d inputs/2024h2
          printf '%s  %s\n' '4c10ab3244996d73d0955850675231a533f918da09a41ac642c9a3e287b7ac78' inputs/2023/normalized/usdjpy_2023_m15_bid_utc_rakuten_mt4_v1.csv.gz '766be5ebba158e5b40f5da5d66929b4da8a25d42a8716b1e591d7c09dd87c2a3' inputs/2024h1/m15_utc_2024h1.csv '9560d6382e2457eaec83415316fb59d4989244d49c9977ce76cbdd717f32f09a' inputs/2024h1/tester/fx2_usdjpy_2024h1_event_audit_fixed_001_each_v1.csv 'a5a871d7105c6e68548e804c9ab517ee6bc0b08553474b158799f47ebd32edcd' inputs/2024h2/h2_baseline/fx2_usdjpy_f05_extatr_h2_baseline_v1.csv | sha256sum -c -
          gh release download usdjpy-2024-derived-bars-v1 --repo "$GITHUB_REPOSITORY" --dir inputs/2024derived --pattern 'USDJPY-2024-m15-derived-bars-v1.csv.gz'
          printf '%s  %s\n' 'd22a008247e2a8bed49a5169648661ab21eff404a6bc2985bca0c3b5af290020' inputs/2024derived/USDJPY-2024-m15-derived-bars-v1.csv.gz | sha256sum -c -
          python tools/build_usdjpy_b02_f05_hyp024_inputs_v2.py --m15-2023 inputs/2023/normalized/usdjpy_2023_m15_bid_utc_rakuten_mt4_v1.csv.gz --m15-2024h1 inputs/2024h1/m15_utc_2024h1.csv --events-2024h1 inputs/2024h1/tester/fx2_usdjpy_2024h1_event_audit_fixed_001_each_v1.csv --events-2024h2 inputs/2024h2/h2_baseline/fx2_usdjpy_f05_extatr_h2_baseline_v1.csv --out-dir materialized
          printf '%s  %s\n' '98c9c8cf57c62c23a94aa38efa6ee257e823dd0b68c413615197a48be00b08ca' materialized/usdjpy_b02_f05_source_trade_ledger_v2.csv | sha256sum -c -
      - name: Download and verify immutable 2023 and 2024 Raw Bid Ask Tick authorities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p inputs/raw2023 inputs/raw2024
          gh release download usdjpy-2023-raw-bidask-ticks-v1 --repo "$GITHUB_REPOSITORY" --dir inputs/raw2023 --pattern 'usdjpy-2023-??-raw-ticks-v1.tar.gz' --pattern 'usdjpy-2023-raw-ticks-v1.annual-manifest.json' --pattern 'SHA256SUMS'
          gh release download usdjpy-2024-raw-bidask-ticks-v1 --repo "$GITHUB_REPOSITORY" --dir inputs/raw2024 --pattern 'usdjpy-2024-??-raw-ticks-v1.tar.gz' --pattern 'usdjpy-2024-raw-ticks-v1.annual-manifest.json' --pattern 'SHA256SUMS'
          (cd inputs/raw2023 && grep -E 'usdjpy-2023-(..-raw-ticks-v1\.tar\.gz|raw-ticks-v1\.annual-manifest\.json)$' SHA256SUMS | sha256sum -c -)
          (cd inputs/raw2024 && grep -E 'usdjpy-2024-(..-raw-ticks-v1\.tar\.gz|raw-ticks-v1\.annual-manifest\.json)$' SHA256SUMS | sha256sum -c -)
          test "$(find inputs/raw2023 -name '*.tar.gz' | wc -l)" = 12
          test "$(find inputs/raw2024 -name '*.tar.gz' | wc -l)" = 12
      - name: Execute frozen Phase 2 evaluator
        run: |
          set -euo pipefail
          mkdir -p phase2_output
          python /tmp/evaluate_asian.py --m15-2023 inputs/2023/normalized/usdjpy_2023_m15_bid_utc_rakuten_mt4_v1.csv.gz --m15-2024 inputs/2024derived/USDJPY-2024-m15-derived-bars-v1.csv.gz --csos-ledger inputs/csos_pkg/csos_output/strategy_opportunity_atlas.csv.gz --baseline-trades materialized/usdjpy_b02_f05_source_trade_ledger_v2.csv --raw-2023 inputs/raw2023 --raw-2024 inputs/raw2024 --prereg configs/research/usdjpy_asian_range_liquidity_sweep_phase2_prereg_v1.json --out-dir phase2_output --research-sha "$GITHUB_SHA" --core-sha '8950067e602abce3622b8e0c3d23b96b877dd5ce' --run-id "$GITHUB_RUN_ID" | tee phase2_output/run.log
          cp configs/research/usdjpy_asian_range_liquidity_sweep_phase2_prereg_v1.json phase2_output/
          jq -e '.atlas_reproduction.pass==true and .boundaries.protected_period_accessed==false and .boundaries.Core_changed==false and .boundaries.MT4_accessed==false' phase2_output/final_decision.json
          ! grep -R --line-number -E '2025-[0-9]{2}-[0-9]{2}|2025H[12].*(net|PF|price|trade)' phase2_output
          (cd phase2_output && sha256sum -c PACKAGE_SHA256SUMS)
          zip -q -X -r "usdjpy-asian-range-liquidity-sweep-phase2-v1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.zip" phase2_output
      - name: Upload immutable Actions artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: usdjpy-asian-range-liquidity-sweep-phase2-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            phase2_output
            usdjpy-asian-range-liquidity-sweep-phase2-v1-${{ github.run_id }}-${{ github.run_attempt }}.zip
          retention-days: 90
          compression-level: 0
      - name: Publish immutable Release on main
        if: github.event_name == 'push' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='usdjpy-asian-range-liquidity-sweep-phase2-v1'
          ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          status=$(jq -r '.status' phase2_output/final_decision.json)
          gh release create "$tag" "usdjpy-asian-range-liquidity-sweep-phase2-v1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.zip" --target "$GITHUB_SHA" --title 'USDJPY Asian Range Liquidity Sweep Phase 2 v1' --notes "Frozen HYP-030 2023H1-2024H2 Atlas reproduction, Raw Bid/Ask executable translation, robustness and B02/F05 complementarity. Decision: ${status}. No protected-period access, Core change, MT4 execution or production authorization." --repo "$GITHUB_REPOSITORY"
      - name: Publish execution receipt Issue on main
        if: always() && github.event_name == 'push' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          status=$(jq -r '.status // "FAILED_BEFORE_RECEIPT"' phase2_output/final_decision.json 2>/dev/null || echo FAILED_BEFORE_RECEIPT)
          cat > receipt.md <<EOF
          workflow: usdjpy_asian_range_liquidity_sweep_phase2_v1.yml
          run_id: ${GITHUB_RUN_ID}
          run_attempt: ${GITHUB_RUN_ATTEMPT}
          head_sha: ${GITHUB_SHA}
          status: ${status}
          hypothesis_id: USDJPY-HYP-030
          artifact_id: ${ARTIFACT_ID}
          artifact_digest: ${ARTIFACT_DIGEST}
          release_tag: usdjpy-asian-range-liquidity-sweep-phase2-v1
          atlas_release: usdjpy-csos-opportunity-atlas-v1-r1
          analysis_periods: 2023H1,2023H2,2024H1,2024H2
          protected_period_accessed: false
          B02_F05_logic_changed: false
          parameter_grid_search: false
          MT4_accessed: false
          Core_modified: false
          production_authorized: false
          run_url: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          gh issue create --repo "$GITHUB_REPOSITORY" --title "[asian-range-liquidity-sweep-phase2] ${GITHUB_RUN_ID} ${status}" --body-file receipt.md
