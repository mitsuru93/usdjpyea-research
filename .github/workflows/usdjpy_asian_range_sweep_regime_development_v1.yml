name: USDJPY Asian Range Sweep Regime Development v1

on:
  pull_request:
    branches: [main]
    paths:
      - 'configs/research/usdjpy_asian_range_sweep_directional_regime_prereg_v1.json'
      - 'tools/asian_range_regime_payload_chunks/**'
      - '.github/workflows/usdjpy_asian_range_sweep_regime_development_v1.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  issues: write

jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install frozen dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==2.1.3' 'pandas==2.2.3'
      - name: Reconstruct and verify evaluator
        shell: bash
        run: |
          set -euo pipefail
          cat tools/asian_range_regime_payload_chunks/part_*.txt | tr -d '\n' | base64 -d | gzip -dc > tools/evaluate_usdjpy_asian_range_sweep_regime_v1.py
          printf '%s  %s\n' 'abca6cad9f666c5002fbda5a244e862ff39c8ee0a488733fc8912b7ee7a9d890' tools/evaluate_usdjpy_asian_range_sweep_regime_v1.py | sha256sum -c -
          python -m py_compile tools/evaluate_usdjpy_asian_range_sweep_regime_v1.py
      - name: Enforce preregistration and 2025 firewall
        run: |
          python - <<'PY'
          import json
          p=json.load(open('configs/research/usdjpy_asian_range_sweep_directional_regime_prereg_v1.json'))
          assert p['hypothesis_id']=='USDJPY-HYP-031'
          assert p['predecessor_boundary']['formal_decision']=='NO_PORTABLE_CANDIDATE'
          assert p['predecessor_boundary']['decision_may_change'] is False
          assert p['binding_research_authority']['raw_native_schedule_binding'] is True
          assert p['external_2025_firewall']['access_before_all_preconditions'] is False
          assert [x['candidate_id'] for x in p['regime_catalog']]==['R1_H4_SYMMETRIC_TRANSITION_BLOCK','R2_D1_SYMMETRIC_TRANSITION_BLOCK']
          PY
      - name: Download and verify 2023-2024 raw Bid Ask releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for year in 2023 2024; do
            mkdir -p "inputs/raw/$year"
            gh release download "usdjpy-${year}-raw-bidask-ticks-v1" --repo "$GITHUB_REPOSITORY" --dir "inputs/raw/$year" \
              --pattern "usdjpy-${year}-??-raw-ticks-v1.tar.gz" \
              --pattern "usdjpy-${year}-??-raw-ticks-v1.manifest.json" \
              --pattern "usdjpy-${year}-raw-ticks-v1.annual-manifest.json" \
              --pattern 'SHA256SUMS'
            (cd "inputs/raw/$year" && sha256sum -c SHA256SUMS)
            test "$(find "inputs/raw/$year" -name "usdjpy-${year}-??-raw-ticks-v1.tar.gz" | wc -l)" -eq 12
          done
      - name: Download exact B02 F05 authorities
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inputs/historical inputs/2023 inputs/2024h1 inputs/2024h2 materialized
          gh release download f05-failed-reclaim-historical-authorities-v1 --repo "$GITHUB_REPOSITORY" --dir inputs/historical \
            --pattern 'usdjpy-2023-canonical-baseline-prep-v1.zip' \
            --pattern 'mt4-usdjpy-2024h1-event-audit-v1.zip' \
            --pattern 'mt4-usdjpy-f05-extatr-h2-validation-v1.zip' \
            --pattern 'EXPECTED_SHA256SUMS'
          (cd inputs/historical && sha256sum -c EXPECTED_SHA256SUMS)
          unzip -q inputs/historical/usdjpy-2023-canonical-baseline-prep-v1.zip -d inputs/2023
          unzip -q inputs/historical/mt4-usdjpy-2024h1-event-audit-v1.zip -d inputs/2024h1
          unzip -q inputs/historical/mt4-usdjpy-f05-extatr-h2-validation-v1.zip -d inputs/2024h2
          python tools/build_usdjpy_b02_f05_hyp024_inputs_v2.py \
            --m15-2023 inputs/2023/normalized/usdjpy_2023_m15_bid_utc_rakuten_mt4_v1.csv.gz \
            --m15-2024h1 inputs/2024h1/m15_utc_2024h1.csv \
            --events-2024h1 inputs/2024h1/tester/fx2_usdjpy_2024h1_event_audit_fixed_001_each_v1.csv \
            --events-2024h2 inputs/2024h2/h2_baseline/fx2_usdjpy_f05_extatr_h2_baseline_v1.csv \
            --out-dir materialized
          printf '%s  %s\n' '98c9c8cf57c62c23a94aa38efa6ee257e823dd0b68c413615197a48be00b08ca' materialized/usdjpy_b02_f05_source_trade_ledger_v2.csv | sha256sum -c -
      - name: Run source-native development study
        shell: bash
        run: |
          set -euo pipefail
          rm -rf regime_output && mkdir regime_output
          python tools/evaluate_usdjpy_asian_range_sweep_regime_v1.py \
            --raw-root inputs/raw \
            --hyp030-ledger docs/research/artifact_archives/usdjpy_asian_range_liquidity_sweep_phase2_v1/executable_trade_ledger.csv \
            --baseline-trades materialized/usdjpy_b02_f05_source_trade_ledger_v2.csv \
            --prereg configs/research/usdjpy_asian_range_sweep_directional_regime_prereg_v1.json \
            --out-dir regime_output \
            --research-sha '832a26fe37503931d619cb5449e083acfe026b9c' \
            --core-sha 'dbffc656a0793a2efd9bd54394223f1239de2afa' \
            --run-id "$GITHUB_RUN_ID" | tee regime_output/run.log
          jq -e '.hypothesis_id=="USDJPY-HYP-031" and .HYP030_decision_changed==false and ."2025_accessed"==false and .pre2023_strategy_outcomes_accessed==false and .audits.hyp030_mismatch_rows==20 and .audits.future_bar_access==0 and .audits.chronology_unresolved==0 and .audits.duplicate_state_rows==0' regime_output/final_decision.json
          (cd regime_output && sha256sum -c PACKAGE_SHA256SUMS)
      - name: Package evidence
        shell: bash
        run: |
          set -euo pipefail
          cp tools/evaluate_usdjpy_asian_range_sweep_regime_v1.py regime_output/
          printf '%s  %s\n' 'abca6cad9f666c5002fbda5a244e862ff39c8ee0a488733fc8912b7ee7a9d890' regime_output/evaluate_usdjpy_asian_range_sweep_regime_v1.py | sha256sum -c -
          (cd regime_output && find . -maxdepth 1 -type f ! -name PACKAGE_SHA256SUMS -printf '%f\0' | sort -z | xargs -0 sha256sum > PACKAGE_SHA256SUMS)
          (cd regime_output && sha256sum -c PACKAGE_SHA256SUMS)
          zip -q -X -r "usdjpy-asian-range-sweep-regime-development-v1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.zip" regime_output
      - name: Commit canonical development archive to branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          archive=docs/research/artifact_archives/usdjpy_asian_range_sweep_regime_development_v1
          rm -rf "$archive" && mkdir -p "$archive"
          cp -a regime_output/. "$archive/"
          cp regime_output/development_candidate_freeze.json configs/research/usdjpy_asian_range_sweep_regime_development_freeze_v1.json
          cp regime_output/final_decision.json configs/research/usdjpy_asian_range_sweep_regime_development_result_v1.json
          git add "$archive" configs/research/usdjpy_asian_range_sweep_regime_development_freeze_v1.json configs/research/usdjpy_asian_range_sweep_regime_development_result_v1.json tools/evaluate_usdjpy_asian_range_sweep_regime_v1.py
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research: archive HYP-031 development result'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Upload development artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: usdjpy-asian-range-sweep-regime-development-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            regime_output
            usdjpy-asian-range-sweep-regime-development-v1-${{ github.run_id }}-${{ github.run_attempt }}.zip
          retention-days: 90
          compression-level: 0
      - name: Publish receipt issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        shell: bash
        run: |
          status=$(jq -r '.decision_class // "FAILED_BEFORE_DECISION"' regime_output/final_decision.json 2>/dev/null || echo FAILED_BEFORE_DECISION)
          selected=$(jq -r '.selected_candidate_id // "NONE"' regime_output/final_decision.json 2>/dev/null || echo NONE)
          cat > receipt.md <<EOF
          workflow: usdjpy_asian_range_sweep_regime_development_v1.yml
          run_id: ${GITHUB_RUN_ID}
          run_attempt: ${GITHUB_RUN_ATTEMPT}
          head_sha: ${GITHUB_SHA}
          hypothesis_id: USDJPY-HYP-031
          status: ${status}
          selected_candidate_id: ${selected}
          artifact_id: ${ARTIFACT_ID}
          artifact_digest: ${ARTIFACT_DIGEST}
          HYP030_decision_changed: false
          pre2023_strategy_outcomes_accessed: false
          2025_accessed: false
          Core_modified: false
          MT4_accessed: false
          run_url: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          gh issue create --repo "$GITHUB_REPOSITORY" --title "[asian-range-regime-development] ${GITHUB_RUN_ID} ${status}" --body-file receipt.md
