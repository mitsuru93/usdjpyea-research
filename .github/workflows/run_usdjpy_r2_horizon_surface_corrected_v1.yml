name: Run Corrected USDJPY R2 Fixed-Horizon Surface v1

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: usdjpy-r2-horizon-surface-corrected-v1
  cancel-in-progress: false

jobs:
  r2:
    if: github.event_name != 'issues' || github.event.issue.title == '[R2] Run corrected USDJPY fixed-horizon surface v1'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CONFIG_PATH: configs/research/usdjpy_r2_horizon_surface_v1.json
      LOCK_PATH: configs/research/usdjpy_r2_horizon_lock_v1.json
      SESSION_CONFIG: configs/market_sessions/fx_market_sessions_v1.json
      HISTORICAL_REGISTRY: configs/research/usdjpy_h1_multi_family_candidates_v1.json
      OUTPUT_DIR: data/experiments/usdjpy_r2_horizon_surface_v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record run ID
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh issue comment "${ISSUE_NUMBER}" --repo "${REPOSITORY}" \
            --body "Corrected USDJPY R2 fixed-horizon surface started. Run ID: ${{ github.run_id }}. https://github.com/${REPOSITORY}/actions/runs/${{ github.run_id }}"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy

      - name: Materialize evaluator and commit execution lock before data access
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          config_path = Path('configs/research/usdjpy_r2_horizon_surface_v1.json')
          prereg_path = Path('docs/research_reboot/usdjpy_r2_horizon_surface_prereg_v1.md')
          runner_path = Path('tools/run_usdjpy_r2_horizon_surface_v1.py')
          lock_path = Path('configs/research/usdjpy_r2_horizon_lock_v1.json')
          stage_path = Path('.github/r2_stage/runner.py.gz.b64')

          encoded = stage_path.read_text(encoding='utf-8').strip()
          encoded += '=' * (-len(encoded) % 4)
          payload = base64.b64decode(encoded, validate=True)
          marker = b'R2RUNNER_SENTINEL_BEGIN_'
          marker_index = payload.index(marker)
          compressed = payload[:marker_index]
          runner = gzip.decompress(compressed)
          assert len(runner) == 32434, len(runner)
          assert hashlib.sha256(runner).hexdigest() == 'fad3a5468fc819dfd7bede38021b78f49ad082080b753587d2a65fca56e35ff0'
          runner_path.write_bytes(runner)
          runner_path.chmod(0o755)

          paths = [
              str(config_path),
              str(runner_path),
              str(prereg_path),
              'configs/research/usdjpy_r1_entry_universe_v2.json',
              'configs/research/usdjpy_h1_multi_family_candidates_v1.json',
              'configs/market_sessions/fx_market_sessions_v1.json',
          ]
          for path in paths:
              assert Path(path).is_file(), path

          config = json.loads(config_path.read_text(encoding='utf-8'))
          assert config['surface']['candidate_count'] == 60
          assert config['surface']['horizons_m15_bars'] == [1,2,3,4,6,8,12,16,24,32,48]
          assert config['surface']['combination_count'] == 660
          assert config['inputs']['r1_registry_snapshot_sha256'] == '3bb43eeb1234ec6d175e37df3b1bbdb385364857351938bd088247ab14567549'
          assert config['inputs']['historical_horizon_artifact_id'] == 8408094591
          assert config['surface']['month_boundary_policy'] == 'entry_and_exit_must_remain_in_same_utc_month'
          assert config['interpretation']['H2_access'] is False
          assert config['interpretation']['2025_access'] is False
          assert config['required_reporting']['promotion_decision'] is False

          registry = json.loads(Path('configs/research/usdjpy_r1_entry_universe_v2.json').read_text(encoding='utf-8'))
          candidates = [c for family in registry['families'] for c in family['candidates']]
          assert len(registry['families']) == 12
          assert len(candidates) == 60
          assert len({c['id'] for c in candidates}) == 60

          code_blobs = {}
          for path in paths:
              if path == str(runner_path):
                  blob = subprocess.check_output(['git','hash-object',path], text=True).strip()
              else:
                  blob = subprocess.check_output(['git','rev-parse',f'HEAD:{path}'], text=True).strip()
              code_blobs[path] = blob
          content_sha256 = {path: hashlib.sha256(Path(path).read_bytes()).hexdigest() for path in paths}

          lock = {
              'version': 'v1',
              'research_stage': 'R2_fixed_horizon_surface',
              'symbol': 'USDJPY',
              'code_blobs': code_blobs,
              'content_sha256': content_sha256,
              'input_releases': {
                  'r0': {
                      'tag': config['inputs']['r0_release_tag'],
                      'asset': config['inputs']['r0_release_asset'],
                      'asset_sha256': config['inputs']['r0_release_asset_sha256'],
                      'canonical_m15_gzip_sha256': config['inputs']['canonical_m15_gzip_sha256'],
                  },
                  'r1_v2': {
                      'tag': config['inputs']['r1_release_tag'],
                      'asset': config['inputs']['r1_release_asset'],
                      'asset_sha256': config['inputs']['r1_release_asset_sha256'],
                      'signals_gzip_sha256': config['inputs']['r1_signal_gzip_sha256'],
                      'registry_snapshot_sha256': config['inputs']['r1_registry_snapshot_sha256'],
                  },
                  'historical_horizon': {
                      'run_id': config['inputs']['historical_horizon_run_id'],
                      'artifact_id': config['inputs']['historical_horizon_artifact_id'],
                      'artifact_name': config['inputs']['historical_horizon_artifact_name'],
                      'artifact_sha256': config['inputs']['historical_horizon_artifact_sha256'],
                      'same_month_projection': True,
                      'expected_cross_month_rows_excluded': 5,
                  },
              },
              'surface_contract': {
                  'candidates': 60,
                  'horizons': config['surface']['horizons_m15_bars'],
                  'combinations': 660,
                  'monthly_rows': 3960,
                  'direction_rows': 1320,
                  'hash_rows': 660,
                  'historical_candidates': 13,
                  'historical_reference_horizons': [1,2,3,4,6,8,12,16,24],
                  'historical_regression_rows': 117,
                  'same_month_reference_projection': True,
              },
              'required_outputs': [
                  'candidate_horizon_trades.csv.gz',
                  'candidate_horizon_summary.csv',
                  'candidate_horizon_monthly.csv',
                  'candidate_horizon_direction.csv',
                  'candidate_horizon_surface.csv',
                  'candidate_horizon_hashes.csv',
                  'legacy_horizon_regression.csv',
                  'r2_acceptance.json',
                  'run_metadata.json',
              ],
              'research_firewall': {
                  'H2_rows_parsed': 0,
                  '2025_access': False,
                  'candidate_selection_in_R2': False,
                  'Core_promotion': False,
                  'MT4_promotion': False,
              },
              'next_stage': 'R3_temporal_stability',
          }
          lock_path.write_text(json.dumps(lock, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print({
              'runner_bytes': len(runner),
              'runner_sha256': content_sha256[str(runner_path)],
              'lock_status': 'FROZEN_BEFORE_DATA_ACCESS',
          })
          PY
          python -m py_compile tools/run_usdjpy_r2_horizon_surface_v1.py

          rm -rf .github/r2_stage
          rm -f .github/workflows/assemble_usdjpy_r2_runner_v1.yml
          rm -f .github/workflows/assemble_usdjpy_r2_runner_v1b.yml
          rm -f .github/workflows/freeze_usdjpy_r2_lock_v1.yml
          rm -f .github/workflows/repair_usdjpy_r2_materialize_v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'research: materialize and lock corrected USDJPY R2 evaluator v1'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify committed execution lock
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path
          lock = json.loads(Path('configs/research/usdjpy_r2_horizon_lock_v1.json').read_text())
          for path, expected in lock['code_blobs'].items():
              actual = subprocess.check_output(['git','rev-parse',f'HEAD:{path}'], text=True).strip()
              assert actual == expected, (path, actual, expected)
          for path, expected in lock['content_sha256'].items():
              actual = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              assert actual == expected, (path, actual, expected)
          assert lock['surface_contract']['combinations'] == 660
          assert lock['surface_contract']['historical_regression_rows'] == 117
          assert lock['input_releases']['historical_horizon']['expected_cross_month_rows_excluded'] == 5
          assert lock['research_firewall']['H2_rows_parsed'] == 0
          assert lock['research_firewall']['2025_access'] is False
          print({'execution_lock': 'PASS', 'code_blobs': len(lock['code_blobs'])})
          PY

      - name: Download and verify all frozen inputs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p data/releases/r0 data/releases/r1 data/releases/horizon data/input/r0 data/input/r1 data/input/horizon
          python - <<'PY' > release.env
          import json
          from pathlib import Path
          lock=json.loads(Path('configs/research/usdjpy_r2_horizon_lock_v1.json').read_text())
          for key,prefix in [('r0','R0'),('r1_v2','R1')]:
              row=lock['input_releases'][key]
              print(f'{prefix}_TAG={row["tag"]}')
              print(f'{prefix}_ASSET={row["asset"]}')
              print(f'{prefix}_ASSET_SHA={row["asset_sha256"]}')
          row=lock['input_releases']['historical_horizon']
          print(f'HIST_ARTIFACT_ID={row["artifact_id"]}')
          print(f'HIST_ARTIFACT_SHA={row["artifact_sha256"]}')
          PY
          source release.env
          cat release.env >> "${GITHUB_ENV}"

          gh release download "${R0_TAG}" --repo "${REPOSITORY}" --pattern "${R0_ASSET}" --dir data/releases/r0
          gh release download "${R1_TAG}" --repo "${REPOSITORY}" --pattern "${R1_ASSET}" --dir data/releases/r1
          gh api "repos/${REPOSITORY}/actions/artifacts/${HIST_ARTIFACT_ID}/zip" > "data/releases/horizon/horizon.zip"

          echo "${R0_ASSET_SHA}  data/releases/r0/${R0_ASSET}" | sha256sum -c -
          echo "${R1_ASSET_SHA}  data/releases/r1/${R1_ASSET}" | sha256sum -c -
          echo "${HIST_ARTIFACT_SHA}  data/releases/horizon/horizon.zip" | sha256sum -c -

          unzip -q "data/releases/r0/${R0_ASSET}" -d data/input/r0
          unzip -q "data/releases/r1/${R1_ASSET}" -d data/input/r1
          unzip -q data/releases/horizon/horizon.zip -d data/input/horizon

          mapfile -t M15_FILES < <(find data/input/r0 -type f -path '*/canonical/bars/M15/USDJPY_M15.csv.gz' | sort)
          mapfile -t SIGNAL_FILES < <(find data/input/r1 -type f -name 'candidate_signals.csv.gz' | sort)
          mapfile -t REGISTRY_FILES < <(find data/input/r1 -type f -name 'r1_registry_snapshot.json' | sort)
          mapfile -t REF_FILES < <(find data/input/horizon -type f -name 'horizon_trades.csv' | sort)
          test "${#M15_FILES[@]}" -eq 1
          test "${#SIGNAL_FILES[@]}" -eq 1
          test "${#REGISTRY_FILES[@]}" -eq 1
          test "${#REF_FILES[@]}" -eq 1

          echo "CANONICAL_M15=${M15_FILES[0]}" >> "${GITHUB_ENV}"
          echo "R1_SIGNALS=${SIGNAL_FILES[0]}" >> "${GITHUB_ENV}"
          echo "R1_REGISTRY_SNAPSHOT=${REGISTRY_FILES[0]}" >> "${GITHUB_ENV}"
          echo "REFERENCE_HORIZON_TRADES=${REF_FILES[0]}" >> "${GITHUB_ENV}"

          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          lock=json.loads(Path('configs/research/usdjpy_r2_horizon_lock_v1.json').read_text())
          def sha(path): return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          assert sha(os.environ['CANONICAL_M15']) == lock['input_releases']['r0']['canonical_m15_gzip_sha256']
          assert sha(os.environ['R1_SIGNALS']) == lock['input_releases']['r1_v2']['signals_gzip_sha256']
          assert sha(os.environ['R1_REGISTRY_SNAPSHOT']) == lock['input_releases']['r1_v2']['registry_snapshot_sha256']
          print({'internal_input_digests': 'PASS'})
          PY

      - name: Run complete R2 surface
        run: |
          python tools/run_usdjpy_r2_horizon_surface_v1.py \
            --canonical-m15 "${CANONICAL_M15}" \
            --signals "${R1_SIGNALS}" \
            --registry-snapshot "${R1_REGISTRY_SNAPSHOT}" \
            --config "${CONFIG_PATH}" \
            --session-config "${SESSION_CONFIG}" \
            --output-dir "${OUTPUT_DIR}"

      - name: Verify 117 projected historical horizon ledgers
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import numpy as np
          import pandas as pd

          out=Path('data/experiments/usdjpy_r2_horizon_surface_v1')
          actual=pd.read_csv(out/'candidate_horizon_trades.csv.gz',compression='gzip')
          reference=pd.read_csv(os.environ['REFERENCE_HORIZON_TRADES'])
          registry=json.loads(Path(os.environ['R1_REGISTRY_SNAPSHOT']).read_text())
          historical=json.loads(Path('configs/research/usdjpy_h1_multi_family_candidates_v1.json').read_text())

          reference['entry_ts']=pd.to_datetime(reference['entry_ts'],utc=True)
          reference['exit_ts']=pd.to_datetime(reference['exit_ts'],utc=True)
          same_month=(reference['entry_ts'].dt.strftime('%Y-%m')==reference['exit_ts'].dt.strftime('%Y-%m'))
          cross_month_excluded=int((~same_month).sum())
          assert cross_month_excluded==5,cross_month_excluded
          reference=reference[same_month].copy()

          legacy_map={
              legacy_id:candidate['id']
              for family in registry['families']
              for candidate in family['candidates']
              for legacy_id in candidate.get('legacy_ids',[])
          }
          rows=[]
          numeric=[
              ('gross_pips','gross_pips'),
              ('default_cost_pips','default_cost_pips'),
              ('default_net_pips','default_net_pips'),
              ('severe_cost_pips','severe_cost_pips'),
              ('severe_net_pips','severe_net_pips'),
          ]
          historical_ids=[c['id'] for family in historical['families'] for c in family['candidates']]
          horizons=[1,2,3,4,6,8,12,16,24]
          for old_id in historical_ids:
              mapped=legacy_map[old_id]
              for horizon in horizons:
                  expected=reference[(reference['candidate_id']==old_id)&(reference['horizon_bars']==horizon)].copy()
                  observed=actual[(actual['candidate_id']==mapped)&(actual['horizon_bars']==horizon)].copy()
                  observed['entry_ts']=pd.to_datetime(observed['entry_ts'],utc=True)
                  observed['exit_ts']=pd.to_datetime(observed['exit_ts'],utc=True)
                  expected=expected.sort_values(['entry_ts','side']).reset_index(drop=True)
                  observed=observed.sort_values(['entry_ts','side']).reset_index(drop=True)
                  expected_keys=set(zip(expected['entry_ts'].astype(str),expected['side'].astype(int)))
                  observed_keys=set(zip(observed['entry_ts'].astype(str),observed['side'].astype(int)))
                  missing=expected_keys-observed_keys
                  extra=observed_keys-expected_keys
                  timestamps_exact=(len(expected)==len(observed) and expected['exit_ts'].equals(observed['exit_ts']))
                  max_abs_diff=0.0
                  numeric_exact=len(expected)==len(observed)
                  if numeric_exact:
                      for observed_col,expected_col in numeric:
                          diff=np.abs(observed[observed_col].to_numpy(float)-expected[expected_col].to_numpy(float))
                          if len(diff): max_abs_diff=max(max_abs_diff,float(diff.max()))
                          numeric_exact=numeric_exact and bool(np.allclose(observed[observed_col],expected[expected_col],rtol=0.0,atol=1e-9))
                  passed=(not missing and not extra and timestamps_exact and numeric_exact)
                  rows.append({
                      'historical_candidate_id':old_id,
                      'r1_candidate_id':mapped,
                      'horizon_bars':horizon,
                      'expected_trades':len(expected),
                      'observed_trades':len(observed),
                      'reference_cross_month_rows_excluded_total':cross_month_excluded,
                      'missing_keys':len(missing),
                      'extra_keys':len(extra),
                      'exit_timestamps_exact':timestamps_exact,
                      'maximum_absolute_numeric_difference':max_abs_diff,
                      'passed':passed,
                  })
          regression=pd.DataFrame(rows).sort_values(['historical_candidate_id','horizon_bars'])
          regression.to_csv(out/'legacy_horizon_regression.csv',index=False,float_format='%.12f',lineterminator='\n')
          assert len(regression)==117,len(regression)
          assert regression['passed'].all(),regression[~regression['passed']].to_dict('records')

          acceptance=json.loads((out/'r2_acceptance.json').read_text())
          acceptance['historical_artifact_digest_verified']=True
          acceptance['legacy_reference_cross_month_rows_exactly_5']=True
          acceptance['legacy_horizon_regression_rows_117']=True
          acceptance['legacy_horizon_regressions_all_passed']=True
          acceptance['status']='PASS'
          (out/'r2_acceptance.json').write_text(json.dumps(acceptance,indent=2,sort_keys=True)+'\n')

          metadata=json.loads((out/'run_metadata.json').read_text())
          metadata['legacy_reference_cross_month_rows_excluded']=cross_month_excluded
          metadata['legacy_horizon_regression_rows']=117
          metadata['legacy_horizon_regressions_passed']=True
          metadata['output_sha256']['legacy_horizon_regression.csv']=hashlib.sha256((out/'legacy_horizon_regression.csv').read_bytes()).hexdigest()
          metadata['output_sha256']['r2_acceptance.json']=hashlib.sha256((out/'r2_acceptance.json').read_bytes()).hexdigest()
          (out/'run_metadata.json').write_text(json.dumps(metadata,indent=2,sort_keys=True)+'\n')
          print({'legacy_horizon_regression':'PASS','rows':117,'cross_month_excluded':5})
          PY

      - name: Verify R2 output contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          out=Path('data/experiments/usdjpy_r2_horizon_surface_v1')
          lock=json.loads(Path('configs/research/usdjpy_r2_horizon_lock_v1.json').read_text())
          for name in lock['required_outputs']:
              path=out/name
              assert path.is_file() and path.stat().st_size>0,name
          summary=pd.read_csv(out/'candidate_horizon_summary.csv')
          monthly=pd.read_csv(out/'candidate_horizon_monthly.csv')
          direction=pd.read_csv(out/'candidate_horizon_direction.csv')
          surface=pd.read_csv(out/'candidate_horizon_surface.csv')
          hashes=pd.read_csv(out/'candidate_horizon_hashes.csv')
          regression=pd.read_csv(out/'legacy_horizon_regression.csv')
          trades=pd.read_csv(out/'candidate_horizon_trades.csv.gz',compression='gzip')
          assert len(summary)==660
          assert len(monthly)==3960
          assert len(direction)==1320
          assert len(surface)==60
          assert len(hashes)==660
          assert len(trades)==383078,len(trades)
          assert len(regression)==117 and regression['passed'].all()
          assert regression['reference_cross_month_rows_excluded_total'].eq(5).all()
          assert summary['candidate_id'].nunique()==60
          assert summary['horizon_bars'].nunique()==11
          acceptance=json.loads((out/'r2_acceptance.json').read_text())
          assert acceptance['status']=='PASS'
          assert all(value is True for key,value in acceptance.items() if key!='status')
          metadata=json.loads((out/'run_metadata.json').read_text())
          assert metadata['h2_rows_parsed']==0
          assert metadata['2025_artifact_access'] is False
          assert metadata['selection_or_promotion_made'] is False
          assert metadata['legacy_reference_cross_month_rows_excluded']==5
          assert metadata['legacy_horizon_regressions_passed'] is True
          assert metadata['R3_unblocked'] is True
          print({'R2':'PASS','trades':len(trades),'summary':660,'monthly':3960,'direction':1320,'historical_regression':117})
          PY

      - name: Write job summary
        if: always()
        run: |
          echo '# Corrected USDJPY R2 Fixed-Horizon Surface v1' >> "${GITHUB_STEP_SUMMARY}"
          echo >> "${GITHUB_STEP_SUMMARY}"
          echo 'R2 evaluates all 660 Entry/horizon combinations and makes no selection or promotion decision.' >> "${GITHUB_STEP_SUMMARY}"
          if [ -f "${OUTPUT_DIR}/r2_acceptance.json" ]; then
            echo '```json' >> "${GITHUB_STEP_SUMMARY}"
            cat "${OUTPUT_DIR}/r2_acceptance.json" >> "${GITHUB_STEP_SUMMARY}"
            echo '```' >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload R2 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usdjpy-r2-horizon-surface-corrected-v1-${{ github.run_id }}
          path: data/experiments/usdjpy_r2_horizon_surface_v1/**
          if-no-files-found: error
          retention-days: 90

      - name: Close successful trigger issue
        if: github.event_name == 'issues' && success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh issue comment "${ISSUE_NUMBER}" --repo "${REPOSITORY}" \
            --body "Corrected USDJPY R2 complete surface passed. Run ID: ${{ github.run_id }}. R3 is unblocked; no candidate was selected and H2/2025 remained unopened."
          gh issue close "${ISSUE_NUMBER}" --repo "${REPOSITORY}" --reason completed
          gh issue close 105 --repo "${REPOSITORY}" --reason completed || true
          gh issue close 107 --repo "${REPOSITORY}" --reason completed || true

      - name: Report failed trigger issue
        if: github.event_name == 'issues' && failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh issue comment "${ISSUE_NUMBER}" --repo "${REPOSITORY}" \
            --body "Corrected USDJPY R2 failed. Run ID: ${{ github.run_id }}. R3 remains blocked."
