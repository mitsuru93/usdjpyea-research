name: Dispatch USDJPY CSOS Remaining-Family Atlas Publication v2
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - 'configs/research/usdjpy_csos_dukascopy_native_remaining_family_atlas_publication_request_v1.json'
permissions:
  actions: write
  issues: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch publication workflow once
        env:
          GH_TOKEN: '${{ github.token }}'
        shell: bash
        run: |
          set -Eeuo pipefail
          repo="$GITHUB_REPOSITORY"
          workflow=publish_usdjpy_csos_remaining_family_atlas_release_v2.yml
          receipt=configs/research/usdjpy_csos_dukascopy_native_remaining_family_atlas_release_receipt_v1.json
          gh issue comment 403 --repo "$repo" --body "Atlas publication dispatcher v2 started for PR #${{ github.event.pull_request.number }}."
          if gh api "repos/${repo}/contents/${receipt}?ref=main" >/dev/null 2>&1; then
            gh issue comment 403 --repo "$repo" --body "Atlas publication dispatcher v2: Release receipt already exists; duplicate dispatch suppressed."
            exit 0
          fi
          runs=$(gh api "repos/${repo}/actions/workflows/${workflow}/runs?per_page=10")
          active=$(printf '%s' "$runs" | jq -c '[.workflow_runs[] | select(.status=="queued" or .status=="in_progress")] | first // empty')
          if [ -n "$active" ]; then
            run_id=$(printf '%s' "$active" | jq -r .id)
            status=$(printf '%s' "$active" | jq -r .status)
            url=$(printf '%s' "$active" | jq -r .html_url)
            gh issue comment 403 --repo "$repo" --body "Atlas publication dispatcher v2: existing Run ${run_id} is ${status}; duplicate dispatch suppressed. ${url}"
            exit 0
          fi
          dispatch_rc=0
          output=$(gh api --method POST "repos/${repo}/actions/workflows/${workflow}/dispatches" -f ref=main 2>&1) || dispatch_rc=$?
          if [ "$dispatch_rc" -ne 0 ]; then
            compact=$(printf '%s' "$output" | tr '\n' ' ' | cut -c1-1200)
            gh issue comment 403 --repo "$repo" --body "Atlas publication dispatcher v2 FAILED with exit code ${dispatch_rc}. API response: ${compact}"
            exit "$dispatch_rc"
          fi
          sleep 4
          runs=$(gh api "repos/${repo}/actions/workflows/${workflow}/runs?per_page=10")
          latest=$(printf '%s' "$runs" | jq -c '[.workflow_runs[] | select(.event=="workflow_dispatch")] | sort_by(.created_at) | last // empty')
          run_id=$(printf '%s' "$latest" | jq -r .id)
          status=$(printf '%s' "$latest" | jq -r .status)
          url=$(printf '%s' "$latest" | jq -r .html_url)
          gh issue comment 403 --repo "$repo" --body "Atlas publication dispatcher v2: dispatched Run ${run_id}; status ${status}. ${url}"
