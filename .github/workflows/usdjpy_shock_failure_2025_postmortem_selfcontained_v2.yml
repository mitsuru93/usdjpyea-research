name: USDJPY Shock Failure 2025 Postmortem Selfcontained v2

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/usdjpy_shock_failure_2025_postmortem_selfcontained_v2.yml
      - tools/run_usdjpy_shock_failure_2025_postmortem_v1.py
      - tools/postmortem_payload_v1/**
      - configs/research/usdjpy_shock_failure_2025_postmortem_protocol_v1.json
      - research_inputs/usdjpy/shock_failure/2025_postmortem_v1/**
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: usdjpy-shock-failure-2025-postmortem-selfcontained-v2
  cancel-in-progress: true

jobs:
  postmortem:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PHASE2_RELEASE: usdjpy-csos-shock-failure-phase2-v1
      RAW_RELEASE: usdjpy-2025-raw-bidask-ticks-v1
      POSTMORTEM_RELEASE: usdjpy-shock-failure-2025-postmortem-v1
      MT4_CONTEXT_DIR: research_inputs/usdjpy/shock_failure/2025_postmortem_v1
      CORRECTED_P6: research_inputs/usdjpy/shock_failure/2025_postmortem_v1/corrected_p6_result_compact.json
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet --disable-pip-version-check pandas==2.2.3 numpy==2.1.3 scipy==1.14.1
      - name: Validate immutable inputs and evaluator
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,glob,hashlib,json,zlib
          from pathlib import Path
          parts=sorted(Path('tools/postmortem_payload_v1').glob('part_*.txt')); assert len(parts)==4
          src=zlib.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts),validate=True))
          assert hashlib.sha256(src).hexdigest()=='cc6cd2c9885acd25769fea709ecfa246f1338a3aebda28bf4ae62b9b6f553bbc'
          events=[]
          for p in sorted(glob.glob('research_inputs/usdjpy/shock_failure/2025_postmortem_v1/mt4_events_*.json')):
            x=json.load(open(p)); assert x['authority']['core_run_id']==30229496015; assert x['authority']['core_artifact_id']==8639969385; events.extend(x['events'])
          assert len(events)==47 and len({x['event_id'] for x in events})==47
          p6=json.load(open('research_inputs/usdjpy/shock_failure/2025_postmortem_v1/corrected_p6_result_compact.json'))
          assert p6['status']=='FAIL_P6_2025_GATE_RESEARCH_ONLY_NO_RETUNING' and p6['standalone_combined']['closed_trades']==47
          protocol=json.load(open('configs/research/usdjpy_shock_failure_2025_postmortem_protocol_v1.json'))
          assert protocol['fixed_candidate_changes_permitted'] is False and protocol['production_authorized'] is False
          print('PASS_FIXED_INPUTS')
          PY
      - name: Download and verify Phase2 and 2025 Raw Tick authorities
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/usdjpy-shock-failure-2025-postmortem-v2"
          rm -rf "$root"; mkdir -p "$root"/{phase2-download,phase2,raw-download,raw,out,release,readback}
          gh release download "$PHASE2_RELEASE" --repo "$GITHUB_REPOSITORY" --dir "$root/phase2-download"
          shopt -s nullglob
          for z in "$root"/phase2-download/*.zip; do unzip -q "$z" -d "$root/phase2"; done
          for a in "$root"/phase2-download/*.tar.gz; do tar -xzf "$a" -C "$root/phase2"; done
          gh release download "$RAW_RELEASE" --repo "$GITHUB_REPOSITORY" --dir "$root/raw-download"
          python - "$root/raw-download" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          root=Path(sys.argv[1]); inv=json.load(open('research_inputs/usdjpy/shock_failure/2025_postmortem_v1/research_release_inventory.json'))
          rel=next(x for x in inv['releases'] if x['tag_name']=='usdjpy-2025-raw-bidask-ticks-v1')
          expected={a['name']:a['digest'].split(':',1)[1] for a in rel['assets']}; actual={p.name:p for p in root.iterdir() if p.is_file()}
          assert set(actual)==set(expected)
          for n,p in actual.items(): assert hashlib.sha256(p.read_bytes()).hexdigest()==expected[n]
          print('PASS_RELEASE_SHA256',len(actual))
          PY
          archives=("$root"/raw-download/usdjpy-2025-??-raw-ticks-v1.tar.gz); test "${#archives[@]}" -eq 12
          for a in "${archives[@]}"; do tar -xzf "$a" -C "$root/raw" --wildcards --no-anchored '*.csv.gz'; done
          cp "$root/raw-download/usdjpy-2025-raw-ticks-v1.annual-manifest.json" "$root/raw/"
          echo "POSTMORTEM_ROOT=$root" >> "$GITHUB_ENV"
      - name: Execute fixed-candidate postmortem
        id: evaluate
        shell: bash
        run: |
          set +e
          python tools/run_usdjpy_shock_failure_2025_postmortem_v1.py \
            --phase2-dir "$POSTMORTEM_ROOT/phase2" \
            --mt4-context-dir "$MT4_CONTEXT_DIR" \
            --raw-2025-root "$POSTMORTEM_ROOT/raw" \
            --corrected-p6 "$CORRECTED_P6" \
            --out-dir "$POSTMORTEM_ROOT/out" \
            --research-sha "$HEAD_SHA" \
            --core-sha e92ac28d908cb5c6ca89224507b24690822e0f35 \
            --run-id "$GITHUB_RUN_ID" >"$POSTMORTEM_ROOT/out/evaluator_stdout.log" 2>"$POSTMORTEM_ROOT/out/evaluator_stderr.log"
          code=$?; echo "$code" > "$POSTMORTEM_ROOT/out/evaluator_exit_code.txt"
          cat "$POSTMORTEM_ROOT/out/evaluator_stdout.log"; cat "$POSTMORTEM_ROOT/out/evaluator_stderr.log" >&2
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"; exit 0
      - name: Build manifest and commit evidence
        shell: bash
        run: |
          set -euo pipefail
          cp tools/run_usdjpy_shock_failure_2025_postmortem_v1.decoded.py "$POSTMORTEM_ROOT/out/postmortem_source_snapshot.py" 2>/dev/null || true
          cp "$CORRECTED_P6" "$POSTMORTEM_ROOT/out/corrected_p6_result.json"
          cp configs/research/usdjpy_shock_failure_2025_postmortem_protocol_v1.json "$POSTMORTEM_ROOT/out/"
          cp "$MT4_CONTEXT_DIR"/mt4_events_*.json "$POSTMORTEM_ROOT/out/"
          cp "$POSTMORTEM_ROOT/raw/usdjpy-2025-raw-ticks-v1.annual-manifest.json" "$POSTMORTEM_ROOT/out/"
          printf '%s\n' "$RAW_RELEASE" > "$POSTMORTEM_ROOT/out/raw_2025_release_tag.txt"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['POSTMORTEM_ROOT'])/'out'
          def sha(p):
            h=hashlib.sha256()
            with p.open('rb') as f:
              for c in iter(lambda:f.read(1<<20),b''): h.update(c)
            return h.hexdigest()
          files=[{'path':p.name,'bytes':p.stat().st_size,'sha256':sha(p)} for p in sorted(root.iterdir()) if p.is_file() and p.name not in {'manifest.json','SHA256SUMS'}]
          (root/'manifest.json').write_text(json.dumps({'schema_version':'usdjpy_shock_failure_2025_postmortem_manifest_v1','files':files},indent=2,sort_keys=True)+'\n')
          with (root/'SHA256SUMS').open('w') as f:
            for p in sorted(root.iterdir()):
              if p.is_file() and p.name!='SHA256SUMS': f.write(f'{sha(p)}  {p.name}\n')
          PY
          target=research/usdjpy/shock_failure/2025_external_gate_postmortem_v1
          rm -rf "$target"; mkdir -p "$target"; cp "$POSTMORTEM_ROOT/out"/* "$target/"
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$target"
          if ! git diff --cached --quiet; then git commit -m 'research: record Shock Failure 2025 external-gate postmortem v2'; git push origin "HEAD:$HEAD_BRANCH"; fi
          echo "PUBLICATION_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Publish immutable Release and readback
        if: steps.evaluate.outputs.exit_code == '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f "$POSTMORTEM_ROOT/out/final_decision.json"
          tar -czf "$POSTMORTEM_ROOT/release/usdjpy-shock-failure-2025-postmortem-v1.tar.gz" -C "$POSTMORTEM_ROOT/out" .
          cp "$POSTMORTEM_ROOT/out/manifest.json" "$POSTMORTEM_ROOT/out/SHA256SUMS" "$POSTMORTEM_ROOT/release/"
          (cd "$POSTMORTEM_ROOT/release" && sha256sum * > RELEASE_SHA256SUMS)
          if ! gh release view "$POSTMORTEM_RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$POSTMORTEM_RELEASE" --repo "$GITHUB_REPOSITORY" --target "$PUBLICATION_SHA" --title 'USDJPY Shock Failure 2025 External-Gate Postmortem v1' --notes 'Fixed candidate postmortem only; no retuning. 2025 remains consumed external evidence.'
            gh release upload "$POSTMORTEM_RELEASE" "$POSTMORTEM_ROOT/release"/* --repo "$GITHUB_REPOSITORY"
          fi
          gh release download "$POSTMORTEM_RELEASE" --repo "$GITHUB_REPOSITORY" --dir "$POSTMORTEM_ROOT/readback"
          (cd "$POSTMORTEM_ROOT/readback" && sha256sum -c RELEASE_SHA256SUMS)
      - name: Enforce evaluator success
        run: test '${{ steps.evaluate.outputs.exit_code }}' = '0'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: usdjpy-shock-failure-2025-postmortem-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.POSTMORTEM_ROOT }}/out
            ${{ env.POSTMORTEM_ROOT }}/release
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
