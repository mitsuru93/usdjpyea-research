name: Stage USDJPY 2024 MT4 Tick Import v1

on:
  workflow_dispatch:
    inputs:
      mode:
        description: prepare only or import through a preconfigured Tick Data Suite source
        required: true
        default: prepare
        type: choice
        options:
          - prepare
          - import
      tds_source:
        description: Existing custom Tick Data Suite source name
        required: true
        default: FX2Dukascopy
        type: string
      tds_symbol:
        description: Existing custom Tick Data Suite symbol
        required: true
        default: USDJPY
        type: string
      import_config_path:
        description: Existing Tick Data Suite import configuration (.icf)
        required: true
        default: C:\mt4-automation\tds\usdjpyea-usdjpy-import.icf
        type: string
  push:
    branches: [main]
    paths:
      - .github/workflows/stage_usdjpy_2024_mt4_tick_import_v1.yml

permissions:
  contents: read

concurrency:
  group: onamae-mt4-ui-single
  cancel-in-progress: false

env:
  CONVERTED_RELEASE_TAG: usdjpy-2024-mt4-tick-import-v1
  STAGING_DIR: C:\mt4-automation\tickdata\USDJPY\2024\mt4-import-v1

jobs:
  stage:
    runs-on:
      - self-hosted
      - Windows
      - X64
      - mt4-ui
      - rakuten
      - interactive
    timeout-minutes: 120

    steps:
      - name: Download converted release assets
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $package = Join-Path $env:RUNNER_TEMP 'usdjpy-2024-mt4-tick-import-v1'
          if (Test-Path -LiteralPath $package) {
              Remove-Item -LiteralPath $package -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $package | Out-Null

          $headers = @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
          }
          $tag = [Uri]::EscapeDataString($env:CONVERTED_RELEASE_TAG)
          $releaseUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag"
          $release = $null
          for ($attempt = 1; $attempt -le 80; $attempt++) {
              try {
                  $release = Invoke-RestMethod -Uri $releaseUri -Headers $headers -Method Get
                  break
              }
              catch {
                  if ($attempt -eq 80) { throw }
                  Write-Host "Converted release is not available yet; retry $attempt/80"
                  Start-Sleep -Seconds 15
              }
          }
          if (-not $release) { throw "Unable to resolve release $env:CONVERTED_RELEASE_TAG" }

          $assets = @($release.assets)
          if ($assets.Count -ne 15) {
              throw "Expected 15 release assets, found $($assets.Count)"
          }
          foreach ($asset in $assets) {
              $destination = Join-Path $package $asset.name
              $downloadHeaders = @{
                  Authorization = "Bearer $env:GH_TOKEN"
                  Accept = 'application/octet-stream'
                  'X-GitHub-Api-Version' = '2022-11-28'
              }
              Invoke-WebRequest -Uri $asset.url -Headers $downloadHeaders -OutFile $destination
              $downloaded = Get-Item -LiteralPath $destination
              if ($downloaded.Length -ne [int64]$asset.size) {
                  throw "Asset size mismatch for $($asset.name): $($downloaded.Length) != $($asset.size)"
              }
          }
          "release_id=$($release.id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_created_at=$($release.created_at)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Verify, stage, and expand monthly CSV files
        id: stage
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          function Get-Sha256([string]$Path) {
              return (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLowerInvariant()
          }

          $package = Join-Path $env:RUNNER_TEMP 'usdjpy-2024-mt4-tick-import-v1'
          $checksumPath = Join-Path $package 'SHA256SUMS'
          if (-not (Test-Path -LiteralPath $checksumPath -PathType Leaf)) {
              throw 'SHA256SUMS is missing'
          }
          foreach ($line in (Get-Content -LiteralPath $checksumPath)) {
              if ([string]::IsNullOrWhiteSpace($line)) { continue }
              if ($line -notmatch '^([0-9a-f]{64})\s{2}(.+)$') {
                  throw "Invalid checksum line: $line"
              }
              $expected = $Matches[1]
              $name = $Matches[2]
              $path = Join-Path $package $name
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                  throw "Checksum target is missing: $name"
              }
              $actual = Get-Sha256 $path
              if ($actual -ne $expected) {
                  throw "SHA256 mismatch for $name: $actual != $expected"
              }
          }

          $destination = $env:STAGING_DIR
          $csvDir = Join-Path $destination 'csv'
          if (Test-Path -LiteralPath $destination) {
              Remove-Item -LiteralPath $destination -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $destination, $csvDir | Out-Null
          Copy-Item -Path (Join-Path $package '*') -Destination $destination -Force

          $gzipFiles = @(Get-ChildItem -LiteralPath $destination -File -Filter 'USDJPY-2024-??-mt4-tick-import-v1.csv.gz' | Sort-Object Name)
          if ($gzipFiles.Count -ne 12) {
              throw "Expected 12 monthly gzip files, found $($gzipFiles.Count)"
          }

          $expanded = @()
          foreach ($gzipFile in $gzipFiles) {
              $csvName = $gzipFile.Name.Substring(0, $gzipFile.Name.Length - 3)
              $csvPath = Join-Path $csvDir $csvName
              $input = [System.IO.File]::OpenRead($gzipFile.FullName)
              try {
                  $gzip = New-Object System.IO.Compression.GZipStream($input, [System.IO.Compression.CompressionMode]::Decompress)
                  try {
                      $output = [System.IO.File]::Create($csvPath)
                      try { $gzip.CopyTo($output) } finally { $output.Dispose() }
                  }
                  finally { $gzip.Dispose() }
              }
              finally { $input.Dispose() }

              $reader = [System.IO.File]::OpenText($csvPath)
              try { $header = $reader.ReadLine() } finally { $reader.Dispose() }
              if ($header -ne 'datetime_utc,bid,ask,bid_volume,ask_volume') {
                  throw "Unexpected CSV header in $csvName: $header"
              }
              $file = Get-Item -LiteralPath $csvPath
              $expanded += [ordered]@{
                  name = $file.Name
                  size_bytes = $file.Length
                  sha256 = Get-Sha256 $file.FullName
              }
          }

          $manifestPath = Join-Path $destination 'USDJPY-2024-mt4-tick-import-v1.manifest.json'
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if (-not $manifest.accepted -or [int64]$manifest.annual_rows -ne 40969081) {
              throw 'Converted manifest was not accepted or has an unexpected annual row count'
          }

          $tdsCandidates = @(
              'C:\Program Files (x86)\eareview.net\Tick Data Suite\Tick Data Manager.exe',
              'C:\Program Files\eareview.net\Tick Data Suite\Tick Data Manager.exe'
          )
          $tdsExe = $tdsCandidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          $summary = [ordered]@{
              generated_at_utc = [DateTime]::UtcNow.ToString('o')
              repository = $env:GITHUB_REPOSITORY
              workflow = $env:GITHUB_WORKFLOW
              run_id = $env:GITHUB_RUN_ID
              run_attempt = $env:GITHUB_RUN_ATTEMPT
              runner_name = $env:RUNNER_NAME
              staging_dir = $destination
              csv_dir = $csvDir
              annual_rows = [int64]$manifest.annual_rows
              monthly_files = $expanded
              expanded_total_bytes = [int64](($expanded | Measure-Object -Property size_bytes -Sum).Sum)
              tick_data_manager_exe = $tdsExe
              tick_data_manager_installed = [bool]$tdsExe
              tick_data_manager_version = if ($tdsExe) { (Get-Item -LiteralPath $tdsExe).VersionInfo.FileVersion } else { $null }
              tick_data_manager_sha256 = if ($tdsExe) { Get-Sha256 $tdsExe } else { $null }
              import_config_default = 'C:\mt4-automation\tds\usdjpyea-usdjpy-import.icf'
              import_config_exists = Test-Path -LiteralPath 'C:\mt4-automation\tds\usdjpyea-usdjpy-import.icf' -PathType Leaf
          }
          $summaryPath = Join-Path $destination 'stage-summary.json'
          $summary | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $summaryPath -Encoding UTF8
          $summary | Format-List
          "summary_path=$summaryPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Import through Tick Data Suite when requested
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'import' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $sourceName = '${{ github.event.inputs.tds_source }}'
          $symbol = '${{ github.event.inputs.tds_symbol }}'
          $importConfig = '${{ github.event.inputs.import_config_path }}'
          $csvPattern = Join-Path $env:STAGING_DIR 'csv\USDJPY-2024-??-mt4-tick-import-v1.csv'
          $tdsCandidates = @(
              'C:\Program Files (x86)\eareview.net\Tick Data Suite\Tick Data Manager.exe',
              'C:\Program Files\eareview.net\Tick Data Suite\Tick Data Manager.exe'
          )
          $tdsExe = $tdsCandidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $tdsExe) { throw 'Tick Data Suite is not installed' }
          if (-not (Test-Path -LiteralPath $importConfig -PathType Leaf)) {
              throw "Tick Data Suite import configuration is missing: $importConfig"
          }
          if (Get-Process -Name 'Tick Data Manager' -ErrorAction SilentlyContinue) {
              throw 'Tick Data Manager is already running'
          }

          $arguments = @(
              "/import:$sourceName`:$symbol",
              "/iformat:$importConfig",
              "/input:$csvPattern"
          )
          $process = Start-Process -FilePath $tdsExe -ArgumentList $arguments -PassThru -Wait
          if ($process.ExitCode -ne 0) {
              throw "Tick Data Manager import returned exit code $($process.ExitCode)"
          }

      - name: Upload staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usdjpy-2024-mt4-tick-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: C:\mt4-automation\tickdata\USDJPY\2024\mt4-import-v1\stage-summary.json
          if-no-files-found: warn
          retention-days: 30
