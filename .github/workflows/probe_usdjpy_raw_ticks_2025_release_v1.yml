name: Probe USDJPY Raw Ticks 2025 Release v1

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/probe_usdjpy_raw_ticks_2025_release_v1.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Persist immutable release REST inventory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          target=research_inputs/usdjpy/shock_failure/2025_postmortem_v1/raw_tick_release_rest_inventory.json
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/usdjpy-raw-ticks-2025-v1" > "$target"
          python - "$target" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x['tag_name']=='usdjpy-raw-ticks-2025-v1'
          assert len(x['assets'])==13
          print([(a['name'],a['size']) for a in x['assets']])
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$target"
          git commit -m "evidence: record immutable 2025 Raw Tick release inventory"
          git push origin "HEAD:$HEAD_BRANCH"
