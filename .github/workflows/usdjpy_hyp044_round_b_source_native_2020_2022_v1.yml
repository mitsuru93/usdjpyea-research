name: USDJPY HYP-044 Round B Source-Native 2020-2022 v1

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/run_usdjpy_hyp044_round_b_source_native_2020_2022_v1.py'
      - '.github/workflows/usdjpy_hyp044_round_b_source_native_2020_2022_v1.yml'
      - 'configs/research/usdjpy_hyp044_candidate_freeze_receipt_round_b_v1.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Install pinned analysis runtime
        run: python -m pip install --disable-pip-version-check --quiet 'numpy==2.1.3' 'pandas==2.2.3'
      - name: Select certified source-native assets
        run: |
          set -euo pipefail
          rm -rf hyp044_round_b_source_native artifacts/research/usdjpy_hyp044/round_b_source_native_2020_2022_v1
          mkdir -p hyp044_round_b_source_native/months artifacts/research/usdjpy_hyp044/round_b_source_native_2020_2022_v1
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('docs/data_authorities/usdjpy_2020_2022_tick_authority_v1/release_manifest.json').read_text())
          rows=[]
          for a in manifest['payload_assets']:
              y=int(a['year']);m=int(a['month']);layer=a['layer']
              if (y==2019 and m>=10 or 2020<=y<=2022) and layer in {'bars','normalized'}:
                  rows.append([str(a['release_asset_id']),a['name'],a['sha256'],f'{y:04d}_{m:02d}',layer,str(a['bytes'])])
          if len(rows)!=78: raise SystemExit(f'expected 78 assets, got {len(rows)}')
          Path('hyp044_round_b_source_native/assets.tsv').write_text('\n'.join('\t'.join(r) for r in rows)+'\n')
          PY
      - name: Download and verify certified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r id name sha ym layer bytes; do
            d="hyp044_round_b_source_native/months/$ym"
            mkdir -p "$d"
            p="$d/$name"
            gh api "repos/mitsuru93/usdjpyea-research/releases/assets/$id" -H 'Accept: application/octet-stream' > "$p"
            actual="$(sha256sum "$p" | awk '{print $1}')"
            [ "$actual" = "$sha" ] || { echo "sha mismatch $name"; exit 1; }
            if [ "$layer" = bars ]; then tar -xzf "$p" -C "$d"; fi
          done < hyp044_round_b_source_native/assets.tsv
      - name: Materialize frozen C2 thresholds and verify Round B freeze
        run: |
          set -euo pipefail
          jq -e '.status=="PASS_RULE_FROZEN_BEFORE_ROUND_B_2025H1_EXECUTION" and .candidate_id=="B0_A2_EARLY_C3_PLUS_A4_SESSION_LOSS_CAP_2" and .rule_hash_sha256=="d8878f92e0641b10c4926966a03a46f238e4074335312003b7a6c058f8843f94" and ."2025H2_accessed"==false' configs/research/usdjpy_hyp044_candidate_freeze_receipt_round_b_v1.json
          jq '{f05_c2:{thresholds:{low_upper_atr_pips:.F05_C2.thresholds.volatility_tertile_low_upper_atr_pips,medium_upper_atr_pips:.F05_C2.thresholds.volatility_tertile_medium_upper_atr_pips}}}' configs/research/usdjpy_hyp044_candidate_input_registry_v1.json > hyp044_round_b_source_native/c2_summary.json
      - name: Execute frozen Round B source-native replay
        run: |
          set -euo pipefail
          python tools/run_usdjpy_hyp044_round_b_source_native_2020_2022_v1.py \
            --data-root hyp044_round_b_source_native/months \
            --c2-summary hyp044_round_b_source_native/c2_summary.json \
            --out artifacts/research/usdjpy_hyp044/round_b_source_native_2020_2022_v1
          jq -e '.status=="PASS_ROUND_B_SOURCE_NATIVE_2020_2022_ANALYSIS" and .authority=="USDJPY-DATA-2020-2022-TICK-AUTHORITY-001" and .candidate_id=="B0_A2_EARLY_C3_PLUS_A4_SESSION_LOSS_CAP_2" and .tick_count==78737040 and ."2025H2_accessed"==false' artifacts/research/usdjpy_hyp044/round_b_source_native_2020_2022_v1/round_b_source_native_result_2020_2022.json
      - name: Commit source-native Round B evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/research/usdjpy_hyp044/round_b_source_native_2020_2022_v1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(hyp044): bind Round B source-native 2020-2022 replay'
          git pull --rebase origin ${{ github.event.pull_request.head.ref || github.ref_name }}
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
