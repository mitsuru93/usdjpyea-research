name: Watch EURUSD 2025 Replication Source v1

on:
  workflow_run:
    workflows: ["Run EURUSD 2025 Full-Year Replication Source"]
    types: [completed]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write completion receipt
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          CREATED_AT: ${{ github.event.workflow_run.created_at }}
          UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
        run: |
          mkdir -p docs/research_reboot
          python - <<'PY'
          import json,os
          from pathlib import Path
          x={'workflow':'Run EURUSD 2025 Full-Year Replication Source','run_id':int(os.environ['RUN_ID']),'run_attempt':int(os.environ['RUN_ATTEMPT']),'conclusion':os.environ['CONCLUSION'],'head_sha':os.environ['HEAD_SHA'],'run_url':os.environ['RUN_URL'],'created_at':os.environ['CREATED_AT'],'updated_at':os.environ['UPDATED_AT']}
          Path('docs/research_reboot/eurusd_2025_source_workflow_completion_v1.json').write_text(json.dumps(x,indent=2,sort_keys=True)+'\n')
          PY
      - name: Commit completion receipt
        run: |
          git pull --rebase origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research_reboot/eurusd_2025_source_workflow_completion_v1.json
          if ! git diff --cached --quiet; then git commit -m "ci: record EURUSD 2025 source workflow completion"; git push origin main; fi
