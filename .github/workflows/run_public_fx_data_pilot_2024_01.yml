name: DEPRECATED - Run Public FX Data Pilot 2024-01

on:
  workflow_dispatch:

jobs:
  deprecated:
    name: deprecated-all-symbol-pilot
    runs-on: ubuntu-latest
    steps:
      - name: Explain replacement workflow
        run: |
          cat <<'EOF'
          This all-symbol pilot workflow is deprecated.

          Do not use this workflow for Dukascopy tick collection. It was the old
          six-symbol aggregate pilot and is retained only to make previous runs
          reproducible in GitHub Actions history.

          Use one of the symbol-specific workflows instead:
            - Run Public FX Tick Pilot 2024-01 USDJPY
            - Run Public FX Tick Pilot 2024-01 EURUSD
            - Run Public FX Tick Pilot 2024-01 GBPUSD
            - Run Public FX Tick Pilot 2024-01 AUDUSD
            - Run Public FX Tick Pilot 2024-01 USDCAD
            - Run Public FX Tick Pilot 2024-01 USDCHF
          EOF
