name: Materialize USDJPY HYP-038 Closure v2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/materialize_usdjpy_hyp038_closure_v2.yml'

permissions:
  contents: write

concurrency:
  group: materialize-usdjpy-hyp038-closure-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply immutable HYP-038 delta on latest Atlas-closed main
        shell: bash
        run: |
          set -euo pipefail
          source_sha='917ffca95eae2cc2930d72f0f12b2a22441b3544'
          git fetch origin "$source_sha"
          while IFS= read -r path; do
            case "$path" in
              configs/research/usdjpy_hyp038_*|docs/research/USDJPY_HYP038_*|docs/research/artifact_archives/usdjpy_hyp038_delayed_continuation_v1/*|tools/evaluate_usdjpy_hyp038_delayed_continuation_v1.py|.github/workflows/publish_usdjpy_hyp038_closure_v1.yml)
                mkdir -p "$(dirname "$path")"
                git show "$source_sha:$path" > "$path"
                ;;
            esac
          done < <(git ls-tree -r --name-only "$source_sha")

          test -f configs/research/usdjpy_hyp038_final_result_v1.json
          test -f docs/research/USDJPY_HYP038_DELAYED_CONTINUATION_RESULT_V1.md
          test -f tools/evaluate_usdjpy_hyp038_delayed_continuation_v1.py
          test -f .github/workflows/publish_usdjpy_hyp038_closure_v1.yml
          printf '%s  %s\n' 66da172e403ff6b53bbf5e84b492d0abdae553c3703c2b794ae3190c647e6af3 tools/evaluate_usdjpy_hyp038_delayed_continuation_v1.py | sha256sum -c -
          (cd docs/research/artifact_archives/usdjpy_hyp038_delayed_continuation_v1 && sha256sum -c PACKAGE_SHA256SUMS)
          jq -e '.decision=="MECHANISM_CONFIRMED_NO_DEPLOYABLE_LOSS_DECOUPLING_RULE" and .candidate_freeze_authorized==false and .period_access."2025H1"==false and .period_access."2025H2"==false and .production_authorized==false and .live_authorized==false' configs/research/usdjpy_hyp038_final_result_v1.json

          python - <<'PY'
          import json
          from pathlib import Path

          next_action = (
              'Do not retune HYP-038, freeze C5, implement Core/MT4, or access 2025. '
              'Preserve delayed right-tail continuation as mechanism evidence. The third-strategy slot remains open; '
              'the next eligible independent research direction is a separately preregistered B_BALANCE_MEAN_REVERSION entry-time hypothesis, '
              'while 2025H2 remains reserved for the integrated B02 v2 + F05 v2 + third-strategy gate.'
          )

          registry = json.loads(Path('configs/research/usdjpy_research_candidate_registry_v66.json').read_text())
          registry.update({
              'schema_version': 'usdjpy_research_candidate_registry_v67',
              'supersedes': 'configs/research/usdjpy_research_candidate_registry_v66.json',
              'status': 'USDJPY_HYP038_COMPLETE_MECHANISM_CONFIRMED_NO_DEPLOYABLE_LOSS_DECOUPLING_RULE',
              'active_hypothesis': None,
              'active_family': None,
              'current_candidate': None,
              'candidate_ids': [],
              'current_open_research_question': None,
              'development_decision': 'MECHANISM_CONFIRMED_NO_DEPLOYABLE_LOSS_DECOUPLING_RULE',
              'candidate_rule_changed': False,
              'scientific_gate_definition_changed_after_outcome': False,
              'scientific_result': True,
              'technical_no_result': False,
              'no_retuning': True,
              'candidate_registry': 'configs/research/usdjpy_hyp038_candidate_registry_v1.json',
              'result': 'configs/research/usdjpy_hyp038_final_result_v1.json',
              'report': 'docs/research/USDJPY_HYP038_DELAYED_CONTINUATION_RESULT_V1.md',
              'output_manifest': 'configs/research/usdjpy_hyp038_output_manifest_v1.json',
              'period_access_receipt': 'configs/research/usdjpy_hyp038_period_access_receipt_v1.json',
              'hypothesis_ledger_addendum': 'configs/research/usdjpy_hypothesis_ledger_addendum_v41.json',
              'atlas_comparison': 'configs/research/usdjpy_hyp038_atlas_comparison_v1.json',
              'remaining_family_atlas_decision': 'ATLAS_COMPLETE_MECHANISM_RESEARCH_ONLY',
              'source_run_id': 30437473624,
              'source_artifact_id': 8718213549,
              'source_artifact_digest': 'sha256:549d2f79937d2304cd5ae4b700c6a22eabf2a105587f367491364aca8025342c',
              'next_action': next_action
          })
          registry['closed_boundaries']['USDJPY-HYP-038'] = 'MECHANISM_CONFIRMED_NO_DEPLOYABLE_LOSS_DECOUPLING_RULE'
          registry['run_authorization'] = {'2020_2022_analysis': False, '2020_2022_binding_confirmation': False, 'Core_implementation': False, 'MT4_candidate': False, '2025H1': False, '2025H2': False, 'production': False, 'live': False}
          registry['research_memory']['hypothesis_ledger_addendum'] = 'configs/research/usdjpy_hypothesis_ledger_addendum_v41.json'
          Path('configs/research/usdjpy_research_candidate_registry_v67.json').write_text(json.dumps(registry, indent=2, sort_keys=True) + '\n')

          ledger = {
              'schema_version': 'usdjpy_hypothesis_ledger_addendum_v41',
              'status': 'ACTIVE_APPEND_ONLY_DELTA',
              'entry_mode': 'DELTA_INHERIT_SUPERSEDES',
              'base_ledger': 'configs/research/usdjpy_hypothesis_ledger_v1.json',
              'inherited_addendum': 'configs/research/usdjpy_hypothesis_ledger_addendum_v40.json',
              'supersedes': 'configs/research/usdjpy_hypothesis_ledger_addendum_v40.json',
              'entries': [{
                  'hypothesis_id': 'USDJPY-HYP-038',
                  'family_ids': ['S_SHORT_PULLBACK_DELAYED_CONTINUATION_LOSS_DECOUPLING'],
                  'title': 'Short Pullback Delayed Right-Tail Continuation and Portfolio Loss-Decoupling Study',
                  'target_failure_mode': 'HYP-037 delayed right-tail alpha had negative B02/F05 baseline-day contribution and worsened worst 5-business-day loss; determine whether time-causal admission or lifecycle information can decouple losses without destroying the right tail.',
                  'causal_hypothesis': 'Short Pullback profit is delayed 120-240 minute right-tail continuation; entry-time, checkpoint-time, or one portfolio-state condition may reject continuation failure while preserving large winners.',
                  'pre_result_predictions': [
                      'At least one finite OOF candidate may make negative-baseline-day contribution nonnegative.',
                      'A deployable rule must retain at least 90 percent of top-5 winner P/L and 80 percent of top-decile gross profit.',
                      'A deployable rule must have avoided loss greater than sacrificed profit and preserve a majority of the top 25 winners.',
                      'A deployable rule must pass PF, fold, cost-stress and all portfolio loss-cluster hard gates.'
                  ],
                  'tests': [
                      'Four-fold 2023H1/2023H2/2024H1/2024H2 leave-one-fold-out evaluation of the preregistered finite C1-C6 catalog.',
                      'Causal Bid/Ask Tick reconstruction at 15, 30, 60, 90 and 120 minute checkpoints.',
                      'Right-tail preservation audit against the unchanged HYP-037 C0 reference.',
                      'UTC/JPY B02/F05 realized and full-equity portfolio replay.',
                      'Observed spread, +1 pip spread, +15 second Entry delay and 0.5 pip adverse slippage per side stress.',
                      'Concentration and event/date/session-block bootstrap diagnostics.'
                  ],
                  'decision': 'MECHANISM_CONFIRMED_NO_DEPLOYABLE_LOSS_DECOUPLING_RULE',
                  'status': 'COMPLETE_RESEARCH_DECISION_NO_CANDIDATE_FREEZE',
                  'phase2_status': 'COMPLETE_RESEARCH_DECISION_NO_CANDIDATE_FREEZE',
                  'authorization': {'2023_2024_research': False, '2025H1': False, '2025H2': False, 'Core': False, 'MT4': False, 'candidate_freeze': False, 'live': False, 'production': False},
                  'period_access': {'2020_2022': False, '2023_2024_candidate_outcomes': True, '2025': False},
                  'retained_findings': [
                      'Delayed right-tail continuation remains confirmed in the unchanged HYP-037 reference.',
                      'C5 co-exposure skip made negative-baseline-day contribution positive but destroyed the right tail and failed OOF economics.',
                      'No finite entry, lifecycle, portfolio, or combined rule passed all hard gates.'
                  ],
                  'falsified_or_unsupported_claims': [
                      'Observable finite entry-time or lifecycle state can preserve the HYP-037 right tail while rejecting enough losses for deployment.',
                      'The co-exposure skip is portable across all four half-year folds.',
                      'The selected OOF rule remains positive under +1 pip spread and 0.5 pip adverse slippage per side.',
                      'The selected OOF rule improves worst 5-day, worst 20-day and worst calendar month simultaneously.'
                  ],
                  'failed_gates': [
                      'OOF PF 1.07058 < 1.10', '2024H2 net -JPY5777 < -JPY1500',
                      'spread +1 pip and 0.5 pip each-side slippage net -JPY133', 'worst 5-day, 20-day and month worsened',
                      'top-5 winner retention 17.4 percent', 'top-decile profit retention 23.2 percent',
                      'sacrificed profit JPY57813 exceeded avoided loss JPY41761', 'top-25 preserved 6/25'
                  ],
                  'prohibited_reuse': ['Do not change HYP-037 decision.', 'Do not retune HYP-038 C5 or lifecycle thresholds under HYP-038.', 'Do not freeze or implement any HYP-038 variant.', 'Do not use 2025 for HYP-038.'],
                  'evidence_refs': {
                      'preregistration': 'configs/research/usdjpy_hyp038_preregistration_v1.json',
                      'final_result': 'configs/research/usdjpy_hyp038_final_result_v1.json',
                      'report': 'docs/research/USDJPY_HYP038_DELAYED_CONTINUATION_RESULT_V1.md',
                      'artifact_archive': 'docs/research/artifact_archives/usdjpy_hyp038_delayed_continuation_v1',
                      'run_id': 30437473624, 'artifact_id': 8718213549,
                      'artifact_digest': 'sha256:549d2f79937d2304cd5ae4b700c6a22eabf2a105587f367491364aca8025342c',
                      'deterministic_archive_sha256': '0322ccb9f62f4f11a70ef4d9e99dc7086b7b4ec3072d3c1cba9b905dc3d62bb8'
                  },
                  'successor_questions': [
                      'Can a separately preregistered B_BALANCE_MEAN_REVERSION entry-time mechanism produce a deployable independent third strategy?',
                      'Should delayed Short Pullback continuation remain research memory only unless a materially different information set becomes available?'
                  ],
                  'lineage': 'Independent successor to closed HYP-037; HYP-037 decision remains unchanged.',
                  'next_action': next_action
              }],
              'hypothesis_status_updates': []
          }
          Path('configs/research/usdjpy_hypothesis_ledger_addendum_v41.json').write_text(json.dumps(ledger, indent=2, sort_keys=True) + '\n')

          manifest_path = Path('configs/research/usdjpy_research_memory_manifest_v1.json')
          manifest = json.loads(manifest_path.read_text())
          manifest['canonical_pointers'].update({
              'current_candidate_registry': 'configs/research/usdjpy_research_candidate_registry_v67.json',
              'hypothesis_ledger_addendum': 'configs/research/usdjpy_hypothesis_ledger_addendum_v41.json',
              'hyp038_preregistration': 'configs/research/usdjpy_hyp038_preregistration_v1.json',
              'hyp038_result': 'configs/research/usdjpy_hyp038_final_result_v1.json',
              'hyp038_result_report': 'docs/research/USDJPY_HYP038_DELAYED_CONTINUATION_RESULT_V1.md',
              'hyp038_candidate_registry': 'configs/research/usdjpy_hyp038_candidate_registry_v1.json',
              'hyp038_period_access_receipt': 'configs/research/usdjpy_hyp038_period_access_receipt_v1.json',
              'hyp038_output_manifest': 'configs/research/usdjpy_hyp038_output_manifest_v1.json',
              'hyp038_atlas_comparison': 'configs/research/usdjpy_hyp038_atlas_comparison_v1.json',
              'hyp038_closure_receipt': 'configs/research/usdjpy_hyp038_closure_receipt_v1.json'
          })
          manifest['current_state_snapshot'].update({
              '2025_H1_authorized': False, '2025_H2_authorized': False, 'MT4_parity_authorized': False,
              'active_family': None, 'active_hypothesis': None, 'candidate_outcome_evaluation_authorized': False,
              'candidate_signal_generation_authorized': False, 'current_candidate': None, 'current_open_research_question': None,
              'historical_2020_2022_authorized': False, 'live_authorized': False, 'production_authorized': False,
              'registry_status': 'USDJPY_HYP038_COMPLETE_MECHANISM_CONFIRMED_NO_DEPLOYABLE_LOSS_DECOUPLING_RULE',
              'next_action': next_action
          })
          manifest['parallel_track_state']['USDJPY-HYP-038'] = {
              'status': 'COMPLETE_RESEARCH_DECISION_NO_CANDIDATE_FREEZE',
              'decision': 'MECHANISM_CONFIRMED_NO_DEPLOYABLE_LOSS_DECOUPLING_RULE',
              '2020_2022_accessed': False, '2025_accessed': False, 'candidate_freeze': False,
              'core_mt4_authorized': False, 'production_authorized': False, 'live_authorized': False
          }
          manifest['lineage_rules'].update({
              'HYP038_is_independent_from_HYP037': True,
              'HYP037_decision_remains_unchanged_after_HYP038': True,
              'HYP038_2020_2022_not_accessed': True,
              'HYP038_2025_not_accessed': True,
              'HYP038_candidate_not_frozen': True
          })
          guard = 'HYP038 finite variants must not be retuned or relabeled after closure'
          if guard not in manifest['duplicate_research_guard']['block_conditions']:
              manifest['duplicate_research_guard']['block_conditions'].append(guard)
          for item in manifest['mandatory_startup_read_order']:
              if item['ordinal'] == 3:
                  item['path'] = 'configs/research/usdjpy_research_candidate_registry_v67.json'
                  item['reason'] = 'global state after HYP-038 mechanism-only scientific closure'
              elif item['ordinal'] == 6:
                  item['path'] = 'configs/research/usdjpy_period_role_policy_v6.json'
                  item['reason'] = 'current EA-wide period roles'
              elif item['ordinal'] == 8:
                  item['path'] = 'configs/research/usdjpy_hypothesis_ledger_addendum_v41.json'
                  item['reason'] = 'append-only scientific memory through HYP-038 closure'
          existing = {x['path'] for x in manifest['mandatory_startup_read_order']}
          ordinal = max(x['ordinal'] for x in manifest['mandatory_startup_read_order'])
          for path, reason in [
              ('configs/research/usdjpy_hyp038_final_result_v1.json', 'HYP-038 binding Research decision'),
              ('docs/research/USDJPY_HYP038_DELAYED_CONTINUATION_RESULT_V1.md', 'HYP-038 human-readable result'),
              ('configs/research/usdjpy_hyp038_atlas_comparison_v1.json', 'HYP-038 and Remaining-Family Atlas common comparison')
          ]:
              if path not in existing:
                  ordinal += 1
                  manifest['mandatory_startup_read_order'].append({'ordinal': ordinal, 'path': path, 'reason': reason})
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          PY

          python tools/validate_usdjpy_research_memory_v2.py --root . --output "${RUNNER_TEMP}/hyp038_memory_validation.json"
          jq -e '.status=="PASS" and .registry_schema=="usdjpy_research_candidate_registry_v67" and .registry_status=="USDJPY_HYP038_COMPLETE_MECHANISM_CONFIRMED_NO_DEPLOYABLE_LOSS_DECOUPLING_RULE"' "${RUNNER_TEMP}/hyp038_memory_validation.json"
          cp "${RUNNER_TEMP}/hyp038_memory_validation.json" configs/research/usdjpy_hyp038_research_memory_validation_receipt_v1.json

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/publish_usdjpy_hyp038_closure_v1.yml configs/research docs/research tools/evaluate_usdjpy_hyp038_delayed_continuation_v1.py
          git commit -m 'research: canonicalize HYP-038 closure on Atlas-closed main'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
