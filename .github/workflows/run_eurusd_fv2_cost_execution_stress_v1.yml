name: Run EURUSD F v2 Cost and Execution Stress v1

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: eurusd-fv2-cost-execution-stress-v1
  cancel-in-progress: false

jobs:
  stress:
    if: ${{ github.event_name != 'issues' || github.event.issue.title == '[EURUSD] Run F v2 cost and execution stress v1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_TAG: eurusd-2024-source-artifact-archive-v1
      SOURCE_ASSET: eurusd-2024-source-artifact-id-8441596981.zip
      SOURCE_SHA256: 7d6e282172ec4290465b61dece886df0407f983726c4f51fb9eddd028318a685
      RESULT_ROOT: result/eurusd_fv2_cost_execution_stress_v1
      RESULT_TAG: eurusd-fv2-cost-execution-stress-v1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies and compile stress evaluator
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy tabulate
          python -m py_compile tools/run_eurusd_h1_h2_v2_validation.py tools/run_eurusd_fv2_cost_execution_stress_v1.py
      - name: Verify locked protocol and candidate roles
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          protocol=json.loads(Path('configs/research/eurusd_fv2_cost_execution_stress_protocol_v1.json').read_text())
          assert protocol['status']=='preregistered_before_stress_execution',protocol
          assert protocol['candidates']==[
            {'id':'F_v2_z72_1p5_mean_target_0p5_max12','role':'production_primary'},
            {'id':'F_v2_z72_1p5_mean_target_0p25_max12','role':'neighboring_robustness_control'},
          ],protocol
          assert 'disconnect the logged-in Rakuten terminal' in protocol['prohibited_operations'],protocol
          assert 'perform a forward test' in protocol['prohibited_operations'],protocol
          print({'stress_protocol':'LOCKED','primary':protocol['candidates'][0]['id']})
          PY
      - name: Download exact canonical 2024 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/source input/unpacked
          gh release download "${SOURCE_TAG}" --pattern "${SOURCE_ASSET}" --dir input/source
          echo "${SOURCE_SHA256}  input/source/${SOURCE_ASSET}" | sha256sum -c -
          unzip -q "input/source/${SOURCE_ASSET}" -d input/unpacked
          test -f input/unpacked/bundle/bars/H1/EURUSD_H1.csv.gz
      - name: Run registered stress grid
        run: |
          python tools/run_eurusd_fv2_cost_execution_stress_v1.py \
            --bars input/unpacked/bundle/bars/H1/EURUSD_H1.csv.gz \
            --candidate-protocol configs/research/eurusd_h1_h2_v2_candidate_protocol.json \
            --stress-protocol configs/research/eurusd_fv2_cost_execution_stress_protocol_v1.json \
            --output-dir "${RESULT_ROOT}"
      - name: Enforce output and no-rule-change contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RESULT_ROOT'])
          protocol=json.loads(Path('configs/research/eurusd_fv2_cost_execution_stress_protocol_v1.json').read_text())
          for name in protocol['required_outputs']:
            assert (root/name).is_file(),name
          result=json.loads((root/'stress_result.json').read_text())
          source=json.loads((root/'source_receipt.json').read_text())
          assert result['candidate_rules_changed'] is False,result
          assert result['new_filter_selected'] is False,result
          assert result['production_primary_candidate_id']=='F_v2_z72_1p5_mean_target_0p5_max12',result
          assert source['bars_rows']==6112,source
          print({'contract':'PASS','primary_pass':result['production_primary_pass']})
          PY
          (cd "${RESULT_ROOT}" && sha256sum -c SHA256SUMS)
      - name: Write exact execution receipt
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['RESULT_ROOT'])
          result=json.loads((root/'stress_result.json').read_text())
          source=json.loads((root/'source_receipt.json').read_text())
          receipt={
            'schema_version':'eurusd_fv2_cost_execution_stress_execution_receipt_v1',
            'workflow_run_id':int(os.environ['GITHUB_RUN_ID']),
            'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
            'head_sha':os.environ['GITHUB_SHA'],
            'source_asset_sha256':'sha256:'+os.environ['SOURCE_SHA256'],
            'annual_frame_sha256':source['bars_frame_content_sha256'],
            'stress_protocol_sha256':source['stress_protocol_sha256'],
            'authoritative_candidate_lock_sha256':source['authoritative_candidate_lock_sha256'],
            'production_primary_candidate_id':result['production_primary_candidate_id'],
            'production_primary_pass':result['production_primary_pass'],
            'candidate_rules_changed':False,
            'new_filter_selected':False,
          }
          (root/'execution_receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          lines=[]
          for path in sorted(root.iterdir()):
            if path.is_file() and path.name!='SHA256SUMS':
              lines.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}")
          (root/'SHA256SUMS').write_text('\n'.join(lines)+'\n')
          print(json.dumps(receipt,indent=2,sort_keys=True))
          PY
          (cd "${RESULT_ROOT}" && sha256sum -c SHA256SUMS)
      - name: Upload stress evidence
        uses: actions/upload-artifact@v4
        with:
          name: eurusd-fv2-cost-execution-stress-v1-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ env.RESULT_ROOT }}
          if-no-files-found: error
          retention-days: 90
      - name: Publish durable stress Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -C result -cf - eurusd_fv2_cost_execution_stress_v1 | gzip -n > eurusd-fv2-cost-execution-stress-v1.tar.gz
          sha256sum eurusd-fv2-cost-execution-stress-v1.tar.gz > eurusd-fv2-cost-execution-stress-v1.tar.gz.sha256
          cp "${RESULT_ROOT}/stress_result.json" stress_result.json
          cp "${RESULT_ROOT}/analysis_summary.md" analysis_summary.md
          cp "${RESULT_ROOT}/execution_receipt.json" execution_receipt.json
          cp "${RESULT_ROOT}/registered_scenarios.csv" registered_scenarios.csv
          cp "${RESULT_ROOT}/SHA256SUMS" SHA256SUMS
          assets=(eurusd-fv2-cost-execution-stress-v1.tar.gz eurusd-fv2-cost-execution-stress-v1.tar.gz.sha256 stress_result.json analysis_summary.md execution_receipt.json registered_scenarios.csv SHA256SUMS)
          if gh release view "${RESULT_TAG}" >/dev/null 2>&1; then
            gh release upload "${RESULT_TAG}" "${assets[@]}" --clobber
          else
            gh release create "${RESULT_TAG}" "${assets[@]}" --title "EURUSD F v2 cost and execution stress v1" --notes "Registered cost-grid characterization for the unchanged target-0.5 production primary and target-0.25 robustness control. No signal or exit rule is changed." --latest=false
          fi
          gh release view "${RESULT_TAG}" --json tagName,url,isDraft,isPrerelease,assets > "${RESULT_ROOT}/release_receipt.json"
      - name: Commit stress result and receipts
        run: |
          set -euo pipefail
          git pull --rebase origin main
          target=docs/research_reboot/artifact_archives/eurusd_fv2_cost_execution_stress_v1
          mkdir -p "${target}"
          cp "${RESULT_ROOT}/stress_result.json" "${target}/stress_result.json"
          cp "${RESULT_ROOT}/analysis_summary.md" "${target}/analysis_summary.md"
          cp "${RESULT_ROOT}/execution_receipt.json" "${target}/execution_receipt.json"
          cp "${RESULT_ROOT}/release_receipt.json" "${target}/release_receipt.json"
          cp "${RESULT_ROOT}/registered_scenarios.csv" "${target}/registered_scenarios.csv"
          cp "${RESULT_ROOT}/stress_grid.csv" "${target}/stress_grid.csv"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${target}"
          git commit -m "research: record EURUSD F v2 cost execution stress"
          git push origin main
      - name: Close trigger issue
        if: ${{ github.event_name == 'issues' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment "Cost and execution stress completed in run ${{ github.run_id }} and Release ${RESULT_TAG}."
