name: FX2 Artifact Storage Audit v1

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  audit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.issue.title == '[FX2-ARTIFACT-STORAGE-AUDIT]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Audit artifact storage
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            );

            const normalize = (value) => String(value || '').trim().toLowerCase();
            const familyKey = (name) => normalize(name)
              .replace(/\b\d{8,}\b/g, '{run}')
              .replace(/-attempt-?\d+\b/g, '-attempt-{n}')
              .replace(/\{run\}-\d+$/g, '{run}-{attempt}');
            const formatBytes = (bytes) => {
              const units = ['B', 'KiB', 'MiB', 'GiB', 'TiB'];
              let value = Number(bytes || 0);
              let unit = 0;
              while (value >= 1024 && unit < units.length - 1) {
                value /= 1024;
                unit += 1;
              }
              return `${value.toFixed(unit === 0 ? 0 : 2)} ${units[unit]}`;
            };
            const matchesAny = (name, patterns) => {
              const normalized = normalize(name);
              return (patterns || []).some((pattern) => normalized.includes(normalize(pattern)));
            };

            const policyResponse = await github.rest.repos.getContent({
              owner,
              repo,
              path: 'config/research_infra/fx2_artifact_lifecycle_policy_v1.json',
              ref: context.sha
            });
            const policy = JSON.parse(Buffer.from(
              policyResponse.data.content,
              policyResponse.data.encoding
            ).toString('utf8'));
            const duplicate = policy.duplicate_prune || {};
            const sourcePatterns = duplicate.exempt_patterns || [];
            const regenerablePatterns = duplicate.regenerable_patterns || [];
            const neverDeletePatterns = policy.never_delete_patterns || [];

            const classify = (name) => {
              if (matchesAny(name, neverDeletePatterns)) return 'explicitly_protected';
              if (matchesAny(name, sourcePatterns)) return 'source_data';
              if (matchesAny(name, regenerablePatterns)) return 'regenerable';
              return 'unclassified';
            };

            const categories = new Map();
            const families = new Map();
            const exactNames = new Map();
            let totalBytes = 0;

            for (const artifact of artifacts) {
              const bytes = Number(artifact.size_in_bytes || 0);
              totalBytes += bytes;
              const category = classify(artifact.name);
              const family = familyKey(artifact.name);
              const exact = normalize(artifact.name);

              const categoryRow = categories.get(category) || { category, count: 0, bytes: 0 };
              categoryRow.count += 1;
              categoryRow.bytes += bytes;
              categories.set(category, categoryRow);

              const familyRow = families.get(family) || {
                family,
                category,
                count: 0,
                bytes: 0,
                largest_bytes: 0,
                unique_sizes: new Set(),
                unique_digests: new Set(),
                oldest_created_at: null,
                newest_created_at: null,
                sample_names: []
              };
              familyRow.count += 1;
              familyRow.bytes += bytes;
              familyRow.largest_bytes = Math.max(familyRow.largest_bytes, bytes);
              familyRow.unique_sizes.add(bytes);
              if (artifact.digest) familyRow.unique_digests.add(artifact.digest);
              if (!familyRow.oldest_created_at || artifact.created_at < familyRow.oldest_created_at) {
                familyRow.oldest_created_at = artifact.created_at;
              }
              if (!familyRow.newest_created_at || artifact.created_at > familyRow.newest_created_at) {
                familyRow.newest_created_at = artifact.created_at;
              }
              if (familyRow.sample_names.length < 3 && !familyRow.sample_names.includes(artifact.name)) {
                familyRow.sample_names.push(artifact.name);
              }
              if (familyRow.category !== category) familyRow.category = 'mixed';
              families.set(family, familyRow);

              const exactRow = exactNames.get(exact) || { name: artifact.name, count: 0, bytes: 0 };
              exactRow.count += 1;
              exactRow.bytes += bytes;
              exactNames.set(exact, exactRow);
            }

            const largestArtifacts = [...artifacts]
              .sort((a, b) => Number(b.size_in_bytes || 0) - Number(a.size_in_bytes || 0))
              .slice(0, 30)
              .map((artifact) => ({
                id: artifact.id,
                name: artifact.name,
                bytes: Number(artifact.size_in_bytes || 0),
                category: classify(artifact.name),
                family: familyKey(artifact.name),
                created_at: artifact.created_at,
                expires_at: artifact.expires_at,
                run_id: artifact.workflow_run ? artifact.workflow_run.id : null
              }));

            const topFamilies = [...families.values()]
              .sort((a, b) => b.bytes - a.bytes)
              .slice(0, 40)
              .map((row) => ({
                ...row,
                unique_sizes: row.unique_sizes.size,
                unique_digests: row.unique_digests.size
              }));

            const repeatedExactNames = [...exactNames.values()]
              .filter((row) => row.count > 1)
              .sort((a, b) => b.bytes - a.bytes)
              .slice(0, 30);

            const receipt = {
              schema_version: 'fx2_artifact_storage_audit_v1',
              repository: `${owner}/${repo}`,
              generated_at: new Date().toISOString(),
              artifact_count: artifacts.length,
              total_bytes: totalBytes,
              category_totals: [...categories.values()].sort((a, b) => b.bytes - a.bytes),
              largest_artifacts: largestArtifacts,
              top_storage_families: topFamilies,
              repeated_exact_names: repeatedExactNames
            };

            const lines = [
              '## FX2 Artifact Storage Audit',
              '',
              `- Repository: \`${owner}/${repo}\``,
              `- Artifacts: \`${artifacts.length}\``,
              `- Storage: \`${formatBytes(totalBytes)}\``,
              '',
              '### Category totals',
              '',
              '| Category | Count | Storage |',
              '|---|---:|---:|'
            ];
            for (const row of receipt.category_totals) {
              lines.push(`| ${row.category} | ${row.count} | ${formatBytes(row.bytes)} |`);
            }
            lines.push('', '### Largest artifacts', '', '| Artifact | Category | Size | Created | Run |', '|---|---|---:|---|---:|');
            for (const row of largestArtifacts.slice(0, 20)) {
              lines.push(`| \`${row.name}\` | ${row.category} | ${formatBytes(row.bytes)} | ${row.created_at} | ${row.run_id || ''} |`);
            }
            lines.push('', '### Top storage families', '', '| Family | Category | Count | Storage | Size variants | Digest variants |', '|---|---|---:|---:|---:|---:|');
            for (const row of topFamilies.slice(0, 25)) {
              lines.push(`| \`${row.family}\` | ${row.category} | ${row.count} | ${formatBytes(row.bytes)} | ${row.unique_sizes} | ${row.unique_digests} |`);
            }
            lines.push('', '<details><summary>Machine-readable receipt</summary>', '', '```json', JSON.stringify(receipt), '```', '</details>');
            const markdown = lines.join('\n');
            await core.summary.addRaw(markdown).write();

            if (context.eventName === 'issues') {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: context.issue.number,
                body: markdown.slice(0, 65000)
              });
            }
