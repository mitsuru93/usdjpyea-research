name: USDJPY B0 Encrypted Bundle Relay v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/usdjpy_b0_encrypted_bundle_relay_v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download AES-encrypted private authority bundle
        env:
          SIGNED_URL: "https://release-assets.githubusercontent.com/github-production-release-asset/1207560375/032cc839-2eaf-40fc-8673-ab1ee1c7f2a9?sp=r&sv=2018-11-09&sr=b&spr=https&se=2026-07-31T06%3A56%3A23Z&rscd=attachment%3B+filename%3Dusdjpy-b0-private-binding-ledgers-30609332571.zip.aes&rsct=application%2Foctet-stream&skoid=96c2d410-5711-43a1-aedd-ab1947aa7ab0&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skt=2026-07-31T05%3A56%3A03Z&ske=2026-07-31T06%3A56%3A23Z&sks=b&skv=2018-11-09&sig=Xm6EFGBJRcNLGiUcTV2%2B2vC6Zp7dQ2vilm4f%2BVAKcyA%3D&jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJnaXRodWIuY29tIiwiYXVkIjoicmVsZWFzZS1hc3NldHMuZ2l0aHVidXNlbnQuY29tIiwia2V5Ijoia2V5MSIsImV4cCI6MTc4NTQ3OTIxMCwibmJmIjoxNzg1NDc4OTEwLCJwYXRoIjoicmVsZWFzZWFzc2V0cHJvZHVjdGlvbi5ibG9iLmNvcmUud2luZG93cy5uZXQifQ.yDi0JDso4hLCYEpc7JSPmYCZzn9PfYG5KBAeE01sD3E&response-content-disposition=attachment%3B%20filename%3Dusdjpy-b0-private-binding-ledgers-30609332571.zip.aes&response-content-type=application%2Foctet-stream"
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "$SIGNED_URL" -o usdjpy-b0-private-binding-ledgers.zip.aes
          test "$(sha256sum usdjpy-b0-private-binding-ledgers.zip.aes | awk '{print $1}')" = 'f7c0ed577be6a4d67102d8de44a06ab3c98792b7862101580a4f6776690a8a81'
      - uses: actions/upload-artifact@v4
        with:
          name: usdjpy-b0-private-binding-ledgers-encrypted-v1
          path: usdjpy-b0-private-binding-ledgers.zip.aes
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
