name: USDJPY B0 Encrypted Bundle Relay v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/usdjpy_b0_encrypted_bundle_relay_v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download AES-encrypted private authority bundle
        env:
          SIGNED_URL: "https://release-assets.githubusercontent.com/github-production-release-asset/1207560375/2207e70c-8044-429d-98c9-3a0b07414544?sp=r&sv=2018-11-09&sr=b&spr=https&se=2026-07-31T07%3A09%3A31Z&rscd=attachment%3B+filename%3Dusdjpy-b0-private-binding-ledgers-30609822777-1.zip.aes&rsct=application%2Foctet-stream&skoid=96c2d410-5711-43a1-aedd-ab1947aa7ab0&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skt=2026-07-31T06%3A08%3A45Z&ske=2026-07-31T07%3A09%3A31Z&sks=b&skv=2018-11-09&sig=149BJBBbirST7c1aVSIcl8xJXrYWCUnZnLI3Dpzovck%3D&jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJnaXRodWIuY29tIiwiYXVkIjoicmVsZWFzZS1hc3NldHMuZ2l0aHVidXNlcmNvbnRlbnQuY29tIiwia2V5Ijoia2V5MSIsImV4cCI6MTc4NTQ3OTc1OSwibmJmIjoxNzg1NDc5NDU5LCJwYXRoIjoicmVsZWFzZWFzc2V0cHJvZHVjdGlvbi5ibG9iLmNvcmUud2luZG93cy5uZXQifQ.GWCSTa7t2j1gezuVVaXFj7b5mo1KSs2arXxr681xbGc&response-content-disposition=attachment%3B%20filename%3Dusdjpy-b0-private-binding-ledgers-30609822777-1.zip.aes&response-content-type=application%2Foctet-stream"
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "$SIGNED_URL" -o usdjpy-b0-private-binding-ledgers.zip.aes
          test "$(sha256sum usdjpy-b0-private-binding-ledgers.zip.aes | awk '{print $1}')" = '2c9673393e2d99c8c5ea10306d9432c1092d0edf6e2eaf5ecd739fae217010cf'
      - uses: actions/upload-artifact@v4
        with:
          name: usdjpy-b0-private-binding-ledgers-encrypted-v1
          path: usdjpy-b0-private-binding-ledgers.zip.aes
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
