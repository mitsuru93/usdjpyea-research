name: USDJPY Asian Range Liquidity Sweep Phase 2 Memory Update v2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/usdjpy_asian_range_liquidity_sweep_phase2_memory_update_v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply and validate atomic HYP-030 memory update
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          mp=Path('configs/research/usdjpy_research_memory_manifest_v1.json')
          d=json.loads(mp.read_text())
          registry_path='configs/research/usdjpy_research_candidate_registry_v51.json'
          addendum_path='configs/research/usdjpy_hypothesis_ledger_addendum_v25.json'
          registry=json.loads(Path(registry_path).read_text())
          cp=d['canonical_pointers']
          cp.update({
            'current_candidate_registry':registry_path,
            'hypothesis_ledger_addendum':addendum_path,
            'hyp030_preregistration':'configs/research/usdjpy_asian_range_liquidity_sweep_phase2_prereg_v1.json',
            'hyp030_candidate_registry':'configs/research/usdjpy_asian_range_liquidity_sweep_phase2_candidate_registry_v1.json',
            'hyp030_period_access_receipt':'configs/research/usdjpy_asian_range_liquidity_sweep_phase2_period_access_receipt_v1.json',
            'hyp030_result':'docs/research/artifact_archives/usdjpy_asian_range_liquidity_sweep_phase2_v1/final_decision.json',
            'hyp030_result_report':'docs/research/artifact_archives/usdjpy_asian_range_liquidity_sweep_phase2_v1/human_report.md'
          })
          s=d['current_state_snapshot']
          s['registry_status']=registry['status']
          s['next_action']=registry['next_action']
          s['current_open_research_question']=registry.get('current_open_research_question')
          d.setdefault('parallel_track_state',{})['USDJPY-HYP-030']={
            'family':'S_ASIAN_RANGE_LIQUIDITY_SWEEP','candidate':None,'tested_candidate':'A_EXACT_EXECUTABLE_12BAR',
            'status':'COMPLETE_NO_PORTABLE_CANDIDATE','failed_gate':'portfolio_mdd_nonworse',
            'core_authorized':False,'mt4_authorized':False,'2025H1_authorized':False,'2025H2_authorized':False,
            'production_authorized':False,'does_not_change_HYP027_or_HYP029':True
          }
          required=[
            (registry_path,'global registry including HYP-030 closure'),
            (addendum_path,'append-only HYP-030 scientific memory'),
            ('configs/research/usdjpy_asian_range_liquidity_sweep_phase2_candidate_registry_v1.json','HYP-030 tested-candidate closure'),
            ('configs/research/usdjpy_asian_range_liquidity_sweep_phase2_period_access_receipt_v1.json','HYP-030 2025 firewall closure'),
            ('docs/research/artifact_archives/usdjpy_asian_range_liquidity_sweep_phase2_v1/final_decision.json','binding HYP-030 result')
          ]
          rows=d['mandatory_startup_read_order']; existing={r['path'] for r in rows}
          for path,reason in required:
            if path not in existing: rows.append({'ordinal':len(rows)+1,'path':path,'reason':reason})
          for i,r in enumerate(rows,1): r['ordinal']=i
          mp.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          PY
          python tools/validate_usdjpy_research_memory_v1.py
      - name: Commit validated memory state
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git add configs/research/usdjpy_research_memory_manifest_v1.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research: make HYP-030 closure mandatory startup memory'
          git pull --rebase origin ${{ github.event.pull_request.head.ref }}
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
