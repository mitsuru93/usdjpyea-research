name: Archive Accepted USDJPY R4 Entry/Horizon Selection v1

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  archive:
    if: github.event.issue.title == '[R4] Archive accepted entry horizon selection v1'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate accepted R4 run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          run_id="$(gh run list --repo "${REPOSITORY}" --workflow run_usdjpy_r4_entry_horizon_selection_v1.yml --status success --limit 20 --json databaseId,createdAt --jq 'sort_by(.createdAt) | reverse | .[0].databaseId')"
          test -n "${run_id}"
          echo "R4_RUN_ID=${run_id}" >> "${GITHUB_ENV}"
          gh issue comment "${ISSUE_NUMBER}" --repo "${REPOSITORY}" --body "Archiving accepted R4 run ${run_id}."

      - name: Download and independently verify artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p audit release_assets
          gh api "repos/${REPOSITORY}/actions/runs/${R4_RUN_ID}/artifacts" > artifacts.json
          python - <<'PY' > artifact.env
          import json
          from pathlib import Path
          rows=json.loads(Path('artifacts.json').read_text())['artifacts']
          expected=f'usdjpy-r4-entry-horizon-selection-v1-${{ env.R4_RUN_ID }}'
          matches=[row for row in rows if row['name']==expected]
          assert len(matches)==1,(expected,rows)
          row=matches[0]
          assert not row['expired']
          digest=row['digest']
          assert digest.startswith('sha256:')
          print(f'ARTIFACT_ID={row["id"]}')
          print(f'ARTIFACT_NAME={row["name"]}')
          print(f'ARTIFACT_DIGEST={digest}')
          print(f'ARTIFACT_SHA={digest.split(":",1)[1]}')
          PY
          source artifact.env
          cat artifact.env >> "${GITHUB_ENV}"
          gh api "repos/${REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > "release_assets/usdjpy-r4-entry-horizon-selection-v1-run-${R4_RUN_ID}-artifact-${ARTIFACT_ID}.zip"
          echo "${ARTIFACT_SHA}  release_assets/usdjpy-r4-entry-horizon-selection-v1-run-${R4_RUN_ID}-artifact-${ARTIFACT_ID}.zip" | sha256sum -c -
          unzip -q "release_assets/usdjpy-r4-entry-horizon-selection-v1-run-${R4_RUN_ID}-artifact-${ARTIFACT_ID}.zip" -d audit
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          root=Path('audit')
          acceptance=json.loads((root/'r4_acceptance.json').read_text())
          metadata=json.loads((root/'run_metadata.json').read_text())
          audit=pd.read_csv(root/'selection_audit_all_660.csv')
          eligible=pd.read_csv(root/'eligible_ranked.csv')
          selected=pd.read_csv(root/'selected_representatives.csv')
          pairwise=pd.read_csv(root/'eligible_pairwise_similarity.csv.gz',compression='gzip')
          assert acceptance['status']=='PASS'
          assert all(v is True for k,v in acceptance.items() if k!='status')
          assert len(audit)==660
          assert len(eligible)==metadata['eligible_combinations']
          assert len(selected)==metadata['selected_representatives']
          assert len(selected)<=8
          assert selected['definition_sha256'].nunique()==len(selected)
          assert selected.groupby('family').size().max()<=2
          assert len(pairwise)==len(eligible)*(len(eligible)-1)//2
          assert metadata['H2_rows_parsed']==0
          assert metadata['2025_artifact_access'] is False
          assert metadata['exit_optimization'] is False
          assert metadata['R5_design_unblocked'] is True
          Path('inspection.json').write_text(json.dumps({
              'eligible_combinations':len(eligible),
              'selected_representatives':len(selected),
              'selected_candidates':metadata['selected_candidates'],
              'pairwise_rows':len(pairwise),
              'r4_acceptance_sha256':__import__('hashlib').sha256((root/'r4_acceptance.json').read_bytes()).hexdigest(),
              'selected_representatives_sha256':__import__('hashlib').sha256((root/'selected_representatives.csv').read_bytes()).hexdigest(),
          },indent=2,sort_keys=True)+'\n')
          print({'R4_archive_input':'PASS','eligible':len(eligible),'selected':len(selected)})
          PY

      - name: Write Release manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          inspection=json.loads(Path('inspection.json').read_text())
          manifest={
              'version':'v1',
              'repository':'mitsuru93/usdjpyea-research',
              'release_tag':'usdjpy-r4-entry-horizon-selection-v1',
              'accepted_run_id':int('${{ env.R4_RUN_ID }}'),
              'actions_artifact_id':int('${{ env.ARTIFACT_ID }}'),
              'actions_artifact_name':'${{ env.ARTIFACT_NAME }}',
              'actions_artifact_sha256':'${{ env.ARTIFACT_SHA }}',
              'r4_status':'PASS',
              'eligible_combinations':inspection['eligible_combinations'],
              'selected_representatives':inspection['selected_representatives'],
              'selected_candidates':inspection['selected_candidates'],
              'pairwise_rows':inspection['pairwise_rows'],
              'r4_acceptance_sha256':inspection['r4_acceptance_sha256'],
              'selected_representatives_sha256':inspection['selected_representatives_sha256'],
              'H2_rows_parsed':0,
              '2025_artifact_access':False,
              'exit_optimization':False,
              'R5_design_unblocked':True,
              'Core_promotion':False,
              'MT4_promotion':False,
          }
          Path('release_assets/usdjpy-r4-entry-horizon-selection-v1-manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          PY
          (cd release_assets && sha256sum * > SHA256SUMS)

      - name: Create clean durable Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: usdjpy-r4-entry-horizon-selection-v1
        run: |
          set -euo pipefail
          if ! gh release view "${TAG}" --repo "${REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${TAG}" --repo "${REPOSITORY}" --title 'USDJPY R4 Entry/Horizon Selection v1' --notes 'Accepted R4 H1 representative selection. At most eight frozen Entry/horizon representatives for R5 design. No H2/2025 access and no Exit optimization.' --latest=false
          fi
          mapfile -t EXISTING < <(gh release view "${TAG}" --repo "${REPOSITORY}" --json assets --jq '.assets[].name')
          for name in "${EXISTING[@]}"; do
            gh release delete-asset "${TAG}" "${name}" --repo "${REPOSITORY}" --yes
          done
          gh release upload "${TAG}" release_assets/* --repo "${REPOSITORY}"
          gh release view "${TAG}" --repo "${REPOSITORY}" --json tagName,url,isDraft,isPrerelease,assets > release_receipt.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('release_receipt.json').read_text())
          assets={row['name']:row for row in r['assets']}
          expected={
              f'usdjpy-r4-entry-horizon-selection-v1-run-${{ env.R4_RUN_ID }}-artifact-${{ env.ARTIFACT_ID }}.zip',
              'usdjpy-r4-entry-horizon-selection-v1-manifest.json',
              'SHA256SUMS',
          }
          assert r['tagName']=='usdjpy-r4-entry-horizon-selection-v1'
          assert not r['isDraft'] and not r['isPrerelease']
          assert set(assets)==expected,(set(assets),expected)
          assert assets[f'usdjpy-r4-entry-horizon-selection-v1-run-${{ env.R4_RUN_ID }}-artifact-${{ env.ARTIFACT_ID }}.zip']['digest']=='${{ env.ARTIFACT_DIGEST }}'
          print({'R4_release':'PASS','assets':3})
          PY

      - name: Commit receipt and result document
        run: |
          set -euo pipefail
          target='docs/research_reboot/artifact_archives/usdjpy_r4_entry_horizon_selection_v1'
          mkdir -p "${target}"
          cp release_receipt.json "${target}/release_receipt.json"
          cp release_assets/usdjpy-r4-entry-horizon-selection-v1-manifest.json "${target}/artifact_manifest.json"
          cp release_assets/SHA256SUMS "${target}/SHA256SUMS"
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('release_assets/usdjpy-r4-entry-horizon-selection-v1-manifest.json').read_text())
          lines=[
              '# USDJPY R4 Entry/Horizon Selection Result v1','',
              '## Decision','',
              '```text',
              'R4: PASS',
              f"eligible combinations: {m['eligible_combinations']}",
              f"selected representatives: {m['selected_representatives']}",
              'H2 rows parsed: 0',
              '2025 access: none',
              'Exit optimization: false',
              'Core promotion: false',
              'MT4 promotion: false',
              '```','',
              '## Accepted run','',
              '```text',
              f"run_id: {m['accepted_run_id']}",
              f"artifact_id: {m['actions_artifact_id']}",
              f"artifact: {m['actions_artifact_name']}",
              f"artifact_digest: sha256:{m['actions_artifact_sha256']}",
              'release_tag: usdjpy-r4-entry-horizon-selection-v1',
              '```','',
              '## Frozen representatives','',
              '| Rank | Candidate | Family | Horizon bars | Score |',
              '|---:|---|---|---:|---:|',
          ]
          for row in m['selected_candidates']:
              lines.append(f"| {row['selection_rank']} | {row['candidate_id']} | {row['family']} | {row['horizon_bars']} | {row['selection_score']:.12f} |")
          lines += [
              '',
              'These are H1 Entry/horizon representatives for R5 Exit research, not complete strategies or Core/MT4 promotions.',
              '',
              'R5 remains blocked until its Exit-policy families, parameter limits, comparison rules and acceptance gates are separately preregistered.',
          ]
          Path('docs/research_reboot/usdjpy_r4_entry_horizon_selection_result_v1.md').write_text('\n'.join(lines)+'\n')
          PY
          rm -rf audit release_assets release_receipt.json inspection.json artifacts.json artifact.env
          rm -f .github/workflows/archive_usdjpy_r4_entry_horizon_selection_v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: archive accepted USDJPY R4 selection v1'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Close issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh issue comment "${ISSUE_NUMBER}" --repo "${REPOSITORY}" --body 'Accepted R4 selection archived and frozen. R5 Exit-policy preregistration is next; no Exit outcome has been opened.'
          gh issue close "${ISSUE_NUMBER}" --repo "${REPOSITORY}" --reason completed
