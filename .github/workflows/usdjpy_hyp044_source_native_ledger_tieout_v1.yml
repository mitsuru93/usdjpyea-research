name: USDJPY HYP-044 Source-Native Ledger Tieout v1

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/audit_usdjpy_hyp044_source_native_ledger_v1.py'
      - '.github/workflows/usdjpy_hyp044_source_native_ledger_tieout_v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Audit ledger/result tieout
        run: |
          set -euo pipefail
          python tools/audit_usdjpy_hyp044_source_native_ledger_v1.py \
            --ledger artifacts/research/usdjpy_hyp044/source_native_2020_2022_v1/source_native_trade_ledger_2020_2022.csv \
            --result artifacts/research/usdjpy_hyp044/source_native_2020_2022_v1/source_native_result_2020_2022.json \
            --out artifacts/research/usdjpy_hyp044/source_native_ledger_tieout_v1.json
      - name: Commit audit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/research/usdjpy_hyp044/source_native_ledger_tieout_v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(hyp044): bind source-native ledger tieout'
          git pull --rebase origin ${{ github.event.pull_request.head.ref || github.ref_name }}
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
