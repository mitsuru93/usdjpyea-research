name: Run USDJPY R0 Canonical Bundle v1

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: usdjpy-r0-canonical-bundle-v1
  cancel-in-progress: false

jobs:
  r0:
    if: github.event_name != 'issues' || github.event.issue.title == '[R0] Run USDJPY canonical bundle v1'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record run ID
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh issue comment "${ISSUE_NUMBER}" --repo "${REPOSITORY}" \
            --body "R0 canonical run started. Run ID: ${{ github.run_id }}. https://github.com/${REPOSITORY}/actions/runs/${{ github.run_id }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas

      - name: Verify frozen code blobs and compile
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          lock = json.loads(Path("configs/research/usdjpy_r0_regression_lock_v1.json").read_text())
          for path, expected in lock["code_blobs"].items():
              actual = subprocess.check_output(
                  ["git", "rev-parse", f"HEAD:{path}"], text=True
              ).strip()
              assert actual == expected, (path, actual, expected)
          print({"code_blob_lock": "PASS", "files": len(lock["code_blobs"])})
          PY
          python -m py_compile \
            tools/build_fx_annual_bar_bundle.py \
            tools/run_usdjpy_r0_canonical_bundle_v1.py \
            tools/run_usdjpy_h1_multi_family_screen.py \
            tools/run_usdjpy_h1_multi_family_screen_v2.py \
            tools/run_usdjpy_joint_h2_a1_e3_eval_v1.py \
            tools/summarize_download_manifest.py
          python -m json.tool configs/research/usdjpy_r0_canonicalization_v1.json >/dev/null
          python -m json.tool configs/research/usdjpy_r0_regression_lock_v1.json >/dev/null

      - name: Download frozen R0 Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: usdjpy-r0-artifact-archive-2024-v1
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          rm -rf data/r0_release
          mkdir -p data/r0_release
          gh release download "${RELEASE_TAG}" \
            --repo "${REPOSITORY}" \
            --dir data/r0_release
          test "$(find data/r0_release -maxdepth 1 -type f | wc -l)" -eq 29

      - name: Run frozen R0 canonicalization and regressions
        run: |
          python tools/run_usdjpy_r0_canonical_bundle_v1.py \
            --release-dir data/r0_release \
            --canonical-config configs/research/usdjpy_r0_canonicalization_v1.json \
            --regression-lock configs/research/usdjpy_r0_regression_lock_v1.json \
            --output-dir data/experiments/usdjpy_r0_canonical_bundle_v1 \
            --repo-root .

      - name: Verify R0 output contract
        run: |
          set -euo pipefail
          root="data/experiments/usdjpy_r0_canonical_bundle_v1"
          test -f "${root}/r0_acceptance.json"
          test -f "${root}/run_metadata.json"
          test -f "${root}/canonical/annual_bundle_manifest.json"
          test -f "${root}/canonical/bars/M1/USDJPY_M1.csv.gz"
          test -f "${root}/canonical/bars/M5/USDJPY_M5.csv.gz"
          test -f "${root}/canonical/bars/M15/USDJPY_M15.csv.gz"
          test -f "${root}/canonical/bars/H1/USDJPY_H1.csv.gz"
          test -f "${root}/audit/release_asset_verification.csv"
          test -f "${root}/audit/original_artifact_verification.csv"
          test -f "${root}/audit/source_coverage_summary.csv"
          test -f "${root}/audit/deterministic_repeatability.csv"
          test -f "${root}/canonical/duplicate_resolution_audit.csv"
          test -f "${root}/regression/h1/candidate_summary.csv"
          test -f "${root}/regression/h1/candidate_trades.normalized.csv"
          test -f "${root}/regression/h2/h2_candidate_summary.csv"
          test -f "${root}/regression/h2/h2_candidate_trades.normalized.csv"
          test -f "${root}/regression/h2/h2_decision.json"
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("data/experiments/usdjpy_r0_canonical_bundle_v1")
          acceptance = json.loads((root / "r0_acceptance.json").read_text())
          metadata = json.loads((root / "run_metadata.json").read_text())
          assert acceptance["status"] == "PASS", acceptance
          assert all(value is True for key, value in acceptance.items() if key != "status"), acceptance
          assert metadata["status"] == "PASS", metadata
          assert metadata["core_promotion"] is False
          assert metadata["mt4_promotion"] is False
          assert metadata["r1_unblocked"] is True
          print({"r0_output_contract": "PASS", "acceptance_checks": len(acceptance) - 1})
          PY

      - name: Write job summary
        if: always()
        run: |
          echo "# USDJPY R0 Canonical Bundle v1" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Release input: \`usdjpy-r0-artifact-archive-2024-v1\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Acceptance" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat data/experiments/usdjpy_r0_canonical_bundle_v1/r0_acceptance.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Regression" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat data/experiments/usdjpy_r0_canonical_bundle_v1/regression/regression_summary.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload R0 canonical artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usdjpy-r0-canonical-2024-v1-${{ github.run_id }}
          path: data/experiments/usdjpy_r0_canonical_bundle_v1
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6

      - name: Close successful trigger issue
        if: github.event_name == 'issues' && success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh issue comment "${ISSUE_NUMBER}" --repo "${REPOSITORY}" \
            --body "R0 canonical bundle completed with PASS. Run ID: ${{ github.run_id }}. R1 is unblocked; Core and MT4 remain closed."
          gh issue close "${ISSUE_NUMBER}" --repo "${REPOSITORY}" --reason completed

      - name: Report failed trigger issue
        if: github.event_name == 'issues' && failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh issue comment "${ISSUE_NUMBER}" --repo "${REPOSITORY}" \
            --body "R0 canonical bundle failed. Run ID: ${{ github.run_id }}. R1 remains blocked."
