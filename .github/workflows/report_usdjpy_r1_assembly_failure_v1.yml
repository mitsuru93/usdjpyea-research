name: Report USDJPY R1 Assembly Failure v1

on:
  issues:
    types: [opened]

permissions:
  actions: read
  issues: write

jobs:
  report:
    if: github.event.issue.title == '[Diag] Report USDJPY R1 assembly failure v1'
    runs-on: ubuntu-latest
    steps:
      - name: Report latest failed assembly run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          run_id="$(gh run list --repo "$REPOSITORY" --workflow assemble_usdjpy_r1_prereg_v1.yml --limit 20 --json databaseId,conclusion --jq '[.[] | select(.conclusion == "failure")][0].databaseId')"
          test -n "$run_id"
          gh run view "$run_id" --repo "$REPOSITORY" --log-failed > failed.log || true
          {
            echo "Latest failed assembly run: ${run_id}"
            echo
            echo '```text'
            tail -n 200 failed.log
            echo '```'
          } > body.md
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body-file body.md
          gh issue close "$ISSUE_NUMBER" --repo "$REPOSITORY" --reason completed
