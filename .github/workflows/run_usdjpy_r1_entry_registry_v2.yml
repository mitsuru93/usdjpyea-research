name: Run Corrected USDJPY R1 Entry Registry v2

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: usdjpy-r1-entry-registry-v2
  cancel-in-progress: false

jobs:
  r1:
    if: github.event_name != 'issues' || github.event.issue.title == '[R1] Run corrected USDJPY Entry Registry v2'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OUTPUT_DIR: data/experiments/usdjpy_r1_entry_registry_v2
      LOCK_PATH: configs/research/usdjpy_r1_entry_lock_v2.json
      REGISTRY_PATH: configs/research/usdjpy_r1_entry_universe_v2.json
      HISTORICAL_REGISTRY: configs/research/usdjpy_h1_multi_family_candidates_v1.json
      SESSION_CONFIG: configs/market_sessions/fx_market_sessions_v1.json
      RELEASE_TAG: usdjpy-r0-canonical-2024-v1
      RELEASE_ASSET: usdjpy-r0-canonical-2024-v1-run-29639548804-artifact-8428199309.zip
      RELEASE_ASSET_SHA256: d67db9b051a03050ddedb720d407b73cb48c5eacf7a441b1b8ff98dd77dc2015
      CANONICAL_M15_SHA256: 1566b9d0497f3a2aa156868144d31b89721fca48329feaf82035826ada7ee25c
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record run ID
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh issue comment "${ISSUE_NUMBER}" --repo "${REPOSITORY}" \
            --body "Corrected USDJPY R1 v2 run started. Run ID: ${{ github.run_id }}. https://github.com/${REPOSITORY}/actions/runs/${{ github.run_id }}"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy

      - name: Verify corrected frozen code
        run: |
          set -euo pipefail
          python -m py_compile tools/run_usdjpy_r1_entry_registry_v2.py
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          lock = json.loads(Path('configs/research/usdjpy_r1_entry_lock_v2.json').read_text())
          for path, expected in lock['code_blobs'].items():
              actual = subprocess.check_output(['git', 'rev-parse', f'HEAD:{path}'], text=True).strip()
              assert actual == expected, (path, actual, expected)
          registry = json.loads(Path('configs/research/usdjpy_r1_entry_universe_v2.json').read_text())
          candidates = [c for f in registry['families'] for c in f['candidates']]
          assert len(registry['families']) == 12 and len(candidates) == 60
          assert registry['common_execution']['entry_hours_utc_applies_to'] == 'actual_next_M15_entry_timestamp'
          assert registry['timing_semantics_correction']['candidate_or_parameter_change'] is False
          assert registry['timing_semantics_correction']['outcome_information_used'] is False
          print({'frozen_code': 'PASS', 'families': 12, 'candidates': 60})
          PY

      - name: Download accepted R0 inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/r0_release data/r0_bundle
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --pattern "${RELEASE_ASSET}" --dir data/r0_release
          echo "${RELEASE_ASSET_SHA256}  data/r0_release/${RELEASE_ASSET}" | sha256sum -c -
          unzip -q "data/r0_release/${RELEASE_ASSET}" -d data/r0_bundle
          mapfile -t M15_FILES < <(find data/r0_bundle -type f -path '*/canonical/bars/M15/USDJPY_M15.csv.gz' | sort)
          mapfile -t REF_FILES < <(find data/r0_bundle -type f -path '*/regression/h1/candidate_trades.csv' | sort)
          test "${#M15_FILES[@]}" -eq 1
          test "${#REF_FILES[@]}" -eq 1
          echo "${CANONICAL_M15_SHA256}  ${M15_FILES[0]}" | sha256sum -c -
          echo "CANONICAL_M15=${M15_FILES[0]}" >> "${GITHUB_ENV}"
          echo "REFERENCE_TRADES=${REF_FILES[0]}" >> "${GITHUB_ENV}"

      - name: Run corrected R1 Entry registry
        run: |
          python tools/run_usdjpy_r1_entry_registry_v2.py \
            --canonical-m15 "${CANONICAL_M15}" \
            --registry "${REGISTRY_PATH}" \
            --session-config "${SESSION_CONFIG}" \
            --output-dir "${OUTPUT_DIR}"

      - name: Verify all thirteen historical Entry ledgers
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          out = Path('data/experiments/usdjpy_r1_entry_registry_v2')
          bars = pd.read_csv('${{ env.CANONICAL_M15 }}', compression='gzip', usecols=['timestamp_utc'])
          bars['timestamp_utc'] = pd.to_datetime(bars['timestamp_utc'], utc=True)
          bars = bars[bars['timestamp_utc'] < pd.Timestamp('2024-07-01T00:00:00Z')].reset_index(drop=True)
          index_by_ts = {ts: idx for idx, ts in enumerate(bars['timestamp_utc'])}

          signals = pd.read_csv(out / 'candidate_signals.csv.gz', compression='gzip')
          signals['signal_ts'] = pd.to_datetime(signals['signal_ts'], utc=True)
          reference = pd.read_csv('${{ env.REFERENCE_TRADES }}')
          reference['timestamp_utc'] = pd.to_datetime(reference['timestamp_utc'], utc=True)
          old_registry = json.loads(Path('configs/research/usdjpy_h1_multi_family_candidates_v1.json').read_text())
          new_registry = json.loads(Path('configs/research/usdjpy_r1_entry_universe_v2.json').read_text())
          legacy_map = {}
          for family in new_registry['families']:
              for candidate in family['candidates']:
                  for legacy_id in candidate.get('legacy_ids', []):
                      legacy_map[legacy_id] = candidate['id']

          rows = []
          for family in old_registry['families']:
              for old in family['candidates']:
                  old_id = old['id']
                  hold = int(old['hold_bars'])
                  r1_id = legacy_map[old_id]
                  projected = signals[signals['candidate_id'] == r1_id][['signal_ts', 'side']].copy()
                  projected['bar_index'] = projected['signal_ts'].map(index_by_ts)
                  assert projected['bar_index'].notna().all(), old_id
                  projected = projected[projected['bar_index'].astype(int) + hold < len(bars)]
                  actual_keys = set(zip(projected['signal_ts'].astype(str), projected['side'].astype(int)))
                  expected = reference[reference['candidate_id'] == old_id]
                  expected_keys = set(zip(expected['timestamp_utc'].astype(str), expected['side'].astype(int)))
                  missing = expected_keys - actual_keys
                  extra = actual_keys - expected_keys
                  passed = not missing and not extra and len(projected) == len(expected)
                  rows.append({
                      'historical_candidate_id': old_id,
                      'r1_candidate_id': r1_id,
                      'registered_hold_bars': hold,
                      'expected_trades': len(expected),
                      'projected_signals': len(projected),
                      'missing_keys': len(missing),
                      'extra_keys': len(extra),
                      'passed': passed,
                  })
          regression = pd.DataFrame(rows).sort_values('historical_candidate_id')
          regression.to_csv(out / 'legacy_registered_hold_regression.csv', index=False, lineterminator='\n')
          assert len(regression) == 13
          assert regression['passed'].all(), regression[~regression['passed']].to_dict('records')

          core = json.loads((out / 'r1_acceptance.json').read_text())
          combined = dict(core)
          combined['entry_hour_semantics_actual_next_bar'] = True
          combined['legacy_registered_hold_regression_13_passed'] = True
          combined['status'] = 'PASS'
          (out / 'r1_v2_acceptance.json').write_text(json.dumps(combined, indent=2, sort_keys=True) + '\n')
          metadata = json.loads((out / 'run_metadata.json').read_text())
          metadata['version'] = 'v2'
          metadata['excluded_predecessor_run_id'] = 29641805182
          metadata['entry_hours_utc_applies_to'] = 'actual_next_M15_entry_timestamp'
          metadata['legacy_registered_hold_regression_rows'] = 13
          metadata['legacy_registered_hold_regression_passed'] = True
          (out / 'run_metadata.json').write_text(json.dumps(metadata, indent=2, sort_keys=True) + '\n')
          print(regression.to_string(index=False))
          PY

      - name: Verify corrected R1 output contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          out = Path('data/experiments/usdjpy_r1_entry_registry_v2')
          lock = json.loads(Path('configs/research/usdjpy_r1_entry_lock_v2.json').read_text())
          for name in lock['required_outputs']:
              path = out / name
              assert path.is_file() and path.stat().st_size > 0, name
          combined = json.loads((out / 'r1_v2_acceptance.json').read_text())
          assert combined['status'] == 'PASS'
          assert combined['entry_hour_semantics_actual_next_bar'] is True
          assert combined['legacy_registered_hold_regression_13_passed'] is True
          regression = pd.read_csv(out / 'legacy_registered_hold_regression.csv')
          assert len(regression) == 13 and regression['passed'].all()
          metadata = json.loads((out / 'run_metadata.json').read_text())
          assert metadata['h2_opened_for_new_candidates'] is False
          assert metadata['2025_artifact_access'] is False
          assert metadata['outcomes_opened'] is False
          assert metadata['legacy_registered_hold_regression_passed'] is True
          print({'corrected_r1_acceptance': 'PASS', 'checks': len(combined)-1, 'legacy_rows': len(regression)})
          PY

      - name: Upload corrected R1 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usdjpy-r1-entry-registry-v2-${{ github.run_id }}
          path: data/experiments/usdjpy_r1_entry_registry_v2/**
          if-no-files-found: error
          retention-days: 90

      - name: Close successful trigger issue
        if: github.event_name == 'issues' && success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh issue comment "${ISSUE_NUMBER}" --repo "${REPOSITORY}" --body "Corrected USDJPY R1 v2 passed all thirteen historical Entry regressions. Run ID: ${{ github.run_id }}. R2 is unblocked."
          gh issue close "${ISSUE_NUMBER}" --repo "${REPOSITORY}" --reason completed

      - name: Report failed trigger issue
        if: github.event_name == 'issues' && failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh issue comment "${ISSUE_NUMBER}" --repo "${REPOSITORY}" --body "Corrected USDJPY R1 v2 failed. Run ID: ${{ github.run_id }}. R2 remains blocked."
