name: USDJPY Impact Atlas Phase 1 v1

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/evaluate_usdjpy_impact_atlas_phase1_v1.py'
      - '.github/workflows/usdjpy_impact_atlas_phase1_v1.yml'
      - 'configs/research/usdjpy_impact_atlas_v1_prereg.json'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  phase1:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install frozen dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==2.1.3' 'pandas==2.2.3'
      - name: Enforce preregistration boundary
        run: |
          python - <<'PY'
          import json
          p=json.load(open('configs/research/usdjpy_impact_atlas_v1_prereg.json'))
          assert p['development_folds']==['2023H1','2023H2','2024H1','2024H2']
          assert p['ranking_rule']['candidate_selection_authorized'] is False
          assert set(p['external_periods'])=={'2025H1','2025H2'}
          PY
      - name: Materialize exact canonical ledgers from durable repository archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p archive_extract materialized
          find . -maxdepth 2 -type f \( -name '*.tar.gz' -o -name '*.tgz' \) -print | sort | tee archive_inventory.txt
          while IFS= read -r a; do
            [ -z "$a" ] && continue
            d="archive_extract/$(basename "$a" | tr '. ' '__')"
            mkdir -p "$d"
            tar -xzf "$a" -C "$d" || true
          done < archive_inventory.txt
          find archive_extract -type f | sort > archive_member_inventory.txt
          trade=$(find archive_extract -type f -name 'usdjpy_b02_f05_source_trade_ledger_v2.csv' | head -n1 || true)
          states=$(find archive_extract -type f -name 'usdjpy_b02_f05_entry_exit_state_ledger_v2.csv.gz' | head -n1 || true)
          if [[ -z "$trade" || -z "$states" ]]; then
            echo 'Exact v2 ledgers were not found in durable repository archives.' >&2
            echo 'Available matching members:' >&2
            grep -E 'trade_ledger|path_class|entry_exit_state' archive_member_inventory.txt || true
            exit 42
          fi
          cp "$trade" materialized/usdjpy_b02_f05_source_trade_ledger_v2.csv
          cp "$states" materialized/usdjpy_b02_f05_entry_exit_state_ledger_v2.csv.gz
          printf '%s  %s\n' \
            '98c9c8cf57c62c23a94aa38efa6ee257e823dd0b68c413615197a48be00b08ca' materialized/usdjpy_b02_f05_source_trade_ledger_v2.csv \
            '2caddc38cdb16ce7504fe1e3b625f8425ccc6f7d579d02590f9ee92bbf013eda' materialized/usdjpy_b02_f05_entry_exit_state_ledger_v2.csv.gz > materialized/SHA256SUMS
          sha256sum -c materialized/SHA256SUMS
          cp configs/research/usdjpy_b02_f05_hyp024_input_materialization_v2.json materialized/
      - name: Run Phase 1 diagnosis
        run: |
          mkdir -p impact_atlas_output
          python tools/evaluate_usdjpy_impact_atlas_phase1_v1.py \
            --trades materialized/usdjpy_b02_f05_source_trade_ledger_v2.csv \
            --states materialized/usdjpy_b02_f05_entry_exit_state_ledger_v2.csv.gz \
            --out-dir impact_atlas_output \
            --research-sha "$GITHUB_SHA" \
            --core-sha 'aca45ab891d9a6da272b5111a99142d99e874929' \
            --run-id "$GITHUB_RUN_ID" | tee impact_atlas_output/run.log
          jq -e '.status=="PHASE1_DIAGNOSIS_COMPLETE_NO_CANDIDATE_AUTHORIZATION" and .population.total_trades==1882 and .population.loser_count==916 and ."2025_accessed"==false and .production_authorized==false' impact_atlas_output/execution_receipt.json
      - name: Package evidence
        run: |
          cp configs/research/usdjpy_impact_atlas_v1_prereg.json impact_atlas_output/
          cp materialized/usdjpy_b02_f05_hyp024_input_materialization_v2.json impact_atlas_output/
          cp archive_inventory.txt archive_member_inventory.txt impact_atlas_output/
          find impact_atlas_output -type f -print0 | sort -z | xargs -0 sha256sum > impact_atlas_output/PACKAGE_SHA256SUMS
          zip -q -X -r "usdjpy-impact-atlas-phase1-v1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.zip" impact_atlas_output
      - name: Upload artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: usdjpy-impact-atlas-phase1-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            impact_atlas_output
            usdjpy-impact-atlas-phase1-v1-${{ github.run_id }}-${{ github.run_attempt }}.zip
          retention-days: 90
          compression-level: 0
      - name: Publish immutable Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create usdjpy-impact-atlas-phase1-v1 "usdjpy-impact-atlas-phase1-v1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.zip" \
            --target "$GITHUB_SHA" --title 'USDJPY Impact Atlas Phase 1 v1' \
            --notes 'Descriptive 2023H1-2024H2 B02/F05 Impact Atlas. No 2025 access, candidate selection, MT4 implementation, or production authorization.' --repo "$GITHUB_REPOSITORY"
      - name: Publish execution receipt issue
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          status=$(jq -r '.status // "FAILED_BEFORE_RECEIPT"' impact_atlas_output/execution_receipt.json 2>/dev/null || echo FAILED_BEFORE_RECEIPT)
          top=$(jq -r '.ranking[0].program // "NA"' impact_atlas_output/execution_receipt.json 2>/dev/null || echo NA)
          cat > receipt.md <<EOF
          workflow: usdjpy_impact_atlas_phase1_v1.yml
          run_id: ${GITHUB_RUN_ID}
          run_attempt: ${GITHUB_RUN_ATTEMPT}
          head_sha: ${GITHUB_SHA}
          status: ${status}
          top_program: ${top}
          artifact_id: ${ARTIFACT_ID}
          artifact_digest: ${ARTIFACT_DIGEST}
          release_tag: usdjpy-impact-atlas-phase1-v1
          2025_accessed: false
          mt4_accessed: false
          candidate_authorized: false
          run_url: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          gh issue create --repo "$GITHUB_REPOSITORY" --title "[impact-atlas-phase1] ${GITHUB_RUN_ID} ${status}" --body-file receipt.md
