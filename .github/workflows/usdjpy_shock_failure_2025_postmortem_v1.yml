name: USDJPY Shock Failure 2025 External-Gate Postmortem v1

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/usdjpy_shock_failure_2025_postmortem_v1.yml
      - tools/run_usdjpy_shock_failure_2025_postmortem_v1.py
      - configs/research/usdjpy_shock_failure_2025_postmortem_protocol_v1.json
      - research_inputs/usdjpy/shock_failure/2025_postmortem_v1/**
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: usdjpy-shock-failure-2025-postmortem-v1
  cancel-in-progress: true

jobs:
  postmortem:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PHASE2_RELEASE: usdjpy-csos-shock-failure-phase2-v1
      POSTMORTEM_RELEASE: usdjpy-shock-failure-2025-postmortem-v1
      DEFINITION_SHA: 96d4551d6bf4238701ed2a146913c851491dd529
      MT4_CONTEXT_DIR: research_inputs/usdjpy/shock_failure/2025_postmortem_v1
      CORRECTED_P6: research_inputs/usdjpy/shock_failure/2025_postmortem_v1/corrected_p6_result_compact.json
    steps:
      - name: Check out exact head revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python and archive tools
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check pandas==2.2.3 numpy==2.1.3 scipy==1.14.1

      - name: Validate immutable Core-derived Research inputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,glob
          files=sorted(glob.glob('research_inputs/usdjpy/shock_failure/2025_postmortem_v1/mt4_events_*.json'))
          assert len(files)==5
          events=[]
          for p in files:
            x=json.load(open(p));assert x['authority']['core_run_id']==30229496015;assert x['authority']['core_artifact_id']==8639969385
            assert x['authority']['core_artifact_sha256']=='70088c66cd1014391cabbb6f533462dcd3dbedbd7d6c537a5dc0798343594a6a'
            events.extend(x['events'])
          assert len(events)==47 and len({x['event_id'] for x in events})==47
          p6=json.load(open('research_inputs/usdjpy/shock_failure/2025_postmortem_v1/corrected_p6_result_compact.json'))
          assert p6['status']=='FAIL_P6_2025_GATE_RESEARCH_ONLY_NO_RETUNING'
          assert p6['standalone_combined']['closed_trades']==47
          assert abs(p6['standalone_combined']['net_jpy']+1277)<1e-6
          print('PASS_CORE_DERIVED_INPUT_CONTRACT')
          PY

      - name: Download frozen Phase 2 authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/usdjpy-shock-failure-2025-postmortem-v1"
          rm -rf "$root"; mkdir -p "$root"/{phase2-download,phase2,raw-download,raw,out,release,readback}
          gh release download "$PHASE2_RELEASE" --repo "$GITHUB_REPOSITORY" --dir "$root/phase2-download"
          shopt -s nullglob
          for z in "$root"/phase2-download/*.zip; do unzip -q "$z" -d "$root/phase2"; done
          for a in "$root"/phase2-download/*.tar.gz; do tar -xzf "$a" -C "$root/phase2"; done
          echo "POSTMORTEM_ROOT=$root" >> "$GITHUB_ENV"

      - name: Download and verify immutable 2025 Raw Bid Ask Tick Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=usdjpy-2025-raw-bidask-ticks-v1
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null
          echo "RAW_2025_RELEASE=$tag" >> "$GITHUB_ENV"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$POSTMORTEM_ROOT/raw-download"
          shopt -s nullglob
          archives=("$POSTMORTEM_ROOT"/raw-download/usdjpy-2025-??-raw-ticks-v1.tar.gz)
          manifests=("$POSTMORTEM_ROOT"/raw-download/usdjpy-2025-??-raw-ticks-v1.manifest.json)
          sums=("$POSTMORTEM_ROOT"/raw-download/usdjpy-2025-??-raw-ticks-v1.SHA256SUMS)
          test "${#archives[@]}" -eq 12
          test "${#manifests[@]}" -eq 12
          test "${#sums[@]}" -eq 12
          test -f "$POSTMORTEM_ROOT/raw-download/usdjpy-2025-raw-ticks-v1.annual-manifest.json"
          for s in "${sums[@]}"; do (cd "$POSTMORTEM_ROOT/raw-download" && sha256sum -c "$(basename "$s")"); done
          expected=0
          for a in "${archives[@]}"; do
            n=$(tar -tzf "$a" | grep -cE '\.csv\.gz$' || true)
            test "$n" -gt 0
            expected=$((expected+n))
            tar -xzf "$a" -C "$POSTMORTEM_ROOT/raw" --wildcards --no-anchored '*.csv.gz'
          done
          actual=$(find "$POSTMORTEM_ROOT/raw" -type f -name '*.csv.gz' | wc -l)
          test "$actual" -eq "$expected"
          cp "$POSTMORTEM_ROOT/raw-download/usdjpy-2025-raw-ticks-v1.annual-manifest.json" "$POSTMORTEM_ROOT/raw/"
          cp "${manifests[@]}" "$POSTMORTEM_ROOT/raw/"
          echo "Raw Tick hourly files: $actual/$expected from $tag"

      - name: Run fixed-candidate postmortem
        shell: bash
        run: |
          set -euo pipefail
          python tools/run_usdjpy_shock_failure_2025_postmortem_v1.py \
            --phase2-dir "$POSTMORTEM_ROOT/phase2" \
            --mt4-context-dir "$MT4_CONTEXT_DIR" \
            --raw-2025-root "$POSTMORTEM_ROOT/raw" \
            --corrected-p6 "$CORRECTED_P6" \
            --out-dir "$POSTMORTEM_ROOT/out" \
            --research-sha "$DEFINITION_SHA" \
            --core-sha "e92ac28d908cb5c6ca89224507b24690822e0f35" \
            --run-id "$GITHUB_RUN_ID"
          cp tools/run_usdjpy_shock_failure_2025_postmortem_v1.decoded.py "$POSTMORTEM_ROOT/out/postmortem_source_snapshot.py"
          cp "$CORRECTED_P6" "$POSTMORTEM_ROOT/out/corrected_p6_result.json"
          cp configs/research/usdjpy_shock_failure_2025_postmortem_protocol_v1.json "$POSTMORTEM_ROOT/out/"
          cp "$MT4_CONTEXT_DIR"/mt4_events_*.json "$POSTMORTEM_ROOT/out/"
          cp "$POSTMORTEM_ROOT/raw/usdjpy-2025-raw-ticks-v1.annual-manifest.json" "$POSTMORTEM_ROOT/out/"
          printf '%s\n' "$RAW_2025_RELEASE" > "$POSTMORTEM_ROOT/out/raw_2025_release_tag.txt"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['POSTMORTEM_ROOT'])/'out'
          def sha(p):
            h=hashlib.sha256()
            with p.open('rb') as f:
              for c in iter(lambda:f.read(1<<20),b''):h.update(c)
            return h.hexdigest()
          files=[{'path':p.name,'bytes':p.stat().st_size,'sha256':sha(p)} for p in sorted(root.iterdir()) if p.is_file() and p.name not in {'manifest.json','SHA256SUMS'}]
          (root/'manifest.json').write_text(json.dumps({'schema_version':'usdjpy_shock_failure_2025_postmortem_manifest_v1','files':files},indent=2,sort_keys=True)+'\n')
          with (root/'SHA256SUMS').open('w') as f:
            for p in sorted(root.iterdir()):
              if p.is_file() and p.name!='SHA256SUMS':f.write(f'{sha(p)}  {p.name}\n')
          PY

      - name: Commit canonical Research outputs to PR branch
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          target=research/usdjpy/shock_failure/2025_external_gate_postmortem_v1
          rm -rf "$target"; mkdir -p "$target"
          cp "$POSTMORTEM_ROOT/out"/* "$target/"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$target"
          if ! git diff --cached --quiet; then
            git commit -m "research: record Shock Failure 2025 external-gate postmortem"
            git push origin "HEAD:$HEAD_BRANCH"
          fi
          echo "PUBLICATION_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish immutable postmortem Release and verify readback
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tar -czf "$POSTMORTEM_ROOT/release/usdjpy-shock-failure-2025-postmortem-v1.tar.gz" -C "$POSTMORTEM_ROOT/out" .
          cp "$POSTMORTEM_ROOT/out/manifest.json" "$POSTMORTEM_ROOT/release/"
          cp "$POSTMORTEM_ROOT/out/SHA256SUMS" "$POSTMORTEM_ROOT/release/"
          (cd "$POSTMORTEM_ROOT/release" && sha256sum usdjpy-shock-failure-2025-postmortem-v1.tar.gz manifest.json SHA256SUMS > RELEASE_SHA256SUMS)
          if ! gh release view "$POSTMORTEM_RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$POSTMORTEM_RELEASE" --repo "$GITHUB_REPOSITORY" --target "$PUBLICATION_SHA" \
              --title "USDJPY Shock Failure 2025 External-Gate Postmortem v1" \
              --notes "Fixed candidate B_EXECUTABLE_T0_8BAR. Evidence repair and postmortem only; no retuning. 2025 remains consumed external evidence and is not reusable as a holdout."
            gh release upload "$POSTMORTEM_RELEASE" "$POSTMORTEM_ROOT/release"/* --repo "$GITHUB_REPOSITORY"
          fi
          gh release download "$POSTMORTEM_RELEASE" --repo "$GITHUB_REPOSITORY" --dir "$POSTMORTEM_ROOT/readback"
          (cd "$POSTMORTEM_ROOT/readback" && sha256sum -c RELEASE_SHA256SUMS)
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['POSTMORTEM_ROOT']);x=json.loads((root/'out'/'final_decision.json').read_text())
          body=(f"## Shock Failure 2025 postmortem\n\n- Decision: `{x['decision']}`\n- Fixed candidate: `{x['fixed_candidate_status']}`\n- Family: `{x['family_status']}`\n- Release: `{os.environ['POSTMORTEM_RELEASE']}`\n- Publication commit: `{os.environ['PUBLICATION_SHA']}`\n- 2025 reused as holdout: `false`\n")
          (root/'pr-comment.md').write_text(body)
          PY
          gh pr comment "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --body-file "$POSTMORTEM_ROOT/pr-comment.md"

      - name: Upload complete postmortem evidence
        uses: actions/upload-artifact@v4
        with:
          name: usdjpy-shock-failure-2025-postmortem-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.POSTMORTEM_ROOT }}/out
            ${{ env.POSTMORTEM_ROOT }}/release
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
