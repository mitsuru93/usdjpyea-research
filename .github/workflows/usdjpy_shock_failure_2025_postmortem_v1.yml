name: USDJPY Shock Failure 2025 External-Gate Postmortem v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/usdjpy_shock_failure_2025_postmortem_v1.yml'
      - 'tools/analyze_usdjpy_shock_failure_2025_postmortem_v1.py.gz.b64'
      - 'configs/research/usdjpy_shock_failure_2025_postmortem_protocol_v1.json'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: usdjpy-shock-failure-2025-postmortem-v1
  cancel-in-progress: true

jobs:
  postmortem:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PHASE2_RELEASE: usdjpy-csos-shock-failure-phase2-v1
      PHASE2_ASSET: usdjpy-csos-shock-failure-phase2-v1-30206226997-1.zip
      CORE_REPO: mitsuru93/usdjpyea-core
      CORE_REPAIR_RELEASE: usdjpy-shock-failure-p6-evidence-repair-v1
      CORE_ORIGINAL_ARTIFACT_SHA256: 70088c66cd1014391cabbb6f533462dcd3dbedbd7d6c537a5dc0798343594a6a
      POSTMORTEM_RELEASE: usdjpy-shock-failure-2025-postmortem-v1
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact head revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0

      - name: Materialize and compile fixed analyzer
        shell: bash
        run: |
          set -euo pipefail
          base64 -d tools/analyze_usdjpy_shock_failure_2025_postmortem_v1.py.gz.b64 | gzip -d > tools/analyze_usdjpy_shock_failure_2025_postmortem_v1.py
          python -m py_compile tools/analyze_usdjpy_shock_failure_2025_postmortem_v1.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install fixed dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'numpy==2.1.3' 'pandas==2.2.3' 'scipy==1.14.1' 'tabulate==0.9.0'

      - name: Validate frozen no-retuning protocol
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p=json.load(open('configs/research/usdjpy_shock_failure_2025_postmortem_protocol_v1.json'))
          assert p['status']=='FROZEN_NO_CANDIDATE_SELECTION'
          assert p['candidate_id']=='B_EXECUTABLE_T0_8BAR'
          assert p['fixed_candidate_changes_permitted'] is False
          assert p['consumed_external_evidence']==['2025H1','2025H2']
          assert p['oracle_exit_label']=='ORACLE_DIAGNOSTIC_NOT_IMPLEMENTABLE_CANDIDATE'
          assert p['production_authorized'] is False and p['live_orders_authorized'] is False
          PY

      - name: Prepare isolated roots
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/usdjpy-shock-failure-2025-postmortem-v1"
          rm -rf "$root"
          mkdir -p "$root"/{phase2-download,phase2,history,history2023,bars2024,raw2025,core-repair,core-artifact,out,release,readback}
          echo "POSTMORTEM_ROOT=$root" >> "$GITHUB_ENV"

      - name: Download and verify Phase 2 authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$PHASE2_RELEASE" --repo "$GITHUB_REPOSITORY" --dir "$POSTMORTEM_ROOT/phase2-download" --pattern "$PHASE2_ASSET"
          unzip -q "$POSTMORTEM_ROOT/phase2-download/$PHASE2_ASSET" -d "$POSTMORTEM_ROOT/phase2"
          test -f "$POSTMORTEM_ROOT/phase2/phase2_output/candidate_trade_ledger.csv.gz"
          (cd "$POSTMORTEM_ROOT/phase2/phase2_output" && sha256sum -c PACKAGE_SHA256SUMS)
          count=$(python - <<'PY'
          import pandas as pd,os
          p=os.path.join(os.environ['POSTMORTEM_ROOT'],'phase2','phase2_output','candidate_trade_ledger.csv.gz')
          d=pd.read_csv(p)
          print(len(d[(d.candidate_id=='B_EXECUTABLE_T0_8BAR') & d.admitted.fillna(False)]))
          PY
          )
          test "$count" = 114

      - name: Download and verify 2023 and 2024 M15 authorities
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download f05-failed-reclaim-historical-authorities-v1 --repo "$GITHUB_REPOSITORY" --dir "$POSTMORTEM_ROOT/history" \
            --pattern 'usdjpy-2023-canonical-baseline-prep-v1.zip' --pattern 'EXPECTED_SHA256SUMS'
          (cd "$POSTMORTEM_ROOT/history" && sha256sum -c EXPECTED_SHA256SUMS --ignore-missing)
          unzip -q "$POSTMORTEM_ROOT/history/usdjpy-2023-canonical-baseline-prep-v1.zip" -d "$POSTMORTEM_ROOT/history2023"
          printf '%s  %s\n' '4c10ab3244996d73d0955850675231a533f918da09a41ac642c9a3e287b7ac78' "$POSTMORTEM_ROOT/history2023/normalized/usdjpy_2023_m15_bid_utc_rakuten_mt4_v1.csv.gz" | sha256sum -c -
          gh release download usdjpy-2024-derived-bars-v1 --repo "$GITHUB_REPOSITORY" --dir "$POSTMORTEM_ROOT/bars2024" --pattern 'USDJPY-2024-m15-derived-bars-v1.csv.gz'
          printf '%s  %s\n' 'd22a008247e2a8bed49a5169648661ab21eff404a6bc2985bca0c3b5af290020' "$POSTMORTEM_ROOT/bars2024/USDJPY-2024-m15-derived-bars-v1.csv.gz" | sha256sum -c -

      - name: Download and verify immutable 2025 Raw Bid Ask Tick Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="$POSTMORTEM_ROOT/raw2025"
          gh release download usdjpy-2025-raw-bidask-ticks-v1 --repo "$GITHUB_REPOSITORY" --dir "$dir" \
            --pattern 'usdjpy-2025-??-raw-ticks-v1.tar.gz' \
            --pattern 'usdjpy-2025-raw-ticks-v1.annual-manifest.json' \
            --pattern 'SHA256SUMS'
          test "$(find "$dir" -maxdepth 1 -name 'usdjpy-2025-??-raw-ticks-v1.tar.gz' | wc -l)" = 12
          test -f "$dir/usdjpy-2025-raw-ticks-v1.annual-manifest.json"
          test -f "$dir/SHA256SUMS"
          (cd "$dir" && grep -E 'usdjpy-2025-(..-raw-ticks-v1\.tar\.gz|raw-ticks-v1\.annual-manifest\.json)$' SHA256SUMS | sha256sum -c -)
          jq -e '.accepted==true and .resolved_hours==.expected_hours and .tick_rows>0' "$dir/usdjpy-2025-raw-ticks-v1.annual-manifest.json"

      - name: Download corrected P6 evidence and original MT4 logs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$CORE_REPAIR_RELEASE" --repo "$CORE_REPO" --dir "$POSTMORTEM_ROOT/core-repair" \
            --pattern 'corrected_p6_result.json' \
            --pattern 'p6_repair_receipt.json' \
            --pattern 'release_readback_receipt.json' \
            --pattern 'usdjpy-shock-failure-p6-original-artifact-8639969385.zip'
          jq -e '.status=="FAIL_P6_2025_GATE_RESEARCH_ONLY_NO_RETUNING" and .candidate_id=="B_EXECUTABLE_T0_8BAR"' "$POSTMORTEM_ROOT/core-repair/corrected_p6_result.json"
          jq -e '.status=="PASS_EVIDENCE_PACKAGING_REPAIRED_SCIENTIFIC_RESULT_UNCHANGED"' "$POSTMORTEM_ROOT/core-repair/p6_repair_receipt.json"
          jq -e '.status=="PASS_SHA256_READBACK"' "$POSTMORTEM_ROOT/core-repair/release_readback_receipt.json"
          actual=$(sha256sum "$POSTMORTEM_ROOT/core-repair/usdjpy-shock-failure-p6-original-artifact-8639969385.zip" | awk '{print $1}')
          test "$actual" = "$CORE_ORIGINAL_ARTIFACT_SHA256"
          unzip -q "$POSTMORTEM_ROOT/core-repair/usdjpy-shock-failure-p6-original-artifact-8639969385.zip" -d "$POSTMORTEM_ROOT/core-artifact"
          test -f "$POSTMORTEM_ROOT/core-artifact/p6/h1/standalone/sf_2025h1_standalone.csv"
          test -f "$POSTMORTEM_ROOT/core-artifact/p6/h2/standalone/sf_2025h2_standalone.csv"
          test -f "$POSTMORTEM_ROOT/core-artifact/p6/h1/baseline/base_2025h1_baseline.csv"
          test -f "$POSTMORTEM_ROOT/core-artifact/p6/h2/baseline/base_2025h2_baseline.csv"

      - name: Execute fixed-candidate postmortem
        shell: bash
        run: |
          set -euo pipefail
          python tools/analyze_usdjpy_shock_failure_2025_postmortem_v1.py \
            --phase2-ledger "$POSTMORTEM_ROOT/phase2/phase2_output/candidate_trade_ledger.csv.gz" \
            --m15-2023 "$POSTMORTEM_ROOT/history2023/normalized/usdjpy_2023_m15_bid_utc_rakuten_mt4_v1.csv.gz" \
            --m15-2024 "$POSTMORTEM_ROOT/bars2024/USDJPY-2024-m15-derived-bars-v1.csv.gz" \
            --raw-2025 "$POSTMORTEM_ROOT/raw2025" \
            --core-artifact-root "$POSTMORTEM_ROOT/core-artifact" \
            --corrected-p6 "$POSTMORTEM_ROOT/core-repair/corrected_p6_result.json" \
            --protocol configs/research/usdjpy_shock_failure_2025_postmortem_protocol_v1.json \
            --out-dir "$POSTMORTEM_ROOT/out" \
            --research-sha "$HEAD_SHA" \
            --core-sha 0dfec6a7a9245acecbd8961a4e784efde857ef69 \
            --run-id "$GITHUB_RUN_ID" | tee "$POSTMORTEM_ROOT/out/run.log"
          jq -e '.status=="PASS_POSTMORTEM_COMPLETED_NO_RETUNING" and .candidate_id=="B_EXECUTABLE_T0_8BAR" and .production_authorized==false and .live_orders_authorized==false and ."2025_available_as_future_holdout"==false' "$POSTMORTEM_ROOT/out/final_decision.json"
          test "$(($(wc -l < "$POSTMORTEM_ROOT/out/event_ledger_2025_mt4_enriched.csv")-1))" = 47
          grep -q 'ORACLE_DIAGNOSTIC_NOT_IMPLEMENTABLE_CANDIDATE' "$POSTMORTEM_ROOT/out/oracle_exit_diagnostics_2025.csv"
          (cd "$POSTMORTEM_ROOT/out" && sha256sum -c SHA256SUMS)
          cp tools/analyze_usdjpy_shock_failure_2025_postmortem_v1.py "$POSTMORTEM_ROOT/out/postmortem_source_snapshot.py"
          cp "$POSTMORTEM_ROOT/core-repair/p6_repair_receipt.json" "$POSTMORTEM_ROOT/out/"
          cp "$POSTMORTEM_ROOT/core-repair/release_readback_receipt.json" "$POSTMORTEM_ROOT/out/core_release_readback_receipt.json"
          cp configs/research/usdjpy_shock_failure_2025_postmortem_protocol_v1.json "$POSTMORTEM_ROOT/out/"

      - name: Rebuild final manifest after source snapshots
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$POSTMORTEM_ROOT/out/MANIFEST.json" "$POSTMORTEM_ROOT/out/SHA256SUMS"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['POSTMORTEM_ROOT'])/'out'
          def sha(p):
            h=hashlib.sha256()
            with p.open('rb') as f:
              for c in iter(lambda:f.read(1<<20),b''): h.update(c)
            return h.hexdigest()
          files=[{'path':p.name,'bytes':p.stat().st_size,'sha256':sha(p)} for p in sorted(root.iterdir()) if p.is_file() and p.name not in {'MANIFEST.json','SHA256SUMS'}]
          (root/'MANIFEST.json').write_text(json.dumps({'schema_version':'usdjpy_shock_failure_2025_postmortem_manifest_v1','files':files},indent=2,sort_keys=True)+'\n')
          with (root/'SHA256SUMS').open('w') as f:
            for p in sorted(root.iterdir()):
              if p.is_file() and p.name!='SHA256SUMS': f.write(f'{sha(p)}  {p.name}\n')
          PY
          (cd "$POSTMORTEM_ROOT/out" && sha256sum -c SHA256SUMS)

      - name: Commit canonical Research outputs to PR branch
        shell: bash
        run: |
          set -euo pipefail
          target=research/usdjpy/shock_failure/2025_external_gate_postmortem_v1
          rm -rf "$target"; mkdir -p "$target"
          cp "$POSTMORTEM_ROOT/out"/* "$target/"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$target"
          if ! git diff --cached --quiet; then
            git commit -m 'research: record completed Shock Failure 2025 postmortem'
            git push origin "HEAD:$HEAD_BRANCH"
          fi
          echo "PUBLICATION_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish immutable Release and verify readback
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tar -czf "$POSTMORTEM_ROOT/release/usdjpy-shock-failure-2025-postmortem-v1.tar.gz" -C "$POSTMORTEM_ROOT/out" .
          cp "$POSTMORTEM_ROOT/out/MANIFEST.json" "$POSTMORTEM_ROOT/release/"
          cp "$POSTMORTEM_ROOT/out/SHA256SUMS" "$POSTMORTEM_ROOT/release/"
          (cd "$POSTMORTEM_ROOT/release" && sha256sum usdjpy-shock-failure-2025-postmortem-v1.tar.gz MANIFEST.json SHA256SUMS > RELEASE_SHA256SUMS)
          if gh release view "$POSTMORTEM_RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Existing immutable Release will be verified without mutation."
          else
            gh release create "$POSTMORTEM_RELEASE" --repo "$GITHUB_REPOSITORY" --target "$PUBLICATION_SHA" \
              --title 'USDJPY Shock Failure 2025 External-Gate Postmortem v1' \
              --notes 'Fixed candidate B_EXECUTABLE_T0_8BAR. Evidence repair and postmortem only; no retuning. 2025 remains consumed external evidence and is not reusable as a holdout.'
            gh release upload "$POSTMORTEM_RELEASE" "$POSTMORTEM_ROOT/release"/* --repo "$GITHUB_REPOSITORY"
          fi
          gh release download "$POSTMORTEM_RELEASE" --repo "$GITHUB_REPOSITORY" --dir "$POSTMORTEM_ROOT/readback"
          (cd "$POSTMORTEM_ROOT/readback" && sha256sum -c RELEASE_SHA256SUMS)

      - name: Comment final decision on PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['POSTMORTEM_ROOT'])
          x=json.loads((root/'out'/'final_decision.json').read_text())
          body=(f"## Shock Failure 2025 postmortem completed\n\n"
                f"- Decision: `{x['decision_class']}`\n"
                f"- Fixed candidate: `{x['fixed_candidate_status']}`\n"
                f"- Family: `{x['family_status']}`\n"
                f"- Release: `{os.environ['POSTMORTEM_RELEASE']}`\n"
                f"- Publication commit: `{os.environ['PUBLICATION_SHA']}`\n"
                f"- 2025 reusable as holdout: `false`\n"
                f"- Retuning: `false`\n")
          (root/'pr-comment.md').write_text(body)
          PY
          gh pr comment "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --body-file "$POSTMORTEM_ROOT/pr-comment.md"

      - name: Upload complete postmortem evidence
        uses: actions/upload-artifact@v4
        with:
          name: usdjpy-shock-failure-2025-postmortem-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.POSTMORTEM_ROOT }}/out
            ${{ env.POSTMORTEM_ROOT }}/release
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
