name: USDJPY HYP-038 Delayed Continuation Research v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/usdjpy_hyp038_delayed_continuation_research_v1.yml'
      - 'configs/research/usdjpy_hyp038_*_v1.json'
      - 'tools/evaluate_usdjpy_hyp038_delayed_continuation_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: usdjpy-hyp038-delayed-continuation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Exact-SHA selective fetch and protocol lock
        id: init
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/h38"; rm -rf "$root"; mkdir -p "$root"/{src,inputs/{hyp037,mechanism,historical,2023,2024h1,2024h2,raw2023,raw2024},materialized,output,evidence/preflight}
          sha='${{ github.event.pull_request.head.sha || github.sha }}'; test "${#sha}" = 40
          fetch(){ p="$1"; o="$2"; mkdir -p "$(dirname "$o")"; gh api "repos/${GITHUB_REPOSITORY}/contents/${p}?ref=${sha}" --jq .content | tr -d '\n' | base64 -d > "$o"; test -s "$o"; }
          fetch configs/research/usdjpy_hyp038_preregistration_v1.json "$root/src/prereg.json"
          fetch configs/research/usdjpy_hyp038_startup_receipt_v1.json "$root/src/startup.json"
          fetch configs/research/usdjpy_hyp038_duplicate_research_audit_v1.json "$root/src/duplicate.json"
          fetch configs/research/usdjpy_hyp038_source_manifest_v1.json "$root/src/source_manifest.json"
          fetch configs/research/usdjpy_hyp038_feature_catalog_v1.json "$root/src/feature_catalog.json"
          fetch configs/research/usdjpy_hyp038_finite_candidate_catalog_v1.json "$root/src/candidate_catalog.json"
          fetch tools/evaluate_usdjpy_hyp038_delayed_continuation_v1.py "$root/src/evaluate.py"
          fetch tools/usdjpy_hyp034_bi5_source_v1.py "$root/src/usdjpy_hyp034_bi5_source_v1.py"
          fetch tools/build_usdjpy_b02_f05_hyp024_inputs_v2.py "$root/src/build_baseline.py"
          fetch tools/vendor/fx2_infra_core_f897b250_v1.py "$root/src/fx2_infra.py"
          python -m py_compile "$root/src/"*.py
          printf '%s  %s\n' 66da172e403ff6b53bbf5e84b492d0abdae553c3703c2b794ae3190c647e6af3 "$root/src/evaluate.py" | sha256sum -c -
          jq -e '.hypothesis_id=="USDJPY-HYP-038" and .status=="PREREGISTERED_BEFORE_OUTCOME" and .relationship_to_hyp037.binding_decision_unchanged=="FAIL_2023_2024_RESEARCH_CANDIDATE_GATE_NO_RETUNING" and ."2025_accessed"==false' "$root/src/prereg.json"
          jq -e '.new_hypothesis_is_not_hyp037_reopening==true and .hyp037_decision_changed==false and .candidate_outcomes_accessed==false' "$root/src/duplicate.json"
          echo "root=$root" >> "$GITHUB_OUTPUT"; echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize immutable HYP-037 and B02/F05 authorities
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ROOT: ${{ steps.init.outputs.root }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'numpy==2.1.3' 'pandas==2.2.3'
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/8714601229/zip" > "$ROOT/inputs/hyp037/artifact.zip"
          unzip -q "$ROOT/inputs/hyp037/artifact.zip" -d "$ROOT/inputs/hyp037/unpacked"
          ref=$(find "$ROOT/inputs/hyp037/unpacked" -name short_source_native_executable_ledger.csv.gz -print -quit); test -n "$ref"; cp "$ref" "$ROOT/materialized/hyp037_short_reference.csv.gz"
          test "$(gzip -cd "$ROOT/materialized/hyp037_short_reference.csv.gz" | wc -l)" = 501

          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/8712825068/zip" > "$ROOT/inputs/mechanism/artifact.zip"
          unzip -q "$ROOT/inputs/mechanism/artifact.zip" -d "$ROOT/inputs/mechanism/unpacked"
          feat=$(find "$ROOT/inputs/mechanism/unpacked" -name mechanism_feature_comparison.csv -print -quit); test -n "$feat"; cp "$feat" "$ROOT/materialized/hyp037_mechanism_features.csv"
          test "$(awk -F, 'NR>1 && $2=="SHORT"{n++} END{print n+0}' "$ROOT/materialized/hyp037_mechanism_features.csv")" = 500

          gh release download f05-failed-reclaim-historical-authorities-v1 --repo "$GITHUB_REPOSITORY" --dir "$ROOT/inputs/historical" --pattern 'usdjpy-2023-canonical-baseline-prep-v1.zip' --pattern 'mt4-usdjpy-2024h1-event-audit-v1.zip' --pattern 'mt4-usdjpy-f05-extatr-h2-validation-v1.zip' --pattern EXPECTED_SHA256SUMS
          (cd "$ROOT/inputs/historical" && sha256sum -c EXPECTED_SHA256SUMS)
          unzip -q "$ROOT/inputs/historical/usdjpy-2023-canonical-baseline-prep-v1.zip" -d "$ROOT/inputs/2023"
          unzip -q "$ROOT/inputs/historical/mt4-usdjpy-2024h1-event-audit-v1.zip" -d "$ROOT/inputs/2024h1"
          unzip -q "$ROOT/inputs/historical/mt4-usdjpy-f05-extatr-h2-validation-v1.zip" -d "$ROOT/inputs/2024h2"
          python "$ROOT/src/build_baseline.py" --m15-2023 "$ROOT/inputs/2023/normalized/usdjpy_2023_m15_bid_utc_rakuten_mt4_v1.csv.gz" --m15-2024h1 "$ROOT/inputs/2024h1/m15_utc_2024h1.csv" --events-2024h1 "$ROOT/inputs/2024h1/tester/fx2_usdjpy_2024h1_event_audit_fixed_001_each_v1.csv" --events-2024h2 "$ROOT/inputs/2024h2/h2_baseline/fx2_usdjpy_f05_extatr_h2_baseline_v1.csv" --out-dir "$ROOT/materialized"
          printf '%s  %s\n' 98c9c8cf57c62c23a94aa38efa6ee257e823dd0b68c413615197a48be00b08ca "$ROOT/materialized/usdjpy_b02_f05_source_trade_ledger_v2.csv" | sha256sum -c -
          test "$(gzip -cd "$ROOT/materialized/usdjpy_b02_f05_entry_exit_state_ledger_v2.csv.gz" | wc -l)" = 68956

      - name: Materialize 2023-2024 Dukascopy Bid Ask Tick only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ROOT: ${{ steps.init.outputs.root }}
        run: |
          set -euo pipefail
          for y in 2023 2024; do
            d="$ROOT/inputs/raw$y"
            gh release download "usdjpy-$y-raw-bidask-ticks-v1" --repo "$GITHUB_REPOSITORY" --dir "$d" --pattern "usdjpy-$y-??-raw-ticks-v1.tar.gz" --pattern "usdjpy-$y-raw-ticks-v1.annual-manifest.json" --pattern SHA256SUMS
            (cd "$d" && grep -E "usdjpy-$y-(..-raw-ticks-v1\\.tar\\.gz|raw-ticks-v1\\.annual-manifest\\.json)$" SHA256SUMS | sha256sum -c -)
            test "$(find "$d" -name '*.tar.gz' | wc -l)" = 12
          done
          find "$ROOT/inputs" -maxdepth 2 -type f -printf '%p\n' | sort > "$ROOT/evidence/input_inventory.txt"
          ! grep -E '/raw2020/|/raw2021/|/raw2022/|2025' "$ROOT/evidence/input_inventory.txt"

      - name: Preflight without candidate outcomes
        shell: bash
        env:
          ROOT: ${{ steps.init.outputs.root }}
          PYTHONPATH: ${{ steps.init.outputs.root }}/src
        run: |
          set -euo pipefail
          common=(--hyp037-ledger "$ROOT/materialized/hyp037_short_reference.csv.gz" --entry-features "$ROOT/materialized/hyp037_mechanism_features.csv" --baseline-trades "$ROOT/materialized/usdjpy_b02_f05_source_trade_ledger_v2.csv" --baseline-states "$ROOT/materialized/usdjpy_b02_f05_entry_exit_state_ledger_v2.csv.gz" --raw-2023 "$ROOT/inputs/raw2023" --raw-2024 "$ROOT/inputs/raw2024" --prereg "$ROOT/src/prereg.json" --startup-receipt "$ROOT/src/startup.json" --duplicate-audit "$ROOT/src/duplicate.json" --source-manifest "$ROOT/src/source_manifest.json" --research-sha '${{ steps.init.outputs.sha }}' --core-sha f897b250b808207d960417b2306935dcb0655acf --run-id "$GITHUB_RUN_ID")
          python "$ROOT/src/evaluate.py" "${common[@]}" --out-dir "$ROOT/evidence/preflight" --preflight-only
          jq -e '.pass==true and ."2020_2022_accessed"==false and ."2025_accessed"==false and .outcomes_authorized==false' "$ROOT/evidence/preflight/preflight_receipt.json"

      - name: Execute frozen HYP-038 2023-2024 OOF research
        shell: bash
        env:
          ROOT: ${{ steps.init.outputs.root }}
          PYTHONPATH: ${{ steps.init.outputs.root }}/src
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          common=(--hyp037-ledger "$ROOT/materialized/hyp037_short_reference.csv.gz" --entry-features "$ROOT/materialized/hyp037_mechanism_features.csv" --baseline-trades "$ROOT/materialized/usdjpy_b02_f05_source_trade_ledger_v2.csv" --baseline-states "$ROOT/materialized/usdjpy_b02_f05_entry_exit_state_ledger_v2.csv.gz" --raw-2023 "$ROOT/inputs/raw2023" --raw-2024 "$ROOT/inputs/raw2024" --prereg "$ROOT/src/prereg.json" --startup-receipt "$ROOT/src/startup.json" --duplicate-audit "$ROOT/src/duplicate.json" --source-manifest "$ROOT/src/source_manifest.json" --research-sha '${{ steps.init.outputs.sha }}' --core-sha f897b250b808207d960417b2306935dcb0655acf --run-id "$GITHUB_RUN_ID")
          python "$ROOT/src/evaluate.py" "${common[@]}" --out-dir "$ROOT/output" | tee "$ROOT/evidence/research_run.log"
          jq -e '.hypothesis_id=="USDJPY-HYP-038" and (.hyp037_relationship|contains("HYP-037 FAIL_2023_2024_RESEARCH_CANDIDATE_GATE_NO_RETUNING unchanged"))' "$ROOT/output/final_result.json"
          jq -e '.period_access."2025H1"==false and .production_authorized==false and .live_authorized==false' "$ROOT/output/final_result.json"
          (cd "$ROOT/output" && sha256sum -c PACKAGE_SHA256SUMS)
          python "$ROOT/src/fx2_infra.py" archive --input "$ROOT/output" --output "$ROOT/usdjpy-hyp038-delayed-continuation-research-v1.zip" --source-sha '${{ steps.init.outputs.sha }}' --run-id "$GITHUB_RUN_ID" --classification scientific > "$ROOT/evidence/archive_build.json"
          python "$ROOT/src/fx2_infra.py" readback --archive "$ROOT/usdjpy-hyp038-delayed-continuation-research-v1.zip" > "$ROOT/evidence/archive_readback.json"
          jq -e '.status=="PASS"' "$ROOT/evidence/archive_readback.json"

      - name: Upload immutable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usdjpy-hyp038-delayed-continuation-research-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.init.outputs.root }}/output
            ${{ steps.init.outputs.root }}/evidence
            ${{ steps.init.outputs.root }}/usdjpy-hyp038-delayed-continuation-research-v1.zip
          retention-days: 90
          compression-level: 0
          if-no-files-found: warn
