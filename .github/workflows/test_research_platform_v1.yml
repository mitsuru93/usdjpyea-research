name: Test USDJPY Research Platform v1

on:
  push:
    branches: ['research/b02-f05-foundation-v1']
    paths:
      - 'tools/research_platform/**'
      - 'tools/test_research_platform_v1.py'
      - 'tools/test_factor_analysis_v1.py'
      - 'tools/test_research_platform_advanced_v1.py'
      - 'configs/research/usdjpy_b02_f05_source_inventory_v1.json'
      - 'configs/research/usdjpy_b02_f05_experiment_registry_v1.json'
      - '.github/workflows/test_research_platform_v1.yml'
  pull_request:
    paths:
      - 'tools/research_platform/**'
      - 'tools/test_research_platform_v1.py'
      - 'tools/test_factor_analysis_v1.py'
      - 'tools/test_research_platform_advanced_v1.py'
      - 'configs/research/usdjpy_b02_f05_source_inventory_v1.json'
      - 'configs/research/usdjpy_b02_f05_experiment_registry_v1.json'
      - '.github/workflows/test_research_platform_v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile
        run: |
          python -m py_compile \
            tools/research_platform/event_model_v1.py \
            tools/research_platform/experiment_contract_v1.py \
            tools/research_platform/source_inventory_v1.py \
            tools/research_platform/result_adapter_v1.py \
            tools/research_platform/transition_rules_v1.py \
            tools/research_platform/path_ledger_adapter_v1.py \
            tools/research_platform/experiment_registry_v1.py \
            tools/research_platform/factor_analysis_v1.py \
            tools/research_platform/observation_builder_v1.py \
            tools/research_platform/advanced_analysis_v1.py \
            tools/test_research_platform_v1.py \
            tools/test_factor_analysis_v1.py \
            tools/test_research_platform_advanced_v1.py
      - name: Platform unit tests
        run: python tools/test_research_platform_v1.py
      - name: Factor analysis unit tests
        run: python tools/test_factor_analysis_v1.py
      - name: Advanced analysis unit tests
        run: python tools/test_research_platform_advanced_v1.py
      - name: Validate repository inventory and registry without downloading market data
        run: |
          python - <<'PY'
          from pathlib import Path
          from tools.research_platform.experiment_registry_v1 import deterministic_registry_sha256, load_registry, validate_registry_paths
          from tools.research_platform.source_inventory_v1 import collection_required, deterministic_inventory_sha256, inspect_repository_file, load_inventory
          root = Path('.')
          records = load_inventory(root / 'configs/research/usdjpy_b02_f05_source_inventory_v1.json')
          inspections = []
          for record in records:
              if record.kind == 'repository_file':
                  result = inspect_repository_file(root, record)
                  assert result['exists'], result
                  assert result.get('sha_match', True), result
                  assert result.get('row_match', True), result
                  inspections.append(result)
          assert collection_required(records) is False
          experiments = load_registry(root / 'configs/research/usdjpy_b02_f05_experiment_registry_v1.json')
          missing = validate_registry_paths(root, experiments)
          assert not missing, missing
          print({'inventory_sha256': deterministic_inventory_sha256(records), 'registry_sha256': deterministic_registry_sha256(experiments), 'source_count': len(records), 'experiment_count': len(experiments), 'repository_files_verified': len(inspections), 'new_tick_collection': False})
          PY
