name: USDJPY CSOS Dukascopy-Native Remaining-Family Atlas Execution v2
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  actions: read
jobs:
  atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Record Atlas execution start
        shell: bash
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          gh issue comment 403 --repo "$GITHUB_REPOSITORY" --body "Atlas Execution v2 started. Run: ${GITHUB_RUN_ID}; head: ${GITHUB_SHA}; event: ${GITHUB_EVENT_NAME}. 2023-2024 only; 2020-2022 and 2025 not accessed."
      - name: Exact-SHA selective fetch, technical repair and Infrastructure v1 probe
        id: init
        shell: bash
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/csa1"; rm -rf "$root"; mkdir -p "$root"/{src,infra,inputs/{atlas,historical,2023,2024h1,2024h2,raw2023,raw2024},materialized,output,evidence,readback}
          sha='${{ github.event.pull_request.head.sha || github.sha }}'; test "${#sha}" = 40
          fetch(){ p="$1"; o="$2"; mkdir -p "$(dirname "$o")"; j=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${p}?ref=${sha}"); printf %s "$j"|jq -er .content|tr -d '\n'|base64 -d >"$o"; printf %s "$j"|jq -er .sha >"$o.blob_sha"; test -s "$o"; }
          fetch configs/research/usdjpy_csos_dukascopy_native_remaining_family_atlas_prereg_v1.json "$root/src/prereg.json"
          fetch configs/research/usdjpy_csos_dukascopy_native_remaining_family_atlas_source_manifest_v1.json "$root/src/source_manifest.json"
          fetch configs/research/usdjpy_csos_dukascopy_native_remaining_family_atlas_startup_receipt_v1.json "$root/src/startup_receipt.json"
          fetch configs/research/usdjpy_csos_dukascopy_native_remaining_family_atlas_period_role_clarification_v1.json "$root/src/period_role_clarification.json"
          fetch configs/research/usdjpy_csos_dukascopy_native_remaining_family_contract_catalog_v1.json "$root/src/contract_catalog.json"
          fetch configs/research/usdjpy_csos_dukascopy_native_remaining_family_prior_study_audit_v1.json "$root/src/prior_study_audit.json"
          fetch configs/research/usdjpy_csos_dukascopy_native_remaining_family_atlas_technical_revision_receipt_v1.json "$root/src/technical_revision.json"
          fetch configs/research/usdjpy_period_role_policy_v6.json "$root/src/period_policy.json"
          fetch tools/evaluate_usdjpy_csos_dukascopy_native_remaining_family_atlas_v1.py "$root/src/evaluate.py"
          fetch tools/patch_usdjpy_csos_remaining_family_atlas_evaluator_table_annotation_v1.py "$root/src/patch_evaluator.py"
          fetch tools/usdjpy_csos_dukascopy_native_remaining_family_atlas_lib_v1.py "$root/src/usdjpy_csos_dukascopy_native_remaining_family_atlas_lib_v1.py"
          fetch tools/evaluate_usdjpy_pullback_continuation_v1.py "$root/src/hyp035.py"
          fetch tools/usdjpy_hyp034_bi5_source_v1.py "$root/src/usdjpy_hyp034_bi5_source_v1.py"
          fetch tools/build_usdjpy_b02_f05_hyp024_inputs_v2.py "$root/src/build_baseline.py"
          fetch tools/vendor/fx2_infra_core_f897b250_v1.py "$root/infra/fx2_infra.py"
          python "$root/src/patch_evaluator.py" --target "$root/src/evaluate.py" --receipt "$root/evidence/evaluator_patch_receipt.json"
          jq -e '.status=="PASS_TECHNICAL_TABLE_ANNOTATION_REPAIR" and .replacement_count==1 and .scientific_contract_changed==false and .family_contract_changed==false and .source_changed==false and .ranking_metric_changed==false and .shortlist_gate_changed==false and .trade_outcomes_changed==false and .partial_outcome_conditioning==false and .analysis_2020_2022_accessed==false and .external_validation_2025_accessed==false' "$root/evidence/evaluator_patch_receipt.json"
          python -m py_compile "$root/src/"*.py "$root/infra/fx2_infra.py"
          python "$root/infra/fx2_infra.py" probe --json "$root/evidence/runner_capability.json" --markdown "$root/evidence/runner_capability.md"
          jq -e '.status=="FROZEN_BEFORE_DUKASCOPY_NATIVE_OUTCOMES" and .period_role_clarification.received_before_new_family_outcome_calculation==true and .period_roles."2020_2022".ea_research_role=="ANALYSIS_PERIOD" and .period_roles."2020_2022".confirmation_credit==false and .period_roles."2025".ea_research_role=="UNSEEN_BINDING_EXTERNAL_VALIDATION_PERIOD" and .candidate_freeze_authorized==false and .core_or_mt4_authorized==false' "$root/src/prereg.json"
          jq -e '.binding_tick_years==[2023,2024] and ."2020_2022_confirmation_credit"==false and ."2025_external_validation_role"==true and .whole_repository_checkout_required==false and .exact_sha_selective_fetch_required==true' "$root/src/source_manifest.json"
          jq -e '.status=="PASS_PROTOCOL_CLARIFICATION_BEFORE_NEW_FAMILY_OUTCOMES" and .candidate_outcomes_accessed_before_correction==false and .family_contract_changed==false and .ranking_metric_changed==false and .shortlist_gate_changed==false and .source_authority_changed==false' "$root/src/period_role_clarification.json"
          jq -e '.status=="PASS_TECHNICAL_REVISION_BEFORE_COMPLETE_ATLAS_OUTCOMES" and .complete_atlas_result_produced==false and .shortlist_produced==false and .partial_variant_outcomes_reviewed_before_repair==false and .repair_conditioned_on_outcome==false and .family_contract_changed==false and .source_authority_changed==false and .ranking_metric_changed==false and .shortlist_gate_changed==false and .trade_outcome_formula_changed==false and .portfolio_metric_formula_changed==false and .analysis_2020_2022_accessed==false and .external_validation_2025_accessed==false' "$root/src/technical_revision.json"
          jq -e '.status=="FROZEN_BEFORE_DUKASCOPY_NATIVE_OUTCOMES" and (.variants|length)==12' "$root/src/contract_catalog.json"
          jq -e '.period_roles."2020_2022".role=="ANALYSIS_PERIOD" and .period_roles."2020_2022".confirmation_credit==false and .period_roles."2025".role=="UNSEEN_BINDING_EXTERNAL_VALIDATION_PERIOD"' "$root/src/period_policy.json"
          echo "root=$root" >>"$GITHUB_OUTPUT"; echo "sha=$sha" >>"$GITHUB_OUTPUT"; printf '%s\n' "$sha" >"$root/evidence/research_execution_sha.txt"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen runtime and verify immutable authorities
        shell: bash
        env:
          GH_TOKEN: '${{ github.token }}'
          ROOT: '${{ steps.init.outputs.root }}'
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'numpy==2.1.3' 'pandas==2.2.3'
          gh release download usdjpy-csos-opportunity-atlas-v1-r1 --repo "$GITHUB_REPOSITORY" --dir "$ROOT/inputs/atlas" --pattern 'usdjpy-csos-opportunity-atlas-v1-r1-30202535070-1.zip'
          printf '%s  %s\n' f5feef1a1eb06cfdc284d3642c7050b05da3fc6fa31f67a4205c7faf3e72a72f "$ROOT/inputs/atlas/usdjpy-csos-opportunity-atlas-v1-r1-30202535070-1.zip"|sha256sum -c -
          unzip -q "$ROOT/inputs/atlas/usdjpy-csos-opportunity-atlas-v1-r1-30202535070-1.zip" -d "$ROOT/inputs/atlas/unpacked"
          (cd "$ROOT/inputs/atlas/unpacked" && sha256sum -c csos_output/PACKAGE_SHA256SUMS)
          test -s "$ROOT/inputs/atlas/unpacked/csos_output/strategy_opportunity_atlas.csv.gz"
          gh release download f05-failed-reclaim-historical-authorities-v1 --repo "$GITHUB_REPOSITORY" --dir "$ROOT/inputs/historical" --pattern 'usdjpy-2023-canonical-baseline-prep-v1.zip' --pattern 'mt4-usdjpy-2024h1-event-audit-v1.zip' --pattern 'mt4-usdjpy-f05-extatr-h2-validation-v1.zip' --pattern EXPECTED_SHA256SUMS
          (cd "$ROOT/inputs/historical" && sha256sum -c EXPECTED_SHA256SUMS)
          unzip -q "$ROOT/inputs/historical/usdjpy-2023-canonical-baseline-prep-v1.zip" -d "$ROOT/inputs/2023"
          unzip -q "$ROOT/inputs/historical/mt4-usdjpy-2024h1-event-audit-v1.zip" -d "$ROOT/inputs/2024h1"
          unzip -q "$ROOT/inputs/historical/mt4-usdjpy-f05-extatr-h2-validation-v1.zip" -d "$ROOT/inputs/2024h2"
          python "$ROOT/src/build_baseline.py" --m15-2023 "$ROOT/inputs/2023/normalized/usdjpy_2023_m15_bid_utc_rakuten_mt4_v1.csv.gz" --m15-2024h1 "$ROOT/inputs/2024h1/m15_utc_2024h1.csv" --events-2024h1 "$ROOT/inputs/2024h1/tester/fx2_usdjpy_2024h1_event_audit_fixed_001_each_v1.csv" --events-2024h2 "$ROOT/inputs/2024h2/h2_baseline/fx2_usdjpy_f05_extatr_h2_baseline_v1.csv" --out-dir "$ROOT/materialized" >"$ROOT/evidence/baseline.log"
          printf '%s  %s\n' 98c9c8cf57c62c23a94aa38efa6ee257e823dd0b68c413615197a48be00b08ca "$ROOT/materialized/usdjpy_b02_f05_source_trade_ledger_v2.csv"|sha256sum -c -
          for y in 2023 2024; do
            d="$ROOT/inputs/raw$y"
            gh release download "usdjpy-$y-raw-bidask-ticks-v1" --repo "$GITHUB_REPOSITORY" --dir "$d" --pattern "usdjpy-$y-??-raw-ticks-v1.tar.gz" --pattern "usdjpy-$y-raw-ticks-v1.annual-manifest.json" --pattern SHA256SUMS
            (cd "$d" && grep -E "usdjpy-$y-(..-raw-ticks-v1\\.tar\\.gz|raw-ticks-v1\\.annual-manifest\\.json)$" SHA256SUMS|sha256sum -c -)
            test "$(find "$d" -name '*.tar.gz'|wc -l)" = 12
          done
          find "$ROOT/inputs/raw2023" "$ROOT/inputs/raw2024" -maxdepth 1 -type f -printf '%f %s\n'|sort >"$ROOT/evidence/raw_release_inventory.txt"
          ! grep -E '2019|2020|2021|2022|2025' "$ROOT/evidence/raw_release_inventory.txt"
      - name: Preflight and execute frozen common-source Atlas
        shell: bash
        env:
          ROOT: '${{ steps.init.outputs.root }}'
          PYTHONPATH: '${{ steps.init.outputs.root }}/src'
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          common=(--raw-2023 "$ROOT/inputs/raw2023" --raw-2024 "$ROOT/inputs/raw2024" --old-atlas-ledger "$ROOT/inputs/atlas/unpacked/csos_output/strategy_opportunity_atlas.csv.gz" --baseline-trades "$ROOT/materialized/usdjpy_b02_f05_source_trade_ledger_v2.csv" --prereg "$ROOT/src/prereg.json" --source-manifest "$ROOT/src/source_manifest.json" --contract-catalog "$ROOT/src/contract_catalog.json" --prior-study-audit "$ROOT/src/prior_study_audit.json" --period-role-clarification "$ROOT/src/period_role_clarification.json" --research-sha '${{ steps.init.outputs.sha }}' --core-sha f897b250b808207d960417b2306935dcb0655acf --run-id "$GITHUB_RUN_ID")
          python "$ROOT/src/evaluate.py" "${common[@]}" --out-dir "$ROOT/evidence/preflight" --preflight-only | tee "$ROOT/evidence/preflight.log"
          jq -e '.pass==true and .candidate_outcomes_computed==false and .analysis_2020_2022_accessed==false and .analysis_2020_2022_confirmation_credit==false and .external_validation_2025_accessed==false' "$ROOT/evidence/preflight/preflight_receipt.json"
          python "$ROOT/src/evaluate.py" "${common[@]}" --out-dir "$ROOT/output" 2>&1|tee "$ROOT/evidence/atlas_run.log"
          jq -e '.status=="ATLAS_COMPLETE_RESEARCH_PRIORITIZATION_ONLY" and .evaluated_family_count==8 and .evaluated_variant_count==12 and .source_authority.archive_count==24 and .source_authority.tick_count==84428370 and .source_authority.m15_bar_count==49894 and .analysis_2020_2022_accessed==false and .analysis_2020_2022_confirmation_credit==false and .external_validation_2025_accessed==false and .candidate_freeze==false and .core_modified==false and .mt4_executed==false and .production_authorized==false and .live_authorized==false' "$ROOT/output/final_result.json"
          jq -e '.shortlist_count<=2 and .same_family_multiple_variants==false and .candidate_freeze==false and .core_mt4_authorized==false and ."2025_external_validation_authorized_in_this_atlas"==false' "$ROOT/output/shortlist_decision.json"
          (cd "$ROOT/output" && sha256sum -c PACKAGE_SHA256SUMS)
          python "$ROOT/infra/fx2_infra.py" archive --input "$ROOT/output" --output "$ROOT/usdjpy-csos-dukascopy-native-remaining-family-atlas-v1.zip" --source-sha '${{ steps.init.outputs.sha }}' --run-id "$GITHUB_RUN_ID" --classification scientific >"$ROOT/evidence/archive_build.json"
          python "$ROOT/infra/fx2_infra.py" readback --archive "$ROOT/usdjpy-csos-dukascopy-native-remaining-family-atlas-v1.zip" >"$ROOT/evidence/archive_readback.json"
          jq -e '.status=="PASS"' "$ROOT/evidence/archive_readback.json"
      - name: Upload immutable Atlas evidence
        if: always()
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: usdjpy-csos-dukascopy-native-remaining-family-atlas-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.init.outputs.root }}/output
            ${{ steps.init.outputs.root }}/evidence
            ${{ steps.init.outputs.root }}/usdjpy-csos-dukascopy-native-remaining-family-atlas-v1.zip
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
