name: Diagnose USDJPY R3 Release v1

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    if: github.event.issue.title == '[Diag] Inspect USDJPY R3 Release v1'
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release view usdjpy-r3-temporal-stability-v1 --repo "${REPOSITORY}" --json tagName,url,isDraft,isPrerelease,assets > receipt.json
          body="$(python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('receipt.json').read_text())
          compact={
            'tagName':r['tagName'],
            'url':r['url'],
            'isDraft':r['isDraft'],
            'isPrerelease':r['isPrerelease'],
            'assets':[
              {
                'name':a['name'],
                'state':a['state'],
                'digest':a.get('digest'),
                'size':a['size'],
              }
              for a in r['assets']
            ],
          }
          print(json.dumps(compact,indent=2,sort_keys=True))
          PY
          )"
          gh issue comment "${ISSUE_NUMBER}" --repo "${REPOSITORY}" --body "\`\`\`json\n${body}\n\`\`\`"
          gh issue close "${ISSUE_NUMBER}" --repo "${REPOSITORY}" --reason completed
