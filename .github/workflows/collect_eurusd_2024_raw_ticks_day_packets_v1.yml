name: Collect EURUSD 2024 Raw Ticks by Day v1

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Durable Release tag for the validated 2024 EURUSD Tick archive
        required: true
        default: eurusd-2024-raw-bidask-ticks-v1
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: eurusd-2024-raw-ticks-day-packets-v1
  cancel-in-progress: false

env:
  SYMBOL: EURUSD
  START_UTC: 2024-01-01T00:00:00Z
  END_UTC: 2025-01-01T00:00:00Z
  EXPECTED_HOURS: "8784"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      h1_dates: ${{ steps.matrix.outputs.h1_dates }}
      h2_dates: ${{ steps.matrix.outputs.h2_dates }}
      months: ${{ steps.matrix.outputs.months }}
    steps:
      - uses: actions/checkout@v4
      - name: Build locked 366-day matrices
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import date, timedelta

          start = date(2024, 1, 1)
          split = date(2024, 7, 1)
          end = date(2025, 1, 1)
          h1, h2 = [], []
          current = start
          while current < end:
              (h1 if current < split else h2).append(current.isoformat())
              current += timedelta(days=1)
          if len(h1) != 182 or len(h2) != 184 or len(h1) + len(h2) != 366:
              raise SystemExit(f"unexpected matrix sizes h1={len(h1)} h2={len(h2)}")
          months = [f"{month:02d}" for month in range(1, 13)]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("h1_dates=" + json.dumps(h1, separators=(",", ":")) + "\n")
              fh.write("h2_dates=" + json.dumps(h2, separators=(",", ":")) + "\n")
              fh.write("months=" + json.dumps(months, separators=(",", ":")) + "\n")
          print(json.dumps({"h1_days": len(h1), "h2_days": len(h2), "total_days": len(h1) + len(h2)}))
          PY
          python -m py_compile \
            tools/download_dukascopy_bi5_ticks.py \
            tools/download_dukascopy_tick_archive_v1.py

  collect-h1:
    name: collect-${{ matrix.date }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        date: ${{ fromJSON(needs.prepare.outputs.h1_dates) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile EURUSD Tick downloader
        run: |
          python -m py_compile \
            tools/download_dukascopy_bi5_ticks.py \
            tools/download_dukascopy_tick_archive_v1.py
      - name: Download and validate one UTC day
        shell: bash
        env:
          DATE: ${{ matrix.date }}
          ROOT: ${{ runner.temp }}/eurusd-2024-raw-ticks/${{ matrix.date }}
        run: |
          set -euo pipefail
          NEXT_DATE=$(date -u -d "$DATE + 1 day" +%F)
          mkdir -p "$ROOT/source_bi5" "$ROOT/decoded_csv"
          python tools/download_dukascopy_tick_archive_v1.py \
            --symbols "$SYMBOL" \
            --start "${DATE}T00" \
            --end "${NEXT_DATE}T00" \
            --bi5-output-root "$ROOT/source_bi5" \
            --tick-output-root "$ROOT/decoded_csv" \
            --manifest-out "$ROOT/download_manifest.attempts.jsonl" \
            --retries 4 \
            --sleep-seconds 1.0 \
            --request-interval 0.05 \
            --request-timeout 45 \
            --max-errors 24 \
            --error-retry-passes 3 \
            --error-retry-sleep-seconds 8 \
            --error-retry-request-timeout 60 \
            --error-retry-retries 4
          python - <<'PY'
          import csv
          import gzip
          import hashlib
          import json
          import os
          from datetime import datetime, timedelta, timezone
          from decimal import Decimal
          from pathlib import Path

          root = Path(os.environ["ROOT"])
          date_text = os.environ["DATE"]
          attempts_path = root / "download_manifest.attempts.jsonl"
          attempts = [json.loads(line) for line in attempts_path.read_text(encoding="utf-8").splitlines() if line.strip()]
          final = {}
          for row in attempts:
              final[(str(row.get("symbol", "")), str(row.get("hour_start_utc", "")))] = row

          start = datetime.fromisoformat(date_text).replace(tzinfo=timezone.utc)
          expected = [start + timedelta(hours=hour) for hour in range(24)]
          failures = []
          normalized = []
          totals = {
              "expected_hours": 24,
              "resolved_hours": 0,
              "downloaded_hours": 0,
              "missing_404_hours": 0,
              "no_tick_hours": 0,
              "error_hours": 0,
              "tick_rows": 0,
              "negative_spread_rows": 0,
              "source_bi5_bytes": 0,
              "decoded_csv_bytes": 0,
          }

          def sha256_file(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as fh:
                  for chunk in iter(lambda: fh.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          for hour in expected:
              key = ("EURUSD", hour.strftime("%Y-%m-%dT%H:%M:%SZ"))
              row = final.get(key)
              if row is None:
                  failures.append(f"missing terminal manifest record: {key[1]}")
                  totals["error_hours"] += 1
                  continue
              status = str(row.get("status", "error"))
              out = {
                  "symbol": "EURUSD",
                  "hour_start_utc": key[1],
                  "status": status,
                  "rows": int(row.get("rows", 0)),
                  "url": row.get("url"),
              }
              if status == "downloaded":
                  source_rel = Path("source_bi5") / "EURUSD" / hour.strftime("%Y/%m/%d") / f"{hour:%H}h_ticks.bi5"
                  tick_rel = Path("decoded_csv") / "EURUSD" / hour.strftime("%Y/%m/%d") / f"{hour:%H}.csv.gz"
                  source = root / source_rel
                  tick = root / tick_rel
                  if not source.exists() or not tick.exists():
                      failures.append(f"missing downloaded payload: {key[1]}")
                      totals["error_hours"] += 1
                      normalized.append(out)
                      continue
                  source_sha = sha256_file(source)
                  tick_sha = sha256_file(tick)
                  if source_sha != row.get("bi5_sha256"):
                      failures.append(f"BI5 digest mismatch: {key[1]}")
                  if tick_sha != row.get("tick_gzip_sha256"):
                      failures.append(f"Tick digest mismatch: {key[1]}")
                  tick_rows = 0
                  negative = 0
                  with gzip.open(tick, "rt", encoding="utf-8", newline="") as fh:
                      reader = csv.DictReader(fh)
                      for tick_row in reader:
                          tick_rows += 1
                          if tick_row.get("symbol") != "EURUSD":
                              failures.append(f"unexpected symbol in Tick CSV: {key[1]}")
                              break
                          if Decimal(tick_row["ask"]) < Decimal(tick_row["bid"]):
                              negative += 1
                  if tick_rows != int(row.get("rows", 0)):
                      failures.append(f"Tick row mismatch: {key[1]} {tick_rows} != {row.get('rows')}")
                  if negative:
                      failures.append(f"negative spreads: {key[1]} rows={negative}")
                  out.update({
                      "source_bi5_path": source_rel.as_posix(),
                      "source_bi5_sha256": source_sha,
                      "source_bi5_bytes": source.stat().st_size,
                      "decoded_csv_path": tick_rel.as_posix(),
                      "decoded_csv_sha256": tick_sha,
                      "decoded_csv_bytes": tick.stat().st_size,
                      "negative_spread_rows": negative,
                  })
                  totals["resolved_hours"] += 1
                  totals["downloaded_hours"] += 1
                  totals["tick_rows"] += tick_rows
                  totals["negative_spread_rows"] += negative
                  totals["source_bi5_bytes"] += source.stat().st_size
                  totals["decoded_csv_bytes"] += tick.stat().st_size
              elif status in {"missing_404", "no_ticks"}:
                  totals["resolved_hours"] += 1
                  totals["missing_404_hours" if status == "missing_404" else "no_tick_hours"] += 1
              else:
                  totals["error_hours"] += 1
                  failures.append(f"terminal error: {key[1]} {row.get('error_type')} {row.get('error')}")
                  out.update(error_type=row.get("error_type"), error=row.get("error"))
              normalized.append(out)

          final_manifest = root / "download_manifest.jsonl"
          final_manifest.write_text("".join(json.dumps(row, sort_keys=True) + "\n" for row in normalized), encoding="utf-8")
          summary = {
              "schema_version": "eurusd_raw_tick_day_v1",
              "symbol": "EURUSD",
              "date": date_text,
              **totals,
              "manifest_sha256": sha256_file(final_manifest),
              "failures": failures,
              "accepted": (
                  not failures
                  and len(normalized) == 24
                  and totals["resolved_hours"] == 24
                  and totals["error_hours"] == 0
                  and totals["negative_spread_rows"] == 0
              ),
          }
          (root / "day_summary.json").write_text(json.dumps(summary, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(summary, sort_keys=True))
          if not summary["accepted"]:
              raise SystemExit("day validation failed: " + "; ".join(failures[:20]))
          PY
      - name: Write per-file checksums
        if: always()
        shell: bash
        env:
          ROOT: ${{ runner.temp }}/eurusd-2024-raw-ticks/${{ matrix.date }}
        run: |
          set -euo pipefail
          if [ -d "$ROOT" ]; then
            (
              cd "$ROOT"
              find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS
            )
          fi
      - name: Upload immutable day packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eurusd-raw-ticks-${{ matrix.date }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/eurusd-2024-raw-ticks
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  collect-h2:
    name: collect-${{ matrix.date }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        date: ${{ fromJSON(needs.prepare.outputs.h2_dates) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile EURUSD Tick downloader
        run: |
          python -m py_compile \
            tools/download_dukascopy_bi5_ticks.py \
            tools/download_dukascopy_tick_archive_v1.py
      - name: Download and validate one UTC day
        shell: bash
        env:
          DATE: ${{ matrix.date }}
          ROOT: ${{ runner.temp }}/eurusd-2024-raw-ticks/${{ matrix.date }}
        run: |
          set -euo pipefail
          NEXT_DATE=$(date -u -d "$DATE + 1 day" +%F)
          mkdir -p "$ROOT/source_bi5" "$ROOT/decoded_csv"
          python tools/download_dukascopy_tick_archive_v1.py \
            --symbols "$SYMBOL" \
            --start "${DATE}T00" \
            --end "${NEXT_DATE}T00" \
            --bi5-output-root "$ROOT/source_bi5" \
            --tick-output-root "$ROOT/decoded_csv" \
            --manifest-out "$ROOT/download_manifest.attempts.jsonl" \
            --retries 4 \
            --sleep-seconds 1.0 \
            --request-interval 0.05 \
            --request-timeout 45 \
            --max-errors 24 \
            --error-retry-passes 3 \
            --error-retry-sleep-seconds 8 \
            --error-retry-request-timeout 60 \
            --error-retry-retries 4
          python - <<'PY'
          import csv
          import gzip
          import hashlib
          import json
          import os
          from datetime import datetime, timedelta, timezone
          from decimal import Decimal
          from pathlib import Path

          root = Path(os.environ["ROOT"])
          date_text = os.environ["DATE"]
          attempts_path = root / "download_manifest.attempts.jsonl"
          attempts = [json.loads(line) for line in attempts_path.read_text(encoding="utf-8").splitlines() if line.strip()]
          final = {}
          for row in attempts:
              final[(str(row.get("symbol", "")), str(row.get("hour_start_utc", "")))] = row

          start = datetime.fromisoformat(date_text).replace(tzinfo=timezone.utc)
          expected = [start + timedelta(hours=hour) for hour in range(24)]
          failures = []
          normalized = []
          totals = {
              "expected_hours": 24,
              "resolved_hours": 0,
              "downloaded_hours": 0,
              "missing_404_hours": 0,
              "no_tick_hours": 0,
              "error_hours": 0,
              "tick_rows": 0,
              "negative_spread_rows": 0,
              "source_bi5_bytes": 0,
              "decoded_csv_bytes": 0,
          }

          def sha256_file(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as fh:
                  for chunk in iter(lambda: fh.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          for hour in expected:
              key = ("EURUSD", hour.strftime("%Y-%m-%dT%H:%M:%SZ"))
              row = final.get(key)
              if row is None:
                  failures.append(f"missing terminal manifest record: {key[1]}")
                  totals["error_hours"] += 1
                  continue
              status = str(row.get("status", "error"))
              out = {
                  "symbol": "EURUSD",
                  "hour_start_utc": key[1],
                  "status": status,
                  "rows": int(row.get("rows", 0)),
                  "url": row.get("url"),
              }
              if status == "downloaded":
                  source_rel = Path("source_bi5") / "EURUSD" / hour.strftime("%Y/%m/%d") / f"{hour:%H}h_ticks.bi5"
                  tick_rel = Path("decoded_csv") / "EURUSD" / hour.strftime("%Y/%m/%d") / f"{hour:%H}.csv.gz"
                  source = root / source_rel
                  tick = root / tick_rel
                  if not source.exists() or not tick.exists():
                      failures.append(f"missing downloaded payload: {key[1]}")
                      totals["error_hours"] += 1
                      normalized.append(out)
                      continue
                  source_sha = sha256_file(source)
                  tick_sha = sha256_file(tick)
                  if source_sha != row.get("bi5_sha256"):
                      failures.append(f"BI5 digest mismatch: {key[1]}")
                  if tick_sha != row.get("tick_gzip_sha256"):
                      failures.append(f"Tick digest mismatch: {key[1]}")
                  tick_rows = 0
                  negative = 0
                  with gzip.open(tick, "rt", encoding="utf-8", newline="") as fh:
                      reader = csv.DictReader(fh)
                      for tick_row in reader:
                          tick_rows += 1
                          if tick_row.get("symbol") != "EURUSD":
                              failures.append(f"unexpected symbol in Tick CSV: {key[1]}")
                              break
                          if Decimal(tick_row["ask"]) < Decimal(tick_row["bid"]):
                              negative += 1
                  if tick_rows != int(row.get("rows", 0)):
                      failures.append(f"Tick row mismatch: {key[1]} {tick_rows} != {row.get('rows')}")
                  if negative:
                      failures.append(f"negative spreads: {key[1]} rows={negative}")
                  out.update({
                      "source_bi5_path": source_rel.as_posix(),
                      "source_bi5_sha256": source_sha,
                      "source_bi5_bytes": source.stat().st_size,
                      "decoded_csv_path": tick_rel.as_posix(),
                      "decoded_csv_sha256": tick_sha,
                      "decoded_csv_bytes": tick.stat().st_size,
                      "negative_spread_rows": negative,
                  })
                  totals["resolved_hours"] += 1
                  totals["downloaded_hours"] += 1
                  totals["tick_rows"] += tick_rows
                  totals["negative_spread_rows"] += negative
                  totals["source_bi5_bytes"] += source.stat().st_size
                  totals["decoded_csv_bytes"] += tick.stat().st_size
              elif status in {"missing_404", "no_ticks"}:
                  totals["resolved_hours"] += 1
                  totals["missing_404_hours" if status == "missing_404" else "no_tick_hours"] += 1
