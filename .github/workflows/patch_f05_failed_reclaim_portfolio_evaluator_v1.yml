name: Patch F05 failed reclaim portfolio evaluator v1

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '.github/workflows/patch_f05_failed_reclaim_portfolio_evaluator_v1.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/f05-failed-reclaim-portfolio-validation-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/f05-failed-reclaim-portfolio-validation-v1
          token: ${{ github.token }}

      - name: Patch exact technical lookup and refreeze SHA
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          evaluator=Path('tools/evaluate_f05_failed_reclaim_portfolio_v1.py')
          workflow=Path('.github/workflows/validate_f05_failed_reclaim_v1.yml')
          text=evaluator.read_text(encoding='utf-8')
          before=hashlib.sha256(text.encode()).hexdigest()
          assert before=='c37aac2a23d18754041f8025af5395519a6c0ff5e89e4db32d6a62b734777ac0',before
          old='assert s["candidate_definition_changed"] is False'
          new='assert s["resolution"]["candidate_definition_changed"] is False'
          assert text.count(old)==1,text.count(old)
          text=text.replace(old,new)
          evaluator.write_text(text,encoding='utf-8')
          after=hashlib.sha256(evaluator.read_bytes()).hexdigest()
          assert after=='069fd15eda0a496a80f54697e34f5ca859661f4a8644b56fd9e5b69b36576c11',after

          wf=workflow.read_text(encoding='utf-8')
          assert wf.count('c37aac2a23d18754041f8025af5395519a6c0ff5e89e4db32d6a62b734777ac0')==1
          workflow.write_text(wf.replace(
              'c37aac2a23d18754041f8025af5395519a6c0ff5e89e4db32d6a62b734777ac0',
              '069fd15eda0a496a80f54697e34f5ca859661f4a8644b56fd9e5b69b36576c11'),encoding='utf-8')
          PY
          python -m py_compile \
            tools/evaluate_f05_failed_reclaim_portfolio_v1.py \
            tools/replay_f05_failed_reclaim_portfolio_v1.py \
            tools/usdjpy_structural_sl_v1/common.py \
            tools/usdjpy_structural_sl_v1/events.py
          git diff --check

      - name: Commit technical patch to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/evaluate_f05_failed_reclaim_portfolio_v1.py .github/workflows/validate_f05_failed_reclaim_v1.yml
          git diff --cached --quiet && { echo 'No patch staged'; exit 1; }
          git commit -m 'research: fix F05 evaluator semantic receipt lookup'
          git push origin HEAD:agent/f05-failed-reclaim-portfolio-validation-v1
