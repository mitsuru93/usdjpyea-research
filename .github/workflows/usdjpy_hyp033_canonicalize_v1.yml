name: USDJPY HYP033 Canonicalize v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/usdjpy_hyp033_canonicalize_v1.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
      ARTIFACT_ID: '8695153813'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Canonicalize binding evidence and remove technical scaffolding
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/canonicalize.py.gz.b64 <<'PAYLOAD'
          
          PAYLOAD
          base64 -d /tmp/canonicalize.py.gz.b64 | gzip -dc > /tmp/canonicalize.py
          python /tmp/canonicalize.py
