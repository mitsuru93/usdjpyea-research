name: USDJPY 2025 Replication Status Snapshot v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/usdjpy_2025_replication_status_snapshot_v1.yml
      - .github/workflows/collect_usdjpy_dukascopy_raw_ticks_2025_v1.yml
      - configs/research/usdjpy_2025_full_year_replication_v1.json
      - configs/research/usdjpy_2025_full_year_replication_prereg_lock_v1.json
  workflow_run:
    workflows:
      - Collect USDJPY Dukascopy Raw Ticks 2025 v1
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  publish-status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Update issue 173 with exact pipeline identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          STATUS_ISSUE: "173"
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPOSITORY"]
          api_root = f"https://api.github.com/repos/{repo}"
          workflows = [
              ("2025 raw tick collection", "collect_usdjpy_dukascopy_raw_ticks_2025_v1.yml"),
          ]

          def request_json(url: str, *, method: str = "GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(url, data=data, method=method)
              request.add_header("Authorization", f"Bearer {token}")
              request.add_header("Accept", "application/vnd.github+json")
              request.add_header("X-GitHub-Api-Version", "2022-11-28")
              request.add_header("User-Agent", "usdjpyea-research-2025-status")
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          rows = []
          details = []
          for label, workflow_file in workflows:
              encoded = urllib.parse.quote(workflow_file, safe="")
              payload = request_json(f"{api_root}/actions/workflows/{encoded}/runs?branch=main&per_page=1")
              runs = payload.get("workflow_runs", [])
              if not runs:
                  rows.append(f"| {label} | no run | — | — | — |")
                  continue
              run = runs[0]
              run_id = run["id"]
              jobs = request_json(f"{api_root}/actions/runs/{run_id}/jobs?per_page=100").get("jobs", [])
              artifacts = request_json(f"{api_root}/actions/runs/{run_id}/artifacts?per_page=100").get("artifacts", [])
              job_summary = [
                  {
                      "id": job.get("id"),
                      "name": job.get("name"),
                      "status": job.get("status"),
                      "conclusion": job.get("conclusion"),
                      "started_at": job.get("started_at"),
                      "completed_at": job.get("completed_at"),
                  }
                  for job in jobs
              ]
              artifact_text = "<br>".join(
                  f"ID `{item['id']}` `{item['name']}` `{item.get('digest')}`"
                  for item in artifacts
              ) or "none"
              rows.append(
                  f"| {label} | `{run_id}` | **{run.get('status')} / {run.get('conclusion')}** | "
                  f"`{run.get('head_sha')}` | {artifact_text} |"
              )
              details.append(
                  {
                      "label": label,
                      "workflow_file": workflow_file,
                      "run_id": run_id,
                      "run_attempt": run.get("run_attempt"),
                      "status": run.get("status"),
                      "conclusion": run.get("conclusion"),
                      "head_sha": run.get("head_sha"),
                      "html_url": run.get("html_url"),
                      "created_at": run.get("created_at"),
                      "updated_at": run.get("updated_at"),
                      "jobs": job_summary,
                      "artifacts": [
                          {
                              "id": item.get("id"),
                              "name": item.get("name"),
                              "digest": item.get("digest"),
                              "size_in_bytes": item.get("size_in_bytes"),
                              "created_at": item.get("created_at"),
                              "expires_at": item.get("expires_at"),
                          }
                          for item in artifacts
                      ],
                  }
              )

          body = "\n".join(
              [
                  "# USDJPY 2025 replication status",
                  "",
                  "The 2025 strategy outcomes remain unopened. This issue reports data-pipeline identities only.",
                  "",
                  "| Stage | Run ID | Status / conclusion | Head SHA | Artifacts |",
                  "|---|---:|---|---|---|",
                  *rows,
                  "",
                  "```json",
                  json.dumps(details, indent=2, sort_keys=True),
                  "```",
              ]
          )
          request_json(
              f"{api_root}/issues/{os.environ['STATUS_ISSUE']}",
              method="PATCH",
              payload={"body": body},
          )
          print(body)
          PY
