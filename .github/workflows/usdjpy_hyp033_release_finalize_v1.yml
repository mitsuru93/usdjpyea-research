name: USDJPY HYP033 Release Finalize v1

on:
  push:
    branches: [main]
    paths:
      - 'configs/research/usdjpy_hyp033_final_result_v1.json'

permissions:
  contents: write
  actions: read
  issues: write

jobs:
  release-finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      TAG: usdjpy-hyp033-asian-low-sweep-rebound-mechanism-v1
      ASSET: usdjpy-hyp033-binding-development-v2-30375772490-1.zip
      ASSET_SHA256: e119f466dff6938b30425f1a05fa08a916a53599e256e8728eb7c3d23a2b3298
      ARTIFACT_ID: '8695153813'
      BINDING_RUN_ID: '30375772490'
      BINDING_ARTIFACT_DIGEST: sha256:941d0da79889bd6e4357cc6cfb769c557f05f22c5b145c5423a0a95c3955b7c6
    steps:
      - name: Download exact binding artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            --output /tmp/artifact.zip
          mkdir -p /tmp/artifact
          unzip -q /tmp/artifact.zip -d /tmp/artifact
          test -f "/tmp/artifact/$ASSET"
          printf '%s  %s\n' "$ASSET_SHA256" "/tmp/artifact/$ASSET" | sha256sum -c -
          test -f /tmp/artifact/hyp033_output/final_decision.json
          test -f /tmp/artifact/hyp033_output/human_report.md

      - name: Create tagged Release and upload exact evidence
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          # USDJPY-HYP-033 closure

          Final decision: `NO_EX_ANTE_OBSERVABLE_DISCRIMINATOR`.

          The 2023–2024 source-native Long/Short path asymmetry was confirmed, but no portable Entry-time discriminator passed the binding gates. No candidate freeze, 2020–2022 access, Core/MT4 implementation, 2025 access, production authorization, live authorization or retuning is permitted.

          Binding Run: `30375772490`  
          Artifact ID: `8695153813`  
          Deterministic evidence SHA-256: `e119f466dff6938b30425f1a05fa08a916a53599e256e8728eb7c3d23a2b3298`
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "/tmp/artifact/$ASSET" /tmp/artifact/hyp033_output/final_decision.json /tmp/artifact/hyp033_output/human_report.md --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "/tmp/artifact/$ASSET" /tmp/artifact/hyp033_output/final_decision.json /tmp/artifact/hyp033_output/human_report.md \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "USDJPY-HYP-033 Asian Low Sweep Rebound Mechanism v1" \
              --notes-file /tmp/release-notes.md
          fi

      - name: Release readback and receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/readback
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --dir /tmp/readback
          printf '%s  %s\n' "$ASSET_SHA256" "/tmp/readback/$ASSET" | sha256sum -c -
          release_url="https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          cat > /tmp/release_receipt.json <<EOF
          {
            "schema_version": "usdjpy_hyp033_release_receipt_v1",
            "status": "PASS_BYTE_IDENTICAL",
            "hypothesis_id": "USDJPY-HYP-033",
            "family_id": "S_ASIAN_LOW_SWEEP_REBOUND_MECHANISM",
            "decision": "NO_EX_ANTE_OBSERVABLE_DISCRIMINATOR",
            "release_tag": "$TAG",
            "release_url": "$release_url",
            "release_target_sha": "$GITHUB_SHA",
            "binding_run_id": $BINDING_RUN_ID,
            "binding_artifact_id": $ARTIFACT_ID,
            "binding_artifact_digest": "$BINDING_ARTIFACT_DIGEST",
            "asset_name": "$ASSET",
            "asset_sha256": "$ASSET_SHA256",
            "readback_sha256": "$ASSET_SHA256",
            "readback_match": true,
            "candidate_freeze": false,
            "historical_2020_2022_accessed": false,
            "core_mt4_accessed": false,
            "2025_accessed": false,
            "production_authorized": false,
            "live_authorized": false,
            "no_retuning": true
          }
          EOF

      - name: Commit receipt and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,json,os,urllib.parse,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GITHUB_TOKEN']; branch='main'
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28','User-Agent':'hyp033-release-finalizer'}
          def api(method,path,payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/{path}',data=data,method=method,headers=headers)
              with urllib.request.urlopen(req,timeout=120) as r:
                  raw=r.read(); return json.loads(raw) if raw else None
          ref=api('GET','git/ref/heads/main'); parent_sha=ref['object']['sha']
          parent=api('GET',f'git/commits/{parent_sha}'); base_tree=parent['tree']['sha']
          receipt=open('/tmp/release_receipt.json','rb').read()
          blob=api('POST','git/blobs',{'content':base64.b64encode(receipt).decode(),'encoding':'base64'})
          entries=[
            {'path':'configs/research/usdjpy_hyp033_release_receipt_v1.json','mode':'100644','type':'blob','sha':blob['sha']},
            {'path':'.github/workflows/usdjpy_hyp033_release_finalize_v1.yml','mode':'100644','type':'blob','sha':None}
          ]
          tree=api('POST','git/trees',{'base_tree':base_tree,'tree':entries})
          commit=api('POST','git/commits',{'message':'evidence: record HYP-033 Release byte-identical readback','tree':tree['sha'],'parents':[parent_sha]})
          api('PATCH','git/refs/heads/main',{'sha':commit['sha'],'force':False})
          print(json.dumps({'receipt_commit':commit['sha'],'release_target':os.environ['GITHUB_SHA']}))
          PY

      - name: Close binding receipt Issue with Release evidence
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 385 --repo "$GITHUB_REPOSITORY" --body "Release $TAG created at https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG. Asset $ASSET read back byte-identically with SHA-256 $ASSET_SHA256. Candidate freeze false; protected periods/Core/MT4/2025/production/live remain unauthorized."
          gh issue close 385 --repo "$GITHUB_REPOSITORY" --reason completed
