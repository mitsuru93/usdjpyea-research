name: Run USDJPY M15 Breakout 24h Alignment H2

on:
  workflow_dispatch:

concurrency:
  group: usdjpy-m15-breakout-24h-alignment-h2
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas pyyaml

      - name: Compile fixed-candidate screen
        run: |
          python -m py_compile tools/screen_usdjpy_m15_breakout_24h_alignment.py

      - name: Resolve canonical public M1 dataset
        run: |
          python - <<'PY'
          import hashlib
          import urllib.request
          from pathlib import Path
          import yaml

          key = "usdjpy_m1_2024_01_02_to_2026_02_18_public_main"
          registry = yaml.safe_load(Path("configs/datasets/dataset_registry.yaml").read_text(encoding="utf-8"))
          spec = registry["datasets"][key]
          out = Path("data/input") / spec["filename"]
          out.parent.mkdir(parents=True, exist_ok=True)
          urllib.request.urlretrieve(spec["url"], out)

          h = hashlib.sha256()
          with out.open("rb") as fh:
              for chunk in iter(lambda: fh.read(1024 * 1024), b""):
                  h.update(chunk)
          actual = h.hexdigest()
          expected = spec["sha256"]
          if actual != expected:
              raise SystemExit(f"dataset sha256 mismatch: expected={expected} actual={actual}")
          print({"dataset": key, "path": str(out), "sha256": actual})
          PY

      - name: Run pre-registered H2 screen
        run: |
          python tools/screen_usdjpy_m15_breakout_24h_alignment.py \
            --input data/input/USDJPY_M1_2024-01-02_2026-02-18.csv \
            --session-config configs/market_sessions/fx_market_sessions_v1.json \
            --start 2024-07-01T00:00:00Z \
            --end 2025-01-01T00:00:00Z \
            --output-dir data/experiments/usdjpy_m15_breakout_24h_alignment_h2_v1

      - name: Write result summary
        if: always()
        run: |
          echo "# USDJPY M15 Breakout 24h Alignment H2" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pre-registration: docs/research_reboot/usdjpy_m15_breakout_24h_alignment_h2_prereg_v1.md" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f data/experiments/usdjpy_m15_breakout_24h_alignment_h2_v1/monthly_default.csv ]; then
            echo "## Monthly default-cost result" >> "$GITHUB_STEP_SUMMARY"
            echo '```csv' >> "$GITHUB_STEP_SUMMARY"
            cat data/experiments/usdjpy_m15_breakout_24h_alignment_h2_v1/monthly_default.csv >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f data/experiments/usdjpy_m15_breakout_24h_alignment_h2_v1/gate.json ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## Gate" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat data/experiments/usdjpy_m15_breakout_24h_alignment_h2_v1/gate.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload screen artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usdjpy-m15-breakout-24h-alignment-h2-${{ github.run_id }}
          path: data/experiments/usdjpy_m15_breakout_24h_alignment_h2_v1/**
          if-no-files-found: error
          retention-days: 30
